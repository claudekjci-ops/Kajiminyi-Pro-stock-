rser dans 15 jours","Un apport personnel ou un emprunt de plusieurs mois ou années","Un crédit fournisseur de 30 jours"],"a":3,"e":"On finance un bien durable par des ressources durables, pas par du court terme qui videra la trésorerie."}]}],"exam":[{"q":"Le salaire que vous vous versez chaque mois sert surtout à :","o":["Séparer l'argent de la famille de celui de la boutique","Payer moins d'impôts automatiquement","Augmenter le stock","Éviter de tenir un cahier de caisse"],"a":0,"e":"Un salaire fixe évite de piocher dans la caisse et permet de voir si l'entreprise gagne vraiment de l'argent."},{"q":"Une boutique est bénéficiaire sur le papier mais n'a plus d'argent en caisse. Quelle explication est la plus probable ?","o":["Le bénéfice n'existe pas","Les clients ont trop payé","Le bénéfice est immobilisé dans le stock et les crédits clients","Le taux de change a baissé"],"a":2,"e":"Bénéfice et trésorerie sont différents : l'argent peut dormir dans le stock ou chez les clients."},{"q":"Un article achète 8 000 FC, frais de transport compris 8 500 FC, et se vend 12 750 FC. Quel est le coefficient multiplicateur sur le coût d'achat ?","o":["1,6","1,0","4,25","1,5"],"a":3,"e":"12 750 ÷ 8 500 = 1,5."},{"q":"Même article : quelle est la marge en FC et le taux de marge sur le coût d'achat de 8 500 FC ?","o":["4 750 FC ; 56 %","4 250 FC ; 50 %","4 250 FC ; 33 %","12 750 FC ; 150 %"],"a":1,"e":"12 750 - 8 500 = 4 250 FC ; 4 250 ÷ 8 500 = 50 %."},{"q":"Charges fixes mensuelles : 600 000 FC. Marge moyenne : 30 % du prix de vente. Quel chiffre d'affaires mensuel faut-il pour ne ni gagner ni perdre ?","o":["2 000 000 FC","1 000 000 FC","1 800 000 FC","600 000 FC"],"a":1,"e":"600 000 ÷ 0,30 = 2 000 000 FC (seuil de rentabilité)."},{"q":"Vous avez fixé un prix de 23 000 FC pour un article acheté 10 $ quand 1 $ valait 2 300 FC. Le dollar passe à 2 600 FC. Quel prix minimal pour revenir au même coût sans marge ?","o":["26 000 FC","25 000 FC","23 000 FC","2 600 FC"],"a":2,"e":"10 × 2 600 = 26 000 FC : le coût de remplacement a augmenté."},{"q":"Vous encaissez 460 000 FC de créances au taux de 2 300 FC/$ pour 200 $. Si le dollar monte à 2 500 FC, ces 460 000 FC valent environ :","o":["200 $","216 $","184 $","250 $"],"a":0,"e":"460 000 ÷ 2 500 = 184 $ : la créance en francs perd de la valeur quand le franc baisse."},{"q":"Un client doit 150 000 FC depuis 75 jours alors que le délai accordé est de 30 jours. Que faire en premier ?","o":["Attendre un an sans rien dire","Continuer à lui vendre à crédit comme avant","Annoncer publiquement la dette","Le relancer poliment et rapidement, puis convenir d'un échéancier écrit"],"a":3,"e":"Une relance rapide, courtoise et suivie d'un accord écrit augmente les chances de récupérer l'argent."},{"q":"Vous payez un fournisseur à 30 jours et vos clients vous paient à 45 jours. Quel est l'effet sur la trésorerie ?","o":["Vous gagnez 15 jours de trésorerie","Vous financez 15 jours de crédit de votre poche","Aucun effet","Vous ne payez plus d'impôts"],"a":1,"e":"Vous payez 15 jours avant d'encaisser : il faut un fonds de roulement pour combler l'écart."},{"q":"Vous empruntez 1 000 000 FC à 2 % par mois, intérêts simples, pendant 6 mois. Quel est le total d'intérêts ?","o":["60 000 FC","120 000 FC","20 000 FC","200 000 FC"],"a":2,"e":"1 000 000 × 0,02 × 6 = 120 000 FC."},{"q":"Prêt de 1 200 000 FC, 240 000 FC d'intérêts au total, remboursé en 10 mensualités égales. Quelle mensualité ?","o":["124 000 FC","144 000 FC","264 000 FC","120 000 FC"],"a":3,"e":"(1 200 000 + 240 000) ÷ 10 = 144 000 FC."},{"q":"Stock moyen 2 000 000 FC, coût des marchandises vendues sur l'année 12 000 000 FC. Combien de fois le stock tourne-t-il par an ?","o":["4 fois","6 fois","8 fois","24 fois"],"a":0,"e":"12 000 000 ÷ 2 000 000 = 6 rotations, soit un stock renouvelé tous les 60 jours environ."}]},{"id":"fiscalite","title":"Fiscalité du commerçant en RDC","icon":"🧾","level":"Intermédiaire","hours":3,"summary":"Comprenez les impôts qui concernent votre commerce : DGI, NIF, TVA, impôt sur les bénéfices, taxes locales, douane, calendrier et contrôles. Apprenez à calculer, déclarer, classer vos pièces et défendre vos droits.","goals":["Savoir qui prélève quoi (DGI, douane, provinces) et obtenir son NIF","Calculer la TVA collectée, la TVA déductible et la TVA à payer, et comprendre le rôle de la facture","Distinguer l'impôt sur les bénéfices et les régimes selon le chiffre d'affaires, et faire des calculs types","Repérer les impôts et taxes locaux et exiger un reçu officiel","Estimer le coût réel d'une importation et éviter les erreurs de douane","Tenir un calendrier fiscal, classer ses pièces et réagir à un contrôle ou à un redressement"],"chapters":[{"t":"Chapitre 1 — Le système fiscal congolais, la DGI et le NIF","html":"\n<h4>À quoi servent les impôts ?<\/h4>\n<p>Un <b>impôt<\/b> est une somme que l'on verse à l'État (ou à une province ou une ville) sans recevoir de service précis en échange. Cet argent finance les routes, les écoles, les hôpitaux, la sécurité, les salaires des agents publics. Pour un commerçant, l'impôt est une <b>charge de l'activité<\/b>, au même titre que le loyer ou le transport : il faut le prévoir dans ses prix et dans sa trésorerie, pas le découvrir le jour du contrôle.<\/p>\n<p>Un mot à connaître : le <b>contribuable<\/b>. C'est vous, toute personne ou entreprise qui doit payer un impôt. L'<b>administration fiscale<\/b> est l'organisme qui vérifie, calcule et encaisse.<\/p>\n<h4>Qui prélève quoi ?<\/h4>\n<p>En RDC, plusieurs administrations se partagent le travail. Il est important de savoir à qui s'adresser.<\/p>\n<table>\n<thead><tr><th>Administration<\/th><th>Ce qu'elle gère<\/th><th>Exemples pour un commerçant<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>DGI<\/b> (Direction générale des impôts)<\/td><td>Les impôts nationaux<\/td><td>TVA, impôt sur les bénéfices, impôt sur les salaires (IPR), numéro d'impôt<\/td><\/tr>\n<tr><td><b>DGDA<\/b> (Direction générale des douanes et accises)<\/td><td>Les opérations à la frontière<\/td><td>Droits et taxes à l'importation et à l'exportation<\/td><\/tr>\n<tr><td><b>DGRAD<\/b> (recettes administratives, domaniales, judiciaires et de participations)<\/td><td>Redevances et frais de l'État<\/td><td>Certaines taxes et frais administratifs<\/td><\/tr>\n<tr><td><b>Provinces et entités territoriales<\/b><\/td><td>Impôts et taxes locaux<\/td><td>Taxes de marché, de publicité, de salubrité, impôts liés aux véhicules ou aux terrains selon les cas<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La <b>DGI<\/b> est celle que vous rencontrerez le plus souvent. Elle a des centres et des services pour les grandes, moyennes et petites entreprises, et un portail en ligne. Vous pouvez la joindre pour vos questions, et vous avez le droit de demander des explications écrites.<\/p>\n<h4>Le NIF : votre numéro d'impôt<\/h4>\n<p>Le <b>NIF<\/b> (numéro d'identification fiscale) est le numéro qui identifie votre activité auprès de l'administration. Sans lui, vous ne pouvez pas déclarer, ni établir de facture reconnue, ni souvent ouvrir un compte professionnel ou répondre à un marché. Il vous est attribué lors de la création de l'entreprise, souvent par le guichet unique, ou sur demande à la DGI. La DGI a rappelé en décembre 2025 que la demande de NIF est <b>gratuite<\/b> et peut se faire sur son portail en ligne (e-NIF) ou auprès du service des impôts de votre secteur ; elle met en garde contre les intermédiaires qui font payer cette démarche. Demandez-le dès le début de l'activité. Si vous arrêtez l'activité, signalez la <b>cessation<\/b> à l'administration : sinon elle continue de vous considérer comme actif et peut vous réclamer des déclarations.<\/p>\n<h4>Déclarer, payer, conserver : le cycle de base<\/h4>\n<ol>\n<li><b>Calculer<\/b> : à partir de vos ventes, de vos achats et de vos charges.<\/li>\n<li><b>Déclarer<\/b> : remplir le formulaire de l'impôt concerné dans le délai, même si vous n'avez rien à payer.<\/li>\n<li><b>Payer<\/b> : le paiement se fait selon les instructions de l'administration (souvent par la banque, avec un bordereau). Gardez le reçu.<\/li>\n<li><b>Conserver<\/b> : factures, relevés, déclarations et preuves de paiement. L'administration peut vous les demander plusieurs années plus tard.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mireille tient une boutique de produits de beauté à Goma depuis trois ans. Elle ne s'est jamais fait enregistrer et paie parfois « un petit quelque chose » à des agents qui passent. Un grossiste de Kinshasa lui propose de devenir revendeuse officielle, à condition de présenter un NIF et de recevoir des factures à son nom. Mireille obtient son NIF, ouvre un compte et commence à tenir un cahier de ventes. Au bout d'un an, ce qu'elle paie est officiel, tracé, justifié par des reçus : elle sait enfin combien lui coûte l'impôt et peut le mettre dans ses prix.<\/div>\n<h4>Les grandes familles d'impôts pour le commerçant<\/h4>\n<ul>\n<li><b>Impôt sur le résultat<\/b> (le bénéfice de l'entreprise) : étudié au chapitre 3.<\/li>\n<li><b>TVA<\/b> (taxe sur la valeur ajoutée) : un impôt sur la consommation que le commerçant collecte et reverse : chapitre 2.<\/li>\n<li><b>Impôt sur les salaires (IPR)<\/b> : retenu sur la paie de vos employés et reversé par vous.<\/li>\n<li><b>Impôts et taxes locaux<\/b> : chapitre 4.<\/li>\n<li><b>Droits de douane<\/b> : si vous importez : chapitre 5.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Plusieurs administrations prélèvent : DGI (impôts nationaux), DGDA (douane), provinces (taxes locales). Le NIF est la clé d'entrée : gratuit, à obtenir tôt, à signaler à la fermeture. Le cycle est toujours le même : calculer, déclarer, payer, conserver les preuves. Déclarer à temps compte autant que payer.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les noms des services, les formulaires et les modalités de paiement évoluent (digitalisation, réformes). Vérifiez toujours auprès de la DGI ou de son portail en ligne avant d'agir. Ce cours est une aide pédagogique et ne remplace pas un conseil personnalisé.<\/div>","quiz":[{"q":"Quelle administration gère principalement la TVA et l'impôt sur les bénéfices ?","o":["La DGDA","La DGI","Le marché communal","La banque"],"a":1,"e":"La DGI gère les impôts nationaux comme la TVA, l'impôt sur le résultat et l'IPR. La DGDA s'occupe de la douane."},{"q":"Que veut dire NIF ?","o":["Numéro d'identification fiscale","Numéro d'inscription au fichier des ventes","Note interne de facturation","Nom d'import-export formel"],"a":0,"e":"Le NIF identifie l'activité auprès de l'administration fiscale."},{"q":"Vous fermez définitivement votre dépôt à Mbuji-Mayi. Que faut-il faire pour votre NIF ?","o":["Le faire désactiver auprès de l'administration","Le donner à un cousin","Le garder et ne plus déclarer","Rien : un numéro n'expire jamais"],"a":3,"e":"Sans désactivation, vous restez considéré comme actif et des obligations déclaratives peuvent continuer de s'appliquer."},{"q":"Vous n'avez réalisé aucune vente ce mois-ci mais une déclaration est due. Que faites-vous ?","o":["Vous déclarez dans le délai, même avec un montant nul, si l'impôt l'exige","Vous attendez le contrôle","Vous ne déclarez pas, il n'y a rien à payer","Vous payez au hasard"],"a":2,"e":"Beaucoup d'obligations existent même sans montant à payer ; l'absence de déclaration peut être pénalisée. En cas de doute, demandez à l'administration."}]},{"t":"Chapitre 2 — La TVA : principe, taux, facture et déductions","html":"\n<h4>Le principe de la TVA<\/h4>\n<p>La <b>TVA<\/b> (taxe sur la valeur ajoutée) est un impôt sur la <b>consommation<\/b>. C'est le client final qui la supporte, mais c'est l'entreprise qui la <b>collecte<\/b> sur ses ventes et la <b>reverse<\/b> à l'État. Pour l'entreprise elle-même, la TVA est « neutre » : elle récupère (on dit <b>déduit<\/b>) la TVA qu'elle a payée sur ses achats. Elle ne verse que la différence.<\/p>\n<p>Les mots à retenir :<\/p>\n<ul>\n<li><b>HT<\/b> : hors taxe, le prix sans la TVA.<\/li>\n<li><b>TVA collectée<\/b> : la TVA que vous ajoutez sur vos factures de vente.<\/li>\n<li><b>TVA déductible<\/b> : la TVA figurant sur vos factures d'achat professionnelles en règle.<\/li>\n<li><b>TVA à payer<\/b> = TVA collectée − TVA déductible.<\/li>\n<li><b>TTC<\/b> : toutes taxes comprises, prix HT + TVA.<\/li>\n<\/ul>\n<h4>Les taux<\/h4>\n<p>Selon les documents de la DGI et les textes sur la TVA, le <b>taux normal est de 16 %<\/b>. Un <b>taux réduit de 8 %<\/b> s'applique à certains produits de première nécessité et aux billets d'avion de vols intérieurs. Un <b>taux de 0 %<\/b> s'applique aux exportations et opérations assimilées. Quelques opérations sont <b>exonérées<\/b> par une liste limitée (raisons sociales, diplomatiques, etc.).<\/p>\n<h4>Qui est assujetti ?<\/h4>\n<p>Selon la DGI, sont assujettis les personnes qui exercent une activité économique indépendante avec un chiffre d'affaires annuel d'au moins <b>80 000 000 FC<\/b> (environ 34 800 $ au taux d'exemple de 1 $ = 2 300 FC ; le taux varie). Les professions libérales sont assujetties quel que soit leur chiffre d'affaires. L'assujetti doit se faire enregistrer comme tel, tenir une comptabilité régulière et facturer la TVA.<\/p>\n<h4>Un calcul complet<\/h4>\n<table>\n<thead><tr><th>Étape<\/th><th>Prix HT<\/th><th>TVA 16 %<\/th><th>TTC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Le grossiste vend à Papy (achat)<\/td><td>1 000 000 FC<\/td><td>160 000 FC<\/td><td>1 160 000 FC<\/td><\/tr>\n<tr><td>Papy vend ses marchandises (vente)<\/td><td>1 400 000 FC<\/td><td>224 000 FC<\/td><td>1 624 000 FC<\/td><\/tr>\n<tr><td colspan=\"4\">TVA à reverser par Papy : 224 000 − 160 000 = <b>64 000 FC<\/b> (16 % de sa marge de 400 000 FC)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Papy n'a donc pas payé 224 000 FC : seulement 64 000 FC, parce qu'il avait déjà payé 160 000 FC à son fournisseur. Pour un prix TTC connu, on retrouve le HT en divisant par 1,16 : 1 624 000 ÷ 1,16 = 1 400 000 FC.<\/p>\n<h4>La déclaration et le paiement<\/h4>\n<p>D'après le document de la DGI sur la TVA, la déclaration et le paiement se font chaque mois, <b>au plus tard le 15 du mois suivant<\/b> celui des opérations. Si la TVA déductible dépasse la TVA collectée, il y a un <b>crédit de TVA<\/b>, reporté sur la déclaration suivante ; les remboursements sont limités à des cas précis (exportateurs, gros investisseurs, cessation d'activité...).<\/p>\n<h4>La facture, preuve indispensable<\/h4>\n<p>Pour déduire la TVA de vos achats, vous devez détenir une <b>facture en règle<\/b> au nom de votre entreprise : nom et NIF du fournisseur et du client, date, description, prix HT, TVA, TTC. Avec la réforme de la <b>facture normalisée<\/b>, les assujettis à la TVA doivent émettre leurs factures à travers un dispositif électronique fiscal (DEF) ou un système de facturation d'entreprise (SFE) agréé par la DGI. L'obligation a démarré à la fin de 2025 ; selon la presse congolaise, le ministère des Finances a annoncé la fin du moratoire, avec des sanctions à partir du 15 mai 2026 : sanction des entreprises qui perçoivent la TVA sans facture normalisée, et refus de la déduction de la TVA quand l'achat n'est pas justifié par une facture normalisée conforme. Une facture faite à la main ou sur un tableur peut donc ne plus suffire pour les assujettis.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépôt de boissons à Lubumbashi achète pour 5 000 000 FC HT (TVA 800 000 FC) et vend pour 6 500 000 FC HT (TVA 1 040 000 FC). TVA à payer : 1 040 000 − 800 000 = 240 000 FC, à déclarer avant le 15 du mois suivant. Si un fournisseur ne lui donne aucune facture sur 1 000 000 FC d'achats, le dépôt perd 160 000 FC de TVA déductible : il paie plus d'impôt qu'il ne devrait.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> TVA à payer = TVA collectée − TVA déductible. Taux normal 16 %, taux réduit 8 %, 0 % à l'exportation. Seuil d'assujettissement : 80 millions FC de chiffre d'affaires annuel. Déclaration et paiement mensuels, au plus tard le 15 du mois suivant. Sans facture en règle, pas de déduction.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les seuils, la liste des produits à taux réduit ou exonérés et le calendrier de la facture normalisée peuvent changer par loi de finances ou instruction. Vérifiez auprès de la DGI avant de fixer vos prix ou de facturer.<\/div>","quiz":[{"q":"Un commerçant assujetti achète 2 000 000 FC HT et vend 3 000 000 FC HT (taux 16 %). Quelle TVA doit-il reverser ?","o":["480 000 FC","320 000 FC","80 000 FC","160 000 FC"],"a":3,"e":"Collectée : 480 000. Déductible : 320 000. À payer : 160 000 FC."},{"q":"Prix TTC d'un sac de farine : 58 000 FC avec TVA 16 %. Quel est le prix HT ?","o":["48 720 FC","58 000 FC","50 000 FC","52 000 FC"],"a":2,"e":"58 000 ÷ 1,16 = 50 000 FC. La TVA est de 8 000 FC."},{"q":"Quel est le seuil de chiffre d'affaires annuel d'assujettissement à la TVA indiqué par la DGI ?","o":["300 millions FC","10 millions FC","80 millions FC","5 milliards FC"],"a":1,"e":"Selon la DGI, 80 000 000 FC par an (hors professions libérales)."},{"q":"Pourquoi conserver les factures d'achat établies au nom de l'entreprise ?","o":["Elles permettent de déduire la TVA payée sur les achats","Elles servent à décorer le bureau","Elles ne servent à rien","Elles remplacent le NIF"],"a":0,"e":"Sans facture en règle, la TVA des achats n'est généralement pas déductible."}]},{"t":"Chapitre 3 — Impôt sur les bénéfices et régimes d'imposition","html":"\n<h4>Le bénéfice imposable<\/h4>\n<p>L'<b>impôt sur le résultat<\/b> frappe le <b>bénéfice<\/b> de l'entreprise, c'est-à-dire ce qui reste après avoir retiré de ses ventes ses charges réelles (achats de marchandises, loyer, salaires, transport, amortissements...). Ce n'est pas la même chose que l'argent en caisse : un stock invendu n'est pas un bénéfice, un prélèvement personnel n'est pas une charge. Seules les charges <b>justifiées par des pièces<\/b> sont acceptées par l'administration.<\/p>\n<p>Calcul simple : <b>bénéfice = ventes − charges justifiées<\/b>.<\/p>\n<h4>Un changement important en 2026<\/h4>\n<p>Pendant longtemps, le principal impôt sur le résultat en RDC s'appelait <b>IBP<\/b> (impôt sur les bénéfices et profits). Une réforme fondée sur la loi n° 23/053 du 30 novembre 2023 le remplace par un <b>impôt sur les sociétés (IS)<\/b>, applicable à partir du <b>1er janvier 2026<\/b>, avec une période de transition. Selon plusieurs sources spécialisées, le taux général de l'IS est de <b>30 %<\/b> du bénéfice net imposable, avec une <b>taxe minimale de 1 % du chiffre d'affaires<\/b> lorsque l'entreprise déclare un bénéfice nul ou une perte, et un report des déficits limité dans le temps (3 exercices). Les personnes physiques relèvent quant à elles d'un impôt sur le revenu des personnes physiques (IRPP) à barème progressif.<\/p>\n<h4>Les régimes selon la taille<\/h4>\n<p>L'administration distingue les entreprises selon leur chiffre d'affaires (CA), pour ne pas imposer à un petit commerce les mêmes règles qu'à une grande société. Le régime des <b>petites et micro-entreprises<\/b> (régime simplifié appliqué à l'ancien IBP, d'après l'ordonnance-loi de 2013 et les rappels de la DGI) est le suivant :<\/p>\n<table>\n<thead><tr><th>Catégorie<\/th><th>Chiffre d'affaires annuel (régime simplifié de l'IBP)<\/th><th>Impôt sur le résultat<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Micro-entreprise<\/td><td>jusqu'à 10 000 000 FC<\/td><td>Petit impôt forfaitaire annuel (montant fixé par les textes : à confirmer)<\/td><\/tr>\n<tr><td>Petite entreprise<\/td><td>de 10 à 80 millions FC<\/td><td>1 % du CA pour la vente de biens, 2 % pour les services<\/td><\/tr>\n<tr><td>Moyenne et grande entreprise<\/td><td>au-delà, régime du réel<\/td><td>Impôt sur le bénéfice réel, déclaration avec comptabilité complète<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Dans le régime des petites entreprises, on ne paie, en principe, que <b>deux impôts<\/b> : l'impôt sur le résultat (forfaitaire en pourcentage du CA) et l'impôt sur les salaires s'il y a des employés. Le régime du <b>réel<\/b> impose, lui, une comptabilité complète et un calcul sur le bénéfice réel.<\/p>\n<h4>Calculs types<\/h4>\n<ul>\n<li><b>Petite boutique de pièces détachées (vente de biens)<\/b> : CA annuel 40 000 000 FC × 1 % = <b>400 000 FC<\/b>.<\/li>\n<li><b>Salon de coiffure (service)<\/b> : CA 18 000 000 FC × 2 % = <b>360 000 FC<\/b>.<\/li>\n<li><b>Société au réel (IS à 30 %)<\/b> : bénéfice net 20 000 000 FC × 30 % = <b>6 000 000 FC<\/b>.<\/li>\n<li><b>Taxe minimale<\/b> : société en perte avec CA 300 000 000 FC × 1 % = <b>3 000 000 FC<\/b>.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un grossiste de pagnes à Kananga réalise 120 000 000 FC de ventes et 105 000 000 FC de charges justifiées. Bénéfice : 15 000 000 FC. À 30 %, l'impôt est de 4 500 000 FC. S'il avait perdu ses factures de transport (6 000 000 FC), l'administration pourrait refuser ces charges : le bénéfice passerait à 21 000 000 FC et l'impôt à 6 300 000 FC, soit 1 800 000 FC de plus. Les pièces valent de l'argent.<\/div>\n<h4>Quand et comment payer ?<\/h4>\n<p>Pour les petites entreprises, le paiement se fait en deux temps : 60 % en acompte au plus tard le 31 janvier, puis 40 % avec la déclaration (la DGI a fixé le 30 avril pour les revenus de 2025). Les micro-entreprises paient leur forfait avec leur déclaration annuelle. Les grandes et moyennes entreprises déposent une déclaration annuelle au plus tard le 30 avril de l'année suivante. Comment ces règles s'adaptent au nouvel IS à partir de 2026 n'est pas détaillé ici : demandez les modalités exactes à la DGI.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Bénéfice = ventes − charges justifiées. L'IBP laisse la place à l'IS (30 % annoncé, taxe minimale de 1 % du CA) à partir de 2026. Les petits commerces ont relevé d'un régime simplifié : 1 % du CA pour les biens et 2 % pour les services. Plus la comptabilité est propre, plus on maîtrise son impôt.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les seuils de chiffre d'affaires et les taux des régimes simplifiés (micro et petite entreprise) ont été donnés ici d'après l'ordonnance-loi de 2013 et des rappels de la DGI ; la réforme de 2026 peut les modifier, et des sources divergent (notamment sur le montant du forfait des micro-entreprises). Ne les utilisez que comme ordre de grandeur et faites confirmer votre catégorie, votre taux et vos dates de paiement par la DGI ou un expert-comptable.<\/div>","quiz":[{"q":"Que remplace l'impôt sur les sociétés (IS) à partir de 2026 ?","o":["La TVA","L'impôt sur les bénéfices et profits (IBP)","Les droits de douane","La patente"],"a":1,"e":"La réforme remplace l'IBP par l'IS à compter du 1er janvier 2026."},{"q":"Boutique au régime petite entreprise (vente de biens, 1 %) avec CA 60 000 000 FC. Impôt ?","o":["1 200 000 FC","600 000 FC","1 800 000 FC","6 000 000 FC"],"a":0,"e":"60 000 000 × 1 % = 600 000 FC."},{"q":"Un salon de coiffure (service, 2 %) a un CA de 25 000 000 FC. Impôt ?","o":["2 500 000 FC","750 000 FC","500 000 FC","250 000 FC"],"a":3,"e":"25 000 000 × 2 % = 500 000 FC."},{"q":"Société au réel, bénéfice net 10 000 000 FC, taux de 30 %. Impôt ?","o":["300 000 FC","30 000 000 FC","3 000 000 FC","1 000 000 FC"],"a":2,"e":"10 000 000 × 30 % = 3 000 000 FC."}]},{"t":"Chapitre 4 — Impôts locaux, taxes provinciales, patente et taxes diverses","html":"\n<h4>Au-delà de la DGI<\/h4>\n<p>Beaucoup de commerçants pensent que « l'impôt », c'est seulement la DGI. En réalité, une partie des paiements va aux <b>provinces<\/b>, aux <b>villes<\/b>, aux <b>communes<\/b> et aux services spécialisés de l'État. Ils sont souvent appelés <b>impôts locaux<\/b> ou <b>taxes<\/b>. Le mot « taxe » désigne en général un paiement lié à un service rendu ou à une autorisation (par exemple l'utilisation d'un emplacement au marché).<\/p>\n<h4>Les principales familles<\/h4>\n<table>\n<thead><tr><th>Type<\/th><th>À quoi ça correspond<\/th><th>Qui en profite<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Patente<\/b><\/td><td>Autorisation annuelle d'exercer un petit commerce, selon la catégorie d'activité<\/td><td>Administration compétente (déclaration souvent via le guichet unique)<\/td><\/tr>\n<tr><td><b>Impôts provinciaux<\/b><\/td><td>Impôt foncier, impôt sur les véhicules, impôt sur les revenus locatifs, etc.<\/td><td>La province<\/td><\/tr>\n<tr><td><b>Taxes de marché et d'emplacement<\/b><\/td><td>Utilisation d'un étal, d'un local ou du domaine public<\/td><td>La ville, la commune ou le marché<\/td><\/tr>\n<tr><td><b>Taxes de publicité, d'assainissement, de salubrité<\/b><\/td><td>Enseigne, affiche, enlèvement des déchets<\/td><td>L'entité locale<\/td><\/tr>\n<tr><td><b>Redevances et frais d'État<\/b><\/td><td>Autorisations, licences, documents<\/td><td>L'État, souvent via la DGRAD<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Les documents de formation destinés aux entrepreneurs rappellent que, depuis la Constitution, des impôts comme l'impôt foncier, l'impôt sur les véhicules ou l'impôt sur les revenus locatifs relèvent des <b>provinces<\/b>, et que le petit commerce a besoin d'une <b>patente<\/b>, à obtenir avant de commencer et à payer chaque année selon la catégorie.<\/p>\n<h4>Comment ne pas se faire piéger<\/h4>\n<ul>\n<li><b>Demandez la base légale<\/b> : quelle taxe, quel texte, quel montant, quelle période ?<\/li>\n<li><b>Exigez un reçu officiel<\/b>, avec le nom de l'organisme, le montant, la date et la taxe payée. Un paiement sans reçu est un paiement qu'on ne peut pas prouver.<\/li>\n<li><b>Payez au bon guichet<\/b> ou à la banque désignée, pas en espèces dans la rue.<\/li>\n<li><b>Gardez un dossier « taxes locales »<\/b> par année : patente, taxe de marché, enseigne, véhicule, immeuble.<\/li>\n<li>Si une taxe vous semble en double, <b>écrivez<\/b> à l'administration concernée plutôt que de discuter à l'étal.<\/li>\n<\/ul>\n<p>Les entreprises se plaignent régulièrement de la <b>multiplicité<\/b> des taxes et des contrôles. Les autorités ont déjà annoncé des efforts de simplification (guichet unique, paiement bancaire), mais les pratiques varient d'un endroit à l'autre. La meilleure défense est la même partout : <b>tout paiement avec reçu, tout reçu classé<\/b>.<\/p>\n<h4>Calcul d'un budget « taxes locales »<\/h4>\n<p>Prévoyez une ligne dans votre budget annuel. Exemple d'une boutique de téléphones à Lubumbashi (montants fictifs d'illustration) :<\/p>\n<ul>\n<li>Patente : 150 000 FC par an ;<\/li>\n<li>Taxe d'enseigne : 80 000 FC ;<\/li>\n<li>Taxe d'assainissement : 12 000 FC × 12 mois = 144 000 FC ;<\/li>\n<li>Autres redevances : 60 000 FC.<\/li>\n<\/ul>\n<p>Total : 150 000 + 80 000 + 144 000 + 60 000 = <b>434 000 FC<\/b> par an, soit environ 36 200 FC par mois à mettre de côté. Sur un chiffre d'affaires de 40 000 000 FC, c'est un peu plus de 1 %.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Rachel vend des légumes au marché de Kananga. Un agent lui réclame 15 000 FC « pour la taxe ». Elle demande : « Quelle taxe ? Je peux voir le reçu officiel ? » L'agent revient avec un carnet de quittances à souche : elle paie 5 000 FC, reçoit sa quittance, la range dans sa boîte de pièces. Quand un autre agent passe le même jour, elle montre le reçu. Un petit réflexe, beaucoup de tranquillité.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Les impôts locaux et provinciaux s'ajoutent à ceux de la DGI. Patente, taxes de marché, publicité, assainissement, impôts sur les véhicules ou les immeubles : chacun a son guichet. Demandez toujours la base légale et un reçu officiel, classez-le, et budgétez ces charges à l'avance.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les taxes locales et leurs montants varient selon la province et la ville, et changent souvent. Les chiffres du budget ci-dessus sont des exemples fictifs. Renseignez-vous auprès de la mairie, de la province ou du guichet unique pour connaître les taxes réellement applicables à votre activité.<\/div>","quiz":[{"q":"Quel document faut-il exiger quand on paie une taxe locale ?","o":["Une promesse orale","Rien","Un message sur téléphone du collecteur","Un reçu officiel avec le nom de la taxe, le montant et la date"],"a":3,"e":"Le reçu est la preuve du paiement : sans lui, on peut payer deux fois."},{"q":"La patente est...","o":["Une autorisation annuelle d'exercer un petit commerce, payée selon la catégorie","Un droit de douane","Un impôt sur les salaires","Une taxe sur la TVA"],"a":2,"e":"La patente accompagne l'exercice du petit commerce et se renouvelle chaque année."},{"q":"Budget annuel d'une boutique : patente 120 000 FC, enseigne 60 000 FC, assainissement 10 000 FC × 12. Total ?","o":["180 000 FC","300 000 FC","240 000 FC","420 000 FC"],"a":1,"e":"120 000 + 60 000 + 120 000 = 300 000 FC."},{"q":"Un agent vous réclame une taxe que vous ne connaissez pas. Que faire ?","o":["Demander la base légale et un reçu, et écrire à l'administration en cas de doute","Payer sans rien dire","Fermer et fuir","Le menacer"],"a":0,"e":"Rester calme, demander le texte et un reçu officiel, puis s'adresser à l'administration."}]},{"t":"Chapitre 5 — Douane et taxes à l'importation : les bases","html":"\n<h4>Pourquoi la douane ?<\/h4>\n<p>Quand vous achetez des marchandises à l'étranger (Dubaï, Chine, Afrique du Sud, Zambie, Ouganda...), elles franchissent la frontière. L'État y perçoit des <b>droits et taxes<\/b> et contrôle ce qui entre. L'administration chargée de cela est la <b>DGDA<\/b> (Direction générale des douanes et accises). Elle travaille avec des <b>transitaires<\/b> (ou commissionnaires en douane), des professionnels qui font les formalités pour vous.<\/p>\n<h4>Les mots à connaître<\/h4>\n<ul>\n<li><b>Valeur en douane<\/b> : la valeur sur laquelle on calcule les taxes. En général, le prix des marchandises plus le transport et l'assurance jusqu'à la frontière congolaise (valeur dite CAF).<\/li>\n<li><b>Droit de douane<\/b> : un pourcentage de cette valeur, qui dépend du type de produit.<\/li>\n<li><b>Déclaration en douane<\/b> : le document qui décrit les marchandises (nature, quantité, valeur, origine). Elle doit être exacte.<\/li>\n<li><b>Code tarifaire (nomenclature)<\/b> : le numéro qui classe chaque produit et détermine le taux applicable.<\/li>\n<li><b>Facture commerciale<\/b> : la facture du fournisseur étranger, qui prouve la valeur.<\/li>\n<li><b>Transitaire<\/b> : l'intermédiaire qui dédouane pour vous.<\/li>\n<\/ul>\n<h4>Les étapes d'une importation<\/h4>\n<ol>\n<li><b>Préparer<\/b> : identifiez-vous (NIF, registre du commerce), vérifiez que le produit n'est pas interdit ou soumis à une autorisation (médicaments, produits alimentaires, etc.).<\/li>\n<li><b>Commander<\/b> : exigez une facture claire et complète du fournisseur.<\/li>\n<li><b>Transporter<\/b> : par route, rail, fleuve ou air ; gardez les documents de transport.<\/li>\n<li><b>Déclarer et dédouaner<\/b> : la déclaration est déposée, la valeur et la classification sont contrôlées, les droits et taxes sont calculés.<\/li>\n<li><b>Payer<\/b> : selon la procédure officielle, avec quittance.<\/li>\n<li><b>Enlever<\/b> : après paiement et contrôle, les marchandises sont libérées.<\/li>\n<\/ol>\n<h4>Estimer le coût réel d'une importation<\/h4>\n<p>Pour fixer votre prix, calculez le <b>coût de revient<\/b> total, et pas seulement le prix du fournisseur. Exemple fictif d'une commande de pièces détachées pour Lubumbashi (taux d'exemple 1 $ = 2 300 FC ; le taux varie) :<\/p>\n<table>\n<thead><tr><th>Poste<\/th><th>Montant ($)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Prix des marchandises<\/td><td>10 000<\/td><\/tr>\n<tr><td>Transport et assurance<\/td><td>1 500<\/td><\/tr>\n<tr><td>Valeur en douane (10 000 + 1 500)<\/td><td>11 500<\/td><\/tr>\n<tr><td>Droits et taxes (hypothèse d'illustration : 20 % de la valeur)<\/td><td>2 300<\/td><\/tr>\n<tr><td>Transitaire, manutention, transport local<\/td><td>700<\/td><\/tr>\n<tr><td><b>Coût de revient total<\/b><\/td><td><b>14 500<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Le coût réel (14 500 $) est <b>45 % plus élevé<\/b> que le prix affiché par le fournisseur (10 000 $). Si vous aviez fixé votre prix de vente sur 10 000 $, vous auriez perdu de l'argent. En francs congolais, 14 500 $ × 2 300 = 33 350 000 FC.<\/p>\n<h4>Les erreurs coûteuses<\/h4>\n<ul>\n<li><b>Sous-déclarer la valeur<\/b> ou changer la nature des produits pour payer moins : c'est de la <b>fraude<\/b>, sanctionnée par des amendes, la saisie de la marchandise, voire des poursuites.<\/li>\n<li><b>Utiliser un intermédiaire non fiable<\/b> qui promet « tout arranger » sans quittance.<\/li>\n<li><b>Perdre les documents<\/b> : sans quittance de douane, vous ne pouvez pas prouver que votre stock est entré légalement.<\/li>\n<li><b>Oublier la TVA à l'importation<\/b> et les autres frais dans le prix de revient.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un commerçant de Goma importe des téléphones par l'Ouganda. Il confie tout à un transitaire sérieux, qui lui remet la déclaration, la quittance et le détail des droits. Six mois plus tard, un contrôle en boutique demande la preuve d'importation de 300 appareils : il présente les quittances, et le contrôle se termine en une heure. Son voisin, qui avait « arrangé » sans papier, a vu son stock saisi.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> La DGDA contrôle les marchandises à la frontière et perçoit les droits et taxes. Le prix de revient d'un produit importé inclut transport, assurance, droits, taxes et frais de transitaire. Une déclaration exacte, une quittance conservée et un transitaire sérieux protègent votre marchandise.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ce chapitre reste volontairement général : les taux de droits de douane, taxes et formalités dépendent du produit (code tarifaire), de l'origine et de la réglementation du moment. Le taux de 20 % ci-dessus est une hypothèse d'illustration, pas un taux officiel. Demandez à la DGDA ou à un transitaire agréé le calcul exact avant de commander.<\/div>","quiz":[{"q":"Quelle administration contrôle les marchandises à la frontière ?","o":["La mairie","La DGDA (douanes et accises)","La banque centrale uniquement","Le marché"],"a":1,"e":"La DGDA perçoit les droits et taxes et contrôle les importations."},{"q":"Qu'est-ce qu'un transitaire ?","o":["Un professionnel qui accomplit les formalités de dédouanement pour vous","Un fournisseur étranger","Un inspecteur des impôts","Un type de taxe"],"a":0,"e":"Il prépare la déclaration, paie les droits et vous remet les documents."},{"q":"Marchandises à 8 000 $, transport et assurance 1 000 $, droits et taxes d'hypothèse 15 % de la valeur, autres frais 500 $. Coût de revient ?","o":["9 000 $","10 350 $","11 700 $","10 850 $"],"a":3,"e":"Valeur en douane : 9 000 $ ; droits : 15 % de 9 000 = 1 350 $ ; frais : 500 $. Total : 9 000 + 1 350 + 500 = 10 850 $."},{"q":"Pourquoi sous-déclarer la valeur à la douane est dangereux ?","o":["Cela n'a aucun risque","Cela augmente la TVA","C'est une fraude pouvant mener à amendes et saisie","Cela supprime le NIF"],"a":2,"e":"La fraude douanière est sanctionnée : amendes, saisie, poursuites."}]},{"t":"Chapitre 6 — Obligations, calendrier, pénalités, contrôles, droits et recours","html":"\n<h4>Un calendrier fiscal, un outil de survie<\/h4>\n<p>La plupart des problèmes fiscaux ne viennent pas de l'impôt lui-même, mais du <b>retard<\/b> ou de l'<b>oubli<\/b>. Construisez votre calendrier en début d'année et affichez-le. Voici un modèle d'après les délais publiés par la DGI et ses directions provinciales (à confirmer pour votre catégorie) :<\/p>\n<table>\n<thead><tr><th>Échéance<\/th><th>Obligation<\/th><th>Qui est concerné<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Dès le début d'activité<\/td><td>Obtenir le numéro d'impôt (NIF), démarche gratuite<\/td><td>Toute entreprise<\/td><\/tr>\n<tr><td>Au plus tard le 15 de chaque mois<\/td><td>Déclarer et payer la TVA du mois précédent<\/td><td>Assujettis à la TVA<\/td><\/tr>\n<tr><td>Au plus tard le 15 de chaque mois<\/td><td>Déclarer et payer l'impôt sur les salaires (IPR) retenu le mois précédent (déclaration « néant » s'il n'y a pas de salaire)<\/td><td>Employeurs<\/td><\/tr>\n<tr><td>31 janvier, puis fin avril (30 avril pour les revenus 2025)<\/td><td>Impôt sur le résultat des petites entreprises : acompte de 60 % puis solde de 40 %<\/td><td>Petites entreprises<\/td><\/tr>\n<tr><td>30 avril (revenus 2025)<\/td><td>Déclaration annuelle des grandes et moyennes entreprises ; forfait des micro-entreprises<\/td><td>Selon la catégorie<\/td><\/tr>\n<tr><td>Avant le 1er février<\/td><td>Impôt foncier et impôt sur les revenus locatifs (provincial)<\/td><td>Propriétaires d'immeubles<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Les pénalités<\/h4>\n<p>Une <b>pénalité<\/b> est une somme ajoutée à l'impôt quand une obligation n'est pas respectée. Après le 30 avril, par exemple, des pénalités sont annoncées chaque année pour les déclarations tardives, selon la loi. Les situations typiques sont : déclaration déposée en retard, impôt payé en retard (avec parfois des intérêts), déclaration inexacte ou incomplète, absence de facture ou de comptabilité, fraude. Les sanctions liées à la <b>facture normalisée<\/b> sont à prendre au sérieux : selon la presse, elles ont été annoncées à partir du 15 mai 2026, avec notamment le refus de la déduction de TVA sans facture normalisée conforme. Les montants et les dates d'application ont évolué ; vérifiez la situation actuelle auprès de la DGI.<\/p>\n<p>Quand l'administration vous envoie une lettre de relance, ne l'ignorez pas : elle vaut en général mise en demeure et laisse peu de jours (5 jours à compter de la réception selon une source) pour régulariser.<\/p>\n<p>Un exemple de calcul fictif de l'effet d'un retard : vous devez 800 000 FC de TVA ; vous payez avec 20 jours de retard. Si la loi prévoit, disons, 2 % de pénalité (taux d'illustration), vous paierez 800 000 + 16 000 = 816 000 FC. Ce n'est pas énorme, mais les retards répétés, les omissions de déclaration et les fraudes coûtent bien plus cher et entraînent des contrôles.<\/p>\n<h4>Les contrôles<\/h4>\n<p>L'administration peut <b>vérifier<\/b> vos déclarations : sur pièces (à partir des documents), ou sur place dans votre entreprise. En général, elle doit vous prévenir par écrit d'une vérification approfondie, vous dire quelles périodes sont contrôlées et quels documents préparer. Pendant le contrôle :<\/p>\n<ul>\n<li>restez poli, demandez la <b>lettre de mission<\/b> ou l'avis de vérification et l'identité des agents ;<\/li>\n<li>remettez les pièces demandées, en gardant un <b>inventaire<\/b> signé de ce que vous donnez ;<\/li>\n<li>faites-vous accompagner d'un expert-comptable si le montant en jeu est important ;<\/li>\n<li>ne payez jamais « pour arranger » sans quittance officielle ;<\/li>\n<li>lisez soigneusement tout procès-verbal avant de le signer.<\/li>\n<\/ul>\n<h4>Vos droits et recours<\/h4>\n<p>Le contribuable a des droits : être informé, présenter ses explications, obtenir des justifications chiffrées d'un redressement, et <b>contester par écrit<\/b> une décision avec laquelle il n'est pas d'accord. La contestation commence généralement par une <b>réclamation<\/b> écrite adressée à l'administration dans un délai fixé par la loi. Si la réponse ne satisfait pas, d'autres recours (hiérarchique, puis juridictionnel) existent. Ces délais sont stricts : une réclamation tardive peut être refusée, même si vous aviez raison sur le fond.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépôt de matériaux à Mbuji-Mayi reçoit un avis de redressement de 3 200 000 FC pour des achats « sans pièces ». Le gérant retrouve les factures dans un classeur, les présente avec une lettre de réclamation datée et déposée contre accusé de réception, et obtient la correction du montant. Il a gagné parce que ses pièces étaient classées et parce qu'il a répondu dans le délai.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Un calendrier évite la plupart des pénalités. Retards, déclarations inexactes et ventes non facturées coûtent cher. En cas de contrôle : calme, avis écrit, inventaire des pièces, reçu officiel pour tout paiement. En cas de désaccord : réclamation écrite, dans le délai, avec preuves.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les taux de pénalité, les délais de réclamation et les règles de contrôle sont fixés par les textes fiscaux et changent. Le taux de 2 % ci-dessus est une pure illustration. Demandez par écrit à la DGI le délai de réclamation applicable et faites-vous conseiller en cas de redressement important.<\/div>","quiz":[{"q":"Quelle est l'échéance de déclaration de la TVA indiquée par la DGI ?","o":["Le 1er janvier de chaque année","Une fois tous les 5 ans","Aucune échéance","Au plus tard le 15 du mois suivant"],"a":3,"e":"La déclaration et le paiement sont mensuels, au plus tard le 15 du mois suivant."},{"q":"Un contrôleur arrive et demande vos documents. Que faites-vous en premier ?","o":["Cacher les documents","Proposer de l'argent liquide","Demander l'avis de vérification et l'identité des agents","Fermer la boutique"],"a":2,"e":"Un contrôle se fait dans un cadre écrit ; demandez l'avis et l'identité."},{"q":"Vous devez 500 000 FC de TVA, avec 3 % de pénalité d'hypothèse. Total à payer ?","o":["503 000 FC","515 000 FC","530 000 FC","550 000 FC"],"a":1,"e":"500 000 × 3 % = 15 000 ; total 515 000 FC."},{"q":"Vous contestez un redressement. Quelle démarche est la plus sûre ?","o":["Une réclamation écrite dans le délai, avec pièces et accusé de réception","Une plainte orale au marché","Attendre un an","Ne rien faire"],"a":0,"e":"Écrit, dans le délai, avec preuves : c'est la base d'un recours."}]},{"t":"Chapitre 7 — Bien se préparer : pièces, facturation et erreurs à éviter","html":"\n<h4>La fiscalité se gagne toute l'année<\/h4>\n<p>Un contrôle ou une déclaration ne s'improvisent pas : on les gagne par des habitudes simples. Ce chapitre rassemble ce qu'il faut mettre en place dès demain, même dans un petit commerce. L'objectif : pouvoir répondre en une heure à la question « Montrez-moi ».<\/p>\n<h4>Classer ses pièces<\/h4>\n<p>Choisissez un système et tenez-vous-y : classeurs, boîtes, dossier numérique avec photos et sauvegarde. Une organisation simple :<\/p>\n<table>\n<thead><tr><th>Dossier<\/th><th>Contenu<\/th><th>À conserver<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1. Identité<\/td><td>NIF, registre du commerce, statuts, patente, attestations<\/td><td>Toujours à jour<\/td><\/tr>\n<tr><td>2. Ventes<\/td><td>Factures émises, carnet de caisse, relevés de paiement mobile<\/td><td>Classées par mois<\/td><\/tr>\n<tr><td>3. Achats<\/td><td>Factures fournisseurs, bons de livraison<\/td><td>Classées par mois<\/td><\/tr>\n<tr><td>4. Banque<\/td><td>Relevés, bordereaux de versement<\/td><td>Par année<\/td><\/tr>\n<tr><td>5. Impôts<\/td><td>Déclarations, reçus de paiement, correspondances DGI<\/td><td>Par impôt et par année<\/td><\/tr>\n<tr><td>6. Taxes locales<\/td><td>Quittances de patente, marché, enseigne<\/td><td>Par année<\/td><\/tr>\n<tr><td>7. Douane<\/td><td>Déclarations, quittances, documents de transport<\/td><td>Par importation<\/td><\/tr>\n<tr><td>8. Personnel<\/td><td>Contrats, bulletins, reversements de l'IPR<\/td><td>Par année<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La durée de conservation est fixée par la loi (souvent plusieurs années) : demandez-la à votre expert-comptable. En cas de doute, gardez plus longtemps.<\/p>\n<h4>Bien facturer<\/h4>\n<ul>\n<li>Une facture contient : nom et NIF du vendeur, nom (et NIF) du client, date, numéro unique et continu, description des produits, quantités, prix unitaires, total HT, TVA si vous êtes assujetti, total TTC.<\/li>\n<li>Si vous êtes assujetti à la TVA, appliquez la <b>facture normalisée<\/b> via un dispositif électronique fiscal ou un système agréé, selon les règles actuelles.<\/li>\n<li>Ne <b>scindez<\/b> pas artificiellement vos ventes et n'émettez pas de fausses factures : c'est de la fraude.<\/li>\n<li>Exigez des factures de vos fournisseurs, à votre nom, sinon vous perdez la déduction de TVA et la preuve de la charge.<\/li>\n<\/ul>\n<h4>Séparer l'argent de l'entreprise et celui de la maison<\/h4>\n<p>Ouvrez un compte pour l'entreprise. Versez-y les recettes, payez-y les achats, et prélevez un « salaire » régulier. Sans cette séparation, vous ne pouvez ni prouver vos charges ni savoir si vous gagnez de l'argent.<\/p>\n<h4>Les erreurs à éviter<\/h4>\n<ol>\n<li><b>Ne pas déclarer<\/b> parce qu'on pense qu'il n'y a rien à payer.<\/li>\n<li><b>Mélanger<\/b> dépenses personnelles et professionnelles.<\/li>\n<li><b>Payer sans reçu<\/b> ou jeter les reçus.<\/li>\n<li><b>Ne pas collecter la TVA<\/b> alors qu'on y est assujetti, puis devoir la payer sur ses propres fonds.<\/li>\n<li><b>Attendre le dernier jour<\/b> : en cas de panne de réseau, le retard est quand même un retard.<\/li>\n<li><b>Ignorer un courrier de l'administration<\/b> : les délais courent dès la réception.<\/li>\n<li><b>Croire un intermédiaire qui « règle tout »<\/b> sans papier.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Sylvie gère une pharmacie de quartier à Kinshasa. Chaque soir, elle note ses ventes ; chaque semaine, elle classe les factures d'achat ; chaque mois, elle calcule sa TVA le 5 et la déclare avant le 15. Un jour, une vérification porte sur les douze derniers mois. Elle remet un classeur propre en deux heures. Le contrôle ne trouve qu'une petite erreur de 45 000 FC, corrigée sans pénalité lourde.<\/div>\n<h4>Votre plan en 30 jours<\/h4>\n<ul>\n<li><b>Semaine 1<\/b> : vérifier NIF, patente et statut TVA ; ouvrir un compte entreprise.<\/li>\n<li><b>Semaine 2<\/b> : mettre en place les huit dossiers ; scanner les pièces importantes.<\/li>\n<li><b>Semaine 3<\/b> : construire le calendrier fiscal ; fixer les dates internes (calcul le 5, déclaration le 10).<\/li>\n<li><b>Semaine 4<\/b> : rencontrer un expert-comptable ou un conseiller pour confirmer votre régime et vos obligations.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Classez, facturez correctement, séparez les comptes, tenez un calendrier. Les bonnes habitudes coûtent peu et évitent la plupart des pénalités. Ce cours donne des repères : pour votre situation précise, faites-vous conseiller par un professionnel agréé.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les durées de conservation, le contenu exact de la facture normalisée et les règles de TVA changent par loi de finances. Confirmez-les auprès de la DGI avant d'agir. Cette formation ne remplace pas un conseil fiscal personnalisé.<\/div>","quiz":[{"q":"Quelle est la meilleure habitude pour se préparer à un contrôle ?","o":["Tout jeter après la vente","Classer régulièrement ses factures, reçus et déclarations","Garder uniquement les ventes","Attendre l'avis pour chercher"],"a":1,"e":"Des pièces classées permettent de répondre vite et de justifier les charges."},{"q":"Pourquoi ouvrir un compte bancaire au nom de l'entreprise ?","o":["Pour séparer l'argent de l'entreprise et celui du ménage et tracer les opérations","Pour ne plus payer d'impôts","Pour éviter les factures","Pour supprimer la TVA"],"a":0,"e":"La séparation facilite la preuve des charges et le calcul du bénéfice."},{"q":"Parmi ces éléments, lequel ne doit pas figurer parmi les erreurs à éviter ?","o":["Ignorer un courrier de l'administration","Mélanger dépenses privées et pro","Calculer sa TVA quelques jours avant l'échéance","Payer sans reçu"],"a":3,"e":"Calculer à l'avance est une bonne pratique ; les trois autres sont des erreurs."},{"q":"Vous calculez la TVA le 5 et déclarez le 10 de chaque mois, l'échéance étant le 15. Quel avantage ?","o":["Aucun","Cela supprime la TVA","Une marge de sécurité de 5 jours en cas d'imprévu","Cela change le taux"],"a":2,"e":"Une marge protège contre les pannes, absences ou retards de paiement."}]}],"exam":[{"q":"Un commerçant vient de commencer son activité à Kananga. Que dit la DGI sur la demande de NIF ?","o":["Elle est gratuite ; il faut se méfier des intermédiaires qui la font payer","Elle coûte obligatoirement 100 $ via un intermédiaire","Elle est réservée aux sociétés de plus de 10 salariés","Elle n'est jamais nécessaire pour un petit commerce"],"a":0,"e":"La DGI a rappelé en décembre 2025 que la demande de NIF est gratuite et mis en garde contre les intermédiaires payants."},{"q":"Un dépôt achète pour 3 000 000 FC HT et vend pour 4 500 000 FC HT (TVA 16 %). Quelle TVA doit-il verser ?","o":["240 000 FC","720 000 FC","480 000 FC","1 500 000 FC"],"a":1,"e":"Collectée : 720 000. Déductible : 480 000. À payer : 240 000 FC (16 % de la marge de 1 500 000 FC)."},{"q":"Un sac de ciment est vendu 232 000 FC TTC (TVA 16 %). Quel est le prix HT ?","o":["194 880 FC","200 000 FC","216 000 FC","208 800 FC"],"a":2,"e":"232 000 ÷ 1,16 = 200 000 FC ; la TVA est de 32 000 FC. Soustraire 16 % du TTC (non pas diviser par 1,16) est une erreur courante."},{"q":"Au-dessus de quel chiffre d'affaires annuel un indépendant est-il en principe assujetti à la TVA (hors professions libérales) ?","o":["300 000 000 FC","1 000 000 000 FC","80 000 000 FC","10 000 000 FC"],"a":3,"e":"Selon la DGI : 80 000 000 FC par an. Les professions libérales sont assujetties quel que soit leur chiffre d'affaires."},{"q":"Un assujetti à la TVA reçoit une facture d'achat qui n'est pas conforme (non normalisée, sans NIF). Quel risque principal ?","o":["Le refus de la déduction de la TVA correspondante","Aucun, la TVA reste toujours déductible","La suppression de son NIF","Le doublement du taux de TVA"],"a":1,"e":"Sans facture en règle, la TVA des achats n'est généralement pas déductible ; la presse a annoncé le refus de déduction sans facture normalisée conforme."},{"q":"Une société au réel a un bénéfice net imposable de 12 000 000 FC. Avec le taux général de 30 % de l'IS, quel impôt ?","o":["3 600 000 FC","360 000 FC","1 200 000 FC","4 200 000 FC"],"a":0,"e":"12 000 000 × 30 % = 3 600 000 FC."},{"q":"Une société est en perte mais a réalisé 250 000 000 FC de chiffre d'affaires. Avec la taxe minimale de 1 % du chiffre d'affaires, que paie-t-elle ?","o":["250 000 FC","75 000 000 FC","2 500 000 FC","Rien, elle est en perte"],"a":3,"e":"250 000 000 × 1 % = 2 500 000 FC. La taxe minimale existe même sans bénéfice."},{"q":"Un salon de coiffure (service) relève du régime simplifié des petites entreprises (2 %) avec 30 000 000 FC de chiffre d'affaires. Impôt ?","o":["600 000 FC","900 000 FC","300 000 FC","6 000 000 FC"],"a":2,"e":"30 000 000 × 2 % = 600 000 FC (1 % pour la vente de biens, 2 % pour les services)."},{"q":"Budget annuel de taxes locales : patente 90 000 FC, enseigne 50 000 FC, assainissement 8 000 FC par mois. Total sur l'année ?","o":["236 000 FC","148 000 FC","190 000 FC","326 000 FC"],"a":0,"e":"90 000 + 50 000 + 8 000 × 12 (96 000) = 236 000 FC."},{"q":"Importation : marchandises 5 000 $, transport et assurance 500 $, droits et taxes d'hypothèse de 10 % de la valeur en douane, transitaire et transport local 250 $. Coût de revient ?","o":["6 050 $","6 800 $","6 300 $","5 750 $"],"a":3,"e":"Valeur en douane 5 500 $ ; droits 550 $ ; frais 250 $. Total : 5 500 + 550 + 250 = 6 300 $."},{"q":"Des agents de l'administration se présentent pour un contrôle. Quelle attitude est la plus prudente ?","o":["Fermer la boutique pour la journée","Remettre de l'argent pour en finir vite","Demander l'avis de vérification et l'identité, remettre les pièces avec un inventaire, ne payer qu'avec une quittance officielle","Refuser de montrer les factures"],"a":2,"e":"Un contrôle se fait dans un cadre écrit. Un inventaire des pièces remises et une quittance pour tout paiement vous protègent."},{"q":"Quelle habitude réduit le plus le risque de pénalités et facilite un contrôle ?","o":["Classer chaque mois factures, reçus et déclarations, et tenir un calendrier fiscal","Garder seulement les ventes et jeter les achats","Mélanger la caisse de la boutique et celle de la maison","Attendre le dernier jour pour déclarer"],"a":1,"e":"Des pièces classées justifient les charges, et un calendrier évite les retards. Séparer les comptes de l'entreprise et du ménage aide aussi."}]},{"id":"vente","title":"Vente et gestion commerciale","icon":"🛒","level":"Débutant","hours":3,"summary":"Apprenez à accueillir, conseiller et convaincre vos clients, à négocier sans perdre votre marge et à gérer le crédit en toute sécurité. Un cours pratique, avec des exemples chiffrés en FC et des situations réelles de commerces congolais.","goals":["Accueillir les clients et tenir un point de vente attractif","Découvrir le besoin du client par des questions et l'écoute","Présenter un produit et répondre aux objections","Négocier le prix en protégeant sa marge","Fidéliser, gérer les réclamations et faire des ventes additionnelles","Accorder et suivre un crédit, délivrer des reçus et vendre par WhatsApp"],"chapters":[{"t":"Chapitre 1 — L'accueil, la tenue du point de vente et les types de clients","html":"\n<h4>Pourquoi l'accueil décide de tout<\/h4>\n<p>Un client décide en quelques secondes s'il va rester dans votre boutique ou aller chez le voisin. Avant même de parler du prix ou de la qualité, il regarde : est-ce propre ? Est-ce qu'on me voit ? Est-ce qu'on me respecte ? Un bon accueil ne coûte rien, mais il peut doubler vos ventes sur le mois.<\/p>\n<p>Vendre, ce n'est pas « pousser » un produit. C'est <b>aider une personne à résoudre un problème<\/b> : elle a soif, elle doit réparer son moto, elle prépare le mariage de sa fille. Votre rôle est de l'aider à bien choisir, à un prix juste, et de lui donner envie de revenir.<\/p>\n<h4>Les cinq gestes d'un bon accueil<\/h4>\n<ol>\n<li><b>Le regard et le salut<\/b> : dites bonjour dans les 5 secondes qui suivent l'entrée du client, même si vous servez quelqu'un d'autre. Un simple « Bonjour Maman, je suis à vous tout de suite » suffit.<\/li>\n<li><b>Le sourire<\/b> : un visage fermé fait fuir. Le sourire doit être sincère, pas forcé.<\/li>\n<li><b>Le vouvoiement et le titre de respect<\/b> : « Papa », « Maman », « Monsieur », « Madame », selon l'usage local, toujours avec politesse.<\/li>\n<li><b>La question ouverte<\/b> : « Qu'est-ce que je peux faire pour vous ? » plutôt que « Vous voulez quoi ? ».<\/li>\n<li><b>La disponibilité<\/b> : ne restez pas collé à votre téléphone. Si vous répondez à un message, excusez-vous et terminez vite.<\/li>\n<\/ol>\n<h4>La tenue du point de vente<\/h4>\n<p>Votre boutique parle pour vous. Quelques règles simples :<\/p>\n<ul>\n<li>Sol balayé et comptoir essuyé chaque matin, avant l'ouverture.<\/li>\n<li>Les produits les plus vendus à hauteur des yeux ; les produits lourds en bas ; les petits articles chers (cartes mémoire, écouteurs, médicaments) derrière le comptoir ou sous vitrine.<\/li>\n<li>Les prix visibles : un client qui ne voit pas le prix a peur qu'on le « fasse payer plus ».<\/li>\n<li>Les produits regroupés par famille : boissons ensemble, savons ensemble, câbles ensemble.<\/li>\n<li>Les produits proches de la date de péremption placés devant et vendus d'abord (règle du « premier entré, premier sorti »).<\/li>\n<li>Une tenue propre pour le vendeur, un espace de travail sans désordre.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mireille tient une boutique de produits de beauté près du marché Gambela à Lubumbashi. Pendant un mois, elle range ses crèmes par type de peau et affiche les prix sur de petites étiquettes. Résultat : les clientes demandent moins « C'est combien ? » et passent plus vite à l'achat. Ses ventes passent de 400 000 FC à 520 000 FC par semaine (environ 174 $ à 226 $ au taux de 2 300 FC pour 1 $ ; le taux varie, vérifiez-le chaque semaine).<\/div>\n<h4>Clients de passage et clients réguliers<\/h4>\n<p>Tous les clients ne se traitent pas de la même façon.<\/p>\n<table>\n<thead><tr><th>Critère<\/th><th>Client de passage<\/th><th>Client régulier<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fréquence<\/td><td>Une fois, par hasard<\/td><td>Toutes les semaines ou tous les mois<\/td><\/tr>\n<tr><td>Ce qu'il cherche<\/td><td>Un produit précis, vite<\/td><td>Confiance, conseil, bons prix<\/td><\/tr>\n<tr><td>Votre priorité<\/td><td>Bien l'accueillir pour qu'il revienne<\/td><td>Le connaître, le fidéliser<\/td><\/tr>\n<tr><td>Crédit<\/td><td>Non (vous ne le connaissez pas)<\/td><td>Possible, avec des règles (chapitre 6)<\/td><\/tr>\n<tr><td>Exemple<\/td><td>Voyageur qui achète de l'eau à la gare<\/td><td>Restauratrice qui prend sa farine chaque semaine<\/td><\/tr>\n<\/tbody><\/table>\n<p>Un client de passage bien traité peut devenir régulier. Un client régulier mal traité peut partir sans prévenir. Notez dans un cahier (ou dans l'application) le nom, le téléphone et les habitudes de vos meilleurs clients.<\/p>\n<h4>Les erreurs d'accueil à éviter<\/h4>\n<ul>\n<li>Ignorer un client parce qu'il est « mal habillé » : on ne juge jamais la capacité d'achat sur l'apparence.<\/li>\n<li>Suivre le client partout comme un surveillant : il se sent suspecté. Restez proche et disponible, sans l'étouffer.<\/li>\n<li>Se disputer devant les clients, parler fort au téléphone ou critiquer un concurrent.<\/li>\n<li>Laisser un client attendre sans un mot : dites « Deux minutes, s'il vous plaît ».<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Un bon accueil, c'est : saluer vite, sourire, respecter, poser une question ouverte, rester disponible. Une boutique propre, rangée et avec des prix visibles vend mieux. Distinguez client de passage (à bien traiter pour qu'il revienne) et client régulier (à connaître et à fidéliser).<\/div>\n","quiz":[{"q":"Un client entre pendant que vous servez quelqu'un d'autre. Que faites-vous en premier ?","o":["Vous le saluez et lui dites que vous êtes à lui dans un instant","Vous lui demandez de revenir plus tard","Vous demandez à un voisin de le servir sans lui parler","Vous continuez sans rien dire jusqu'à avoir fini"],"a":0,"e":"Saluer dans les premières secondes montre au client qu'il est vu et respecté, même s'il doit patienter un peu."},{"q":"Quelle question d'accueil est la meilleure ?","o":["Vous achetez ou vous regardez ?","Qu'est-ce que je peux faire pour vous ?","C'est pour quel prix ?","Vous voulez quoi ?"],"a":1,"e":"La question ouverte invite le client à expliquer son besoin et reste polie."},{"q":"Pourquoi afficher les prix sur les produits ?","o":["Pour impressionner les concurrents","Pour empêcher toute négociation","Parce que le client qui ne voit pas le prix craint d'être trompé","Parce que c'est obligatoire pour tous les commerces sans exception"],"a":2,"e":"L'affichage rassure, fait gagner du temps et montre l'honnêteté du commerçant."},{"q":"Qui est un client « régulier » ?","o":["Celui qui paie toujours en dollars","Celui qui marchande beaucoup","Celui qui achète pour la première fois un gros montant","Celui qui revient souvent acheter chez vous"],"a":3,"e":"La régularité (retour fréquent) définit le client régulier, quel que soit le montant ou la monnaie."}]},{"t":"Chapitre 2 — Écouter et découvrir le besoin du client","html":"\n<h4>Le vendeur qui parle trop vend moins<\/h4>\n<p>Beaucoup de commerçants pensent qu'il faut beaucoup parler pour vendre. C'est faux. Les meilleurs vendeurs <b>posent des questions, puis écoutent<\/b>. Quand vous comprenez vraiment le besoin, vous proposez le bon produit, le client est content et ne vous retourne pas l'article.<\/p>\n<h4>Pourquoi découvrir le besoin ?<\/h4>\n<ul>\n<li>Pour éviter de vendre un produit inadapté (et se faire insulter ensuite).<\/li>\n<li>Pour proposer un produit à la bonne taille de budget.<\/li>\n<li>Pour repérer un besoin supplémentaire (voir chapitre 5).<\/li>\n<li>Pour montrer au client qu'il est important.<\/li>\n<\/ul>\n<h4>La méthode des questions en entonnoir<\/h4>\n<p>On commence large, on termine précis :<\/p>\n<ol>\n<li><b>Le contexte<\/b> : « C'est pour quel usage ? Pour la maison, le commerce, un cadeau ? »<\/li>\n<li><b>Le besoin<\/b> : « Qu'est-ce qui est le plus important pour vous : la durée, le prix, la marque ? »<\/li>\n<li><b>Le budget<\/b> : « Vous pensez dépenser à peu près combien ? » Posez la question avec tact, sans gêner.<\/li>\n<li><b>Le délai<\/b> : « C'est pour aujourd'hui ou plus tard ? »<\/li>\n<li><b>La reformulation<\/b> : « Si je comprends bien, il vous faut un téléphone solide, avec une grosse batterie, autour de 150 000 FC. C'est bien cela ? »<\/li>\n<\/ol>\n<p>La reformulation est très puissante : le client sent qu'on l'a compris, et vous vérifiez que vous n'avez pas fait d'erreur.<\/p>\n<h4>Écouter avec les oreilles et avec les yeux<\/h4>\n<p>Le client ne dit pas tout. Observez : il regarde longtemps un article cher mais demande le moins cher ? Il a peut-être un budget limité mais de l'envie. Il hésite en regardant son téléphone ? Il attend peut-être l'avis de son mari ou de son associé. Ne le brusquez pas.<\/p>\n<ul>\n<li>Regardez la personne dans les yeux.<\/li>\n<li>Ne coupez pas la parole.<\/li>\n<li>Hochez la tête, dites « d'accord », « je vois ».<\/li>\n<li>Notez les mots-clés : « pas cher », « solide », « pour mes enfants », « urgent ».<\/li>\n<\/ul>\n<h4>Dialogue-type : pièces détachées à Kananga<\/h4>\n<table>\n<thead><tr><th>Qui<\/th><th>Ce qui est dit<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Client<\/td><td>Je cherche des plaquettes de frein pour ma moto.<\/td><\/tr>\n<tr><td>Vendeur<\/td><td>Bonjour Papa. C'est pour quelle marque et quelle année ?<\/td><\/tr>\n<tr><td>Client<\/td><td>Une 125, 2019. Je roule beaucoup en taxi-moto.<\/td><\/tr>\n<tr><td>Vendeur<\/td><td>Vous roulez beaucoup, donc le plus important c'est la durée, non ?<\/td><\/tr>\n<tr><td>Client<\/td><td>Oui, la dernière paire a fini en un mois.<\/td><\/tr>\n<tr><td>Vendeur<\/td><td>Je vous propose deux choix : la paire à 8 000 FC qui tient environ deux mois, ou celle à 14 000 FC qui tient environ six mois. Sur six mois, la deuxième coûte moins cher.<\/td><\/tr>\n<\/tbody><\/table>\n<p>Le vendeur n'a pas imposé la plus chère : il a compris le besoin (durée), puis il a comparé avec des chiffres. Calcul de contrôle : sur six mois, la paire à 8 000 FC tient deux mois, donc il en faut 3 : 3 x 8 000 = 24 000 FC. La paire à 14 000 FC suffit pour six mois : 14 000 FC. Le client économise 10 000 FC (environ 4,3 $).<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un pharmacien de quartier à Goma entend une mère dire « mon enfant tousse ». Il ne vend pas tout de suite un sirop : il demande l'âge, depuis quand, s'il y a de la fièvre. Si les signes sont inquiétants, il l'oriente vers le centre de santé au lieu de vendre. Il perd une petite vente, mais il gagne la confiance de toute la famille. Pour les médicaments, la santé du client passe avant la vente.<\/div>\n<h4>Les signaux d'achat<\/h4>\n<p>Certaines phrases montrent que le client se rapproche de la décision : « Vous avez cela en stock ? », « Vous pouvez livrer ? », « C'est garanti combien de temps ? », « Je peux payer en deux fois ? ». À ce moment, ne parlez plus beaucoup : répondez précisément et proposez de conclure.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne devinez jamais le budget du client d'après ses vêtements. Et ne mentez jamais pour « coller » au besoin : si vous n'avez pas le produit adapté, dites-le et orientez le client. Il reviendra.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Posez des questions ouvertes (contexte, besoin, budget, délai), écoutez sans couper, reformulez pour vérifier, observez les signaux d'achat. Proposez ensuite la solution qui répond au vrai besoin, avec des chiffres simples.<\/div>\n","quiz":[{"q":"Dans le dialogue des plaquettes de frein, pourquoi le vendeur propose-t-il la paire à 14 000 FC ?","o":["Parce qu'elle lui rapporte le plus","Parce qu'il a compris que le client veut de la durée et que c'est moins cher sur six mois","Parce que la paire à 8 000 FC est interdite","Parce que le client a demandé le plus cher"],"a":1,"e":"Sur six mois : 3 x 8 000 = 24 000 FC contre 14 000 FC. Le conseil répond au besoin exprimé (durée)."},{"q":"À quoi sert la reformulation ?","o":["À éviter de répondre au client","À gagner du temps pour inventer une réponse","À montrer qu'on a compris et à vérifier qu'on n'a pas fait d'erreur","À faire baisser le prix"],"a":2,"e":"Reformuler confirme la compréhension et évite de vendre un mauvais produit."},{"q":"Un client demande « C'est garanti combien de temps ? ». C'est probablement :","o":["Un signe qu'il veut partir","Une plaisanterie","Une critique de votre boutique","Un signal d'achat"],"a":3,"e":"Les questions sur garantie, stock, livraison ou paiement montrent que le client se projette dans l'achat."},{"q":"Vous n'avez pas le produit qui convient au besoin du client. Le mieux est de :","o":["Lui dire honnêtement que vous ne l'avez pas et l'orienter ou proposer de le commander","Lui dire que ce produit n'existe pas","Changer de sujet","Lui vendre un produit proche en disant que c'est pareil"],"a":0,"e":"L'honnêteté construit la confiance : le client revient, même s'il n'achète pas aujourd'hui."}]},{"t":"Chapitre 3 — Présenter le produit et répondre aux objections","html":"\n<h4>Présenter : caractéristique, avantage, bénéfice<\/h4>\n<p>Un client n'achète pas une « caractéristique », il achète un résultat. Pour bien présenter, passez par trois étapes :<\/p>\n<ul>\n<li><b>La caractéristique<\/b> : ce que le produit est (« batterie de 5 000 mAh »).<\/li>\n<li><b>L'avantage<\/b> : ce que cela permet (« elle dure plus longtemps »).<\/li>\n<li><b>Le bénéfice pour ce client<\/b> : ce que cela change pour lui (« vous ne serez plus à court de batterie quand le courant est coupé à Kinshasa »).<\/li>\n<\/ul>\n<p>Parlez toujours du bénéfice, avec les mots du client. À une commerçante de marché, on ne dit pas « écran AMOLED », on dit « vous verrez bien vos messages au soleil ».<\/p>\n<h4>Faire toucher, faire essayer<\/h4>\n<p>Laissez le client tenir, goûter, essayer, comparer. Pour un pagne : déplier et montrer à la lumière. Pour un téléphone : le laisser l'allumer. Pour de la farine : montrer la date et l'emballage. Ce qu'on a touché, on a plus de mal à le laisser.<\/p>\n<h4>Les objections : ce qu'elles veulent vraiment dire<\/h4>\n<p>Une objection n'est pas un refus. C'est souvent une demande d'information ou une peur. Si le client dit « C'est cher », il veut peut-être comprendre pourquoi cela vaut ce prix. Votre travail : <b>comprendre la vraie raison<\/b>, puis répondre calmement.<\/p>\n<table>\n<thead><tr><th>Objection<\/th><th>Ce que cela peut cacher<\/th><th>Bonne réponse<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>« C'est trop cher »<\/td><td>Budget limité, ou manque de preuve de valeur<\/td><td>« Par rapport à quoi ? » puis montrer durée, garantie, qualité ; proposer un modèle moins cher<\/td><\/tr>\n<tr><td>« Chez le voisin c'est moins cher »<\/td><td>Comparaison de prix<\/td><td>Comparer le même produit (origine, garantie, date) ; ne jamais dénigrer le voisin<\/td><\/tr>\n<tr><td>« Je vais réfléchir »<\/td><td>Doute, ou besoin de consulter<\/td><td>« Qu'est-ce qui vous fait hésiter ? » puis lever le doute ; sinon laisser votre numéro<\/td><\/tr>\n<tr><td>« Je n'ai pas l'argent maintenant »<\/td><td>Trésorerie<\/td><td>Proposer un acompte, un modèle plus petit, ou revenir à la date de paie<\/td><\/tr>\n<tr><td>« Je ne vous connais pas »<\/td><td>Manque de confiance<\/td><td>Garantie écrite, reçu, essai sur place, recommandations d'autres clients<\/td><\/tr>\n<\/tbody><\/table>\n<h4>La méthode en quatre temps : E-C-R-V<\/h4>\n<ol>\n<li><b>Écouter<\/b> l'objection jusqu'au bout.<\/li>\n<li><b>Comprendre<\/b> : « Si je comprends bien, c'est le prix qui vous gêne ? »<\/li>\n<li><b>Répondre<\/b> avec un fait, une preuve ou une alternative.<\/li>\n<li><b>Vérifier<\/b> : « Est-ce que cela répond à votre question ? »<\/li>\n<\/ol>\n<h4>Calcul de valeur : le prix se justifie par le coût d'usage<\/h4>\n<p>Exemple : des chaussures de travail à 30 000 FC qui durent 3 mois, contre 55 000 FC qui durent 12 mois. Coût par mois : 30 000 / 3 = 10 000 FC par mois ; 55 000 / 12 = 4 583 FC par mois (arrondi). Les chaussures « chères » coûtent moins de la moitié par mois. Mais attention : c'est un argument honnête seulement si la durée annoncée est réelle.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Mbuji-Mayi, un client hésite sur un panneau solaire de 50 000 FC alors que le voisin en vend un à 35 000 FC. Le vendeur ne dit pas du mal du voisin. Il demande : « Vous voulez l'utiliser combien d'heures par jour ? » Il explique la différence de puissance et la garantie de 12 mois écrite sur le reçu. Le client comprend que les deux produits ne sont pas comparables et achète le bon, ou repart informé et revient plus tard.<\/div>\n<h4>Ce qu'il ne faut jamais faire<\/h4>\n<ul>\n<li>Argumenter pour « gagner » contre le client. Vous voulez qu'il parte content, pas battu.<\/li>\n<li>Promettre ce que le produit ne fait pas.<\/li>\n<li>Dire du mal d'un concurrent ou d'une autre marque.<\/li>\n<li>Se vexer devant « c'est cher ».<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Présentez le bénéfice pour le client, pas seulement la caractéristique. Laissez essayer. Une objection est une demande d'information : écoutez, comprenez, répondez avec preuves et alternatives, puis vérifiez. Justifiez le prix par le coût d'usage réel, avec honnêteté.<\/div>\n","quiz":[{"q":"Quel énoncé exprime un bénéfice pour le client ?","o":["Modèle 2024","Batterie de 5 000 mAh","Cette batterie tient deux jours, vous ne cherchez plus de prise quand le courant est coupé","Marque connue mondialement"],"a":2,"e":"Le bénéfice relie la caractéristique à un résultat concret dans la vie du client."},{"q":"Des chaussures à 30 000 FC durent 3 mois ; d'autres à 55 000 FC durent 12 mois. Quel est le coût mensuel de ces dernières (arrondi) ?","o":["5 500 FC","55 000 FC","10 000 FC","4 583 FC"],"a":3,"e":"55 000 / 12 = 4 583 FC par mois, contre 10 000 FC pour les premières."},{"q":"Un client dit « Je vais réfléchir ». La meilleure réaction est de :","o":["Demander avec douceur ce qui le fait hésiter pour lever le doute","Lui dire que le produit sera épuisé demain, même si c'est faux","Le laisser partir sans rien dire","Baisser tout de suite le prix de moitié"],"a":0,"e":"L'hésitation cache souvent une question non dite. Mentir sur le stock détruit la confiance."},{"q":"Le client dit que le voisin est moins cher. Que faites-vous ?","o":["Vous dites que le voisin vend de la contrefaçon","Vous comparez objectivement les deux produits (garantie, origine, qualité) sans dénigrer","Vous alignez automatiquement votre prix","Vous ignorez la remarque"],"a":1,"e":"Comparer les faits aide le client à choisir. Dénigrer est malhonnête et nuit à votre image."}]},{"t":"Chapitre 4 — Négocier le prix sans perdre sa marge","html":"\n<h4>Marchander fait partie de la culture commerciale<\/h4>\n<p>Dans beaucoup de marchés et de boutiques de la RDC, le client s'attend à discuter le prix. Ce n'est pas un problème : c'est une occasion de créer une relation. Le danger, c'est de baisser le prix sans réfléchir et de vendre à perte sans s'en rendre compte.<\/p>\n<h4>Connaître ses chiffres avant de négocier<\/h4>\n<p>Avant toute discussion, vous devez connaître :<\/p>\n<ul>\n<li>Votre <b>prix d'achat complet<\/b> : prix du fournisseur + transport + frais de douane ou de manutention + pertes. C'est le coût de revient.<\/li>\n<li>Votre <b>marge<\/b> : prix de vente moins coût de revient.<\/li>\n<li>Votre <b>prix plancher<\/b> : le prix en dessous duquel vous ne descendez jamais (coût + marge minimale).<\/li>\n<\/ul>\n<p>Dans l'application, la fiche produit vous donne le coût et la marge. Regardez-les avant de négocier.<\/p>\n<h4>Calcul : ce que coûte vraiment une remise<\/h4>\n<p>Prenons un téléphone acheté 80 000 FC (coût de revient, transport inclus), vendu 100 000 FC. La marge est de 20 000 FC, soit 20 % du prix de vente (et 25 % du coût).<\/p>\n<table>\n<thead><tr><th>Prix de vente<\/th><th>Remise<\/th><th>Marge en FC<\/th><th>Marge en % du prix<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>100 000 FC<\/td><td>0 %<\/td><td>20 000 FC<\/td><td>20 %<\/td><\/tr>\n<tr><td>95 000 FC<\/td><td>5 %<\/td><td>15 000 FC<\/td><td>15,8 %<\/td><\/tr>\n<tr><td>90 000 FC<\/td><td>10 %<\/td><td>10 000 FC<\/td><td>11,1 %<\/td><\/tr>\n<tr><td>85 000 FC<\/td><td>15 %<\/td><td>5 000 FC<\/td><td>5,9 %<\/td><\/tr>\n<tr><td>80 000 FC<\/td><td>20 %<\/td><td>0 FC<\/td><td>0 %<\/td><\/tr>\n<\/tbody><\/table>\n<p>Une remise de 10 % du prix a réduit la marge de <b>moitié<\/b> (de 20 000 à 10 000 FC). Pour gagner le même bénéfice total qu'avant, il faut vendre <b>deux fois plus<\/b> de téléphones. Si vous en vendiez 10 par mois à 20 000 FC de marge (200 000 FC), à 10 000 FC de marge il vous en faut 20 pour gagner autant. Une petite remise est donc très coûteuse.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Jean-Pierre vend des cartons de jus à Goma. Il achète un carton à 18 000 FC (transport compris) et le vend 21 000 FC. Marge : 3 000 FC. Un client en prend 10 et demande « un geste ». Jean-Pierre calcule : s'il donne 1 000 FC de remise par carton, la marge tombe à 2 000 FC, soit une perte de 10 000 FC sur la commande. Il propose plutôt d'offrir un petit carton de 12 sachets d'eau, qui lui coûte 3 000 FC. Pour lui, le geste coûte 3 000 FC au lieu de 10 000 FC, et le client est content.<\/div>\n<h4>Les principes d'une négociation saine<\/h4>\n<ol>\n<li><b>Ne baissez jamais sans contrepartie.<\/b> Chaque concession doit être payée : le client prend plus, paie comptant, paie en dollars en espèces, vient chercher lui-même.<\/li>\n<li><b>Donnez de petites concessions, de plus en plus petites.<\/b> Si vous baissez de 3 000, puis 2 000, puis 500, le client comprend que vous arrivez au bout.<\/li>\n<li><b>Gardez une marge de manœuvre<\/b> en affichant un prix raisonnable, mais pas absurde. Un prix gonflé de 50 % pour « pouvoir marchander » fait fuir les clients informés.<\/li>\n<li><b>Valorisez avant de baisser<\/b> : rappelez garantie, qualité, service.<\/li>\n<li><b>Sachez dire non poliment<\/b> : « Je ne peux pas descendre en dessous de ce prix, sinon je perds de l'argent. Par contre, je peux vous offrir… »<\/li>\n<\/ol>\n<h4>Les alternatives à la baisse de prix<\/h4>\n<ul>\n<li>Offrir un petit accessoire à faible coût (coque, câble, sachet).<\/li>\n<li>Livraison gratuite à partir d'un certain montant.<\/li>\n<li>Paiement en deux fois avec acompte.<\/li>\n<li>Lot de plusieurs articles à prix dégressif.<\/li>\n<\/ul>\n<h4>Dollars et francs : attention au taux<\/h4>\n<p>Si vous affichez en dollars et le client paie en francs congolais, appliquez le taux du jour, annoncé clairement (« aujourd'hui 1 $ = 2 300 FC dans cet exemple ; le taux varie »). Un taux trop bas pour « faire plaisir » grignote votre marge sans que vous le voyiez.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne confondez pas marge et pourcentage de remise. Une remise de 20 % sur un produit à 20 % de marge vous fait travailler gratuitement. Et ne vendez jamais en dessous du coût de revient, sauf décision réfléchie (liquidation d'un produit périmé, par exemple).<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Connaissez votre coût de revient et votre prix plancher. Une remise de 10 % peut diviser la marge par deux. Négociez avec contreparties, concessions décroissantes, et préférez offrir un petit plus plutôt que baisser le prix.<\/div>\n","quiz":[{"q":"Un article coûte 80 000 FC et se vend 100 000 FC. Vous accordez 10 % de remise. Quelle est votre marge en FC ?","o":["5 000 FC","20 000 FC","15 000 FC","10 000 FC"],"a":3,"e":"100 000 - 10 000 = 90 000 de prix ; 90 000 - 80 000 = 10 000 FC de marge, soit la moitié de la marge initiale."},{"q":"Que signifie « prix plancher » ?","o":["Le prix en dessous duquel vous ne vendez pas car la marge minimale ne serait plus respectée","Le prix du concurrent","Le prix d'achat chez le fournisseur uniquement","Le prix affiché le plus haut"],"a":0,"e":"Le prix plancher = coût de revient + marge minimale que vous vous fixez."},{"q":"Un client demande un geste sur 10 cartons à marge de 3 000 FC chacun. Quelle option protège le mieux votre marge ?","o":["Baisser de 1 000 FC par carton","Offrir un article qui vous coûte 3 000 FC au total","Baisser de 2 000 FC par carton","Refuser en criant"],"a":1,"e":"Baisser de 1 000 FC sur 10 cartons coûte 10 000 FC ; l'offre coûte 3 000 FC."},{"q":"Quelle attitude est correcte dans une négociation ?","o":["Ne jamais discuter","Concéder de plus en plus gros pour conclure","Chaque concession doit avoir une contrepartie et être de plus en plus petite","Annoncer un prix très haut pour pouvoir baisser de 50 %"],"a":2,"e":"Des concessions décroissantes avec contrepartie montrent que vous approchez de votre limite."}]},{"t":"Chapitre 5 — Vente additionnelle, fidélisation et réclamations","html":"\n<h4>La vente additionnelle : proposer le « petit plus » utile<\/h4>\n<p>La <b>vente additionnelle<\/b> consiste à proposer, après le choix principal, un produit qui complète le premier. La <b>vente croisée<\/b> propose un produit voisin. La <b>montée en gamme<\/b> propose une version supérieure. Le but n'est pas de forcer, mais d'aider : le client oublie souvent ce dont il aura besoin.<\/p>\n<table>\n<thead><tr><th>Achat principal<\/th><th>Proposition utile<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Téléphone<\/td><td>Coque, protection d'écran, chargeur de rechange<\/td><\/tr>\n<tr><td>Farine de manioc ou de maïs (sac)<\/td><td>Huile, sel, sucre<\/td><\/tr>\n<tr><td>Pagne<\/td><td>Fil, doublure, couturier partenaire<\/td><\/tr>\n<tr><td>Plaquettes de frein<\/td><td>Liquide de frein, main-d'œuvre recommandée<\/td><\/tr>\n<tr><td>Boissons pour fête<\/td><td>Glaçons, gobelets, livraison<\/td><\/tr>\n<\/tbody><\/table>\n<h4>Comment proposer sans harceler<\/h4>\n<ul>\n<li>Proposez <b>une seule fois<\/b> et <b>une ou deux choses<\/b>, pas dix.<\/li>\n<li>Utilisez la formule « Beaucoup de clients prennent aussi… » ou « Avec cela, il vous faudra… ».<\/li>\n<li>Si le client dit non, souriez et passez à la caisse.<\/li>\n<li>Ne proposez pas quand le client est pressé ou visiblement à court d'argent.<\/li>\n<\/ul>\n<p>Calcul : une boutique de téléphones à Kinshasa fait 40 ventes par semaine. Si seulement 1 client sur 4 prend une coque à 3 000 FC (marge de 1 500 FC), cela fait 10 coques, soit 15 000 FC de marge par semaine, environ 60 000 FC par mois, sans aucun client supplémentaire.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Dans une quincaillerie de Kananga, un client achète 5 tôles. Le vendeur demande : « C'est pour couvrir quelle surface ? » puis suggère les clous et les vis adaptées. Le client avait oublié et aurait dû revenir ou aller ailleurs. Il économise du temps, et le vendeur augmente sa vente de 12 %.<\/div>\n<h4>Fidéliser : un client fidèle vaut plusieurs nouveaux<\/h4>\n<p>Trouver un nouveau client demande du temps et souvent de l'argent (publicité). Garder un client coûte beaucoup moins. Les moyens simples :<\/p>\n<ul>\n<li>Se souvenir du prénom et des habitudes.<\/li>\n<li>Envoyer un message WhatsApp quand un produit attendu arrive.<\/li>\n<li>Carte de fidélité (10 achats, le 11e à moitié prix, ou un petit cadeau).<\/li>\n<li>Remercier : « Merci Maman, à bientôt ».<\/li>\n<li>Demander son avis : « Le produit vous a donné satisfaction ? »<\/li>\n<\/ul>\n<h4>Gérer une réclamation : méthode en six pas<\/h4>\n<p>Une réclamation bien gérée transforme un client fâché en client très fidèle. Un client qui se plaint est un client qui vous donne encore une chance : beaucoup partent sans rien dire.<\/p>\n<ol>\n<li><b>Écoutez<\/b> sans interrompre, calmement.<\/li>\n<li><b>Ne vous justifiez pas tout de suite<\/b> ni n'accusez le client.<\/li>\n<li><b>Reconnaissez<\/b> le problème : « Je comprends que ce soit gênant. »<\/li>\n<li><b>Demandez les faits<\/b> : reçu, date, état du produit.<\/li>\n<li><b>Proposez une solution<\/b> claire : échange, réparation, avoir, remboursement
