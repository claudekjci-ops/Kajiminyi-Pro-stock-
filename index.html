<style>
:root{--dg:#003B32;--g:#00A86B;--bg:#F4F7F6;--o:#FFA726;--r:#E53935;--tx:#13302b;--mu:#6b8480;--bd:#e1e9e7;--sh:0 2px 12px rgba(0,59,50,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;overscroll-behavior-y:none}
h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{vertical-align:middle;flex:none}
.muted{color:var(--mu)}.pos{color:var(--g)}.neg{color:var(--r)}.sm{font-size:.85em}.right{text-align:right}
.splash,.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--dg),#005a48);color:#fff;padding:24px;text-align:center}
.splash img{width:88px;border-radius:20px}
.login .box{background:#fff;color:var(--tx);border-radius:24px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login img{width:84px;border-radius:20px}
.login h1{margin:12px 0 4px;color:var(--dg);font-size:1.4rem;letter-spacing:.5px}
.login p{color:var(--mu);margin:0 0 22px;font-size:.9rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:1px solid var(--bd);border-radius:14px;background:#fff;font-weight:600;box-shadow:var(--sh)}
.gbtn:active{transform:scale(.98)}
/* layout */
.shell{min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:250px;background:var(--dg);color:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.side.open+.scrim{display:block}
.side .lg{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:800;letter-spacing:.5px}
.side .lg img{width:38px;border-radius:10px}
.side .lg small{display:block;font-weight:400;font-size:.7rem;opacity:.7;letter-spacing:0}
.side nav{flex:1;overflow:auto;padding:4px 10px}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#cfe7df;text-decoration:none;margin-bottom:2px}
.side a.on{background:var(--g);color:#fff;font-weight:600}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:.8rem}
.mainwrap{min-height:100vh;padding-bottom:78px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--dg);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .brand-s{font-weight:800;flex:1;font-size:.95rem}.top .brand-s b{color:var(--g)}
.ib{background:none;border:0;color:#fff;padding:4px}
.net{font-size:.72rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.15)}
.net.off{background:var(--o);color:#3a2500}
main{padding:14px;max-width:1300px;margin:0 auto}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.68rem;color:var(--mu);text-decoration:none;background:none;border:0}
.bnav a.on{color:var(--g);font-weight:700}
@media(min-width:900px){
  .side{transform:none}.scrim{display:none!important}
  .mainwrap{margin-left:250px;padding-bottom:20px}.bnav{display:none}
  .top .ib{display:none}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:1.25rem;color:var(--dg)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* composants */
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:8px;color:var(--dg)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);border-left:5px solid var(--g);animation:up .35s both}
.kpi small{color:var(--mu);display:block;font-size:.74rem}
.kpi b{font-size:1.12rem;display:block;margin-top:2px;word-break:break-word}
.kpi.o{border-color:var(--o)}.kpi.r{border-color:var(--r)}.kpi.d{border-color:var(--dg)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chart{position:relative;height:230px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--dg);border:1px solid var(--bd)}
.btn.dark{background:var(--dg)}.btn.red{background:var(--r)}.btn.orange{background:var(--o);color:#3a2500}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font-size:.84rem;color:var(--tx)}
.chip.on{background:var(--dg);color:#fff;border-color:var(--dg)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:#e3f6ee;color:#007a4d}
.badge.warn{background:#fff1dc;color:#9a5b00}.badge.bad{background:#fde6e5;color:#b3231f}.badge.gray{background:#eceff0;color:#556}
.search{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:#fff;margin-bottom:8px}
.tw{overflow-x:auto;border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:.86rem}
.tbl th{background:var(--dg);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap;font-weight:600;font-size:.78rem}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:nth-child(even) td{background:#fafcfb}
.tbl img.th{width:38px;height:38px;border-radius:8px;object-fit:cover;display:block}
.tbl .ac{white-space:nowrap}
.tbl .ac button{background:none;border:0;color:var(--dg);padding:4px}
.tbl .ac .del{color:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:12px}
.sp{justify-content:space-between}
/* formulaires */
.frm{display:flex;flex-direction:column;gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mu);font-weight:600}
.frm input,.frm select,.frm textarea,.in{padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:1rem;width:100%}
.frm input:focus,.frm select:focus,.search:focus{outline:2px solid var(--g);border-color:transparent}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--tx)}
.frm .chk input{width:auto}
.urow,.pl{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.pl{grid-template-columns:1.5fr 1fr .8fr .9fr auto auto}
.urow input,.pl input,.pl select{padding:8px;border:1px solid var(--bd);border-radius:10px;width:100%;min-width:0}
@media(max-width:600px){.pl{grid-template-columns:1fr 1fr 1fr}.pl .pl-p{grid-column:1/4}}
.x{background:none;border:0;color:var(--mu);font-size:1.1rem;padding:4px 8px}
/* modales */
.modal-wrap{position:fixed;inset:0;background:rgba(0,20,16,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal-wrap.open{opacity:1}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .25s}
.modal-wrap.open .sheet{transform:none}
.sheet.wide{max-width:760px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.sheet-h h3{color:var(--dg)}
.sheet-b{padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
@media(min-width:700px){.modal-wrap{align-items:center}.sheet{border-radius:22px}}
.toasts,#toasts{position:fixed;top:12px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;animation:up .25s;transition:opacity .35s}
.toast.err{background:var(--r)}.toast.out{opacity:0}
/* ventes */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.pcard:active{transform:scale(.97)}
.pcard img,.pcard .ph-ic{width:100%;height:80px;object-fit:cover;border-radius:10px}
.ph-ic{background:linear-gradient(135deg,#d8f3e8,#bfe9d6);color:var(--dg);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800}
.pcard b{font-size:.84rem;line-height:1.2}.pcard span{color:var(--g);font-weight:700;font-size:.86rem}.pcard small{font-size:.72rem}
.pcard.out{opacity:.55}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;background:var(--g);color:#fff;border:0;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px rgba(0,168,107,.4)}
@media(min-width:900px){.cartbar{left:auto;right:24px;bottom:24px;min-width:300px}}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.cl .qty{display:flex;align-items:center;gap:4px}
.cl .qty input{width:62px;text-align:center;padding:6px;border:1px solid var(--bd);border-radius:8px}
.cl .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:1.1rem}
.cl select{padding:6px;border:1px solid var(--bd);border-radius:8px}
.totbox{background:var(--bg);border-radius:14px;padding:12px;margin:10px 0}
.totbox .big{font-size:1.4rem;font-weight:800;color:var(--dg)}
.receipt{font-family:"Courier New",monospace;font-size:.82rem;background:#fff;padding:6px;max-width:340px;margin:0 auto}
.receipt .rc-h{text-align:center;border-bottom:1px dashed #333;padding-bottom:6px;margin-bottom:6px}
.receipt table{width:100%}.receipt td{padding:2px 0;vertical-align:top}
.receipt .rc-t{border-top:1px dashed #333;margin-top:6px;padding-top:6px}
.receipt .rc-t div{display:flex;justify-content:space-between}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;width:100%;max-width:none}
  .modal-wrap,.sheet,.sheet-b{position:static!important;overflow:visible!important;transform:none!important;max-height:none!important}
}
.inv-in{width:84px;padding:6px;border:1px solid var(--bd);border-radius:8px}
.cat-card{display:flex;gap:12px;align-items:center}
.cat-ic{width:54px;height:54px;border-radius:14px;background:#d8f3e8;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none;overflow:hidden}
.cat-ic img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.hint{background:#fff8e8;border:1px solid #ffe2a8;border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:10px}
.mi{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}

/* ===== Style "maquette" : écran mobile ===== */
body{background:#f2f6f5}
.top{background:var(--dg);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .brand-s{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:700}
.top .brand-s img{width:30px;height:30px;border-radius:8px}
.top .brand-s b{color:#7ef0bd}
@media(max-width:899px){.ph h2{display:none}.ph:has(.acts:empty){display:none}.ph{margin-bottom:8px;justify-content:flex-end}}
.hero{background:linear-gradient(135deg,#00A86B,#008a57);color:#fff;border-radius:20px;padding:16px 18px;position:relative;box-shadow:0 8px 20px rgba(0,168,107,.28);margin-bottom:12px;overflow:hidden}
.hero small{opacity:.92;font-size:.9rem;display:block}
.hero b{display:block;font-size:2rem;margin:4px 0 2px;letter-spacing:.3px}
.hero span{opacity:.88;font-size:.85rem}
.hero i{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.4}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{color:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:96px;box-shadow:0 6px 14px rgba(0,0,0,.12);animation:up .35s both}
.tile .t-h{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600}
.tile b{font-size:1.7rem;line-height:1.1;margin-top:4px}.tile small{opacity:.9}
.t-blue{background:linear-gradient(135deg,#3b9bff,#1e6fe8)}.t-green{background:linear-gradient(135deg,#7ccf52,#43a047)}
.t-orange{background:linear-gradient(135deg,#ffbd4a,#fb8c00)}.t-purple{background:linear-gradient(135deg,#a066f7,#6f3bd9)}
.card{border-radius:20px;border:1px solid #e8efed}
.bnav{border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,59,50,.1);border-top:0}
.bnav a,.bnav button{font-size:.72rem;padding:10px 2px 8px}
.bnav a.on{color:var(--g)}

function rangeFor(p, ref = new Date()) {
  const y = ref.getFullYear(), m = ref.getMonth(), d = ref.getDate(); let a, b;
  if (p === 'day') { a = new Date(y, m, d); b = new Date(y, m, d + 1); }
  else if (p === 'week') { const wd = (ref.getDay() + 6) % 7; a = new Date(y, m, d - wd); b = new Date(y, m, d - wd + 7); }
  else if (p === 'month') { a = new Date(y, m, 1); b = new Date(y, m + 1, 1); }
  else if (p === 'quarter') { const q = Math.floor(m / 3) * 3; a = new Date(y, q, 1); b = new Date(y, q + 3, 1); }
  else { a = new Date(y, 0, 1); b = new Date(y + 1, 0, 1); }
  return [a.getTime(), b.getTime() - 1];
}
function buckets(p) {
  const [from, to] = rangeFor(p); const labels = [], ends = []; let idx;
  const M = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'];
  if (p === 'day') {
    for (let i = 0; i < 24; i++) { labels.push(i + 'h'); ends.push(from + (i + 1) * 36e5 - 1); }
    idx = ts => new Date(ts).getHours();
  } else if (p === 'week' || p === 'month') {
    const a = new Date(from), n = Math.round((to + 1 - from) / 864e5);
    for (let i = 0; i < n; i++) {
      const d = new Date(a.getFullYear(), a.getMonth(), a.getDate() + i);
      labels.push(d.getDate() + '/' + (d.getMonth() + 1));
      ends.push(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() - 1);
    }
    idx = ts => { const d = new Date(ts); return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - from) / 864e5); };
  } else {
    const a = new Date(from), n = p === 'quarter' ? 3 : 12;
    for (let i = 0; i < n; i++) {
      const d = new Date(a.getFullYear(), a.getMonth() + i, 1);
      labels.push(M[d.getMonth()]); ends.push(new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() - 1);
    }
    idx = ts => { const d = new Date(ts); return (d.getFullYear() - a.getFullYear()) * 12 + d.getMonth() - a.getMonth(); };
  }
  return { from, to, labels, ends, idx, n: labels.length };
}

function resizeImage(file, max = 240) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function toast(msg, type = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.classList.add('out'), 3200); setTimeout(() => t.remove(), 3600);
}
function modal(title, html, opts = {}) {
  const w = document.createElement('div'); w.className = 'modal-wrap';
  w.innerHTML = `<div class="sheet ${opts.wide ? 'wide' : ''}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Fermer">✕</button></div><div class="sheet-b">${html}</div></div>`;
  document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('open'));
  w.close = () => { w.classList.remove('open'); setTimeout(() => { w.remove(); hooks.afterModal(); }, 200); };
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) w.close(); });
  return w;
}
const formData = f => Object.fromEntries(new FormData(f));
function form(title, html, onSubmit, opts = {}) {
  const w = modal(title, `<form class="frm">${html}<div class="row end"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">${opts.ok || 'Enregistrer'}</button></div></form>`, opts);
  const f = w.querySelector('form');
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (f.dataset.busy) return; f.dataset.busy = 1;
    try { const r = await onSubmit(formData(f), w, f); if (r !== false) w.close(); }
    catch (err) { toast(err.message || String(err), 'err'); }
    finally { delete f.dataset.busy; }
  });
  opts.onOpen?.(w, f); return w;
}

// Les identifiants sont générés côté client : un envoi rejoué après une coupure réseau écrase le même document (pas de doublon).
function batch() {
  const b = F.writeBatch(F.db);
  const api = {
    set: (c, id, d) => { b.set(F.doc(F.db, c, id), d); return api; },
    merge: (c, id, d) => { b.set(F.doc(F.db, c, id), d, { merge: true }); return api; },
    upd: (c, id, d) => { b.update(F.doc(F.db, c, id), d); return api; },
    del: (c, id) => { b.delete(F.doc(F.db, c, id)); return api; },
    commit: () => {
      const p = b.commit();
      p.catch(e => { console.error(e); toast('Erreur de synchronisation : ' + e.message, 'err'); });
      return p;
    }
  };
  return api;
}

}

function subscribe(onChange) {
  let t; const fire = () => { clearTimeout(t); t = setTimeout(onChange, 60); }; const un = [];
  for (const c of COLS) {
    const q = c === 'journal' ? F.query(F.collection(F.db, c), F.orderBy('ts', 'desc'), F.limit(600)) : F.collection(F.db, c);

function checkout(w) {
  const L = cartLines(); if (!L.length) throw new Error('Panier vide');
  const need = {}; L.forEach(x => { need[x.p.id] = (need[x.p.id] || 0) + x.qty * x.u.factor; });

  if (Math.abs(paid - t.total) > 0.05) throw new Error('Le total des paiements doit être égal au montant à payer');

  if (pay.credit > 0) {
    if (!cl) throw new Error('Choisissez un client pour une vente à crédit');
    if (!(cl.limit > 0) || (cl.debt || 0) + pay.credit > cl.limit + 1e-9) throw new Error(`Plafond de crédit dépassé (plafond ${usd(cl.limit || 0)}, dette ${usd(cl.debt || 0)})`);

  b.commit();
  cart = []; ck = { disc: 0, client: '', mode: 'usd', usd: '', cdf: '', mm: '', credit: '' };

/* ---------- authentification & rôles ---------- */
F.onAuthStateChanged(F.auth, async user => {
  unsub?.(); unsub = null; S.user = null; S.me = null; clearTimeout(idleT);
  if (!user) return loginScreen();
  loading('Connexion en cours…');
  const email = user.email.toLowerCase();
  const get = async (c, id) => { const r = F.doc(F.db, c, id); try { return await F.getDoc(r); } catch { return await F.getDocFromCache(r); } };
  try {
    let me = await get('users', email);
    if (!me.exists()) {
      const init = await get('meta', 'init');
      if (init.exists()) { S.user = user; return denied(email); }
      // Première utilisation : ce compte devient administrateur
      const b = batch();
      b.set('users', email, { name: user.displayName || email, role: 'admin', active: true, perms: ROLE_PERMS.admin, ts: Date.now() });
      b.set('meta', 'init', { ts: Date.now(), by: email });
      b.set('meta', 'settings', S.settings);
      SEED_CATS.forEach(([name, icon], i) => { const id = 'cat' + (i + 1); b.set('categories', id, { id, name, icon, desc: '', image: '', ts: Date.now() }); });
      await b.commit();
      me = await get('users', email);
    }
    const data = me.data();
    if (!data.active) { S.user = user; return denied(email); }
    S.user = user; S.me = { ...data, email, name: data.name || user.displayName || email, perms: [...(data.perms || ROLE_PERMS[data.role]), ...((ROLE_PERMS[data.role] || []).filter(m => ['calc','health','help'].includes(m)))] };
    startApp();
  } catch (e) { console.error(e); loginScreen('Erreur : ' + (e.code || e.message) + ' — vérifiez la connexion et les règles Firestore.'); }
});

/* ===== KAJIMINYI STOCK PRO — EXTENSION V2 =====
   À COLLER dans <script type="module">, juste AVANT la fin du script (après le dernier bloc "{ ... }", avant la balise de fermeture du script).
   Ajoute : Smart Calculator, Santé du commerce (score /100, seuil de rentabilité, employés),
   Aide & CGU (acceptation enregistrée), blocage d'une dépense supérieure au bénéfice du mois.

{
const NEW = { calc: 'Smart Calculator', health: 'Santé du commerce', help: 'Aide & CGU' };

const CGU_VERSION = '1.0';
const gch = {};
const mkc = (id, type, labels, datasets, extra = {}) => {
  const c = document.getElementById(id); if (!c || !window.Chart) return;
  gch[id]?.destroy();
  gch[id] = new Chart(c, { type, data: { labels, datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } }, ...extra } });
};

/* ================= SMART CALCULATOR ================= */
const p2 = x => r2(x);
const CALCS = [
  ['profit', 'Bénéfice & marge', [['buy', "Prix d'achat"], ['sell', 'Prix de vente'], ['qty', 'Quantité', 1]],
    v => [['Bénéfice', p2((v.sell - v.buy) * v.qty)], ['Marge sur vente %', v.sell ? p2((v.sell - v.buy) / v.sell * 100) : 0], ['Marge sur coût %', v.buy ? p2((v.sell - v.buy) / v.buy * 100) : 0]]],

  ['disc', 'Remise', [['a', 'Prix'], ['p', 'Remise %']], v => [['Montant remise', p2(v.a * v.p / 100)], ['Prix net', p2(v.a * (1 - v.p / 100))]]],
  ['tva', 'TVA configurable', [['a', 'Montant HT'], ['t', 'TVA %', 16]], v => [['TVA', p2(v.a * v.t / 100)], ['TTC', p2(v.a * (1 + v.t / 100))]]],
  ['fx', 'Taux de change', [['a', 'Montant USD'], ['r', 'Taux (CDF pour 1 USD)']], v => { const r = v.r || S.settings.rate; return [['En CDF', Math.round(v.a * r)], ['CDF → USD (même montant en CDF)', p2(v.a / r)]]; }],
  ['loan', 'Remboursement de dette', [['c', 'Capital'], ['t', 'Intérêt mensuel %'], ['n', 'Nombre de mois', 1]],
    v => { const i = v.t / 100, n = v.n || 1, m = i ? v.c * i / (1 - Math.pow(1 + i, -n)) : v.c / n; return [['Mensualité', p2(m)], ['Total à rembourser', p2(m * n)], ['Coût du crédit', p2(m * n - v.c)]]; }],
  ['stock', 'Stock restant', [['s', 'Stock initial'], ['e', 'Entrées'], ['o', 'Sorties']], v => [['Stock restant', p2(v.s + v.e - v.o)]]],
  ['unit', "Conversion d'unités", [['q', 'Quantité en unité de base'], ['f', "Contenu d'un emballage (ex. 12)", 12]], v => [['Emballages entiers', v.f ? Math.floor(v.q / v.f) : 0], ['Reste (unité de base)', v.f ? p2(v.q % v.f) : 0], ['Équivalent décimal', v.f ? +(v.q / v.f).toFixed(4) : 0]]],
  ['rent', 'Rentabilité (retour sur investissement)', [['i', 'Investissement'], ['g', 'Gain net']], v => [['Rentabilité %', v.i ? p2(v.g / v.i * 100) : 0]]],

];
let cs = { k: 'profit', vals: {}, res: null }, calcs = [], csub = false;
const ensureCalcs = () => {
  if (csub || !S.user) return; csub = true;
  F.onSnapshot(F.collection(F.db, 'calcs'), s => {
    calcs = s.docs.map(d => d.data()).sort((a, b) => b.ts - a.ts);
    if (location.hash === '#/calc' && !document.querySelector('.modal-wrap') && !document.activeElement?.matches?.('#view input,#view select')) views.calc($('#view'));
  }, e => console.error('calcs', e));
};
const calcNums = () => { const c = CALCS.find(x => x[0] === cs.k); const v = {}; c[2].forEach(([n, , d]) => { const raw = cs.vals[n]; v[n] = raw === undefined || raw === '' ? (d ?? 0) : num(raw); }); return v; };
views.calc = el => {
  ensureCalcs();
  const c = CALCS.find(x => x[0] === cs.k);
  el.innerHTML = page('Smart Calculator', `<button class="btn ghost" data-act="calcxls">${ic('dl', 16)} Excel</button>`, `
    <div class="card"><div class="frm">${sel('Type de calcul', 'ck', CALCS.map(x => [x[0], x[1]]), cs.k, 'data-ck')}
    ${c[2].map(([n, l, d]) => `<label>${esc(l)}<input type="number" step="any" inputmode="decimal" data-cv="${n}" value="${esc(cs.vals[n] ?? (d ?? ''))}"></label>`).join('')}
    <div class="row"><button class="btn" data-act="calcrun">Calculer</button><button class="btn ghost" data-act="calcsave" ${cs.res ? '' : 'disabled'}>Enregistrer</button></div></div>
    ${cs.res ? `<div class="totbox">${cs.res.map(([k, v]) => `<div class="row sp"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>` : ''}</div>
    <div class="card"><h3>Historique des calculs</h3>${calcs.map(h => `<div class="mi"><span><b>${esc(h.label)}</b><br><small class="muted">${fmtDate(h.ts)} · ${esc(h.user)} · ${h.res.map(r => esc(r[0] + ' : ' + r[1])).join(' | ')}</small></span><button class="btn sm ghost" data-act="calcload" data-id="${h.id}">Rouvrir</button></div>`).join('') || '<p class="muted">Aucun calcul enregistré.</p>'}</div>`);
};
document.addEventListener('change', e => { if (e.target.dataset?.ck !== undefined) { cs = { k: e.target.value, vals: {}, res: null }; views.calc($('#view')); } });
document.addEventListener('input', e => { const n = e.target.dataset?.cv; if (n) cs.vals[n] = e.target.value; });
A.calcrun = () => { cs.res = CALCS.find(x => x[0] === cs.k)[3](calcNums()); views.calc($('#view')); };
A.calcsave = () => {
  if (!cs.res) return; const id = uid(), c = CALCS.find(x => x[0] === cs.k);

A.calcload = d => { const h = calcs.find(x => x.id === d.id); if (h) { cs = { k: h.k, vals: { ...h.vals }, res: h.res }; views.calc($('#view')); } };
A.calcxls = () => exportXLSX('Historique des calculs', ['Date', 'Utilisateur', 'Calcul', 'Résultats'], calcs.map(h => [fmtDate(h.ts), h.user, h.label, h.res.map(r => r[0] + ' : ' + r[1]).join(' | ')]));

/* ================= BUSINESS HEALTH ANALYTICS ================= */
views.health = el => {
  const now = new Date(), ok = S.sales.filter(s => s.status !== 'cancelled'), eu = e => toUSD(e.amt, e.cur);
  const per = r => {
    const s = ok.filter(x => x.ts >= r[0] && x.ts <= r[1]), e = S.expenses.filter(x => x.ts >= r[0] && x.ts <= r[1]);
    const rev = sum(s, x => x.total), gross = rev - sum(s, x => x.cost), exp = sum(e, eu);
    return { rev, gross, exp, net: gross - exp, n: s.length };
  };
  const mr = i => rangeFor('month', new Date(now.getFullYear(), now.getMonth() - i, 15));
  const c = per(mr(0)), p = per(mr(1));
  const growth = p.rev > 0 ? (c.rev - p.rev) / p.rev * 100 : null, netm = c.rev > 0 ? c.net / c.rev * 100 : 0, margin = c.rev > 0 ? c.gross / c.rev : 0;
  const t30 = Date.now() - 30 * 864e5, sold = {}, prof = {};
  ok.filter(s => s.ts >= t30).forEach(s => s.items.forEach(i => { sold[i.pid] = (sold[i.pid] || 0) + i.qty * i.factor; prof[i.pid] = (prof[i.pid] || 0) + (i.price - i.cost) * i.qty; }));
  const dorm = S.products.filter(x => x.qty > 0 && !sold[x.id]), rup = S.products.filter(x => x.qty <= 0), P = S.products.length || 1;
  const debtC = sum(S.clients, x => x.debt || 0), debtS = sum(S.suppliers, x => x.debt || 0);
  const gaps = S.sessions.filter(s => s.status === 'closed' && (Math.abs(s.diff?.USD || 0) > 1 || Math.abs(s.diff?.CDF || 0) > S.settings.rate));
  const cl = (x, m) => Math.max(0, Math.min(m, x));
  const sc = [
    ['Rentabilité', cl(netm / 20 * 25, 25), 25], ['Croissance des ventes', growth == null ? 10 : cl(10 + growth / 2, 20), 20],
    ['Maîtrise des dépenses', c.gross > 0 ? cl((1 - c.exp / c.gross) * 20, 20) : 0, 20], ['Santé du stock', cl((1 - (dorm.length + rup.length) / P) * 15, 15), 15],
    ['Dettes clients', c.rev > 0 ? cl((1 - debtC / (c.rev * 2)) * 10, 10) : 5, 10], ['Fiabilité de caisse', cl(10 - gaps.length * 3, 10), 10]];
  const total = Math.round(sum(sc, x => x[1])), few = !ok.length;
  const col = total >= 70 ? 'var(--g)' : total >= 45 ? 'var(--o)' : 'var(--r)';
  const be = margin > 0 ? c.exp / margin : null;
  const rec = [];
  if (few) rec.push('Pas encore de ventes enregistrées : le score deviendra fiable avec les données réelles.');
  if (growth != null) rec.push(growth >= 0 ? `Les ventes ont augmenté de ${p2(growth)} % par rapport au mois précédent.` : `Les ventes ont baissé de ${p2(-growth)} % par rapport au mois précédent.`);
  if (p.exp > 0) { const g = (c.exp - p.exp) / p.exp * 100; if (g > 10) rec.push(`Vos dépenses ont augmenté de ${p2(g)} % par rapport au mois précédent.`); }
  if (be != null) rec.push(c.rev >= be ? `Seuil de rentabilité atteint (${usd(be)} de ventes ce mois).` : `Il reste ${usd(be - c.rev)} de ventes à réaliser pour couvrir les dépenses du mois (seuil ${usd(be)}).`);
  if (rup.length) rec.push(`${rup.length} produit(s) en rupture : ${rup.slice(0, 4).map(x => x.name).join(', ')}.`);
  if (dorm.length) rec.push(`${dorm.length} produit(s) dormants (aucune vente depuis 30 jours) : évitez de les recommander, faites une promotion.`);
  if (debtC > 0) rec.push(`Dettes clients à recouvrer : ${usd(debtC)}. Dettes fournisseurs : ${usd(debtS)}.`);
  if (gaps.length) rec.push(`${gaps.length} clôture(s) de caisse avec écart significatif.`);
  const dec = S.products.map(x => {
    const s = sold[x.id] || 0, pf = prof[x.id] || 0;
    const d = x.qty <= 0 && s ? ['Commander', 'bad'] : !s && x.qty > 0 ? ['Ne pas racheter / promotion', 'warn'] : pf <= 0 && s ? ['Revoir le prix', 'warn'] : s ? ['Continuer à vendre', ''] : ['—', 'gray'];
    return { x, pf, d };
  }).sort((a, b) => b.pf - a.pf).slice(0, 12);
  const users = {}; S.sales.forEach(s => { const u = users[s.userName] ??= { n: 0, c: 0, a: 0 }; u.n++; if (s.status === 'cancelled') u.c++; });
  S.journal.forEach(j => { (users[j.user] ??= { n: 0, c: 0, a: 0 }).a++; });
  el.innerHTML = page('Santé du commerce', '', `
    <div class="hero" style="background:linear-gradient(135deg,${col},#003B32)"><small>Indicateur global de santé</small><b>${total} / 100</b><span>${total >= 70 ? 'Commerce en bonne santé' : total >= 45 ? 'À surveiller' : 'Situation fragile'}${few ? ' (peu de données)' : ''}</span></div>
    <div class="card"><h3>Détail du score</h3>${sc.map(([k, v, m]) => `<div class="mi"><span>${k}</span><b>${p2(v)} / ${m}</b></div><div class="bar"><i style="width:${v / m * 100}%"></i></div>`).join('')}</div>
    <div class="card"><h3>Recommandations automatiques</h3>${rec.map(r => `<div class="mi"><span>${esc(r)}</span></div>`).join('') || '<p class="muted">Rien à signaler.</p>'}</div>
    <div class="grid g2"><div class="card"><h3>Ventes, dépenses, bénéfice net (6 mois, $)</h3><div class="chart"><canvas id="h1"></canvas></div></div>
    <div class="card"><h3>Seuil de rentabilité du mois ($)</h3><div class="chart"><canvas id="h2"></canvas></div><p class="muted sm">${be == null ? 'Calculable dès qu\'il y a des ventes avec marge positive.' : `Seuil : ${usd(be)} · ventes actuelles : ${usd(c.rev)}`}</p></div></div>
    <div class="card"><h3>Vendre ou pas ? (30 derniers jours)</h3><div class="tw"><table class="tbl"><thead><tr><th>Produit</th><th>Bénéfice</th><th>Stock</th><th>Décision</th></tr></thead><tbody>${dec.map(({ x, pf, d }) => `<tr><td>${esc(x.name)}</td><td>${usd(pf)}</td><td>${fmtQty(x)}</td><td><span class="badge ${d[1]}">${d[0]}</span></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Aucun produit.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h3>Qualité d'utilisation par employé</h3><div class="tw"><table class="tbl"><thead><tr><th>Employé</th><th>Ventes</th><th>Annulées</th><th>Actions</th><th>État</th></tr></thead><tbody>${Object.entries(users).map(([n, u]) => { const r = u.n ? u.c / u.n : 0; return `<tr><td>${esc(n)}</td><td>${u.n}</td><td>${u.c}</td><td>${u.a}</td><td><span class="badge ${r > .1 ? 'bad' : ''}">${r > .1 ? 'À surveiller' : 'Bonne utilisation'}</span></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">Aucune activité.</td></tr>'}</tbody></table></div></div>`);
  const M = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'], H = [5, 4, 3, 2, 1, 0].map(i => ({ i, ...per(mr(i)), l: M[new Date(now.getFullYear(), now.getMonth() - i, 1).getMonth()] }));
  mkc('h1', 'bar', H.map(h => h.l), [{ label: 'Ventes', data: H.map(h => p2(h.rev)), backgroundColor: '#00A86B' }, { label: 'Dépenses', data: H.map(h => p2(h.exp)), backgroundColor: '#FFA726' }, { label: 'Bénéfice net', data: H.map(h => p2(h.net)), backgroundColor: '#003B32' }]);
  if (be != null) { const xs = [0, .25, .5, .75, 1, 1.25, 1.5, 2].map(k => p2(be * k)); mkc('h2', 'line', xs, [{ label: 'Ventes', data: xs, borderColor: '#00A86B' }, { label: 'Coûts totaux', data: xs.map(x => p2(c.exp + (1 - margin) * x)), borderColor: '#E53935' }], { elements: { point: { radius: 2 } } }); }
};
