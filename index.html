0 FC<\/b>.<\/li>\n<li><b>Daniel<\/b> (entreprise individuelle) : les 14 000 000 FC restants peuvent être réclamés sur ses biens personnels (maison, véhicule, épargne).<\/li>\n<li><b>David<\/b> (SARL) : son apport de 5 000 000 FC est perdu, mais ses biens personnels ne sont pas atteints, sauf faute grave de gestion ou garantie personnelle.<\/li>\n<\/ul>\n<p>Attention : les fournisseurs et les banques le savent. Ils demandent souvent au gérant de signer une <b>caution personnelle<\/b>. Une fois la caution signée, la protection de la SARL disparaît pour cette dette. Lisez avant de signer.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Solange vend des médicaments dans une pharmacie de quartier à Kananga. Elle commence en entreprise individuelle avec 8 000 000 FC de stock. Au bout de trois ans, son stock atteint 30 000 000 FC, elle emploie quatre personnes et un grossiste lui consent 10 000 000 FC de crédit. Elle décide de créer une SARL avec son mari, en apportant le fonds de commerce. C'est le bon moment : l'activité est devenue assez grosse et le risque plus élevé. Elle a d'abord commencé simple et a changé de forme quand le contexte l'a justifié.<\/div>\n<h4>Peut-on changer plus tard ?<\/h4>\n<p>Oui. On peut commencer en entreprise individuelle puis créer une société, ou transformer une forme de société en une autre sous conditions. Ces opérations ont un coût et des formalités ; il vaut mieux y réfléchir tôt. Pour des opérations importantes, demandez l'avis d'un notaire ou d'un avocat.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Choisissez votre forme en fonction du nombre de personnes, du niveau de risque, des clients visés et du financement. L'entreprise individuelle est simple mais expose vos biens ; la SARL protège mieux mais est plus formelle. Attention aux cautions personnelles, qui annulent la protection.<\/div>\n","quiz":[{"q":"Quel est le principal avantage d'une SARL par rapport à l'entreprise individuelle pour une activité à risque ?","o":["Elle n'a besoin d'aucun document","Elle est toujours gratuite à créer","Elle limite la perte de l'associé à son apport, sauf caution ou faute grave","La SARL ne paie jamais d'impôts"],"a":3,"e":"La séparation des patrimoines protège les biens personnels, sauf garantie personnelle ou faute de gestion."},{"q":"Une dette de 20 000 000 FC, un actif restant de 6 000 000 FC. Combien manque-t-il pour payer le créancier ?","o":["14 000 000 FC","6 000 000 FC","20 000 000 FC","26 000 000 FC"],"a":0,"e":"20 000 000 − 6 000 000 = 14 000 000 FC."},{"q":"Une personne gérante de SARL signe une caution personnelle pour un prêt. Que se passe-t-il ?","o":["Elle répond sur ses biens personnels de cette dette si la société ne paie pas","La caution est sans effet","La banque perd son droit de réclamer","La SARL devient une SNC"],"a":1,"e":"La caution est un engagement personnel : elle écarte la protection de la société pour cette dette."},{"q":"Lequel de ces profils choisirait plutôt la SARL ?","o":["Trois associés qui investissent ensemble dans un dépôt avec un gros stock","Un vendeur ambulant très petit","Une personne qui vend un seul produit en passant","Un employé sans activité"],"a":1,"e":"Plusieurs associés et un risque important justifient une société à responsabilité limitée."}]},{"t":"Chapitre 5 — Les statuts, le capital, les associés","html":"\n<h4>Les statuts : le règlement intérieur de votre société<\/h4>\n<p>Les <b>statuts<\/b> sont le document écrit qui organise la société. Ils sont signés par les associés et sont la loi interne de l'entreprise. En cas de désaccord, on revient aux statuts. Mal rédigés, ils sont source de conflits ; bien rédigés, ils les évitent. Ils contiennent notamment :<\/p>\n<ul>\n<li>la <b>forme<\/b> de la société et sa <b>dénomination<\/b> (le nom) ;<\/li>\n<li>l'<b>objet social<\/b> : l'activité exercée (par exemple « commerce de boissons, vente en gros et au détail ») ; rédigez-le assez large pour ne pas être bloqué si vous ajoutez un produit ;<\/li>\n<li>le <b>siège<\/b> : l'adresse officielle ;<\/li>\n<li>la <b>durée<\/b> de la société ;<\/li>\n<li>le <b>capital<\/b> et les <b>apports<\/b> de chaque associé ;<\/li>\n<li>le ou les <b>gérants<\/b> et leurs pouvoirs ;<\/li>\n<li>les règles de <b>décision<\/b> (qui décide quoi, à quelle majorité) ;<\/li>\n<li>la répartition des <b>bénéfices<\/b> et des <b>pertes<\/b> ;<\/li>\n<li>les conditions de <b>sortie<\/b> d'un associé et de <b>cession<\/b> des parts.<\/li>\n<\/ul>\n<p>En droit OHADA, la rédaction des statuts d'une société passe généralement par un notaire ; vérifiez la règle applicable à votre forme et à votre situation.<\/p>\n<h4>Le capital et les apports<\/h4>\n<p>Le <b>capital<\/b> est la somme de tout ce que les associés ont apporté. Il y a trois types d'apports : en <b>numéraire<\/b> (de l'argent), en <b>nature<\/b> (matériel, stock, véhicule, local, évalué en argent) et en <b>industrie<\/b> (travail ou savoir-faire, qui ne compte pas dans le capital de la SARL ou de la SA mais peut donner droit à des avantages selon les statuts). Le capital n'est pas un chiffre décoratif :<\/p>\n<ul>\n<li>il sert de <b>garantie<\/b> aux créanciers (fournisseurs, banque) ;<\/li>\n<li>il détermine la <b>part de chaque associé<\/b> (pouvoir de décision et part des bénéfices) ;<\/li>\n<li>un capital <b>trop faible<\/b> pour l'activité donne une mauvaise image et expose la société à des difficultés dès le départ.<\/li>\n<\/ul>\n<p>Les apports en argent sont déposés sur un compte bancaire ouvert au nom de la société en formation ; la banque délivre une attestation de dépôt utile pour l'immatriculation.<\/p>\n<h4>Les associés et le partage des bénéfices<\/h4>\n<p>Exemple de calcul. Trois associés créent une SARL avec un capital de 10 000 000 FC (environ 4 348 $ au taux d'exemple). Paul apporte 6 000 000 FC (60 %), Anne 3 000 000 FC (30 %), Jean 1 000 000 FC (10 %). À la fin de l'année, la société dégage un bénéfice de 4 000 000 FC. La loi OHADA impose de mettre de côté chaque année une <b>réserve légale<\/b> (un dixième du bénéfice, jusqu'à atteindre un cinquième du capital). Le reste peut être distribué selon les statuts.<\/p>\n<table>\n<thead><tr><th>Élément<\/th><th>Calcul<\/th><th>Montant<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Bénéfice de l'année<\/td><td><\/td><td>4 000 000 FC<\/td><\/tr>\n<tr><td>Réserve légale (10 %)<\/td><td>4 000 000 × 10 %<\/td><td>400 000 FC<\/td><\/tr>\n<tr><td>Bénéfice distribuable<\/td><td>4 000 000 − 400 000<\/td><td>3 600 000 FC<\/td><\/tr>\n<tr><td>Part de Paul (60 %)<\/td><td>3 600 000 × 60 %<\/td><td>2 160 000 FC<\/td><\/tr>\n<tr><td>Part d'Anne (30 %)<\/td><td>3 600 000 × 30 %<\/td><td>1 080 000 FC<\/td><\/tr>\n<tr><td>Part de Jean (10 %)<\/td><td>3 600 000 × 10 %<\/td><td>360 000 FC<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La somme des trois parts est de 3 600 000 FC : le compte est bon. Si l'année est mauvaise, la perte se partage de la même façon.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mireille et sa cousine Odette ouvrent une boutique de pagnes à Kinshasa. Elles ne mettent rien par écrit, « on est de la famille ». Un an plus tard, Odette veut partir et réclame la moitié du stock. Mireille dit que son apport était supérieur. Faute de statuts clairs, il n'y a aucune preuve de qui a mis quoi. Le conflit dure des mois, l'activité s'arrête. Des statuts avec la liste des apports et les règles de sortie auraient évité ce blocage.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Le capital minimal, les règles de libération des apports (quelle part doit être payée à la création) et la forme exacte des statuts dépendent du droit en vigueur et ont évolué. Faites-vous confirmer ces points par le guichet unique, un notaire ou un conseil juridique (taux et procédures peuvent changer).<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Les statuts sont la loi interne de la société : objet, capital, apports, pouvoirs du gérant, partage des bénéfices, sortie des associés. Mettez tout par écrit, même entre amis ou en famille. Le capital doit correspondre à l'activité réelle.<\/div>\n","quiz":[{"q":"Que contiennent les statuts d'une société ?","o":["Les règles du fonctionnement interne : objet, capital, apports, pouvoirs du gérant, partage des bénéfices","Uniquement le nom des clients","Le bilan de l'année précédente","Le prix des marchandises vendues"],"a":0,"e":"Les statuts organisent la société et ses règles de fonctionnement."},{"q":"Capital de 10 000 000 FC. Anne a apporté 3 000 000 FC. Quelle est sa part du capital ?","o":["20 %","33 %","30 %","10 %"],"a":3,"e":"3 000 000 / 10 000 000 = 30 %."},{"q":"Bénéfice 4 000 000 FC ; réserve légale de 10 %. Quelle somme reste distribuable ?","o":["400 000 FC","3 600 000 FC","4 000 000 FC","3 000 000 FC"],"a":2,"e":"4 000 000 − 400 000 = 3 600 000 FC."},{"q":"Pourquoi faut-il mettre les apports par écrit, même entre membres d'une même famille ?","o":["Pour prouver qui a mis quoi et éviter les conflits à la sortie d'un associé","Pour payer plus d'impôts","Parce que la banque l'interdit autrement","Ce n'est jamais utile"],"a":1,"e":"Les écrits servent de preuve et évitent les litiges."}]},{"t":"Chapitre 6 — Les démarches : RCCM, Id.Nat, NIF, guichet unique, banque et taxes","html":"\n<h4>Le guichet unique de création d'entreprise<\/h4>\n<p>Avant, créer une entreprise obligeait à courir entre plusieurs administrations. Le <b>Guichet unique de création d'entreprise<\/b> (GUCE) a été créé pour regrouper ces démarches en un seul dossier. Il a été institué par décret en 2014. Il est présent à Kinshasa et dispose d'antennes dans d'autres villes, notamment Lubumbashi, Kisangani et Goma, et il propose aussi une plateforme en ligne. Les agents vous orientent, reçoivent le dossier et délivrent les documents d'identification. Renseignez-vous sur son adresse et ses horaires actuels : ils peuvent changer.<\/p>\n<h4>Les quatre identifiants à connaître<\/h4>\n<table>\n<thead><tr><th>Document<\/th><th>À quoi il sert<\/th><th>Qui le délivre (en général)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>RCCM<\/b> : registre du commerce et du crédit mobilier<\/td><td>Prouve que vous existez légalement comme commerçant ou société<\/td><td>Le greffe du tribunal de commerce, via le guichet unique<\/td><\/tr>\n<tr><td><b>Id.Nat<\/b> : identification nationale<\/td><td>Numéro national qui identifie votre activité pour l'administration<\/td><td>Le ministère chargé de l'économie, via le guichet unique<\/td><\/tr>\n<tr><td><b>NIF<\/b> : numéro d'identification fiscale<\/td><td>Vous identifie auprès des impôts ; indispensable pour facturer et déclarer<\/td><td>La Direction générale des impôts (DGI)<\/td><\/tr>\n<tr><td><b>Affiliation sociale<\/b> (CNSS) si vous employez<\/td><td>Couvre vos salariés (pension, accidents du travail, etc.)<\/td><td>La caisse nationale de sécurité sociale<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Le déroulement type pour une société<\/h4>\n<ol>\n<li><b>Choisir la forme et le nom<\/b> ; vérifier que le nom n'est pas déjà pris.<\/li>\n<li><b>Rédiger les statuts<\/b> (avec un notaire quand c'est nécessaire).<\/li>\n<li><b>Déposer le capital en banque<\/b> et obtenir l'attestation de dépôt.<\/li>\n<li><b>Déposer le dossier au guichet unique<\/b> : demande, statuts, déclaration de souscription et de versement du capital, spécimen de signature du gérant, pièces d'identité des dirigeants.<\/li>\n<li><b>Recevoir le RCCM, l'Id.Nat et le NIF<\/b>, selon la procédure en vigueur.<\/li>\n<li><b>S'affilier à la sécurité sociale<\/b> si vous embauchez, et demander les <b>autorisations sectorielles<\/b> si votre activité est réglementée (pharmacie, transport, mines, télécommunications, par exemple).<\/li>\n<li><b>Ouvrir le compte bancaire<\/b> de l'entreprise.<\/li>\n<\/ol>\n<h4>Le compte bancaire professionnel<\/h4>\n<p>Un compte au nom de l'entreprise est fortement conseillé et souvent exigé. Il sert à séparer l'argent de la maison et de l'activité, à recevoir des virements de clients, à justifier vos ressources et à construire un <b>historique<\/b> utile quand vous demanderez un crédit. Comparez les frais de tenue de compte, les frais de retrait et de transfert, et la possibilité de tenir un compte en francs congolais et en dollars. Vous aurez besoin des documents d'identification de l'entreprise et de la pièce d'identité du représentant.<\/p>\n<h4>Les taxes locales : ne pas les oublier<\/h4>\n<p>En plus des impôts nationaux gérés par la DGI, une activité commerciale peut devoir des <b>taxes et redevances provinciales ou locales<\/b> : par exemple, une autorisation d'exploiter ou une taxe annuelle liée à l'activité, des droits pour l'occupation d'un emplacement ou d'un marché, une redevance pour la publicité ou l'enseigne. Elles varient selon la province, la commune et le type d'activité. Demandez à la mairie ou à l'autorité de votre commune la liste actuelle, exigez toujours un <b>reçu officiel<\/b> et gardez-le.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Les frais, les délais, la liste précise des pièces et les taxes locales varient selon le type d'entreprise, la province et la période. Ne vous fiez pas à un chiffre entendu au marché : demandez la liste officielle des frais par écrit et paiement contre reçu, uniquement par les canaux officiels (taux et procédures peuvent changer).<\/div>\n<div class=\"ex\"><b>Exemple en RDC (dialogue).<\/b> À Lubumbashi, Aline veut créer sa SARL de vente de farine.<br/>\n<i>Aline :<\/i> « Bonjour, je veux créer une SARL. Que dois-je apporter ? »<br/>\n<i>L'agent :<\/i> « Les statuts, la preuve du dépôt du capital en banque, votre pièce d'identité et celle de vos associés, et le spécimen de signature du gérant. »<br/>\n<i>Aline :<\/i> « Combien cela coûte-t-il ? »<br/>\n<i>L'agent :<\/i> « Voici le barème officiel imprimé. Le paiement se fait par les canaux indiqués et vous recevez un reçu. »<br/>\n<i>Aline :<\/i> « Et si quelqu'un me demande de payer à part pour aller plus vite ? »<br/>\n<i>L'agent :<\/i> « Ne payez rien en dehors du barème. Gardez le reçu et signalez la demande. »<br/>\nAline repart avec une liste écrite et un calendrier. Son dossier est déposé en bonne et due forme.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Le guichet unique rassemble les démarches : RCCM (existence légale), Id.Nat (identification nationale), NIF (impôts). Ouvrez un compte bancaire au nom de l'entreprise, déclarez vos salariés si vous en avez, et renseignez-vous sur les taxes locales. Payez uniquement par les canaux officiels contre reçu.<\/div>\n","quiz":[{"q":"Quel numéro vous identifie auprès des impôts et est nécessaire pour facturer ?","o":["Le NIF","Le RCCM","L'Id.Nat","Le numéro de téléphone"],"a":1,"e":"Le NIF (numéro d'identification fiscale) est délivré par la Direction générale des impôts."},{"q":"Quel est le rôle du guichet unique de création d'entreprise ?","o":["Contrôler les prix du marché","Regrouper les démarches de création en un seul dossier","Prêter de l'argent","Vendre des marchandises"],"a":2,"e":"Il évite de courir entre plusieurs administrations en regroupant les démarches."},{"q":"Que faire si quelqu'un vous demande de payer « à côté » pour accélérer votre dossier ?","o":["Négocier le montant","Menacer le fonctionnaire","Ne payer que le barème officiel contre reçu, et signaler la demande","Payer, c'est plus rapide"],"a":3,"e":"Seuls les frais officiels, payés par les canaux officiels contre reçu, sont à payer."},{"q":"À quoi sert surtout le compte bancaire professionnel ?","o":["Séparer l'argent de l'entreprise et celui de la maison, et construire un historique","Payer moins d'impôts automatiquement","Éviter de tenir une comptabilité","Remplacer le RCCM"],"a":0,"e":"Le compte facilite la séparation des fonds, la preuve des ressources et l'accès au crédit."}]},{"t":"Chapitre 7 — Après la création : obligations, erreurs fréquentes et checklist","html":"\n<h4>Créer n'est que le début<\/h4>\n<p>Beaucoup de commerçants pensent que, une fois le RCCM et le NIF en main, tout est terminé. En réalité, la vie légale d'une entreprise commence : il faut tenir ses comptes, déclarer, payer, renouveler. Les entreprises qui négligent ces obligations accumulent des pénalités et finissent par perdre leur clientèle formelle.<\/p>\n<h4>Les principales obligations<\/h4>\n<table>\n<thead><tr><th>Obligation<\/th><th>Ce que cela veut dire en pratique<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Tenir une comptabilité<\/td><td>Enregistrer ventes, achats, dépenses, caisse, banque ; garder les pièces (voir le cours « Comptabilité pour commerçants »)<\/td><\/tr>\n<tr><td>Déclarer et payer les impôts<\/td><td>Déclarations périodiques à la DGI selon votre régime ; payer dans les délais, garder les preuves<\/td><\/tr>\n<tr><td>Mentionner vos identifiants<\/td><td>Faire figurer le nom, le RCCM, l'Id.Nat et le NIF sur factures et documents officiels<\/td><\/tr>\n<tr><td>Déclarer vos salariés<\/td><td>Contrat écrit, affiliation sociale, versement des cotisations<\/td><\/tr>\n<tr><td>Tenir à jour les informations<\/td><td>Changement d'adresse, de gérant, de capital, d'activité : le déclarer et modifier les statuts si nécessaire<\/td><\/tr>\n<tr><td>Approuver les comptes (société)<\/td><td>Tenir une assemblée chaque année pour approuver les comptes et décider du sort du bénéfice<\/td><\/tr>\n<tr><td>Renouveler les autorisations<\/td><td>Licences sectorielles et taxes locales selon leur échéance<\/td><\/tr>\n<tr><td>Conserver les documents<\/td><td>Garder statuts, factures, contrats, reçus, bulletins de paie pendant la durée légale<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Les erreurs fréquentes<\/h4>\n<ol>\n<li><b>Mélanger l'argent de la maison et de l'entreprise.<\/b> Calcul : un gérant prélève 150 000 FC par semaine dans la caisse sans les noter. Sur 52 semaines, cela fait 7 800 000 FC, soit environ 3 391 $ au taux d'exemple. Après un an, il croit que « l'affaire ne marche pas » alors que l'argent est parti sans trace.<\/li>\n<li><b>Ne pas faire de statuts ou les copier sans les lire<\/b> : on découvre trop tard qu'ils ne correspondent pas à l'activité.<\/li>\n<li><b>Choisir la mauvaise forme<\/b> : une entreprise individuelle avec un gros crédit fournisseur, ou une SA pour une toute petite boutique.<\/li>\n<li><b>Sous-estimer le capital<\/b> : une SARL créée avec un capital minuscule et un énorme stock à crédit inspire peu confiance.<\/li>\n<li><b>Oublier les déclarations<\/b> : les retards entraînent des pénalités, parfois supérieures à l'impôt lui-même.<\/li>\n<li><b>Payer sans reçu<\/b> : sans preuve, vous pouvez être obligé de payer deux fois.<\/li>\n<li><b>Signer des cautions personnelles sans comprendre<\/b> : on perd la protection de la société.<\/li>\n<li><b>Ne pas séparer les rôles<\/b> : le gérant qui encaisse, achète et tient les comptes seul s'expose aux erreurs et aux fraudes.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Bénédicte tient une quincaillerie à Mbuji-Mayi. Elle fait immatriculer son entreprise, puis oublie ses déclarations pendant 18 mois. Un contrôle lui réclame l'impôt dû et des pénalités. Elle règle avec ses économies, mais ne peut plus payer son fournisseur de ciment. Une sœur commerçante lui conseille de créer un petit calendrier : chaque 5 du mois, elle prépare ses chiffres ; chaque trimestre, elle fait le point avec un comptable. L'année suivante, elle est à jour et obtient une ligne de crédit.<\/div>\n<h4>Checklist de fin de cours<\/h4>\n<ul>\n<li>J'ai choisi ma forme juridique en connaissance de cause.<\/li>\n<li>Mes statuts (si société) sont écrits, signés et rangés.<\/li>\n<li>J'ai mon RCCM, mon Id.Nat et mon NIF (selon ma situation).<\/li>\n<li>J'ai un compte bancaire au nom de l'entreprise.<\/li>\n<li>J'ai un calendrier des déclarations et des paiements.<\/li>\n<li>Je garde un reçu pour chaque paiement officiel.<\/li>\n<li>Je me verse un montant fixe et je note tout prélèvement.<\/li>\n<\/ul>\n<div class=\"warn\"><b>Attention.<\/b> Ce cours donne des repères généraux, pas un avis juridique personnalisé. Les obligations exactes dépendent de votre forme, de votre activité et de votre lieu ; vérifiez-les auprès de l'administration compétente et, pour les cas importants, auprès d'un notaire, d'un avocat ou d'un comptable agréé (taux et procédures peuvent changer).<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Après la création : comptabilité, déclarations, identifiants sur les factures, salariés déclarés, mise à jour des informations, comptes approuvés chaque année (pour une société). Les erreurs les plus coûteuses sont le mélange des caisses, l'oubli des déclarations, le paiement sans reçu et les cautions signées à la légère.<\/div>\n","quiz":[{"q":"Un gérant prélève 150 000 FC par semaine sans les noter. Combien cela fait-il sur 52 semaines ?","o":["15 600 000 FC","7 800 000 FC","1 500 000 FC","780 000 FC"],"a":2,"e":"150 000 × 52 = 7 800 000 FC."},{"q":"Pourquoi faut-il garder le reçu de chaque paiement officiel ?","o":["Pour prouver le paiement et ne pas payer deux fois","Pour décorer le bureau","Parce que le reçu remplace la comptabilité","Ce n'est pas utile"],"a":1,"e":"Le reçu est la preuve du paiement."},{"q":"Que doivent mentionner vos factures et documents officiels ?","o":["Le nom de vos fournisseurs","Le nom de l'entreprise et ses identifiants (RCCM, Id.Nat, NIF)","Le prix d'achat de la marchandise","L'adresse personnelle de vos clients"],"a":2,"e":"Les identifiants prouvent l'existence légale de l'entreprise et rassurent les clients."},{"q":"Quelle est l'erreur la plus dangereuse parmi celles-ci ?","o":["Se faire aider par un comptable","Avoir un calendrier de déclarations","Signer une caution personnelle sans en comprendre la portée","Garder trop de reçus"],"a":3,"e":"Une caution engage vos biens personnels, même si vous avez une SARL."}]}],"exam":[{"q":"Que signifie OHADA ?","o":["Organisation pour l'harmonisation en Afrique du droit des affaires","Office national des affaires et du développement agricole","Organisme des hôteliers et artisans d'Afrique","Observatoire des habitudes d'achat"],"a":0,"e":"L'OHADA harmonise le droit des affaires entre pays africains, dont la RDC."},{"q":"Un hôtel exige une facture avec numéro d'impôt pour une commande de 4 600 000 FC. Quel est le montant en dollars au taux d'exemple (1 $ = 2 300 FC) ?","o":["2 000 $","1 000 $","2 300 $","4 600 $"],"a":1,"e":"4 600 000 / 2 300 = 2 000 $."},{"q":"Quelle forme permet d'exercer seul avec une simple déclaration et un chiffre d'affaires modeste ?","o":["La SNC","L'entreprenant","La SA","La société en commandite"],"a":2,"e":"L'entreprenant est un statut allégé pour les petites activités individuelles."},{"q":"Dans une entreprise individuelle, qui répond des dettes de l'activité ?","o":["L'État","Le fournisseur","L'entrepreneur, y compris sur ses biens personnels","Seulement les clients"],"a":3,"e":"Il n'y a pas de séparation entre patrimoine professionnel et personnel."},{"q":"Dans une SNC, la responsabilité des associés est :","o":["Illimitée et solidaire","Limitée à 10 % du capital","Nulle","Limitée à l'apport"],"a":0,"e":"Chaque associé peut être poursuivi pour toute la dette."},{"q":"Une SARL doit 20 000 000 FC, son actif restant est de 6 000 000 FC. Combien manque-t-il ?","o":["14 000 000 FC","6 000 000 FC","20 000 000 FC","26 000 000 FC"],"a":1,"e":"20 000 000 − 6 000 000 = 14 000 000 FC ; la perte de l'associé reste limitée à son apport (hors caution)."},{"q":"Les statuts d'une société servent à :","o":["Remplacer la comptabilité","Fixer les règles de fonctionnement de la société (objet, capital, pouvoirs, partage des bénéfices)","Calculer l'impôt","Fixer le prix de vente des produits"],"a":2,"e":"Ce sont la loi interne de la société."},{"q":"Capital de 10 000 000 FC ; Paul en détient 60 %. Bénéfice distribuable de 3 600 000 FC. Combien revient à Paul ?","o":["360 000 FC","3 600 000 FC","2 160 000 FC","1 080 000 FC"],"a":3,"e":"3 600 000 × 60 % = 2 160 000 FC."},{"q":"Quel document est délivré par la Direction générale des impôts et sert à facturer et déclarer ?","o":["Le NIF","Le RCCM","L'attestation de dépôt du capital","L'Id.Nat"],"a":0,"e":"Le NIF est le numéro d'identification fiscale."},{"q":"Une personne vous demande un paiement « en plus » pour accélérer votre dossier au guichet. Que faites-vous ?","o":["Vous ne payez que les frais officiels contre reçu et signalez la demande","Vous payez sans reçu","Vous renoncez à votre projet","Vous demandez un prix plus bas"],"a":1,"e":"Seuls les frais officiels sont dus ; gardez le reçu."},{"q":"Pourquoi ouvrir un compte bancaire au nom de l'entreprise ?","o":["Pour éviter les statuts","Pour séparer l'argent de l'entreprise et celui de la maison et construire un historique","Pour ne jamais payer d'impôts","Parce que c'est la seule façon de vendre"],"a":2,"e":"Le compte sépare les fonds et prépare l'accès au crédit."},{"q":"Un gérant prélève 150 000 FC par semaine sans les noter pendant un an (52 semaines). Quel montant n'est pas tracé ?","o":["15 000 000 FC","780 000 FC","7 800 000 FC","1 560 000 FC"],"a":3,"e":"150 000 × 52 = 7 800 000 FC."}]},{"id":"businessplan","title":"Business plan et financement","icon":"📈","level":"Intermédiaire","hours":3,"summary":"Apprenez à écrire un business plan simple et chiffré pour votre commerce, de l'étude de marché au plan de trésorerie. Découvrez les sources de financement réalistes en RDC et comment présenter votre projet à un banquier ou à un partenaire.","goals":["Rédiger un business plan simple structuré en huit parties","Chiffrer une étude de marché (clients par jour, panier moyen, concurrence)","Calculer marge, prix de vente et seuil de rentabilité","Établir le besoin de démarrage, le compte de résultat et le plan de trésorerie","Choisir une source de financement et calculer un remboursement raisonnable","Présenter son projet avec honnêteté à un banquier ou un partenaire"],"chapters":[{"t":"Chapitre 1 — Pourquoi un business plan et comment il est construit","html":"\n<h4>Un plan avant de dépenser<\/h4>\n<p>Un <b>business plan<\/b> (en français : plan d'affaires) est un document, court et chiffré, qui explique ce que vous voulez vendre, à qui, avec quels moyens, et combien d'argent vous allez gagner ou perdre. Il n'est pas réservé aux grandes sociétés. Une femme qui ouvre une boutique à Kinshasa, un grossiste qui installe un dépôt à Lubumbashi ou un jeune qui lance un atelier de téléphones à Goma en ont tous besoin.<\/p>\n<p>Il sert à trois choses. D'abord, <b>à vous<\/b> : mettre les idées à plat évite de découvrir, après avoir acheté le stock, qu'il manque de l'argent pour le loyer. Ensuite, <b>aux autres<\/b> : un banquier, une institution de microfinance, un partenaire ou un membre de la famille qui vous prête de l'argent veut voir que vous avez réfléchi. Enfin, <b>au suivi<\/b> : une fois l'activité lancée, vous comparez la réalité au plan pour corriger vite.<\/p>\n<h4>Les parties d'un business plan simple<\/h4>\n<table><thead><tr><th>Partie<\/th><th>Question à laquelle elle répond<\/th><th>Longueur conseillée<\/th><\/tr><\/thead><tbody>\n<tr><td>1. Résumé<\/td><td>En quelques lignes : quoi, où, combien, pour quel résultat ?<\/td><td>1/2 page<\/td><\/tr>\n<tr><td>2. Le porteur et l'activité<\/td><td>Qui êtes-vous ? Quelle expérience ? Que vendez-vous ?<\/td><td>1 page<\/td><\/tr>\n<tr><td>3. Le marché<\/td><td>Qui sont les clients ? Combien sont-ils ? Qui sont les concurrents ?<\/td><td>1 à 2 pages<\/td><\/tr>\n<tr><td>4. Ventes et prix<\/td><td>Combien allez-vous vendre chaque mois, à quel prix ?<\/td><td>1 page<\/td><\/tr>\n<tr><td>5. Moyens et dépenses<\/td><td>Local, personnel, stock, matériel, charges mensuelles ?<\/td><td>1 page<\/td><\/tr>\n<tr><td>6. Besoin de démarrage et financement<\/td><td>De combien d'argent avez-vous besoin et d'où vient-il ?<\/td><td>1 page<\/td><\/tr>\n<tr><td>7. Prévisions financières<\/td><td>Compte de résultat, plan de trésorerie, seuil de rentabilité.<\/td><td>1 à 2 pages<\/td><\/tr>\n<tr><td>8. Risques et plan B<\/td><td>Qu'est-ce qui peut mal tourner ? Que ferez-vous alors ?<\/td><td>1/2 page<\/td><\/tr>\n<\/tbody><\/table>\n<h4>Un fil rouge pour tout le cours<\/h4>\n<p>Dans les chapitres qui suivent, nous construirons pas à pas le plan d'une même boutique : <b>« Boutique Espérance »<\/b>, une boutique de produits de première nécessité (sucre, huile, farine, savon, boissons, recharges téléphoniques) ouverte par Mama Espérance dans une rue passante d'une commune de Kinshasa. À la fin, vous aurez un exemple complet que vous pourrez copier et adapter à votre commerce.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Papa Jonas, à Mbuji-Mayi, achète 40 sacs de farine à crédit pour son dépôt. Il n'a pas fait de plan. Au bout de deux mois, il n'a plus d'argent pour payer le fournisseur, car il a utilisé la caisse pour réparer sa moto et payer les frais de scolarité. Un plan simple lui aurait montré que la caisse du commerce et l'argent de la famille doivent être séparés, et que 40 sacs dépassaient ses moyens du mois.<\/div>\n<h4>Les règles d'or de l'écriture<\/h4>\n<ul>\n<li><b>Écrire simple.<\/b> Des phrases courtes, pas de mots compliqués. Si un mot technique est nécessaire, expliquez-le.<\/li>\n<li><b>Chiffrer.<\/b> Remplacez « beaucoup de clients » par « environ 36 clients par jour, d'après mon comptage de trois jours ».<\/li>\n<li><b>Être prudent.<\/b> Mieux vaut des ventes un peu basses et des dépenses un peu hautes que l'inverse.<\/li>\n<li><b>Dire d'où vient chaque chiffre.<\/b> Un devis, un prix relevé au marché, un comptage, une facture.<\/li>\n<li><b>Choisir une monnaie de référence.<\/b> Beaucoup de prix se fixent en dollars et d'autres en francs congolais. Indiquez le taux utilisé (dans ce cours : 1 $ = 2 300 FC) et rappelez que <b>le taux varie<\/b> ; il faut le mettre à jour.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Un business plan est un outil de décision, pas une formalité. Il répond à : « Est-ce que ce projet peut vivre, et de combien d'argent ai-je besoin pour le démarrer ? » Il se prépare par étapes : marché, ventes, dépenses, besoin de démarrage, résultat, trésorerie, financement.<\/div>\n<h4>Avant de commencer : rassembler les informations<\/h4>\n<p>Prenez un cahier. Notez le prix d'achat et de vente de vos dix produits principaux chez trois fournisseurs, les loyers dans votre zone, les salaires habituels, les frais de transport. Passez deux ou trois jours devant l'emplacement choisi et comptez les passants. Ces informations de terrain valent plus que de longs textes copiés ailleurs.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne copiez pas le business plan d'un autre sans l'adapter. Un banquier voit tout de suite un plan « copié-collé » aux chiffres qui ne correspondent pas à votre quartier.<\/div>\n","quiz":[{"q":"À quoi sert d'abord un business plan ?","o":["À faire plaisir à l'administration","À payer moins d'impôts","À vérifier que le projet peut vivre et à savoir de combien d'argent on a besoin","À remplacer la comptabilité"],"a":2,"e":"Le plan est un outil de décision : il évite d'acheter du stock sans savoir si le loyer et les charges seront payés."},{"q":"Quelle phrase est la plus utile dans un business plan ?","o":["« Je compte environ 36 clients par jour, d'après trois jours de comptage devant la boutique. »","« J'aurai beaucoup de clients. »","« Ce quartier est très bon. »","« Tout le monde achète chez moi. »"],"a":0,"e":"Un chiffre sourcé (comptage, devis, facture) est crédible ; une impression ne l'est pas."},{"q":"Quelle partie du plan indique de combien d'argent vous avez besoin au départ et d'où il vient ?","o":["Le besoin de démarrage et le financement","Le résumé de l'équipe","L'étude de la concurrence","La liste des risques"],"a":0,"e":"Le besoin de démarrage additionne les dépenses de lancement ; le plan de financement dit comment on les couvre."},{"q":"Pourquoi indiquer le taux de change utilisé dans le plan ?","o":["Parce que c'est obligatoire dans chaque phrase","Parce que le taux ne change jamais","Parce que les banques refusent le franc congolais","Parce que le taux varie et qu'il faut pouvoir le mettre à jour"],"a":3,"e":"Le taux varie : un plan qui ne précise pas son taux de référence devient vite faux."}]},{"t":"Chapitre 2 — L'étude de marché chiffrée","html":"\n<h4>Connaître ses clients avant d'ouvrir<\/h4>\n<p>L'<b>étude de marché<\/b> consiste à répondre à quatre questions : qui achètera, combien de personnes, à quel prix, et face à quels concurrents. Pas besoin d'un cabinet : un petit commerçant peut la faire lui-même en une semaine, avec un cahier et de la patience.<\/p>\n<h4>Étape 1 : définir la zone de clientèle<\/h4>\n<p>La <b>zone de chalandise<\/b> est la zone d'où viennent vos clients. Pour une boutique de quartier, c'est souvent un rayon de 300 à 500 mètres (5 à 10 minutes à pied). Pour un dépôt de boissons à Lubumbashi, ce sont les petits revendeurs et les bars à 5 ou 10 kilomètres. Pour un commerce de pièces détachées à Kananga, ce peut être toute la ville et les villages voisins.<\/p>\n<h4>Étape 2 : compter, observer, interroger<\/h4>\n<ul>\n<li><b>Compter les passants<\/b> devant l'emplacement, à plusieurs heures et plusieurs jours (marché, jour de paie, week-end).<\/li>\n<li><b>Compter ceux qui entrent<\/b> chez le concurrent le plus proche.<\/li>\n<li><b>Interroger 20 à 30 personnes<\/b> : que achetez-vous, où, quand, qu'est-ce qui vous manque ?<\/li>\n<li><b>Relever les prix<\/b> de vos produits principaux chez au moins trois concurrents.<\/li>\n<\/ul>\n<h4>Étape 3 : transformer les comptages en clients par jour<\/h4>\n<p>Le calcul de l'entonnoir est simple. Mama Espérance a compté <b>600 passants par jour<\/b> devant son futur local, en moyenne sur trois jours. Chez un concurrent comparable, environ <b>10 %<\/b> des passants entrent, et <b>60 %<\/b> de ceux qui entrent achètent quelque chose. Elle prévoit donc :<\/p>\n<table><thead><tr><th>Étape<\/th><th>Calcul<\/th><th>Résultat<\/th><\/tr><\/thead><tbody>\n<tr><td>Passants par jour<\/td><td>comptage<\/td><td>600<\/td><\/tr>\n<tr><td>Entrent dans la boutique<\/td><td>600 × 10 %<\/td><td>60<\/td><\/tr>\n<tr><td>Achètent<\/td><td>60 × 60 %<\/td><td><b>36 clients par jour<\/b><\/td><\/tr>\n<tr><td>Panier moyen<\/td><td>relevé chez le concurrent<\/td><td>10 000 FC (environ 4.35 $)<\/td><\/tr>\n<tr><td>Ventes par jour<\/td><td>36 × 10 000<\/td><td>360 000 FC<\/td><\/tr>\n<\/tbody><\/table>\n<p>Le <b>panier moyen<\/b> est la dépense moyenne d'un client à chaque passage. Vous l'obtenez en divisant les ventes d'une journée par le nombre de clients.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Goma, Chantal veut ouvrir une boutique de pagnes et d'accessoires près d'un marché. Elle compte 900 passants par jour un samedi mais seulement 400 en semaine. Elle prend donc une moyenne prudente et prévoit moins de ventes en semaine. Elle note aussi qu'il y a déjà quatre boutiques de pagnes sur la même rue : elle décide de se spécialiser dans les pagnes de mariage, que personne d'autre ne propose bien.<\/div>\n<h4>Étape 4 : analyser la concurrence<\/h4>\n<table><thead><tr><th>Concurrent<\/th><th>Prix du sucre (1 kg)<\/th><th>Horaires<\/th><th>Points forts<\/th><th>Points faibles<\/th><\/tr><\/thead><tbody>\n<tr><td>Boutique A<\/td><td>3 300 FC<\/td><td>7h-20h<\/td><td>Crédit aux voisins<\/td><td>Étagères vides souvent<\/td><\/tr>\n<tr><td>Boutique B<\/td><td>3 000 FC<\/td><td>8h-18h<\/td><td>Prix bas<\/td><td>Fermée le dimanche<\/td><\/tr>\n<tr><td>Marché<\/td><td>2 900 FC<\/td><td>6h-17h<\/td><td>Choix<\/td><td>Éloigné, bousculade<\/td><\/tr>\n<\/tbody><\/table>\n<p>Ce tableau montre une opportunité : ouvrir le dimanche et garder les rayons pleins. C'est cela, un avantage concurrentiel : une raison précise pour laquelle un client viendra chez vous.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Une étude de marché chiffrée suit un entonnoir : passants, puis entrants, puis acheteurs, puis panier moyen, puis ventes. Chaque pourcentage doit venir d'une observation, pas d'un souhait. Et il faut regarder la concurrence pour trouver ce que vous ferez de mieux ou de différent.<\/div>\n<h4>Étape 5 : la clientèle et le pouvoir d'achat<\/h4>\n<p>Pensez aussi à la capacité à payer. Dans un quartier où les revenus arrivent en fin de mois, les ventes baissent en milieu de mois. Les saisons comptent : rentrée scolaire, fêtes de fin d'année, saison des pluies, récoltes. Notez ces variations, car elles influencent votre trésorerie (nous y reviendrons).<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne confondez pas « beaucoup de passants » et « beaucoup d'acheteurs ». Une rue animée près d'une église un dimanche peut être vide le lundi. Comptez à plusieurs moments. Et méfiez-vous des chiffres trouvés sur Internet : ils concernent rarement votre quartier précis.<\/div>\n<h4>Ce que vous mettez dans le plan<\/h4>\n<p>Une demi-page suffit : la zone, le nombre estimé de clients, le panier moyen, trois concurrents comparés, et votre avantage. Joignez le cahier de comptage en annexe : le banquier appréciera la preuve du travail de terrain.<\/p>\n","quiz":[{"q":"Mama Espérance compte 600 passants, 10 % entrent, 60 % de ceux qui entrent achètent. Combien de clients par jour ?","o":["6","36","60","360"],"a":1,"e":"600 × 10 % = 60 entrants ; 60 × 60 % = 36 acheteurs."},{"q":"Le panier moyen se calcule en :","o":["Divisant les ventes de la journée par le nombre de clients","Multipliant les ventes par le nombre de produits","Additionnant tous les prix du catalogue","Prenant le prix du produit le plus cher"],"a":0,"e":"Panier moyen = ventes / nombre de clients (ex. 360 000 / 36 = 10 000 FC)."},{"q":"Quelle observation constitue un avantage concurrentiel dans l'exemple des boutiques de quartier ?","o":["Les concurrents vendent le sucre moins cher","Il y a déjà beaucoup de boutiques","Les concurrents ferment le dimanche et ont des rayons souvent vides ; on peut ouvrir tous les jours et rester approvisionné","Le marché est éloigné"],"a":2,"e":"Un avantage répond à un manque réel des concurrents (horaires, disponibilité, service)."},{"q":"Un jour de marché, Chantal compte 900 passants, mais seulement 400 en semaine. Que doit-elle faire dans son plan ?","o":["Prévoir une moyenne prudente et distinguer semaine et jour de marché","Retenir 900 passants pour tous les jours","Ignorer les comptages","Retenir 400 passants et ne plus y penser"],"a":0,"e":"Les ventes varient selon les jours ; une moyenne prudente évite de surestimer le chiffre d'affaires."}]},{"t":"Chapitre 3 — Plan de ventes, prix, marge et seuil de rentabilité","html":"\n<h4>Du nombre de clients au chiffre d'affaires<\/h4>\n<p>Le <b>chiffre d'affaires<\/b> (CA) est le total de vos ventes sur une période. Pour la Boutique Espérance : 36 clients × 10 000 FC × 26 jours d'ouverture par mois = <b>9 360 000 FC par mois<\/b>, soit environ 4,070 $ au taux d'exemple de 2 300 FC pour 1 $ (le taux réel varie).<\/p>\n<p>Cette formule simple s'adapte : pour un dépôt de boissons, comptez le nombre de caisses vendues par jour × le prix d'une caisse ; pour un atelier, le nombre de réparations × le prix moyen d'une réparation.<\/p>\n<h4>Prix, marge et coefficient<\/h4>\n<p>La <b>marge brute<\/b> est ce qu'il reste d'une vente après avoir payé le produit lui-même. Exemple : un article acheté 7 800 FC et vendu 10 000 FC laisse 2 200 FC. Deux façons de l'exprimer :<\/p>\n<ul>\n<li><b>Taux de marge<\/b> = marge / prix de vente = 2 200 / 10 000 = <b>22 %<\/b>.<\/li>\n<li><b>Taux de majoration<\/b> (ou marque) = marge / prix d'achat = 2 200 / 7 800 = <b>28,2 %<\/b>.<\/li>\n<\/ul>\n<p>Ne mélangez pas les deux ! Beaucoup de commerçants disent « je prends 22 % » mais calculent sur le prix d'achat : leur vraie marge est plus petite que prévu. Pour obtenir 22 % de taux de marge, le prix de vente = prix d'achat / (1 − 0,22) = prix d'achat × 1,282.<\/p>\n<table><thead><tr><th>Produit<\/th><th>Achat (FC)<\/th><th>Vente avec 22 % de marge<\/th><th>Marge (FC)<\/th><\/tr><\/thead><tbody>\n<tr><td>Sac de farine 25 kg<\/td><td>46 800<\/td><td>60 000<\/td><td>13 200<\/td><\/tr>\n<tr><td>Huile 5 litres<\/td><td>23 400<\/td><td>30 000<\/td><td>6 600<\/td><\/tr>\n<tr><td>Caisse de boissons<\/td><td>31 200<\/td><td>40 000<\/td><td>8 800<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Lubumbashi, un dépôt achète la caisse de boissons 31 200 FC. En voulant « 25 % », le gérant ajoute 25 % au prix d'achat : 31 200 × 1,25 = 39 000 FC, soit une marge de 7 800 FC et un taux de marge réel de 20 %. S'il visait 25 % de marge sur le prix de vente, il aurait dû vendre 31 200 / 0,75 = 41 600 FC. Toujours préciser sur quoi le pourcentage est calculé.<\/div>\n<h4>Le plan de ventes mensuel<\/h4>\n<p>Au démarrage, les clients ne viennent pas tous le premier jour. Un plan prudent prévoit une montée progressive : environ 60 % de l'objectif le premier mois, 80 % le deuxième, 100 % à partir du troisième. Pour la Boutique Espérance : 5 616 000 FC, 7 488 000 FC, puis 9 360 000 FC.<\/p>\n<p>Ajoutez les variations de saison (rentrée scolaire, fêtes) si elles sont importantes pour votre activité.<\/p>\n<h4>Les charges fixes et le seuil de rentabilité<\/h4>\n<p>Les <b>charges fixes<\/b> sont celles que vous payez même si vous ne vendez rien : loyer, salaire, électricité, etc. Le <b>seuil de rentabilité<\/b> est le chiffre d'affaires minimum pour ne pas perdre d'argent. Formule :<\/p>\n<p><b>Seuil de rentabilité = charges fixes ÷ taux de marge.<\/b><\/p>\n<table><thead><tr><th>Charge fixe mensuelle<\/th><th>FC<\/th><\/tr><\/thead><tbody>\n<tr><td>Loyer<\/td><td>400 000<\/td><\/tr>\n<tr><td>Salaire du vendeur<\/td><td>300 000<\/td><\/tr>\n<tr><td>Électricité et eau<\/td><td>100 000<\/td><\/tr>\n<tr><td>Transport (approvisionnement)<\/td><td>80 000<\/td><\/tr>\n<tr><td>Téléphone et Internet<\/td><td>30 000<\/td><\/tr>\n<tr><td>Taxes et patente (estimation, à vérifier)<\/td><td>70 000<\/td><\/tr>\n<tr><td><b>Total<\/b><\/td><td><b>980 000<\/b><\/td><\/tr>\n<tr><td>Rémunération de la patronne (Mama Espérance)<\/td><td>250 000<\/td><\/tr>\n<tr><td><b>Charges fixes avec la patronne<\/b><\/td><td><b>1 230 000<\/b><\/td><\/tr>\n<\/tbody><\/table>\n<p>Seuil = 1 230 000 ÷ 0,22 = <b>5 590 909 FC par mois<\/b>, soit 215 035 FC par jour, soit environ <b>22 clients par jour<\/b> au panier de 10 000 FC. Comme on prévoit 36 clients, la <b>marge de sécurité<\/b> est de 40 % : les ventes pourraient baisser de 40 % avant de passer en perte.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Chiffre d'affaires = clients × panier moyen × jours. Marge brute = ventes − coût d'achat. Seuil de rentabilité = charges fixes ÷ taux de marge. Précisez toujours si le pourcentage de marge est calculé sur le prix de vente ou sur le prix d'achat.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ne payez pas la patronne « avec ce qui reste ». Mettez dès le début un salaire dans les charges : sinon vous ne saurez jamais si l'activité est vraiment rentable. Et si le seuil est supérieur à vos ventes réalistes, changez le projet avant de dépenser.<\/div>\n","quiz":[{"q":"Un article acheté 7 800 FC est vendu 10 000 FC. Quel est le taux de marge sur le prix de vente ?","o":["22 %","28,2 %","2 200 %","78 %"],"a":0,"e":"Marge = 2 200 FC ; 2 200 / 10 000 = 22 %. Le 28,2 % est le taux sur le prix d'achat."},{"q":"Une caisse achetée 31 200 FC est vendue 39 000 FC. Quel est le taux de marge sur le prix de vente ?","o":["20 %","25 %","30 %","15 %"],"a":1,"e":"Marge = 7 800 ; 7 800 / 39 000 = 20 %. Ajouter 25 % à l'achat ne donne pas 25 % de marge."},{"q":"Charges fixes : 1 230 000 FC par mois ; taux de marge : 22 %. Quel est le seuil de rentabilité mensuel ?","o":["Environ 5 590 909 FC","Environ 270 600 FC","Environ 1 230 000 FC","Environ 12 300 000 FC"],"a":0,"e":"1 230 000 / 0,22 = 5 590 909 FC de ventes."},{"q":"Pourquoi inclure un salaire pour la patronne dans les charges fixes ?","o":["Pour payer plus d'impôts","Parce que la loi l'oblige dans tous les cas","Pour savoir si l'activité est vraiment rentable et ne pas mélanger caisse et famille","Pour augmenter artificiellement le seuil"],"a":2,"e":"Sans rémunération prévue, on surestime le bénéfice et on prélève sans contrôle dans la caisse."}]},{"t":"Chapitre 4 — Plan de dépenses et besoin de démarrage","html":"\n<h4>Deux familles de dépenses<\/h4>\n<p>Pour démarrer un commerce, vous devez distinguer :<\/p>\n<ul>\n<li>Les <b>investissements<\/b> : ce que vous achetez une fois pour utiliser longtemps (étagères, comptoir, congélateur, ordinateur ou téléphone pour l'application, enseigne, caution de loyer).<\/li>\n<li>Le <b>fonds de roulement<\/b> (ou besoin en fonds de roulement, BFR) : l'argent qui circule dans l'activité (stock de départ, trésorerie pour payer les premières factures avant que les clients ne paient).<\/li>\n<\/ul>\n<p>Le <b>besoin de démarrage<\/b> est la somme de tout ce qu'il faut payer avant de pouvoir vivre de ses ventes. C'est le chiffre que le banquier regarde en premier.<\/p>\n<h4>Le tableau du besoin de démarrage de la Boutique Espérance<\/h4>\n<table><thead><tr><th>Poste<\/th><th>Détail<\/th><th>FC<\/th><\/tr><\/thead><tbody>\n<tr><td>Stock initial<\/td><td>produits de base, boissons, recharges<\/td><td>6 000 000<\/td><\/tr>\n<tr><td>Aménagement<\/td><td>étagères, comptoir, enseigne, balance<\/td><td>800 000<\/td><\/tr>\n<tr><td>Caution et avance de loyer<\/td><td>3 mois × 400 000<\/td><td>1 200 000<\/td><\/tr>\n<tr><td>Formalités<\/td><td>enregistrement, autorisations (montants à vérifier)<\/td><td>500 000<\/td><\/tr>\n<tr><td>Fonds de roulement<\/td><td>réserve pour les premiers mois<\/td><td>1 500 000<\/td><\/tr>\n<tr><td><b>Total du besoin<\/b><\/td><td><\/td><td><b>10 000 000<\/b><\/td><\/tr>\n<\/tbody><\/table>\n<p>Cela représente environ <b>4,348 $<\/b> au taux d'exemple de 2 300 FC pour 1 $. Le taux réel change : refaites ce calcul quand vous présentez le plan.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Kananga, un commerçant ouvre une boutique de pièces de moto. Il achète 3 millions de FC de stock, mais oublie la caution du local (900 000 FC) et le fonds de roulement. Au deuxième mois, il ne peut plus renouveler le stock des pièces qui partent vite, et les clients vont chez le voisin. Le manque de trésorerie, pas le manque de clients, a bloqué son commerce.<\/div>\n<h4>Comment estimer chaque poste<\/h4>\n<ul>\n<li><b>Stock initial<\/b> : environ 3 à 4 semaines de ventes au prix d'achat. Ici, les achats mensuels sont de 7 300 800 FC ; 6 000 000 FC représentent donc environ 25 jours de stock.<\/li>\n<li><b>Matériel<\/b> : demandez au moins deux devis ; pensez à l'occasion en bon état pour économiser.<\/li>\n<li><b>Loyer<\/b> : demandez par écrit combien de mois d'avance et de caution le bailleur exige.<\/li>\n<li><b>Formalités<\/b> : renseignez-vous auprès de l'administration compétente sur les enregistrements, l'identification fiscale et les autorisations ; les coûts et procédures changent.<\/li>\n<li><b>Imprévus<\/b> : ajoutez 10 % si possible. Ici, 10 % de 10 000 000 FC feraient 1 000 000 FC.<\/li>\n<\/ul>\n<h4>Le plan de financement : équilibrer ressources et besoins<\/h4>\n<p>Le plan de financement montre d'où vient l'argent. Les ressources doivent être égales aux besoins.<\/p>\n<table><thead><tr><th>Ressource<\/th><th>FC<\/th><th>Part<\/th><\/tr><\/thead><tbody>\n<tr><td>Apport personnel (épargne et tontine de Mama Espérance)<\/td><td>6 000 000<\/td><td>60 %<\/td><\/tr>\n<tr><td>Prêt demandé (institution de microfinance ou banque)<\/td><td>4 000 000<\/td><td>40 %<\/td><\/tr>\n<tr><td><b>Total<\/b><\/td><td><b>10 000 000<\/b><\/td><td>100 %<\/td><\/tr>\n<\/tbody><\/table>\n<p>Un apport de 30 à 40 % du besoin est souvent apprécié par les prêteurs : il montre que vous risquez aussi votre argent. Ici, l'apport est de 60 %, ce qui est solide.<\/p>\n<h4>Les dépenses mensuelles<\/h4>\n<p>Une fois lancé, le commerce a des dépenses de fonctionnement : achats de marchandises (qui varient avec les ventes) et charges fixes (980 000 FC dans notre exemple, voir chapitre 3). Listez-les mois par mois. N'oubliez pas : les frais de transport, les pertes (produits périmés, casse, vols), les frais de Mobile Money, les commissions, les petites dépenses « sociales » (funérailles, cadeaux), qui existent dans la vraie vie.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Besoin de démarrage = investissements + stock + caution + formalités + fonds de roulement. Plan de financement : apport + emprunt = besoin. Ne sous-estimez jamais le fonds de roulement : c'est lui qui vous permet de tenir pendant que la clientèle se construit.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ne mettez pas tout l'argent dans le stock. Un stock trop gros immobilise votre argent, expose aux pertes et vous empêche de payer le loyer. Gardez toujours une réserve de trésorerie. Les montants de formalités et de taxes cités ici sont des exemples : à vérifier auprès de l'administration compétente (taux et procédures peuvent changer).<\/div>\n","quiz":[{"q":"Quelle dépense est un investissement ?","o":["L'achat de sucre à revendre cette semaine","L'achat d'étagères et d'un comptoir","Le salaire du mois","La facture d'électricité"],"a":1,"e":"Un investissement sert longtemps (étagères, comptoir) ; le sucre est du stock, l'électricité une charge."},{"q":"Stock 6 000 000 + aménagement 800 000 + caution 1 200 000 + formalités 500 000 + fonds de roulement 1 500 000. Quel est le besoin de démarrage ?","o":["10 000 000 FC","9 000 000 FC","8 800 000 FC","11 000 000 FC"],"a":0,"e":"6 000 000 + 800 000 + 1 200 000 + 500 000 + 1 500 000 = 10 000 000 FC."},{"q":"Le besoin est de 10 000 000 FC et l'apport de 6 000 000 FC. Quel prêt faut-il pour équilibrer ?","o":["6 000 000 FC","10 000 000 FC","4 000 000 FC","16 000 000 FC"],"a":2,"e":"Ressources = besoins : 6 000 000 + prêt = 10 000 000, donc prêt = 4 000 000 FC."},{"q":"Pourquoi garder un fonds de roulement ?","o":["Pour acheter une voiture personnelle","Pour payer les premières charges et renouveler le stock pendant que la clientèle se construit","Pour éviter de tenir une comptabilité","Parce que la loi l'impose en dollars"],"a":1,"e":"Beaucoup de commerces échouent par manque de trésorerie dans les premiers mois, pas par manque de clients."}]},{"t":"Chapitre 5 — Compte de résultat prévisionnel et plan de trésorerie","html":"\n<h4>Le compte de résultat prévisionnel<\/h4>\n<p>Le <b>compte de résultat<\/b> répond à : « Est-ce que je gagne de l'argent ? » Il compare les produits (ventes) aux charges (dépenses) sur une période. On l'appelle <b>prévisionnel<\/b> quand il est fait à l'avance. Voici celui de la Boutique Espérance pour un mois normal (à partir du 3e mois).<\/p>\n<table><thead><tr><th>Ligne<\/th><th>Calcul<\/th><th>FC par mois<\/th><\/tr><\/thead><tbody>\n<tr><td>Chiffre d'affaires<\/td><td>36 clients × 10 000 × 26 jours<\/td><td>9 360 000<\/td><\/tr>\n<tr><td>− Coût d'achat des marchandises vendues<\/td><td>78 % du CA<\/td><td>7 300 800<\/td><\/tr>\n<tr><td><b>= Marge brute<\/b><\/td><td>22 % du CA<\/td><td><b>2 059 200<\/b><\/td><\/tr>\n<tr><td>− Charges fixes<\/td><td>loyer, vendeur, énergie, etc.<\/td><td>980 000<\/td><\/tr>\n<tr><td>− Rémunération de la patronne<\/td><td>prévue<\/td><td>250 000<\/td><\/tr>\n<tr><td>− Intérêts du prêt (moyenne)<\/td><td>650 000 ÷ 12<\/td><td>54 167<\/td><\/tr>\n<tr><td><b>= Résultat avant impôt<\/b><\/td><td><\/td><td><b>775 033<\/b><\/td><\/tr>\n<\/tbody><\/table>\n<p>Résultat annuel approximatif : 9 300 400 FC (environ 4,044 $). Les intérêts viennent de l'hypothèse suivante : prêt de 4 000 000 FC sur 12 mois à 2.5 % par mois sur le capital restant dû ; ce taux est un exemple, les vrais taux dépendent du prêteur et sont à demander par écrit. Le calcul : 4 000 000 × 0.025 × (12 + 11 + … + 1) ÷ 12 = 4 000 000 × 0.025 × 6,5 = 650 000 FC d'intérêts au total.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Goma, Papa Désiré voit « beaucoup d'argent » passer dans sa caisse de pagnes : 5 millions de FC de ventes en un mois. Mais après avoir payé le tissu acheté, le transport, le loyer et le vendeur, il lui reste moins de 300 000 FC. Le compte de résultat lui aurait montré que le chiffre d'affaires n'est pas le bénéfice.<\/div>\n<h4>Résultat et trésorerie : deux choses différentes<\/h4>\n<p>Le résultat peut être positif alors que la caisse est vide. Pourquoi ? Parce que le <b>plan de trésorerie<\/b> suit l'argent réel (entrées et sorties de caisse, de banque et de Mobile Money), pas les chiffres comptables. Il inclut le remboursement du capital du prêt (qui n'est pas une charge du compte de résultat) et le réachat du stock vendu. Il n'inclut pas les ventes à crédit non encore encaissées.<\/p>\n<h4>Le plan de trésorerie des trois premiers mois<\/h4>\n<p>Hypothèses : ventes à 60 %, 80 % puis 100 % de l'objectif, tout payé comptant, achats égaux à 78 % des ventes, la patronne ne se paie pas encore, remboursement du prêt par mensualités (capital 333 333 FC + intérêts sur le restant). Trésorerie de départ : 1 500 000 FC (fonds de roulement).<\/p>\n<table><thead><tr><th>Mois<\/th><th>Encaissements (ventes)<\/th><th>Achats de stock<\/th><th>Charges fixes<\/th><th>Remboursement prêt<\/th><th>Solde du mois<\/th><th>Trésorerie cumulée<\/th><\/tr><\/thead><tbody>\n<tr><td>Mois 1<\/td><td>5 616 000<\/td><td>4 380 480<\/td><td>980 000<\/td><td>433 333<\/td><td>-177 813<\/td><td>1 322 187<\/td><\/tr><tr><td>Mois 2<\/td><td>7 488 000<\/td><td>5 840 640<\/td><td>980 000<\/td><td>425 000<\/td><td>242 360<\/td><td>1 564 547<\/td><\/tr><tr><td>Mois 3<\/td><td>9 360 000<\/td><td>7 300 800<\/td><td>980 000<\/td><td>416 667<\/td><td>662 533<\/td><td>2 227 080<\/td><\/tr>\n<\/tbody><\/table>\n<p>La trésorerie reste positive, ce qui est essentiel. Si elle devenait négative, il faudrait réduire les achats, négocier un crédit fournisseur ou reporter une dépense.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Le compte de résultat dit si l'activité est rentable ; le plan de trésorerie dit si vous pouvez payer vos factures. Un commerce peut être rentable sur le papier et manquer d'argent en caisse : surveillez les deux. Revenez au plan chaque mois et comparez avec la réalité.<\/div>\n<h4>Faire une simulation « et si ? »<\/h4>\n<p>Refaites le plan avec des ventes inférieures de 20 %, puis avec un loyer plus cher, puis avec un fournisseur qui augmente ses prix de 5 %. Notez le résultat. Si votre commerce ne survit à aucun de ces scénarios, il est trop fragile. Cela montre au banquier que vous êtes réaliste.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> N'oubliez pas les impôts et taxes : les règles dépendent de votre forme juridique et de votre chiffre d'affaires ; renseignez-vous auprès de l'administration fiscale compétente (taux et procédures peuvent changer). Le plan ci-dessus ne prétend pas donner un avis fiscal.<\/div>\n","quiz":[{"q":"Quelle ligne du compte de résultat correspond à : ventes − coût d'achat des marchandises vendues ?","o":["La marge brute","Le résultat net","Le fonds de roulement","L'apport personnel"],"a":0,"e":"La marge brute est ce qui reste des ventes après le coût des marchandises."},{"q":"Ventes 9 360 000 ; marge brute 22 % ; charges fixes 980 000 ; salaire patronne 250 000 ; intérêts 54 167. Quel est le résultat avant impôt (environ) ?","o":["775 033 FC","2 059 200 FC","1 079 200 FC","9 360 000 FC"],"a":0,"e":"2 059 200 − 980 000 − 250 000 − 54 167 = 775 033 FC."},{"q":"Pourquoi le remboursement du capital du prêt figure-t-il dans le plan de trésorerie mais pas dans le compte de résultat ?","o":["Parce qu'il est gratuit","Parce qu'il est interdit de le rembourser","Parce que les banques l'oublient","Parce que c'est une sortie d'argent réelle mais pas une charge d'exploitation"],"a":3,"e":"Rembourser un capital est une sortie de caisse ; seuls les intérêts sont une charge du compte de résultat."},{"q":"Un commerce est rentable mais sa caisse est vide. Quelle est l'explication la plus probable ?","o":["Le compte de résultat est faux par nature","Trop d'argent immobilisé en stock, ventes à crédit non encaissées ou remboursements élevés","Les clients paient trop","Il n'y a pas de charges"],"a":1,"e":"Rentabilité et trésorerie sont différentes : stock, crédits clients et remboursements consomment la caisse."}]},{"t":"Chapitre 6 — Financement, garanties, remboursement et endettement raisonnable","html":"\n<h4>Les sources de financement réalistes en RDC<\/h4>\n<table><thead><tr><th>Source<\/th><th>Avantages<\/th><th>Limites<\/th><\/tr><\/thead><tbody>\n<tr><td>Épargne personnelle<\/td><td>Pas d'intérêts, aucune dette<\/td><td>Limitée ; ne pas utiliser l'argent des frais scolaires ou de santé<\/td><\/tr>\n<tr><td>Famille et amis<\/td><td>Souple, parfois sans intérêt<\/td><td>Risque de conflit : mettre l'accord par écrit (montant, date, remboursement)<\/td><\/tr>\n<tr><td>Tontine, likelemba, association d'épargne<\/td><td>Discipline d'épargne, rapidité, confiance du groupe<\/td><td>Le tour arrive à une date fixe ; les règles dépendent du groupe<\/td><\/tr>\n<tr><td>Microfinance et coopératives d'épargne et de crédit<\/td><td>Petits montants, procédures plus simples que la banque<\/td><td>Taux souvent plus élevés, remboursements fréquents<\/td><\/tr>\n<tr><td>Banques commerciales<\/td><td>Montants plus grands, services variés<\/td><td>Garanties exigées, dossier complet<\/td><\/tr>\n<tr><td>Crédit fournisseur<\/td><td>Vous vendez avant de payer<\/td><td>Dépendance au fournisseur, pénalités de retard<\/td><\/tr>\n<tr><td>Programmes d'appui aux PME (agences, fonds de garantie, projets de bailleurs)<\/td><td>Conditions parfois avantageuses, accompagnement<\/td><td>Disponibilité variable : à vérifier auprès de l'administration compétente et des organismes concernés<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mama Espérance fait partie d'un groupe de likelemba de 12 femmes à Kinshasa. Chacune verse 100 000 FC par mois ; à son tour, une membre reçoit 1 200 000 FC. Elle a attendu son tour pour constituer une partie de son apport et a complété avec son épargne. Elle n'a pas attendu un crédit : elle a commencé avec ses propres ressources, ce qui rassure ensuite le prêteur.<\/div>\n<h4>Les garanties<\/h4>\n<p>Une <b>garantie<\/b> est ce que le prêteur peut saisir ou utiliser si vous ne remboursez pas. Les formes courantes : un bien (matériel, véhicule, titre de propriété), une caution (une personne qui promet de payer si vous ne payez pas), un dépôt de garantie bloqué à l'avance, le nantissement du stock ou du matériel, ou une garantie apportée par un fonds spécialisé (si disponible : à vérifier). Lisez toujours le contrat : que se passe-t-il en cas de retard ? Quels frais de dossier ? Quels intérêts de retard ?<\/p>\n<h4>Calculer la mensualité et le coût total<\/h4>\n<p>Prêt de 4 000 000 FC sur 12 mois, taux d'exemple de 2.5 % par mois sur le capital restant :<\/p>\n<ul>\n<li>Capital remboursé chaque mois : 4 000 000 ÷ 12 = 333 333 FC.<\/li>\n<li>Intérêts du 1er mois : 4 000 000 × 0.025 = 100 000 FC. Mensualité du 1er mois : 433 333 FC.<\/li>\n<li>Intérêts totaux : 650 000 FC. Coût total à rembourser : 4 650 000 FC.<\/li>\n<\/ul>\n<p>Le <b>coût du crédit<\/b> est donc de 16.2 % du montant emprunté. Vérifiez aussi les frais de dossier, l'assurance, les commissions : demandez le <b>coût total<\/b> en francs.<\/p>\n<h4>Le niveau d'endettement raisonnable<\/h4>\n<p>Calculez votre <b>capacité de remboursement<\/b> mensuelle : la marge brute moins les charges fixes, avant le salaire de la patronne et avant les intérêts. Pour la boutique : 2 059 200 − 980 000 = 1 079 200 FC. Le premier remboursement (433 333 FC) en représente <b>40 %<\/b>.<\/p>\n<p>Une règle de prudence souvent utilisée : la mensualité ne devrait pas dépasser environ <b>30 à 40 %<\/b> de cette capacité, afin de garder une marge en cas de baisse des ventes. Le chiffre de 40 % est à la limite : la boutique peut rembourser mais doit surveiller ses ventes, ou demander 18 mois au lieu de 12. Si la capacité tombe à 600 000 FC (ventes plus faibles), la mensualité de 433 333 FC serait de 72 % : trop tendu.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Empruntez seulement ce que votre activité peut rembourser en période difficile. Comparez les offres sur le coût total, pas seulement sur le taux. Gardez une trace écrite de tout accord, même avec la famille.<\/div>\n<h4>Pièges à éviter<\/h4>\n<ul>\n<li>Emprunter en dollars alors que vos ventes sont en francs, ou l'inverse : le taux de change peut alourdir votre dette.<\/li>\n<li>Rembourser un crédit avec un autre crédit.<\/li>\n<li>Utiliser le prêt pour des dépenses personnelles.<\/li>\n<li>Payer à un intermédiaire une « commission » pour obtenir le prêt : demandez toujours des frais officiels contre reçu.<\/li>\n<\/ul>\n<div class=\"warn\"><b>Attention.<\/b> Les conditions de crédit (taux, frais, garanties, programmes d'appui) changent et diffèrent selon l'institution : tous les chiffres de ce chapitre sont des exemples. À vérifier auprès de l'administration compétente et de l'institution financière (taux et procédures peuvent changer). Ce cours ne remplace pas un conseil juridique ou financier personnalisé.<\/div>\n","quiz":[{"q":"Quel avantage principal a une tontine (likelemba) ?","o":["Elle aide à épargner avec discipline et rapidement grâce à la confiance du groupe","Elle garantit un gros prêt de banque","Elle supprime toute dette","Elle est légalement obligatoire pour ouvrir un commerce"],"a":0,"e":"La tontine discipline l'épargne, mais ses règles dépendent du groupe et le tour a une date fixe."},{"q":"Prêt de 4 000 000 FC sur 12 mois ; quel est le capital remboursé chaque mois (hors intérêts) ?","o":["333 333 FC","400 000 FC","4 000 000 FC","100 000 FC"],"a":0,"e":"4 000 000 / 12 ≈ 333 333 FC."},{"q":"Capacité de remboursement : 1 079 200 FC. Mensualité : 433 333 FC. Quelle part cela représente-t-il ?","o":["Environ 40 %","Environ 4 %","Environ 90 %","Environ 15 %"],"a":0,"e":"433 333 / 1 079 200 ≈ 0,40, soit 40 %, à la limite de la règle prudente de 30 à 40 %."},{"q":"Un intermédiaire propose d'obtenir votre prêt contre une « commission » en espèces sans reçu. Que faites-vous ?","o":["Vous payez pour aller plus vite","Vous empruntez ailleurs pour payer l'intermédiaire","Vous refusez et demandez les frais officiels contre reçu","Vous cachez la commission dans le plan"],"a":2,"e":"Les frais doivent être officiels et justifiés par un reçu ; payer un intermédiaire sans reçu expose à la fraude et à la corruption."}]},{"t":"Chapitre 7 — Présenter son plan, éviter les erreurs, exemple complet","html":"\n<h4>Préparer la présentation<\/h4>\n<p>Que vous rencontriez un banquier, un agent de microfinance, un partenaire ou un parent qui vous prête de l'argent, la préparation est la même. Apportez : le plan imprimé (5 à 8 pages), vos pièces d'identité, des devis, vos relevés (banque ou Mobile Money si vous en avez), le cahier de comptage, et, si possible, les documents d'enregistrement de votre activité (à vérifier auprès de l'administration compétente).<\/p>\n<h4>Les 5 minutes qui comptent<\/h4>\n<ol>\n<li><b>Qui je suis<\/b> : mon expérience (par exemple : 5 ans comme vendeuse dans la boutique d'une tante).<\/li>\n<li><b>Ce que je vends<\/b> et à qui.<\/li>\n<li><b>Ce dont j'ai besoin<\/b> : 10 000 000 FC, dont 6 000 000 FC de mon apport et 4 000 000 FC demandés.<\/li>\n<li><b>Comment je rembourserai<\/b> : capacité mensuelle de 1 079 200 FC, mensualité de 433 333 FC au maximum.<\/li>\n<li><b>Les risques<\/b> et mon plan B.<\/li>\n<\/ol>\n<p>Répondez honnêtement aux questions. Si vous ne savez pas, dites-le et promettez une réponse écrite. N'exagérez jamais vos chiffres : un banquier compare avec le secteur et avec vos relevés.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mama Espérance est convoquée par une institution de microfinance. L'agent demande : « Que se passe-t-il si vos ventes baissent de 30 % ? » Elle répond avec ses simulations : « Mes ventes passeraient à environ 6 552 000 FC, ma marge brute à 1 441 440 FC. Après les charges fixes (980 000 FC), il resterait 461 440 FC avant la rémunération et le remboursement. Je diminuerais mes achats et je reporterais mon salaire. » Sa préparation inspire confiance.<\/div>\n<h4>Les erreurs fréquentes<\/h4>\n<table><thead><tr><th>Erreur<\/th><th>Conséquence<\/th><th>Remède<\/th><\/tr><\/thead><tbody>\n<tr><td>Ventes trop optimistes<\/td><td>Trésorerie insuffisante<\/td><td>Compter sur le terrain, scénario prudent<\/td><\/tr>\n<tr><td>Oublier des charges (transport, pertes, frais Mobile Money)<\/td><td>Résultat faux<\/td><td>Lister avec un commerçant expérimenté<\/td><\/tr>\n<tr><td>Pas de fonds de roulement<\/td><td>Blocage au 2e mois<\/td><td>Réserver 1 à 2 mois de charges<\/td><\/tr>\n<tr><td>Mélanger argent du commerce et argent de la famille<\/td><td>Impossible de suivre le résultat<\/td><td>Se verser un salaire fixe<\/td><\/tr>\n<tr><td>Ignorer le taux de change<\/td><td>Marge détruite si le franc baisse<\/td><td>Prix revus régulièrement<\/td><\/tr>\n<tr><td>Emprunter trop<\/td><td>Surendettement<\/td><td>Mensualité ≤ 30 à 40 % de la capacité<\/td><\/tr>\n<tr><td>Ne pas suivre le plan<\/td><td>Plan inutile<\/td><td>Comparer chaque mois plan et réalité<\/td><\/tr>\n<\/tbody><\/table>\n<h4>Le business plan complet de la Boutique Espérance (version d'une page)<\/h4>\n<ul>\n<li><b>Résumé<\/b> : boutique de produits de première nécessité dans une rue passante d'une commune de Kinshasa ; besoin de 10 000 000 FC (environ 4,348 $).<\/li>\n<li><b>Porteuse<\/b> : Mama Espérance, 5 ans d'expérience en vente, membre d'un likelemba.<\/li>\n<li><b>Marché<\/b> : 600 passants par jour, 36 clients par jour, panier de 10 000 FC ; deux concurrents qui ferment le dimanche et manquent de stock.<\/li>\n<li><b>Ventes<\/b> : 9 360 000 FC par mois à pleine vitesse (60 % puis 80 % pendant les deux premiers mois) ; marge de 22 %.<\/li>\n<li><b>Charges<\/b> : 980 000 FC par mois et 250 000 FC pour la patronne.<\/li>\n<li><b>Seuil de rentabilité<\/b> : 5 590 909 FC par mois, soit 22 clients par jour ; marge de sécurité de 40 %.<\/li>\n<li><b>Résultat<\/b> : environ 775 033 FC par mois avant impôt.<\/li>\n<li><b>Financement<\/b> : apport de 6 000 000 FC, prêt de 4 000 000 FC sur 12 mois (taux d'exemple de 2.5 % par mois).<\/li>\n<li><b>Trésorerie<\/b> : positive sur les trois premiers mois (2 227 080 FC à la fin du mois 3).<\/li>\n<li><b>Risques<\/b> : baisse des ventes (réduire les achats), hausse des prix des fournisseurs (réajuster les prix), vol (assurance et inventaire).<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Un bon plan est court, chiffré, prudent et honnête. Présentez : qui, quoi, combien, comment je rembourse, quels risques. Après le financement, comparez chaque mois vos résultats au plan : c'est ce suivi qui transforme un papier en commerce solide.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ne promettez jamais des « rendements garantis » à un partenaire ou un investisseur : aucun commerce n'est sans risque. Si un partenaire apporte de l'argent, mettez par écrit la part, les droits et les règles de sortie. Pour la forme juridique (entreprise individuelle, société) et les obligations légales, renseignez-vous auprès de l'administration compétente ou d'un professionnel (taux et procédures peuvent changer).<\/div>\n","quiz":[{"q":"Quel élément rassure le plus un prêteur ?","o":["Des promesses de gains énormes","Un plan chiffré, prudent, appuyé par des preuves de terrain et un apport personnel","Un plan copié d'un autre commerçant","L'absence de risques cités"],"a":1,"e":"Un prêteur veut voir la préparation, la prudence, un apport personnel et des preuves."},{"q":"Si les ventes baissent de 30 % (9 360 000 → 6 552 000) avec 22 % de marge, quelle est la marge brute ?","o":["Environ 1 441 440 FC","Environ 2 059 200 FC","Environ 6 552 000 FC","Environ 980 000 FC"],"a":0,"e":"6 552 000 × 0,22 = 1 441 440 FC ; après 980 000 FC de charges fixes, il reste 461 440 FC."},{"q":"Laquelle de ces phrases à un banquier est la meilleure ?","o":["« Voici mon cahier de comptage, mes devis et mon scénario si les ventes baissent. »","« Faites-moi confiance, ça marchera. »","« Je n'ai pas de chiffres mais mon quartier est bon. »","« Je rembourserai avec le prochain prêt. »"],"a":0,"e":"Des preuves et des scénarios inspirent confiance ; les promesses sans chiffres non."},{"q":"Quelle erreur est la plus dangereuse pour la trésorerie d'un commerce qui démarre ?","o":["Avoir un cahier de comptage","Comparer plusieurs fournisseurs","Faire un plan de trois pages","Mettre tout l'argent dans le stock sans fonds de roulement"],"a":3,"e":"Sans réserve de trésorerie, le commerce se bloque quand les premières charges arrivent."}]}],"exam":[{"q":"Quel est le but principal d'un business plan pour un petit commerçant ?","o":["Décider si le projet peut vivre et évaluer le besoin d'argent","Remplir une formalité sans utilité","Éviter de tenir un cahier","Fixer le salaire de l'État"],"a":0,"e":"Il sert d'outil de décision et de preuve de sérieux."},{"q":"Si 800 passants passent, 5 % entrent et 50 % de ceux qui entrent achètent, combien de clients par jour ?","o":["20","40","400","8"],"a":0,"e":"800 × 5 % = 40 ; 40 × 50 % = 20 clients."},{"q":"Un panier moyen de 8 000 FC, 25 clients par jour, 26 jours par mois. Quel est le chiffre d'affaires mensuel ?","o":["5 200 000 FC","200 000 FC","520 000 FC","2 080 000 FC"],"a":0,"e":"25 × 8 000 = 200 000 FC par jour ; × 26 = 5 200 000 FC."},{"q":"Un produit acheté 6 000 FC est vendu 8 000 FC. Quel est le taux de marge sur le prix de vente ?","o":["25 %","33 %","75 %","2 000 %"],"a":0,"e":"Marge = 2 000 ; 2 000 / 8 000 = 25 %. (Sur le prix d'achat, ce serait 33 %.)"},{"q":"Charges fixes de 900 000 FC, taux de marge de 30 %. Quel est le seuil de rentabilité mensuel ?","o":["3 000 000 FC","270 000 FC","930 000 FC","30 000 000 FC"],"a":0,"e":"900 000 / 0,30 = 3 000 000 FC."},{"q":"Qu'est-ce que le fonds de roulement ?","o":["L'argent qui permet de faire tourner l'activité (stock, premières charges)","Un fonds d'État obligatoire","Le salaire du patron","Le prix du local"],"a":0,"e":"C'est la réserve qui évite la rupture de trésorerie."},{"q":"Besoin de 8 000 000 FC ; apport de 3 000 000 FC. Quel prêt faut-il ?","o":["5 000 000 FC","3 000 000 FC","8 000 000 FC","11 000 000 FC"],"a":0,"e":"8 000 000 − 3 000 000 = 5 000 000 FC."},{"q":"Quelle différence entre résultat et trésorerie ?","o":["Le résultat compare ventes et charges ; la trésorerie suit l'argent réellement encaissé et décaissé","Aucune","La trésorerie ne concerne que les banques","Le résultat ne concerne que les dollars"],"a":0,"e":"Un commerce rentable peut manquer d'argent à cause du stock, des crédits clients ou des remboursements."},{"q":"Prêt de 3 000 000 FC sur 10 mois : capital remboursé par mois ?","o":["300 000 FC","30 000 FC","3 000 000 FC","100 000 FC"],"a":0,"e":"3 000 000 / 10 = 300 000 FC."},{"q":"Que doit-on faire avant de choisir un prêt ?","o":["Comparer le coût total en francs, les frais et les garanties","Choisir le plus rapide sans lire","Choisir selon le nom de la banque seulement","Payer une commission cachée"],"a":0,"e":"Le coût total et les clauses (retards, garanties) comptent plus que le taux affiché seul."},{"q":"Une mensualité de 500 000 FC pour une capacité de remboursement de 700 000 FC. Que pensez-vous ?","o":["C'est trop tendu : environ 71 %, au-delà d'une règle prudente de 30 à 40 %","C'est idéal","C'est trop faible","On ne peut pas juger"],"a":0,"e":"500 000 / 700 000 ≈ 71 % : en cas de baisse de ventes, le risque d'impayé est élevé."},{"q":"Quel comportement est honnête et prudent face à un banquier ou un partenaire ?","o":["Ne pas promettre de gains garantis et mettre les accords par écrit","Promettre des gains garantis","Cacher les risques","Donner de faux relevés"],"a":0,"e":"L'honnêteté, la prudence et l'écrit protègent toutes les parties."}]},{"id":"comptabilite","title":"Comptabilité de base pour commerçants (SYSCOHADA)","icon":"📒","level":"Débutant","hours":3,"summary":"Ce cours explique pas à pas comment tenir les comptes d'un commerce : livre de caisse, journaux, partie double, bilan et compte de résultat. Vous apprendrez aussi à gérer stocks, crédits et amortissements, à contrôler caisse et banque, et à lire vos chiffres pour décider.","goals":["Comprendre pourquoi tenir ses comptes et le cadre OHADA (SYSCOHADA)","Tenir un livre de caisse et les journaux des ventes et des achats","Passer des écritures en partie double (débit/crédit) pour des opérations de commerce","Construire et comprendre un bilan et un compte de résultat simplifiés","Évaluer le stock, suivre clients et fournisseurs et calculer un amortissement linéaire","Contrôler caisse, banque et stock, puis lire ses ratios pour décider"],"chapters":[{"t":"Chapitre 1 — Pourquoi tenir ses comptes ? Les obligations OHADA","html":"\n<h4>Savoir si l'on gagne vraiment de l'argent<\/h4>\n<p>Beaucoup de commerçants jugent leur activité à la <b>quantité d'argent qui passe dans la caisse<\/b>. Or de l'argent qui entre n'est pas de l'argent gagné : il faut en retirer ce que la marchandise a coûté, le loyer, le transport, les salaires. La <b>comptabilité<\/b> est simplement la manière de noter, jour après jour, tout ce qui entre et sort, afin de répondre à quatre questions : combien ai-je vendu ? combien ai-je dépensé ? combien ai-je gagné ? que possède mon commerce et que doit-il à d'autres ?<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mama Nadine tient une boutique de produits d'épicerie à Kinshasa. Elle dit : « Je vends bien, la caisse est toujours pleine. » Un mois, on fait le calcul : ventes 3 600 000 FC (environ 1 565 $ au taux d'exemple de 1 $ = 2 300 FC ; le taux varie) ; achats de marchandises vendues 2 700 000 FC ; loyer 300 000 FC ; transport 150 000 FC ; aide en boutique 200 000 FC. Son gain réel : 3 600 000 − 2 700 000 − 300 000 − 150 000 − 200 000 = <b>250 000 FC<\/b>. Or elle prélève 400 000 FC par mois pour la maison. Chaque mois, elle mange 150 000 FC de son capital, sans s'en rendre compte. Dans un an : 1 800 000 FC envolés.<\/div>\n<h4>À quoi servent les comptes<\/h4>\n<ul>\n<li><b>Piloter<\/b> : voir quels produits rapportent, quelles dépenses sont trop lourdes.<\/li>\n<li><b>Protéger l'argent<\/b> : repérer les vols, erreurs et oublis (qui a pris quoi, quand ?).<\/li>\n<li><b>Suivre les crédits<\/b> : qui vous doit de l'argent, à qui vous en devez.<\/li>\n<li><b>Convaincre<\/b> : une banque, une microfinance ou un partenaire demande des chiffres propres avant de prêter.<\/li>\n<li><b>Respecter la loi<\/b> : calculer correctement les impôts et être en règle en cas de contrôle.<\/li>\n<\/ul>\n<h4>Le cadre OHADA : le SYSCOHADA<\/h4>\n<p>La RDC est membre de l'<b>OHADA<\/b>, qui a fixé des règles communes pour les affaires. Pour la comptabilité, elles sont rassemblées dans l'<b>Acte uniforme relatif au droit comptable et à l'information financière<\/b>, qui met en œuvre le <b>SYSCOHADA<\/b> (système comptable OHADA). Il a été révisé et son texte révisé s'applique depuis 2018 dans les États membres. Ses grandes lignes :<\/p>\n<ul>\n<li>toute entité qui exerce une activité économique doit tenir une comptabilité régulière, en <b>langue officielle<\/b> et dans la <b>monnaie nationale<\/b> (le franc congolais) ;<\/li>\n<li>on enregistre chaque opération sur la base d'une <b>pièce justificative<\/b> (facture, reçu, bordereau, relevé bancaire) ;<\/li>\n<li>on respecte un <b>plan de comptes<\/b> commun : les comptes sont numérotés par classes (1 à 9), de sorte que tous les comptables parlent le même langage ;<\/li>\n<li>à la fin de chaque exercice (en général l'année civile), on établit des <b>états financiers annuels<\/b> : bilan, compte de résultat, tableau des flux de trésorerie et notes annexes ;<\/li>\n<li>les petites entités peuvent utiliser un <b>système allégé<\/b> (dit « minimal de trésorerie ») : surtout un suivi des recettes et dépenses, au lieu de la comptabilité complète. Les seuils exacts et leur application en RDC doivent être confirmés auprès de l'administration.<\/li>\n<\/ul>\n<h4>Les principes de base<\/h4>\n<table>\n<thead><tr><th>Principe<\/th><th>Ce que cela veut dire<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Séparation commerce / maison<\/td><td>L'argent du commerce n'est pas l'argent de la famille ; ce que vous prenez est noté comme un prélèvement<\/td><\/tr>\n<tr><td>Prudence<\/td><td>On ne compte pas un gain avant qu'il soit sûr, mais on note une perte dès qu'elle est probable<\/td><\/tr>\n<tr><td>Régularité<\/td><td>On note chaque opération à sa date, sans trou ni rature, dans l'ordre<\/td><\/tr>\n<tr><td>Permanence des méthodes<\/td><td>On garde la même façon de compter d'une année à l'autre<\/td><\/tr>\n<tr><td>Preuve<\/td><td>Chaque écriture s'appuie sur un document conservé<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Le chemin de ce cours<\/h4>\n<p>Nous allons avancer pas à pas : d'abord le <b>livre de caisse<\/b> et les journaux, puis la <b>partie double<\/b> (débit et crédit), ensuite le <b>bilan<\/b> et le <b>compte de résultat<\/b>, puis les stocks, les crédits clients et fournisseurs et l'amortissement ; enfin les contrôles de fin d'année et la lecture des chiffres pour décider. Vous n'avez pas besoin d'être comptable : il faut de la rigueur et de la régularité.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Tenir ses comptes, c'est savoir si l'on gagne réellement, protéger son argent et être crédible. En RDC, la comptabilité suit le SYSCOHADA : pièces justificatives, plan de comptes commun, états financiers annuels. Séparez toujours l'argent du commerce de celui de la maison.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les seuils, les durées de conservation des documents, les formulaires et les obligations fiscales peuvent changer et varient selon la taille de l'entreprise. À vérifier auprès de l'administration compétente (taux et procédures peuvent changer). Ce cours ne remplace pas un expert-comptable.<\/div>\n","quiz":[{"q":"Laquelle de ces raisons justifie le mieux de tenir sa comptabilité ?","o":["Éviter de noter les petites dépenses","Savoir si l'on gagne réellement et protéger son argent","Faire plaisir aux clients qui ne la voient jamais","Remplacer la caisse"],"a":2,"e":"La comptabilité sert à mesurer le gain réel, repérer les pertes et prouver ses chiffres à la banque ou à l'administration."},{"q":"Ventes du mois : 2 000 000 FC ; achats des marchandises vendues : 1 400 000 FC ; loyer 250 000 FC ; transport 100 000 FC. Quel est le gain du mois ?","o":["250 000 FC","600 000 FC","350 000 FC","2 000 000 FC"],"a":0,"e":"2 000 000 − 1 400 000 − 250 000 − 100 000 = 250 000 FC."},{"q":"Pourquoi faut-il conserver les factures et reçus ?","o":["Pour ne plus avoir à noter les opérations","Parce qu'ils sont inutiles après un mois","Parce qu'ils sont la preuve des écritures comptables","Pour décorer la boutique"],"a":3,"e":"Chaque écriture doit s'appuyer sur une pièce justificative."},{"q":"Un commerçant gagne 250 000 FC par mois mais prélève 400 000 FC pour sa famille pendant 12 mois. Combien de capital a-t-il consommé sur l'année ?","o":["1 800 000 FC","150 000 FC","3 000 000 FC","4 800 000 FC"],"a":1,"e":"(400 000 − 250 000) × 12 = 1 800 000 FC."}]},{"t":"Chapitre 2 — Le livre de caisse, le journal des ventes et des achats","html":"\n<h4>Le point de départ : noter dans l'ordre<\/h4>\n<p>Avant la partie double, un commerçant a besoin de trois outils simples. Ils peuvent être tenus sur un cahier ou, mieux, dans l'application. L'essentiel est de noter <b>chaque jour<\/b>, <b>dans l'ordre<\/b>, avec la <b>date<\/b>, un <b>libellé clair<\/b> et le <b>montant<\/b>.<\/p>\n<h4>1. Le livre de caisse<\/h4>\n<p>La <b>caisse<\/b>, c'est l'argent liquide que vous avez. Le livre de caisse a deux colonnes : les <b>entrées<\/b> (argent qui arrive) et les <b>sorties<\/b> (argent qui part), puis une colonne <b>solde<\/b>. Règle d'or : <b>sold
