, selon votre politique.<\/li>\n<li><b>Suivez<\/b> : appelez le lendemain pour vérifier que c'est réglé.<\/li>\n<\/ol>\n<h4>Une politique de retour simple et affichée<\/h4>\n<p>Écrivez votre règle : par exemple « Échange sous 7 jours avec reçu, produit non utilisé et dans son emballage ; les produits alimentaires et les médicaments ouverts ne sont ni repris ni échangés, sauf défaut de fabrication ou erreur de notre part ». Une règle affichée évite les disputes. Pour un défaut réel, remplacez sans discuter : le coût est petit comparé à la perte d'un client.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne criez jamais sur un client, même s'il a tort. Si la discussion s'envenime, appelez le patron ou invitez calmement le client à revenir pour que l'on revoie le dossier. Ne promettez pas de rembourser quand vous n'en avez pas le pouvoir.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Proposez une fois le petit plus utile ; fidélisez par la mémoire, la reconnaissance et la carte de fidélité ; face à une réclamation, écoutez, reconnaissez, vérifiez les faits, proposez une solution et faites le suivi. Affichez votre politique de retour.<\/div>\n","quiz":[{"q":"Une coque à 3 000 FC (marge 1 500 FC) vendue à 10 clients par semaine rapporte combien de marge par semaine ?","o":["15 000 FC","30 000 FC","1 500 FC","10 000 FC"],"a":0,"e":"10 x 1 500 = 15 000 FC de marge supplémentaire par semaine."},{"q":"Quelle est la bonne façon de faire une vente additionnelle ?","o":["Proposer cinq produits à la suite","Proposer une ou deux choses utiles, une seule fois, et accepter un refus avec le sourire","Refuser de vendre si le client n'en prend pas","Ajouter le produit au ticket sans prévenir"],"a":1,"e":"La proposition doit aider le client, sans pression ni tromperie."},{"q":"Un client furieux vous montre un produit défectueux acheté hier. Première étape ?","o":["Faire une remise sur un autre produit sans regarder","Lui dire que c'est sa faute","L'écouter calmement sans l'interrompre","Lui demander de partir"],"a":2,"e":"L'écoute calme fait baisser la tension et permet de comprendre les faits avant de proposer une solution."},{"q":"Pourquoi afficher sa politique de retour ?","o":["Parce que la loi l'impose avec un modèle unique","Pour pouvoir refuser sans expliquer","Pour décourager tous les achats","Pour éviter les disputes et rassurer les clients"],"a":3,"e":"Une règle claire connue d'avance évite les conflits et montre votre sérieux."}]},{"t":"Chapitre 6 — La vente à crédit : règles, plafond, preuve, relance et impayés","html":"\n<h4>Le crédit : un outil dangereux s'il n'est pas encadré<\/h4>\n<p>Vendre à crédit (« à terme », « à tempérament », « sur carnet ») attire des clients et aide les familles. Mais c'est aussi la première cause de faillite des petits commerces. Un crédit non payé est un argent qui sort de votre caisse <b>sans revenir<\/b>. Il faut donc des règles, comme pour une banque, à votre échelle.<\/p>\n<h4>Les règles d'or du crédit<\/h4>\n<ol>\n<li><b>Ne faites crédit qu'à des clients connus<\/b> : réguliers, avec adresse et téléphone vérifiés, idéalement recommandés.<\/li>\n<li><b>Fixez un plafond<\/b> par client. Exemple : pas plus de 50 000 FC pour un client récent, 200 000 FC pour un client régulier de plus d'un an. Le plafond ne doit jamais dépasser ce que vous pouvez perdre sans mettre le commerce en danger.<\/li>\n<li><b>Fixez une durée<\/b> : 7, 15 ou 30 jours maximum. Écrivez la date de paiement.<\/li>\n<li><b>Demandez un acompte<\/b> : 30 % à 50 % pour un premier crédit.<\/li>\n<li><b>Une seule dette à la fois<\/b> : pas de nouveau crédit tant que l'ancien n'est pas payé.<\/li>\n<li><b>Gardez une preuve écrite<\/b> (voir plus bas).<\/li>\n<\/ol>\n<h4>La preuve écrite<\/h4>\n<p>Une promesse orale n'est pas une preuve. Préparez une <b>fiche de crédit<\/b> à signer avec : nom complet, téléphone, adresse, pièce d'identité (numéro), liste des articles, montant, acompte, solde, date limite, signature du client et du vendeur, et si possible le nom d'un garant. Faites une copie pour le client. Dans l'application, enregistrez la vente comme vente à crédit avec le nom du client, afin que la dette soit suivie automatiquement.<\/p>\n<table>\n<thead><tr><th>Élément de la fiche<\/th><th>Pourquoi<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Identité + téléphone<\/td><td>Pouvoir retrouver et relancer le client<\/td><\/tr>\n<tr><td>Montant, acompte, solde<\/td><td>Éviter les discussions sur ce qui est dû<\/td><\/tr>\n<tr><td>Date limite<\/td><td>Savoir quand relancer<\/td><\/tr>\n<tr><td>Signature<\/td><td>Preuve de l'accord<\/td><\/tr>\n<tr><td>Garant<\/td><td>Seconde personne à contacter<\/td><\/tr>\n<\/tbody><\/table>\n<h4>Calcul : le vrai coût d'un impayé<\/h4>\n<p>Un revendeur de farine à Lubumbashi vend 150 000 FC à crédit à une restauratrice, avec 50 000 FC d'acompte. Le solde de 100 000 FC n'est jamais payé. Sa marge sur la farine est de 15 % du prix de vente. Pour <b>récupérer<\/b> 100 000 FC de perte, il doit réaliser 100 000 / 0,15 = environ 666 667 FC de ventes supplémentaires, soit presque sept fois la somme perdue, ou plus de 290 $ de ventes pour un impayé de 43 $ (à 2 300 FC pour 1 $). Voilà pourquoi mieux vaut refuser un crédit que courir derrière un impayé.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Dans son dépôt de boissons à Kinshasa, Papa Dieudonné a cessé de faire crédit « à tout le monde ». Il a créé trois catégories : A (clients de plus de deux ans, plafond 300 000 FC, 15 jours), B (clients de plus de six mois, plafond 100 000 FC, 7 jours), C (nouveaux, comptant seulement). En un an, ses impayés sont passés de 12 % à 3 % de ses ventes à crédit.<\/div>\n<h4>La relance : poliment mais régulièrement<\/h4>\n<ul>\n<li><b>Avant l'échéance<\/b> : un message de rappel amical, 2 jours avant.<\/li>\n<li><b>Le jour J<\/b> : appel ou visite courtoise.<\/li>\n<li><b>Après 3 jours<\/b> : nouveau contact, proposer un plan de paiement réaliste (deux ou trois versements écrits).<\/li>\n<li><b>Après 15 jours<\/b> : rencontrer le client, contacter le garant, suspendre tout nouveau crédit.<\/li>\n<\/ul>\n<p>Message type WhatsApp : « Bonjour Maman Grâce, petit rappel amical : le solde de 100 000 FC est attendu le 15. Merci de me dire quand vous passez. »<\/p>\n<h4>En cas d'impayé persistant<\/h4>\n<ol>\n<li>Cessez toute nouvelle vente à crédit.<\/li>\n<li>Faites une demande écrite de paiement, gardez une copie.<\/li>\n<li>Essayez un arrangement amiable, avec un calendrier signé.<\/li>\n<li>En dernier recours, la voie légale (conciliation, juridiction compétente) : demandez conseil à un juriste ou à l'administration compétente. Les procédures et frais varient.<\/li>\n<li>N'employez <b>jamais<\/b> de menaces, d'insultes publiques, de violences ni de saisie sauvage : c'est interdit et dangereux pour vous.<\/li>\n<\/ol>\n<div class=\"warn\"><b>Attention.<\/b> Ne prêtez pas l'argent de votre stock à votre famille et vos amis sans note écrite. Les « petites dettes » des proches coulent plus de boutiques que les grosses fraudes. Cette information est générale : pour un cas précis de recouvrement, demandez l'avis d'un juriste.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Crédit seulement aux clients connus, avec plafond, durée, acompte, preuve écrite et suivi. Relancez tôt et poliment. Un impayé coûte beaucoup plus cher que sa valeur car il faut vendre plusieurs fois son montant pour le compenser.<\/div>\n","quiz":[{"q":"Marge de 15 % du prix de vente. Un impayé de 100 000 FC oblige à vendre environ combien pour compenser la perte ?","o":["150 000 FC","666 667 FC","1 500 000 FC","100 000 FC"],"a":1,"e":"100 000 / 0,15 = 666 667 FC de ventes supplémentaires."},{"q":"Quel client est le plus approprié pour un premier crédit ?","o":["Un ami qui refuse de signer","Un inconnu qui promet de payer demain","Un client régulier connu, avec téléphone et adresse vérifiés, et un acompte","Un client de passage pressé"],"a":2,"e":"Crédit = connaissance du client, traçabilité et acompte pour limiter le risque."},{"q":"Que doit contenir une fiche de crédit ?","o":["Uniquement la signature du vendeur","Rien, la parole suffit","Seulement le nom du client","Identité, téléphone, articles, montant, acompte, solde, date limite, signatures"],"a":3,"e":"Ces éléments constituent la preuve et permettent le suivi et la relance."},{"q":"Un client ne paie pas à l'échéance. Quelle démarche est correcte ?","o":["Relancer poliment, proposer un plan de paiement écrit, suspendre les nouveaux crédits","Oublier la dette pour garder le client","Afficher son nom devant la boutique","Menacer le client de le faire arrêter sans procédure"],"a":0,"e":"Relance courtoise, plan écrit et arrêt des nouveaux crédits ; les menaces et humiliations sont interdites et contre-productives."}]},{"t":"Chapitre 7 — Reçus, honnêteté, réputation et vente par téléphone et WhatsApp","html":"\n<h4>Le reçu et la facture : preuves pour tous<\/h4>\n<p>Un <b>reçu<\/b> prouve qu'un paiement a eu lieu. Une <b>facture<\/b> détaille ce qui est vendu et le montant dû. Donner un reçu protège le client (garantie, échange) et vous protège (preuve de la vente, suivi de la caisse). Même pour de petits montants, proposez-le, surtout pour les téléphones, les médicaments chers, les pièces détachées et les ventes à crédit.<\/p>\n<p>Un bon reçu contient :<\/p>\n<ul>\n<li>Le nom du commerce, son adresse et son téléphone.<\/li>\n<li>La date et le numéro du reçu.<\/li>\n<li>Les articles, quantités, prix unitaires, total.<\/li>\n<li>Le mode de paiement (espèces, mobile money) et, si besoin, l'acompte et le solde.<\/li>\n<li>La garantie ou la règle de retour.<\/li>\n<li>Le nom du vendeur.<\/li>\n<\/ul>\n<p>Pour la facturation officielle, les mentions obligatoires et les règles fiscales (numéro d'identification, TVA, etc.) dépendent de votre statut et de la réglementation. Renseignez-vous auprès de la Direction Générale des Impôts ou d'un comptable : les règles peuvent changer.<\/p>\n<h4>L'honnêteté : le meilleur investissement<\/h4>\n<p>Dans un quartier, tout se sait. Un commerçant qui trompe sur le poids, le prix, la date ou la qualité perd sa réputation en quelques jours et ne la retrouve presque jamais. À l'inverse, la réputation d'honnêteté attire des clients sans publicité.<\/p>\n<ul>\n<li>Respectez les prix annoncés et les poids (balance contrôlée).<\/li>\n<li>Ne vendez jamais de produit périmé ou de médicament sans conseil adapté.<\/li>\n<li>N'inventez pas une origine ou une garantie. Ne mélangez pas du faux et du vrai.<\/li>\n<li>Rendez la monnaie exactement, comptez devant le client.<\/li>\n<li>Reconnaissez vos erreurs et réparez-les vite.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Goma, un vendeur de téléphones a vendu un appareil reconditionné en le présentant comme neuf. Le client l'a découvert, a posté un message sur Facebook, et le vendeur a perdu une grande partie de sa clientèle en deux semaines. À côté, un autre vendeur affiche clairement « neuf », « reconditionné garanti 3 mois » avec deux prix. Ses clients savent à quoi s'attendre et le recommandent.<\/div>\n<h4>Vendre au téléphone et sur WhatsApp<\/h4>\n<p>Beaucoup de ventes se font aujourd'hui à distance. Le client ne vous voit pas, il n'a pas le produit en main : la confiance est donc encore plus importante.<\/p>\n<ol>\n<li><b>Répondez vite<\/b>, dans l'heure si possible. Indiquez vos horaires.<\/li>\n<li><b>Saluez et présentez-vous<\/b> : « Bonjour, ici la boutique Mama Léa à Lubumbashi. »<\/li>\n<li><b>Envoyez de bonnes photos<\/b> claires, prises à la lumière, avec le prix et la taille ou le modèle.<\/li>\n<li><b>Écrivez des messages courts, précis, polis<\/b>, sans abréviations difficiles.<\/li>\n<li><b>Confirmez la commande par écrit<\/b> : produit, quantité, prix total, lieu et date de livraison.<\/li>\n<li><b>Précisez le paiement<\/b> : espèces à la livraison, mobile money. Donnez le nom exact qui s'affichera au transfert pour éviter les arnaques. Ne partagez jamais de code secret.<\/li>\n<li><b>Livrez ce qui est montré<\/b> et tenez la date promise.<\/li>\n<li><b>Après la livraison<\/b>, demandez si tout va bien.<\/li>\n<\/ol>\n<p>Exemple de message : « Bonjour Papa Joël. Voici la photo du carton de savon, 24 pièces, 36 000 FC. Livraison à Gombe demain avant 15 h pour 2 000 FC. Total : 38 000 FC, payable à la livraison. Je vous confirme ? » Vérification : 36 000 + 2 000 = 38 000 FC, soit environ 16,5 $.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Méfiez-vous des fausses preuves de paiement (captures modifiées) : vérifiez toujours que l'argent est réellement arrivé sur votre compte avant de livrer. Ne livrez jamais un gros achat sur une simple capture d'écran.<\/div>\n<h4>Protéger sa réputation en ligne<\/h4>\n<p>Répondez poliment à tout commentaire négatif, proposez de régler en privé, et demandez à vos clients satisfaits de laisser un avis ou de vous recommander. Une réponse calme est vue par tous les futurs clients.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Donnez toujours un reçu clair ; soyez honnête sur le prix, la qualité et la garantie ; à distance, répondez vite, envoyez de vraies photos, confirmez par écrit et vérifiez le paiement avant de livrer. La réputation est votre capital le plus précieux.<\/div>\n","quiz":[{"q":"Un client WhatsApp envoie une capture d'écran de paiement pour un gros achat. Que faites-vous avant de livrer ?","o":["Vous livrez la moitié","Vous livrez immédiatement","Vous vérifiez que l'argent est bien arrivé sur votre compte","Vous demandez une deuxième capture"],"a":2,"e":"Les captures peuvent être falsifiées : seule la réception réelle de l'argent fait foi."},{"q":"Pourquoi donner un reçu même pour une petite vente ?","o":["Uniquement parce que c'est la mode","Pour que le client paie plus","Pour perdre du temps","Pour prouver la vente, appliquer la garantie et suivre la caisse"],"a":3,"e":"Le reçu protège le client et le commerçant et rend la caisse traçable."},{"q":"Un client commande par WhatsApp un carton de savon à 36 000 FC avec livraison à 2 000 FC. Quel total confirmez-vous ?","o":["38 000 FC","40 000 FC","36 000 FC","37 000 FC"],"a":0,"e":"36 000 + 2 000 = 38 000 FC."},{"q":"Vous avez vendu par erreur un produit proche de la péremption sans l'indiquer. Que faire en découvrant l'erreur ?","o":["Se taire en espérant que rien ne se passe","Contacter le client, reprendre le produit et le remplacer ou le rembourser","Dire que le client aurait dû vérifier","Retirer le numéro du client de votre liste"],"a":1,"e":"Reconnaître et réparer vite protège la santé du client et votre réputation."}]}],"exam":[{"q":"Quel geste d'accueil est prioritaire quand un client entre pendant que vous servez quelqu'un ?","o":["Le saluer et lui dire que vous êtes à lui dans un instant","Continuer sans rien dire","Lui demander de revenir plus tard","Regarder votre téléphone"],"a":0,"e":"Le client doit se sentir vu dès les premières secondes."},{"q":"Pourquoi poser des questions ouvertes à un client ?","o":["Pour découvrir son vrai besoin avant de proposer un produit","Pour gagner du temps en parlant à sa place","Pour lui faire baisser son prix","Pour éviter qu'il compare"],"a":0,"e":"Découvrir le besoin permet de conseiller le produit adapté."},{"q":"Des chaussures à 36 000 FC durent 6 mois ; d'autres à 54 000 FC durent 18 mois. Quel est le coût mensuel des secondes ?","o":["3 000 FC","6 000 FC","9 000 FC","54 000 FC"],"a":1,"e":"54 000 / 18 = 3 000 FC par mois, contre 36 000 / 6 = 6 000 FC pour les premières."},{"q":"Un client dit « C'est trop cher ». Quelle est la meilleure première réaction ?","o":["Chercher ce qui le gêne (budget, comparaison, doute) et justifier la valeur","Baisser aussitôt le prix de 30 %","Lui dire d'aller voir ailleurs","Ignorer la remarque"],"a":1,"e":"Une objection cache souvent une question : écouter, comprendre, répondre puis vérifier."},{"q":"Un article coûte 60 000 FC et se vend 75 000 FC. Vous accordez 8 % de remise. Quelle est votre marge en FC ?","o":["9 000 FC","15 000 FC","6 000 FC","9 800 FC"],"a":1,"e":"Remise : 75 000 x 0,08 = 6 000 ; prix 69 000 ; marge 69 000 - 60 000 = 9 000 FC."},{"q":"À quoi sert le prix plancher ?","o":["À copier le prix du voisin","À fixer le prix du fournisseur","À ne jamais vendre en dessous de la marge minimale que l'on s'est fixée","À afficher le prix le plus haut"],"a":3,"e":"Le prix plancher = coût de revient + marge minimale."},{"q":"Une coque à 4 000 FC (marge 2 000 FC) est proposée à 15 clients par semaine. Combien de marge supplémentaire par semaine ?","o":["60 000 FC","30 000 FC","15 000 FC","2 000 FC"],"a":2,"e":"15 x 2 000 = 30 000 FC."},{"q":"Quelle est la bonne méthode face à un client mécontent ?","o":["Proposer tout de suite une remise","Appeler le voisin à l'aide","L'écouter sans l'interrompre, reformuler, puis proposer une solution","Lui expliquer que c'est sa faute"],"a":3,"e":"L'écoute calme fait baisser la tension et permet de traiter les faits."},{"q":"Avant d'accorder un crédit à un client, que faut-il prévoir ?","o":["Une fiche écrite avec identité, montant, acompte, date limite et signatures","Une promesse verbale","Rien si le client est pressé","Un prix plus bas"],"a":0,"e":"La preuve écrite permet le suivi, la relance et évite les litiges."},{"q":"Votre marge est de 20 % du prix de vente. Un impayé de 80 000 FC oblige à vendre combien de plus pour compenser ?","o":["400 000 FC","80 000 FC","160 000 FC","16 000 FC"],"a":1,"e":"80 000 / 0,20 = 400 000 FC de ventes supplémentaires."},{"q":"Un client ne paie pas à l'échéance. Que faire ?","o":["Menacer de le faire arrêter sans procédure","Relancer poliment, proposer un plan de paiement écrit et suspendre les nouveaux crédits","Afficher son nom devant la boutique","Oublier la dette"],"a":2,"e":"Relance courtoise et régulière ; menaces et humiliation sont à proscrire."},{"q":"Un client WhatsApp commande 3 cartons à 24 000 FC pièce, livraison 3 000 FC. Quel total, et que faire avant de livrer ?","o":["72 000 FC ; livrer dès réception de la capture d'écran","69 000 FC ; vérifier la réception réelle","75 000 FC ; vérifier que l'argent est réellement arrivé sur votre compte","75 000 FC ; livrer dès réception de la capture d'écran"],"a":3,"e":"3 x 24 000 = 72 000 + 3 000 = 75 000 FC. Une capture peut être falsifiée : seule la réception réelle de l'argent fait foi."}]},{"id":"stock","title":"Gestion des stocks et des approvisionnements","icon":"📦","level":"Débutant","hours":3,"summary":"Ce cours vous apprend à tenir un stock fiable et rentable : fiche de stock, unités, coût de revient, marge, CMUP, FIFO et FEFO, stock minimum et commandes, inventaire, choix des fournisseurs et gestion du taux de change. Il montre ensuite comment appliquer tout cela avec l'application KAJIMINYI STOCK PRO.","goals":["Expliquer le rôle du stock et mesurer le coût des ruptures et du surstock","Tenir une fiche de stock et convertir cartons, casiers et sacs en unités de vente","Calculer un coût de revient, une marge et un CMUP, et appliquer FIFO et FEFO","Fixer un stock minimum, un point de commande et une quantité à commander, et mesurer la rotation","Faire un inventaire, valoriser les écarts et justifier la casse et les pertes","Comparer et négocier avec les fournisseurs, gérer le taux de change et organiser le magasin avec KAJIMINYI STOCK PRO"],"chapters":[{"t":"Chapitre 1 — Le rôle du stock et le coût d'un mauvais stock","html":"\n<h4>Qu'est-ce que le stock ?<\/h4>\n<p>Le <b>stock<\/b>, ce sont toutes les marchandises que vous avez achetées et que vous n'avez pas encore vendues : les sacs de farine dans l'arrière-boutique, les cartons de boissons, les pagnes sur l'étagère, les téléphones dans la vitrine, les boîtes de médicaments de la pharmacie. Pour un commerçant, le stock est souvent <b>la plus grosse partie de son argent<\/b>. Tant que la marchandise n'est pas vendue, cet argent est « endormi » sur les étagères.<\/p>\n<h4>À quoi sert le stock ?<\/h4>\n<ul>\n<li><b>Servir le client tout de suite<\/b> : un client qui trouve ce qu'il cherche achète ; sinon il va chez le voisin.<\/li>\n<li><b>Se protéger des retards<\/b> : le camion de votre fournisseur peut arriver en retard (route coupée, panne, pluie, bateau bloqué).<\/li>\n<li><b>Acheter en plus grande quantité<\/b> : on obtient parfois un meilleur prix et on économise des voyages.<\/li>\n<li><b>Lisser les saisons<\/b> : fêtes de fin d'année, rentrée scolaire, saison des pluies.<\/li>\n<\/ul>\n<h4>Les deux mauvais stocks : trop peu ou trop<\/h4>\n<p>Un bon stock n'est ni vide ni débordant. Il y a deux façons de se tromper.<\/p>\n<p><b>1. La rupture de stock<\/b> : le produit manque au moment où le client le demande. Conséquences : vente perdue, client déçu qui ne revient pas, réputation abîmée.<\/p>\n<p><b>2. Le surstock<\/b> : vous avez trop de marchandise par rapport à ce que vous vendez. Conséquences : argent bloqué, produits qui se périment, qui s'abîment, qui se démodent ou qui attirent les vols, besoin de plus de place.<\/p>\n<table>\n<thead><tr><th>Problème<\/th><th>Ce que ça coûte<\/th><th>Signes à surveiller<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Rupture<\/td><td>Marge perdue, clients perdus<\/td><td>Clients qui repartent les mains vides, « il n'y en a plus »<\/td><\/tr>\n<tr><td>Surstock<\/td><td>Argent bloqué, pertes par péremption ou casse<\/td><td>Produits qui dorment depuis des mois, poussière, étagères pleines<\/td><\/tr>\n<tr><td>Désordre<\/td><td>Temps perdu, vols, erreurs<\/td><td>On ne sait plus ce qu'il y a, on achète deux fois la même chose<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Calculer le coût d'une rupture<\/h4>\n<p>Le coût d'une rupture, c'est la marge que vous n'avez pas gagnée : <b>nombre d'unités non vendues × marge par unité<\/b>. Et ce calcul ne compte pas encore le client qui ne reviendra pas.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mado tient une boutique à Kinshasa. Elle vend en moyenne 6 sacs de farine de 25 kg par jour et gagne 4 000 FC de marge sur chaque sac. Un jour, elle oublie de recommander : pendant 5 jours, la farine manque. Manque à gagner : 6 × 5 = 30 sacs, soit 30 × 4 000 = <b>120 000 FC<\/b> (environ 52 $ au taux d'exemple de 1 $ = 2 300 FC ; le taux varie). Pire : trois clientes régulières ont trouvé un autre fournisseur et ne sont pas revenues.<\/div>\n<h4>Calculer le coût du surstock<\/h4>\n<p>Le surstock coûte de trois façons : l'argent immobilisé (que vous auriez pu utiliser autrement), les pertes (péremption, casse, vol) et la place occupée.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépositaire de boissons à Lubumbashi a acheté 300 cartons de jus pour la fête, soit 300 × 18 000 FC = 5 400 000 FC. Il en vend 200. Il reste 100 cartons, donc <b>1 800 000 FC<\/b> d'argent bloqué. S'il y a en plus une date limite de consommation proche, il peut devoir baisser le prix et perdre une partie de la marge, voire jeter. Avec ces 1 800 000 FC, il aurait pu acheter un autre produit qui se vend toute l'année.<\/div>\n<h4>Le stock est de l'argent<\/h4>\n<p>Prenez l'habitude de regarder votre stock en <b>francs<\/b>, pas seulement en nombre de produits. Un stock de 3 000 000 FC, c'est 3 000 000 FC que vous ne pouvez pas utiliser pour payer le loyer, les salaires ou un nouveau fournisseur. Chaque produit doit gagner sa place : s'il ne se vend pas, il coûte.<\/p>\n<h4>Les quatre questions de la gestion de stock<\/h4>\n<ol>\n<li><b>Qu'est-ce que j'ai ?<\/b> (fiche de stock, inventaire : chapitres 2 et 5)<\/li>\n<li><b>Combien ça m'a coûté ?<\/b> (prix d'achat, coût de revient : chapitre 3)<\/li>\n<li><b>Quand et combien commander ?<\/b> (stock minimum, point de commande : chapitre 4)<\/li>\n<li><b>Chez qui acheter, et comment protéger le tout ?<\/b> (fournisseurs, magasin, sécurité : chapitres 6 et 7)<\/li>\n<\/ol>\n<div class=\"key\"><b>À retenir.<\/b> Le stock est de l'argent transformé en marchandises. Trop peu : vous perdez des ventes. Trop : vous bloquez de l'argent et vous risquez des pertes. Le but de la gestion de stock est d'avoir <b>le bon produit, en bonne quantité, au bon moment, au meilleur coût<\/b>.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Un stock qui paraît « beau » n'est pas forcément sain. Une étagère pleine de produits qui ne se vendent pas est un problème, pas une richesse.<\/div>\n","quiz":[{"q":"Qu'est-ce qu'une rupture de stock ?","o":["Un produit qui manque alors que le client le demande","Un produit en promotion","Un stock trop important","Un fournisseur qui baisse ses prix"],"a":0,"e":"La rupture, c'est le manque de produit au moment de la demande : vente et parfois client perdus."},{"q":"Une boutique vend 8 bouteilles d'huile par jour avec 500 FC de marge par bouteille. Elle manque d'huile 4 jours. Quel est le manque à gagner ?","o":["16 000 FC","4 000 FC","32 000 FC","2 000 FC"],"a":1,"e":"8 × 4 = 32 bouteilles non vendues ; 32 × 500 = 16 000 FC."},{"q":"Parmi ces conséquences, laquelle est typique d'un surstock ?","o":["De l'argent bloqué et des risques de péremption","Des clients plus nombreux","Des ventes perdues faute de produit","Un meilleur prix d'achat garanti"],"a":2,"e":"Le surstock immobilise l'argent et expose aux pertes (péremption, casse, vol)."},{"q":"Un commerçant a acheté 200 cartons à 12 000 FC et en a vendu 150. Quelle somme est encore immobilisée en stock (au prix d'achat) ?","o":["2 400 000 FC","1 800 000 FC","1 200 000 FC","600 000 FC"],"a":3,"e":"Il reste 50 cartons ; 50 × 12 000 = 600 000 FC."}]},{"t":"Chapitre 2 — La fiche de stock, les entrées, les sorties et les unités","html":"\n<h4>La fiche de stock : la mémoire de votre marchandise<\/h4>\n<p>La <b>fiche de stock<\/b> est un document (cahier, tableau ou application) où l'on note, <b>pour chaque produit<\/b>, tout ce qui entre et tout ce qui sort. Elle répond à une question simple : « combien dois-je avoir en magasin, là, maintenant ? ». Ce nombre s'appelle le <b>stock théorique<\/b>. Plus tard, l'inventaire physique le comparera avec ce que vous comptez réellement.<\/p>\n<h4>La formule de base<\/h4>\n<p><b>Stock final = stock initial + entrées − sorties<\/b><\/p>\n<ul>\n<li>Le <b>stock initial<\/b> : ce qu'il y avait au début de la période (jour, semaine, mois).<\/li>\n<li>Les <b>entrées<\/b> : tout ce qui arrive : achats, retours de clients, transferts reçus d'un autre dépôt.<\/li>\n<li>Les <b>sorties<\/b> : tout ce qui part : ventes, produits donnés, casse, produits périmés jetés, transferts envoyés, retours au fournisseur.<\/li>\n<\/ul>\n<p>Attention : ce ne sont pas seulement les ventes qui font baisser le stock. La casse et les produits périmés le font baisser aussi, et c'est en les notant que l'on voit où part l'argent.<\/p>\n<h4>Ce que contient une ligne de fiche<\/h4>\n<table>\n<thead><tr><th>Date<\/th><th>Pièce (bon, facture)<\/th><th>Entrée<\/th><th>Sortie<\/th><th>Stock<\/th><th>Observation<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>01/06<\/td><td>Stock initial<\/td><td><\/td><td><\/td><td>100<\/td><td><\/td><\/tr>\n<tr><td>03/06<\/td><td>Facture d'achat n° 14<\/td><td>60<\/td><td><\/td><td>160<\/td><td>Livraison complète<\/td><\/tr>\n<tr><td>04/06<\/td><td>Ventes du jour<\/td><td><\/td><td>25<\/td><td>135<\/td><td><\/td><\/tr>\n<tr><td>05/06<\/td><td>Casse constatée<\/td><td><\/td><td>3<\/td><td>132<\/td><td>Chute en rangeant<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Chaque mouvement porte une <b>pièce justificative<\/b> : bon de livraison, facture, ticket de vente, bon de sortie. Sans pièce, un mouvement est invérifiable et ouvre la porte aux erreurs et aux vols.<\/p>\n<h4>Les unités : un même produit, plusieurs façons de le compter<\/h4>\n<p>Vous achetez en <b>cartons<\/b>, vous vendez à la <b>bouteille<\/b>. Si vous mélangez les unités dans la fiche, vous vous trompez. Règle d'or : <b>choisir une unité de stock (la plus petite que vous vendez) et convertir tout le reste dedans<\/b>.<\/p>\n<table>\n<thead><tr><th>Produit<\/th><th>Unité d'achat<\/th><th>Unité de vente<\/th><th>Conversion<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Boisson<\/td><td>Carton<\/td><td>Bouteille<\/td><td>1 carton = 12 bouteilles<\/td><\/tr>\n<tr><td>Bière ou soda<\/td><td>Casier<\/td><td>Bouteille<\/td><td>1 casier = 24 bouteilles (selon le modèle)<\/td><\/tr>\n<tr><td>Farine<\/td><td>Sac de 25 kg<\/td><td>Kilogramme<\/td><td>1 sac = 25 kg<\/td><\/tr>\n<tr><td>Savon<\/td><td>Carton de 10 plaquettes<\/td><td>Pièce<\/td><td>1 carton = 10 pièces<\/td><\/tr>\n<tr><td>Pagne<\/td><td>Balle de 6 pièces de 6 yards<\/td><td>Pièce ou yard<\/td><td>1 pièce = 6 yards ; 1 balle = 36 yards<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Les conditionnements varient selon le fabricant : vérifiez toujours sur l'emballage combien d'unités contient un carton ou un casier.<\/p>\n<h4>Calcul pas à pas<\/h4>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépôt de boissons à Goma. Le stock initial du lundi est de 8 cartons de jus (1 carton = 12 bouteilles). Mercredi, il reçoit 15 cartons. Pendant la semaine, il vend 98 bouteilles.\n<ol>\n<li>Stock initial : 8 × 12 = 96 bouteilles.<\/li>\n<li>Entrée : 15 × 12 = 180 bouteilles.<\/li>\n<li>Total disponible : 96 + 180 = 276 bouteilles.<\/li>\n<li>Stock final : 276 − 98 = <b>178 bouteilles<\/b>.<\/li>\n<li>En cartons : 178 ÷ 12 = 14 cartons et il reste 10 bouteilles (14 × 12 = 168 ; 178 − 168 = 10).<\/li>\n<\/ol><\/div>\n<h4>Autre conversion utile : la vente au détail<\/h4>\n<p>Une vendeuse achète un sac de farine de 25 kg à 32 000 FC et le revend au kilo. Le coût d'un kilo est 32 000 ÷ 25 = 1 280 FC. Si elle vend le kilo à 1 600 FC, elle gagne 320 FC par kilo, soit 25 × 320 = 8 000 FC par sac, <b>à condition de ne rien perdre en pesant<\/b>. Si 1 kg se perd (poussière, sac percé), il reste 24 kg à vendre : 24 × 1 600 = 38 400 FC au lieu de 40 000 FC.<\/p>\n<h4>Bonnes habitudes<\/h4>\n<ul>\n<li>Un <b>code ou nom unique<\/b> par produit (pas « huile », « huile 1 L », « Huile 1l » pour le même article).<\/li>\n<li>Noter le mouvement <b>au moment où il se passe<\/b>, pas en fin de semaine de mémoire.<\/li>\n<li>Un seul responsable de la fiche, un autre qui vérifie.<\/li>\n<li>Ne jamais corriger en effaçant : on ajoute une ligne de correction avec explication.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Stock final = stock initial + entrées − sorties. Tout mouvement (même la casse) est noté avec sa pièce. Comptez dans la plus petite unité vendue et convertissez les cartons, casiers et sacs avant d'additionner.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Additionner des cartons avec des bouteilles est l'erreur la plus fréquente. Convertissez d'abord, additionnez ensuite.<\/div>\n","quiz":[{"q":"Stock initial : 120 pièces. Entrées : 80. Sorties : 150. Quel est le stock final ?","o":["350","50","110","90"],"a":1,"e":"120 + 80 − 150 = 50."},{"q":"1 carton = 12 bouteilles. Vous avez 7 cartons et 5 bouteilles. Combien de bouteilles ?","o":["89","84","75","60"],"a":2,"e":"7 × 12 = 84 ; 84 + 5 = 89."},{"q":"Lequel de ces mouvements doit aussi être noté comme une sortie de stock ?","o":["Les ventes, la casse, les produits périmés et les dons","Seulement les produits payés comptant","Aucun, la casse est une perte non enregistrée","Seulement les ventes"],"a":3,"e":"Toute sortie, quelle qu'en soit la raison, doit apparaître dans la fiche."},{"q":"Un sac de 50 kg de riz coûte 90 000 FC. Quel est le coût d'un kilo ?","o":["1 500 FC","2 000 FC","1 200 FC","1 800 FC"],"a":0,"e":"90 000 ÷ 50 = 1 800 FC le kilo."}]},{"t":"Chapitre 3 — Prix d'achat, coût de revient, marge, CMUP, FIFO et FEFO","html":"\n<h4>Le prix d'achat n'est pas le vrai coût<\/h4>\n<p>Le prix inscrit sur la facture du fournisseur n'est qu'une partie de ce que la marchandise vous coûte. Pour savoir si vous gagnez de l'argent, calculez le <b>coût de revient<\/b> : tout ce que vous avez payé pour que la marchandise soit <b>dans votre magasin, prête à vendre<\/b>.<\/p>\n<p><b>Coût de revient = prix d'achat + transport + déchargement + autres frais d'approche (emballage, droits ou taxes payés sur l'achat, commission, etc.)<\/b><\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un grossiste de Kananga commande 50 sacs de farine à 28 000 FC le sac auprès d'un fournisseur de Kinshasa.\n<ul>\n<li>Prix d'achat : 50 × 28 000 = 1 400 000 FC<\/li>\n<li>Transport : 150 000 FC<\/li>\n<li>Déchargement et manutention : 50 000 FC<\/li>\n<li>Coût de revient total : 1 400 000 + 150 000 + 50 000 = <b>1 600 000 FC<\/b><\/li>\n<li>Coût de revient unitaire : 1 600 000 ÷ 50 = <b>32 000 FC<\/b> le sac<\/li>\n<\/ul>\nS'il avait vendu à 31 000 FC en croyant que le sac lui coûtait 28 000 FC, il aurait perdu 1 000 FC sur chaque sac.<\/div>\n<h4>La marge : combien je gagne ?<\/h4>\n<p>La <b>marge<\/b> est la différence entre le prix de vente et le coût de revient : <b>marge = prix de vente − coût de revient<\/b>. On l'exprime de deux façons.<\/p>\n<table>\n<thead><tr><th>Mesure<\/th><th>Formule<\/th><th>Avec coût 32 000 FC et vente 40 000 FC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Marge en francs<\/td><td>Prix de vente − coût de revient<\/td><td>8 000 FC<\/td><\/tr>\n<tr><td>Taux de marge (sur le coût)<\/td><td>Marge ÷ coût de revient × 100<\/td><td>8 000 ÷ 32 000 = 25 %<\/td><\/tr>\n<tr><td>Taux de marque (sur la vente)<\/td><td>Marge ÷ prix de vente × 100<\/td><td>8 000 ÷ 40 000 = 20 %<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Ne confondez pas les deux pourcentages. Pour fixer un prix à partir d'un taux de marge de 25 % : prix de vente = coût × 1,25 = 32 000 × 1,25 = 40 000 FC. Et n'oubliez pas que la marge n'est pas le bénéfice : il faut encore payer le loyer, l'électricité, les salaires et les impôts.<\/p>\n<h4>Quand le prix d'achat change : le CMUP<\/h4>\n<p>Vous rachetez le même produit plusieurs fois à des prix différents. Quel coût retenir pour valoriser le stock et calculer vos marges ? La méthode la plus simple est le <b>CMUP<\/b> : <b>Coût Moyen Unitaire Pondéré<\/b>. On fait la moyenne en tenant compte des quantités.<\/p>\n<p><b>CMUP = (valeur du stock existant + valeur de l'achat) ÷ (quantité en stock + quantité achetée)<\/b><\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Il reste 40 sacs de farine achetés à 30 000 FC (valeur 1 200 000 FC). Vous en achetez 60 à 33 000 FC (valeur 1 980 000 FC).\n<ul>\n<li>Valeur totale : 1 200 000 + 1 980 000 = 3 180 000 FC<\/li>\n<li>Quantité totale : 40 + 60 = 100 sacs<\/li>\n<li>CMUP : 3 180 000 ÷ 100 = <b>31 800 FC<\/b> le sac<\/li>\n<\/ul><\/div>\n<p>Ce n'est pas la simple moyenne de 30 000 et 33 000 (31 500), parce que vous avez acheté plus de sacs à 33 000. Le CMUP est recalculé à chaque nouvel achat.<\/p>\n<h4>FIFO : premier entré, premier sorti<\/h4>\n<p><b>FIFO<\/b> (First In, First Out) veut dire que l'on vend d'abord les produits <b>les plus anciens<\/b>. C'est à la fois une règle de rangement (on place les nouveaux produits derrière) et une méthode de valorisation (la sortie prend le prix des lots les plus anciens).<\/p>\n<p>Suite de l'exemple : vous vendez 50 sacs. En FIFO, les 40 premiers sortent à 30 000 FC, les 10 suivants à 33 000 FC : 40 × 30 000 + 10 × 33 000 = 1 200 000 + 330 000 = <b>1 530 000 FC<\/b>. En CMUP : 50 × 31 800 = <b>1 590 000 FC<\/b>. Les deux méthodes donnent des résultats légèrement différents ; choisissez-en une et gardez-la, sans en changer chaque mois.<\/p>\n<h4>FEFO : premier périmé, premier sorti<\/h4>\n<p>Pour les produits qui se périment (lait, yaourt, médicaments, biscuits, huile, conserves), on applique le <b>FEFO<\/b> (First Expired, First Out) : on sort d'abord <b>le produit dont la date de péremption est la plus proche<\/b>, même s'il est arrivé après un autre. Un lot arrivé hier avec une date de péremption en mars passe avant un lot arrivé le mois dernier avec une date en décembre.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Coût de revient = prix d'achat + frais d'approche. Marge = prix de vente − coût de revient ; ne confondez pas taux de marge (sur le coût) et taux de marque (sur la vente). Le CMUP lisse les différences de prix d'achat. FIFO : l'ancien d'abord. FEFO : le plus proche de la péremption d'abord.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Si vous achetez en dollars, le coût de revient en francs dépend du taux du jour de l'achat (le taux d'exemple de 1 $ = 2 300 FC varie). Le traitement fiscal des frais d'approche et des taxes d'achat peut dépendre de votre régime : à vérifier auprès de l'administration compétente ou de votre comptable.<\/div>\n","quiz":[{"q":"Vous achetez 20 cartons à 15 000 FC, avec 40 000 FC de transport. Quel est le coût de revient d'un carton ?","o":["17 000 FC","17 500 FC","15 000 FC","16 000 FC"],"a":2,"e":"Total : 300 000 + 40 000 = 340 000 FC ; 340 000 ÷ 20 = 17 000 FC."},{"q":"Coût de revient 8 000 FC, prix de vente 10 000 FC. Quel est le taux de marge sur le coût ?","o":["30 %","25 %","2 000 %","20 %"],"a":3,"e":"Marge 2 000 FC ; 2 000 ÷ 8 000 = 25 %. (Le taux de marque serait 20 %.)"},{"q":"Stock : 10 pièces à 500 FC. Achat : 30 pièces à 700 FC. Quel est le CMUP ?","o":["650 FC","600 FC","700 FC","550 FC"],"a":0,"e":"(5 000 + 21 000) ÷ 40 = 26 000 ÷ 40 = 650 FC."},{"q":"Un lot de yaourts arrivé lundi expire dans 10 jours ; un lot arrivé la semaine dernière expire dans 40 jours. Lequel vendre en premier ?","o":["Celui qui expire dans 40 jours","Celui arrivé la semaine dernière (FIFO strict)","Peu importe","Celui qui expire dans 10 jours (FEFO)"],"a":1,"e":"Pour les produits périssables, on sort d'abord la date de péremption la plus proche."}]},{"t":"Chapitre 4 — Stock minimum, point de commande, quantité à commander et rotation","html":"\n<h4>Commander au bon moment<\/h4>\n<p>Le plus gros risque de la rupture, c'est de s'apercevoir trop tard qu'il n'y a presque plus rien. Pour l'éviter, on fixe pour chaque produit important des <b>seuils chiffrés<\/b>. Quand le stock atteint le seuil, on commande. Plus besoin de deviner.<\/p>\n<h4>Les notions à connaître<\/h4>\n<ul>\n<li><b>Consommation moyenne<\/b> : combien de pièces vous vendez en moyenne par jour (ou par semaine). On la calcule sur plusieurs semaines : ventes du mois ÷ nombre de jours.<\/li>\n<li><b>Délai d'approvisionnement<\/b> : nombre de jours entre le moment où vous commandez et celui où la marchandise est en magasin et vendable.<\/li>\n<li><b>Stock de sécurité<\/b> : une réserve en plus pour couvrir les surprises (retard du fournisseur, vente plus forte que d'habitude).<\/li>\n<li><b>Point de commande<\/b> (ou seuil d'alerte) : le niveau de stock auquel on doit passer commande.<\/li>\n<li><b>Stock maximum<\/b> : le niveau à ne pas dépasser pour éviter le surstock.<\/li>\n<\/ul>\n<h4>Les formules<\/h4>\n<p><b>Point de commande = consommation par jour × délai en jours + stock de sécurité<\/b><\/p>\n<p><b>Quantité à commander = stock maximum − stock actuel − commandes déjà en route<\/b><\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un grossiste de Mbuji-Mayi vend en moyenne 8 sacs de farine par jour. Son fournisseur met 5 jours à livrer. Il veut une sécurité de 2 jours de vente.\n<ul>\n<li>Consommation pendant le délai : 8 × 5 = 40 sacs<\/li>\n<li>Stock de sécurité : 8 × 2 = 16 sacs<\/li>\n<li>Point de commande : 40 + 16 = <b>56 sacs<\/b><\/li>\n<\/ul>\nIl décide de ne pas dépasser 22 jours de vente en magasin : stock maximum = 8 × 22 = 176 sacs. Quand le stock tombe à 56 sacs et qu'aucune commande n'est en route, il commande 176 − 56 = <b>120 sacs<\/b>. Pendant les 5 jours de livraison, il vend 40 sacs : il lui en reste 16 (la sécurité) quand le camion arrive, puis 16 + 120 = 136 sacs après le déchargement.<\/div>\n<h4>Adapter à la réalité<\/h4>\n<table>\n<thead><tr><th>Situation<\/th><th>Réflexe<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fournisseur peu fiable ou route difficile<\/td><td>Augmenter le stock de sécurité<\/td><\/tr>\n<tr><td>Saison forte (fêtes, rentrée scolaire)<\/td><td>Augmenter temporairement la consommation prévue<\/td><\/tr>\n<tr><td>Produit qui se périme vite<\/td><td>Baisser le stock maximum, commander plus souvent en petites quantités<\/td><\/tr>\n<tr><td>Produit cher qui bloque beaucoup d'argent<\/td><td>Stock maximum plus bas<\/td><\/tr>\n<tr><td>Produit à fort impact (le client part s'il manque)<\/td><td>Stock de sécurité plus haut<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>La rotation du stock : le stock tourne-t-il vite ?<\/h4>\n<p>La <b>rotation<\/b> mesure combien de fois, dans l'année, vous avez vendu et remplacé votre stock moyen. Plus elle est élevée, plus votre argent travaille.<\/p>\n<p><b>Rotation = coût des marchandises vendues sur l'année ÷ stock moyen<\/b> (en francs, au coût d'achat) et <b>durée de stockage = 365 ÷ rotation<\/b> (en jours).<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Une pharmacie de quartier à Kinshasa a vendu en un an pour 36 000 000 FC de médicaments (valeur au coût d'achat). Son stock moyen est de 3 000 000 FC.\n<ul>\n<li>Rotation : 36 000 000 ÷ 3 000 000 = <b>12 fois par an<\/b><\/li>\n<li>Durée moyenne de stockage : 365 ÷ 12 ≈ <b>30 jours<\/b><\/li>\n<\/ul>\nSi le stock moyen montait à 6 000 000 FC pour les mêmes ventes, la rotation tomberait à 6 et la durée monterait à environ 61 jours : le double d'argent serait bloqué pour le même chiffre d'affaires.<\/div>\n<h4>Classer ses produits : la méthode ABC<\/h4>\n<p>Tous les produits ne méritent pas la même attention. Classez-les selon l'argent qu'ils rapportent : les <b>produits A<\/b> (peu nombreux, par exemple 20 % des références, qui font environ 80 % des ventes) sont suivis de près et ne doivent jamais manquer ; les <b>produits B<\/b> sont suivis régulièrement ; les <b>produits C<\/b> (nombreux, peu de ventes) sont commandés en petites quantités. Les pourcentages sont une règle pratique, pas une loi exacte.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Point de commande = consommation par jour × délai + stock de sécurité. Quantité à commander = stock maximum − stock actuel − commandes en route. Rotation = coût des ventes ÷ stock moyen. Une rotation faible signale de l'argent bloqué.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ces chiffres reposent sur vos ventes passées. Révisez-les régulièrement : un produit à la mode, un nouveau concurrent ou un changement de saison les rend vite faux.<\/div>\n","quiz":[{"q":"Vous vendez 5 cartons par jour, le délai est de 4 jours, la sécurité est de 10 cartons. Quel est le point de commande ?","o":["30 cartons","10 cartons","40 cartons","20 cartons"],"a":3,"e":"5 × 4 + 10 = 30 cartons."},{"q":"Stock maximum 200 ; stock actuel 60 ; 50 unités déjà commandées et en route. Combien commander ?","o":["140","90","150","110"],"a":0,"e":"200 − 60 − 50 = 90."},{"q":"Coût des ventes annuelles : 24 000 000 FC. Stock moyen : 4 000 000 FC. Quelle est la rotation ?","o":["96 fois par an","6 fois par an","4 fois par an","20 fois par an"],"a":1,"e":"24 000 000 ÷ 4 000 000 = 6."},{"q":"Que faire pour un produit qui se périme vite ?","o":["Commander souvent en petites quantités et appliquer le FEFO","Ne pas surveiller les dates","Acheter très en gros pour avoir un bon prix","Augmenter le stock maximum"],"a":2,"e":"Un produit périssable demande un stock maximum bas et des commandes fréquentes."}]},{"t":"Chapitre 5 — Inventaire physique, écarts, casse, vols et justification","html":"\n<h4>Pourquoi compter ?<\/h4>\n<p>Votre fiche de stock dit ce qui <b>devrait<\/b> être en magasin. L'<b>inventaire physique<\/b> compte ce qui y est <b>réellement<\/b>. La différence entre les deux s'appelle l'<b>écart d'inventaire<\/b>. Sans comptage, vous ne saurez jamais si votre fiche est juste, ni combien d'argent disparaît.<\/p>\n<p><b>Écart = stock compté − stock théorique<\/b>. Un écart négatif est un manque ; un écart positif est un surplus (souvent une vente ou une entrée non notée).<\/p>\n<h4>Les types d'inventaire<\/h4>\n<ul>\n<li><b>Inventaire général<\/b> : on compte tout, en général une à deux fois par an, ou à chaque fin d'exercice. On ferme la boutique le temps du comptage.<\/li>\n<li><b>Inventaire tournant<\/b> : chaque semaine ou chaque mois, on compte quelques produits (d'abord les plus chers et les plus vendus). Sur l'année, tout est compté sans fermer.<\/li>\n<li><b>Comptage surprise<\/b> : un contrôle inattendu sur un produit sensible. Très dissuasif.<\/li>\n<\/ul>\n<h4>Comment bien faire un inventaire<\/h4>\n<ol>\n<li><b>Préparer<\/b> : ranger le magasin, regrouper les produits identiques, arrêter les mouvements pendant le comptage (ou noter ceux en cours).<\/li>\n<li><b>Compter à deux<\/b> : une personne compte, l'autre note. Idéalement, un comptage par quelqu'un qui ne tient pas la fiche.<\/li>\n<li><b>Compter dans la bonne unité<\/b> (voir chapitre 2) et noter aussi les dates de péremption et l'état (abîmé, cassé).<\/li>\n<li><b>Comparer<\/b> avec la fiche, produit par produit.<\/li>\n<li><b>Recompter<\/b> les écarts avant de conclure : la moitié des écarts viennent d'erreurs de comptage ou de rangement.<\/li>\n<li><b>Chercher l'explication<\/b>, puis corriger la fiche par une ligne d'ajustement signée.<\/li>\n<\/ol>\n<h4>Valoriser un écart<\/h4>\n<p>Un écart en nombre n'impressionne personne. Multipliez-le par le <b>coût de revient<\/b> : cela vous donne la perte en francs.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Dépôt de boissons à Lubumbashi. Fiche : 240 bouteilles de soda. Comptage : 231. Écart : 231 − 240 = <b>−9 bouteilles<\/b>. Le coût de revient d'une bouteille est 1 800 FC.\n<ul>\n<li>Perte totale : 9 × 1 800 = 16 200 FC<\/li>\n<li>Casse déclarée et notée dans le cahier : 4 bouteilles = 7 200 FC (justifiée)<\/li>\n<li>Écart non justifié : 5 bouteilles = <b>9 000 FC<\/b><\/li>\n<\/ul>\nLe gérant recompte, vérifie les bons de sortie et retrouve 2 bouteilles données à un livreur sans bon. Reste 3 bouteilles (5 400 FC) non expliquées : il surveille ce produit les semaines suivantes.<\/div>\n<h4>Casse, péremption, vol : trois causes à distinguer<\/h4>\n<table>\n<thead><tr><th>Cause<\/th><th>Comment la reconnaître<\/th><th>Comment la réduire<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Casse (accident)<\/td><td>Débris, emballage abîmé ; la perte est visible et peut être montrée<\/td><td>Rangement stable, manutention soignée, formation du personnel<\/td><\/tr>\n<tr><td>Péremption ou détérioration<\/td><td>Dates dépassées, produits moisis ou rances<\/td><td>FEFO, commandes plus petites, promotion avant la date<\/td><\/tr>\n<tr><td>Vol (client ou employé)<\/td><td>Écarts répétés sans explication, surtout sur les mêmes produits<\/td><td>Contrôles, bons de sortie, séparation des tâches, surveillance<\/td><\/tr>\n<tr><td>Erreurs de gestion<\/td><td>Ventes ou entrées oubliées, mauvaise unité, doublons<\/td><td>Saisie immédiate, pièces justificatives, nom unique par produit<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>La justification : tout écart doit avoir une explication écrite<\/h4>\n<p>Pour chaque perte (casse, péremption), on établit un <b>bon de casse ou de perte<\/b> : date, produit, quantité, valeur, cause, signature de l'employé et du responsable, et si possible une photo ou la présence d'un témoin. On ne jette jamais un produit sans passer par ce bon. C'est la façon de distinguer une vraie casse d'un vol « justifié » après coup.<\/p>\n<h4>Le taux de démarque<\/h4>\n<p>Le <b>taux de démarque inconnue<\/b> mesure la part du stock qui disparaît sans explication : <b>pertes inexpliquées ÷ valeur des ventes (ou du stock) × 100<\/b>. Reprenons : 9 000 FC de pertes inconnues sur 3 000 000 FC de ventes = 0,3 %. Fixez-vous une limite acceptable (par exemple 1 %) et comparez d'un inventaire à l'autre. Si le taux grimpe, cherchez la cause.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Écart = stock compté − stock théorique. Valorisez-le au coût de revient. Comptez à deux, recomptez les écarts, justifiez chaque perte par un bon signé. Casse, péremption, erreurs et vols sont des causes différentes : on ne les corrige pas de la même façon.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Accuser un employé sans preuve est dangereux et injuste. Appuyez-vous sur des faits : écarts répétés, pièces manquantes. En cas de vol avéré, renseignez-vous sur la procédure légale applicable (droit du travail, plainte) auprès d'un conseil compétent.<\/div>\n","quiz":[{"q":"Fiche : 150 pièces. Comptage : 142. Quel est l'écart ?","o":["+8","−8","−142","+292"],"a":0,"e":"142 − 150 = −8 : il manque 8 pièces."},{"q":"L'écart est de −12 pièces ; le coût de revient est 2 500 FC. Quelle est la perte ?","o":["12 500 FC","30 000 FC","25 000 FC","2 500 FC"],"a":1,"e":"12 × 2 500 = 30 000 FC."},{"q":"Quelle est la meilleure façon de traiter des bouteilles cassées ?","o":["Établir un bon de casse signé, puis noter la sortie dans la fiche","Ne rien noter et attendre l'inventaire","Les jeter discrètement","Les ajouter aux ventes"],"a":2,"e":"Un bon signé justifie la perte et évite de la confondre avec un vol."},{"q":"Que faire en premier quand un inventaire révèle un écart important sur un produit ?","o":["Corriger la fiche sans chercher","Recompter le produit et vérifier les pièces (bons, factures)","Ne rien faire","Licencier le magasinier"],"a":3,"e":"Beaucoup d'écarts viennent d'erreurs de comptage ou de saisie ; on vérifie avant de conclure."}]},{"t":"Chapitre 6 — Choisir et comparer ses fournisseurs, négocier, gérer le taux de change","html":"\n<h4>Un bon fournisseur, c'est plus qu'un bon prix<\/h4>\n<p>Votre fournisseur décide d'une grande partie de votre réussite : de la qualité de la marchandise, des délais, de vos ruptures et de votre trésorerie. Le prix le plus bas n'est pas toujours le meilleur choix : un fournisseur 5 % moins cher qui livre en retard et vous fait perdre des ventes peut coûter plus cher.<\/p>\n<h4>Les critères de comparaison<\/h4>\n<ul>\n<li><b>Prix<\/b> d'achat, mais surtout coût de revient livré (chapitre 3).<\/li>\n<li><b>Qualité<\/b> et conformité de la marchandise (produits d'origine, dates, emballage intact).<\/li>\n<li><b>Délai de livraison<\/b> et régularité (arrive-t-il à la date promise ?).<\/li>\n<li><b>Conditions de paiement<\/b> : comptant, acompte, paiement à 15 ou 30 jours.<\/li>\n<li><b>Quantité minimum<\/b> de commande.<\/li>\n<li><b>Disponibilité<\/b> : a-t-il toujours le produit en stock ?<\/li>\n<li><b>Services<\/b> : reprise des produits défectueux, remplacement, conseils, facture en règle.<\/li>\n<li><b>Réputation<\/b> : demandez l'avis d'autres commerçants.<\/li>\n<\/ul>\n<h4>Comparer avec un tableau et des chiffres<\/h4>\n<p>Comparez des coûts <b>livrés<\/b> pour la même quantité. Exemple pour 100 sacs de farine :<\/p>\n<table>\n<thead><tr><th>Critère<\/th><th>Fournisseur A (Kinshasa)<\/th><th>Fournisseur B (import)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Prix par sac<\/td><td>28 000 FC<\/td><td>26 000 FC<\/td><\/tr>\n<tr><td>Transport et frais par sac<\/td><td>4 000 FC<\/td><td>7 000 FC<\/td><\/tr>\n<tr><td>Coût de revient par sac<\/td><td>32 000 FC<\/td><td>33 000 FC<\/td><\/tr>\n<tr><td>Coût pour 100 sacs<\/td><td>3 200 000 FC<\/td><td>3 300 000 FC<\/td><\/tr>\n<tr><td>Délai<\/td><td>2 à 3 jours<\/td><td>14 jours<\/td><\/tr>\n<tr><td>Paiement<\/td><td>30 jours<\/td><td>Comptant à la commande<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Malgré un prix affiché plus bas, B coûte 100 000 FC de plus pour 100 sacs, livre bien plus tard (donc exige un stock de sécurité plus grand) et demande de payer tout de suite. A est plus avantageux ici, sauf si B offre une qualité nettement supérieure ou une autre raison de le choisir.<\/p>\n<h4>Négocier : un échange, pas une bagarre<\/h4>\n<ol>\n<li><b>Préparez-vous<\/b> : connaissez vos besoins, vos volumes, les prix des concurrents.<\/li>\n<li><b>Demandez des offres écrites<\/b> à au moins deux ou trois fournisseurs.<\/li>\n<li><b>Négociez plusieurs choses<\/b> : prix, remise de quantité, délai de paiement, livraison gratuite, reprise des invendus.<\/li>\n<li><b>Proposez en échange<\/b> : commandes régulières, paiement plus rapide, volume plus important.<\/li>\n<li><b>Mettez tout par écrit<\/b> : bon de commande, facture, accord sur les délais.<\/li>\n<li><b>Gardez une porte ouverte<\/b> : ne dépendez pas d'un seul fournisseur pour un produit essentiel.<\/li>\n<\/ol>\n<div class=\"ex\"><p><b>Exemple en RDC.<\/b> Dialogue-type à Kinshasa.<\/p>\n<p>Commerçant : « Je commande 100 sacs chaque mois. Votre prix est 28 000 FC. Un autre fournisseur me propose 27 200 FC. »<\/p>\n<p>Fournisseur : « Je peux faire 27 500 FC si vous payez à la livraison. »<\/p>\n<p>Commerçant : « D'accord pour 27 500 FC et paiement à la livraison, si vous livrez chez moi sans frais. »<\/p>\n<p>Calcul : économie de 500 FC × 100 sacs = 50 000 FC par mois, soit 600 000 FC sur l'année, plus le transport évité. Mais le commerçant vérifie qu'il a la trésorerie pour payer à la livraison : un paiement à 30 jours lui aurait laissé de la souplesse.<\/p><\/div>\n<h4>Quand le fournisseur facture en dollars : le taux de change<\/h4>\n<p>Beaucoup de fournisseurs fixent leurs prix en dollars américains. Si vous vendez en francs congolais, <b>le taux de change fait varier votre coût d'achat<\/b> entre le jour de la commande et le jour du paiement. Dans nos exemples, 1 $ = 2 300 FC ; le taux réel varie et peut être différent selon le lieu et le moment.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Une facture de 1 000 $ est émise au taux de 2 300 FC, soit 2 300 000 FC. Au paiement, le taux est de 2 350 FC : vous devez 2 350 000 FC, soit <b>50 000 FC de plus<\/b> (environ 2,2 %). Si votre marge était de 10 %, cette variation en consomme déjà plus d'un cinquième.<\/div>\n<h4>Comment se protéger<\/h4>\n<ul>\n<li>Calculez votre coût de revient au <b>taux du jour du paiement<\/b> ou à un taux prudent, jamais à un vieux taux.<\/li>\n<li>Gardez une <b>petite marge de sécurité<\/b> dans vos prix de vente quand la monnaie bouge.<\/li>\n<li>Réduisez l'écart entre commande et paiement : payer plus tôt gèle le taux, mais pensez à votre trésorerie.<\/li>\n<li>Si possible, <b>vendez en la même monnaie que vous achetez<\/b> (affichez un prix en dollars quand vos coûts le sont) ou gardez une partie de vos recettes en dollars pour payer vos factures en dollars.<\/li>\n<li>Mettez à jour vos prix dès que le taux bouge de façon importante.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Comparez les fournisseurs sur le coût de revient livré, la qualité, le délai, le paiement et la fiabilité, pas sur le seul prix affiché. Négociez avec des offres écrites et des contreparties. Quand le fournisseur facture en dollars, calculez votre coût au taux du jour du paiement et prévoyez une marge de sécurité.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Pour les marchandises importées (droits de douane, taxes, formalités, obligations de change), les règles et taux changent : renseignez-vous auprès de l'administration compétente, d'un transitaire ou de votre comptable avant d'importer. Ce cours ne donne aucun taux officiel.<\/div>\n","quiz":[{"q":"Fournisseur X : 9 000 FC + 1 500 FC de frais par pièce. Fournisseur Y : 9 800 FC + 300 FC de frais. Lequel est le moins cher livré ?","o":["X, 10 500 FC contre 10 100 FC","Y, 10 100 FC contre 10 500 FC","X, car son prix affiché est plus bas","Ils coûtent pareil"],"a":1,"e":"X : 10 500 FC ; Y : 10 100 FC. On compare le coût livré, pas le prix affiché."},{"q":"Que faut-il demander pour bien comparer deux fournisseurs ?","o":["Des offres écrites avec prix, délai, conditions de paiement et frais de livraison","Un cadeau personnel","Seulement le prix le plus bas","Uniquement le nom du patron"],"a":2,"e":"Une comparaison sérieuse se fait sur des offres écrites et complètes."},{"q":"Facture de 2 000 $ émise à 2 300 FC, payée à 2 360 FC. Quelle est la différence payée en plus ?","o":["120 000 FC","12 000 FC","6 000 FC","60 000 FC"],"a":3,"e":"2 000 × (2 360 − 2 300) = 2 000 × 60 = 120 000 FC."},{"q":"Vous achetez en dollars et vendez en francs. Quelle précaution est la plus utile ?","o":["Ne jamais mettre à jour ses prix","Calculer le coût au taux du jour du paiement et garder une marge de sécurité","Cacher les factures","Acheter sans compter"],"a":0,"e":"Le taux fait varier le coût de revient : il faut le suivre et prévoir une marge."}]},{"t":"Chapitre 7 — Organisation du magasin, sécurité, indicateurs et KAJIMINYI STOCK PRO","html":"\n<h4>Un magasin bien rangé travaille pour vous<\/h4>\n<p>Un stock parfaitement calculé sur le papier ne sert à rien si on ne retrouve rien dans le magasin. L'organisation physique évite les pertes de temps, les erreurs de livraison, la casse et les vols.<\/p>\n<h4>Les règles de rangement<\/h4>\n<ul>\n<li><b>Une place pour chaque produit<\/b>, et chaque produit à sa place. Repérez les rayons ou emplacements par des lettres et numéros (A1, A2, B1...).<\/li>\n<li><b>Étiqueter<\/b> chaque emplacement avec le nom du produit.<\/li>\n<li><b>Regrouper<\/b> les produits de la même famille et séparer ce qui ne doit pas être mélangé (produits alimentaires, produits chimiques, carburant, savon parfumé).<\/li>\n<li><b>Lourd en bas, léger en haut<\/b> ; les produits qui se vendent vite près de la sortie ou à portée de main.<\/li>\n<li><b>FIFO et FEFO en pratique<\/b> : les nouveaux produits derrière, les anciens devant, dates visibles.<\/li>\n<li><b>Palettes ou planches<\/b> sous les sacs : on ne pose pas la marchandise directement au sol, à cause de l'humidité.<\/li>\n<li><b>Zone à part<\/b> pour les produits cassés, périmés ou à retourner, pour éviter qu'ils soient revendus par erreur.<\/li>\n<\/ul>\n<h4>Sécurité du magasin<\/h4>\n<ul>\n<li><b>Accès limité<\/b> : une clé, une personne responsable, un cahier des entrées de personnes autorisées.<\/li>\n<li><b>Séparer les tâches<\/b> : celui qui reçoit la marchandise n'est pas le seul à la compter et à tenir la caisse.<\/li>\n<li><b>Aucune sortie sans pièce<\/b> : bon de sortie ou ticket de vente.<\/li>\n<li><b>Protection contre le feu, l'eau, les rongeurs et les insectes<\/b> : extincteur, toiture en bon état, propreté, produits rangés loin des murs.<\/li>\n<li><b>Verrous solides, éclairage, et si possible caméras ou gardiennage<\/b> pour les produits de valeur (téléphones, médicaments, pièces détachées).<\/li>\n<li>Si vous le pouvez, une <b>assurance<\/b> contre l'incendie et le vol ; renseignez-vous sur les offres disponibles.<\/li>\n<\/ul>\n<h4>Les indicateurs à suivre chaque mois<\/h4>\n<table>\n<thead><tr><th>Indicateur<\/th><th>Formule<\/th><th>Exemple<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Valeur du stock<\/td><td>Somme (quantité × coût de revient)<\/td><td>3 000 000 FC<\/td><\/tr>\n<tr><td>Rotation<\/td><td>Coût des ventes annuelles ÷ stock moyen<\/td><td>12 fois par an<\/td><\/tr>\n<tr><td>Taux de rupture<\/td><td>Nombre de jours en rupture ÷ jours d'ouverture × 100<\/td><td>3 jours sur 30 = 10 %<\/td><\/tr>\n<tr><td>Produits dormants<\/td><td>Produits sans vente depuis 3 mois ou plus<\/td><td>12 références, 450 000 FC<\/td><\/tr>\n<tr><td>Taux de casse et de péremption<\/td><td>Valeur perdue ÷ valeur des achats × 100<\/td><td>60 000 ÷ 4 000 000 = 1,5 %<\/td><\/tr>\n<tr><td>Écarts d'inventaire<\/td><td>Valeur des écarts inexpliqués<\/td><td>9 000 FC<\/td><\/tr>\n<tr><td>Marge brute<\/td><td>Ventes − coût des marchandises vendues<\/td><td>1 200 000 FC<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Utiliser KAJIMINYI STOCK PRO pour appliquer tout cela<\/h4>\n<p>Tout ce que nous avons vu se fait à la main, mais c'est long et on se trompe. L'application KAJIMINYI STOCK PRO sert à tenir cette gestion de façon régulière. Voici comment elle correspond aux chapitres du cours (les noms exacts des écrans peuvent varier selon votre version).<\/p>\n<ol>\n<li><b>Fiche produit<\/b> : créez chaque produit avec un nom unique, son unité de vente, son conditionnement (carton = 12 bouteilles), son prix d'achat et son prix de vente. (Chapitres 2 et 3)<\/li>\n<li><b>Entrées et achats<\/b> : enregistrez chaque livraison avec le fournisseur, les quantités, le prix et les frais de transport pour obtenir le bon coût de revient. (Chapitres 3 et 6)<\/li>\n<li><b>Ventes et sorties<\/b> : chaque vente fait baisser le stock automatiquement ; la casse et les pertes sont notées comme sorties avec un motif. (Chapitres 2 et 5)<\/li>\n<li><b>Seuils d'alerte<\/b> : renseignez le stock minimum (point de commande) de vos produits principaux, afin d'être prévenu avant la rupture. (Chapitre 4)<\/li>\n<li><b>Inventaire<\/b> : saisissez vos quantités comptées, comparez-les au stock théorique et enregistrez les ajustements justifiés. (Chapitre 5)<\/li>\n<li><b>Fournisseurs et taux de change<\/b> : gardez la liste de vos fournisseurs, leurs prix et conditions, et mettez à jour le taux utilisé pour vos achats en dollars. (Chapitre 6)<\/li>\n<li><b>Rapports<\/b> : consultez la valeur du stock, les produits dormants, les meilleures ventes et les marges. (Chapitre 7)<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mado, de Kinshasa, enregistre chaque matin les livraisons et chaque soir les ventes. Le lundi, elle regarde la liste des produits sous le seuil d'alerte et prépare ses commandes. Le premier samedi du mois, elle compte 20 produits (inventaire tournant) et compare avec l'application : un écart de −3 sacs de farine apparaît ; elle retrouve un bon de sortie non saisi. Elle corrige. Le dernier jour du mois, elle regarde la valeur du stock et la liste des produits dormants pour décider des promotions.<\/div>\n<h4>Une routine simple<\/h4>\n<ul>\n<li><b>Chaque jour<\/b> : saisir entrées et ventes, ranger, noter la casse.<\/li>\n<li><b>Chaque semaine<\/b> : vérifier les alertes, commander, compter quelques produits.<\/li>\n<li><b>Chaque mois<\/b> : regarder les indicateurs, traiter les produits dormants, relancer les fournisseurs, mettre à jour les prix et le taux.<\/li>\n<li><b>Chaque année<\/b> : inventaire général et révision des seuils.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Un magasin rangé, fermé et contrôlé protège votre argent. Suivez quelques indicateurs chaque mois. L'application ne remplace pas votre jugement, mais elle garde la mémoire fidèle de votre stock, vous alerte et fait les calculs : elle n'est fiable que si vous y saisissez chaque mouvement le jour même.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les données de l'application valent ce que vous y saisissez. Sauvegardez régulièrement vos données et protégez les accès par des mots de passe personnels.<\/div>\n","quiz":[{"q":"Où ranger les nouveaux arrivages de produits périssables ?","o":["Derrière les anciens, avec les dates visibles","Sur le sol","Devant les anciens","Dans la zone des produits cassés"],"a":2,"e":"Les anciens (ou ceux qui expirent d'abord) restent devant pour sortir en premier."},{"q":"Un magasin a été ouvert 26 jours dans le mois et le produit principal a manqué 2 jours. Quel est le taux de rupture, arrondi ?","o":["13 %","8 %","26 %","2 %"],"a":3,"e":"2 ÷ 26 × 100 = 7,7 %, soit environ 8 %."},{"q":"Lequel est un bon principe de sécurité du magasin ?","o":["Tout le monde a une clé","Aucune sortie sans pièce justificative et tâches séparées","Laisser la porte ouverte pendant la journée","Ne jamais compter"],"a":0,"e":"Pièces justificatives et séparation des tâches limitent les vols et les erreurs."},{"q":"Pour quoi utilise-t-on le seuil d'alerte dans l'application ?","o":["Pour changer le prix des produits","Pour être prévenu quand un produit atteint son point de commande","Pour supprimer les ventes","Pour calculer l'impôt"],"a":1,"e":"Le seuil d'alerte signale qu'il faut commander avant la rupture."}]}],"exam":[{"q":"Quelle est la conséquence principale d'une rupture de stock ?","o":["Un meilleur prix d'achat","Des ventes et parfois des clients perdus","Plus d'argent disponible","Moins de travail sans effet"],"a":1,"e":"La rupture fait perdre la marge de la vente manquée et risque de faire partir le client."},{"q":"Une boutique vend 10 sacs par jour avec 3 000 FC de marge. Elle est en rupture 3 jours. Quel est le manque à gagner ?","o":["90 000 FC","9 000 FC","30 000 FC","300 000 FC"],"a":2,"e":"10 × 3 = 30 sacs ; 30 × 3 000 = 90 000 FC."},{"q":"Stock initial : 5 cartons de 12 bouteilles. Entrée : 10 cartons. Ventes : 70 bouteilles. Quel est le stock final en bouteilles ?","o":["180","50","130","110"],"a":3,"e":"(5 + 10) × 12 = 180 ; 180 − 70 = 110."},{"q":"Vous achetez 40 sacs à 25 000 FC avec 120 000 FC de transport. Quel est le coût de revient d'un sac ?","o":["25 000 FC","28 000 FC","30 000 FC","26 000 FC"],"a":0,"e":"40 × 25 000 = 1 000 000 ; + 120 000 = 1 120 000 ; ÷ 40 = 28 000 FC. Attention : la bonne réponse est 28 000 FC."},{"q":"Stock : 20 pièces à 1 000 FC. Achat : 30 pièces à 1 200 FC. Quel est le CMUP ?","o":["1 120 FC","1 100 FC","1 200 FC","1 000 FC"],"a":1,"e":"(20 000 + 36 000) ÷ 50 = 56 000 ÷ 50 = 1 120 FC."},{"q":"Quelle méthode faut-il suivre pour des médicaments ou des yaourts avec des dates différentes ?","o":["FEFO : la date de péremption la plus proche sort d'abord","Vendre le plus récent d'abord","FIFO strict, sans regarder les dates","Peu importe"],"a":2,"e":"FEFO protège de la péremption."},{"q":"Consommation 6 par jour, délai 7 jours, sécurité 12. Quel est le point de commande ?","o":["54","48","19","42"],"a":3,"e":"6 × 7 + 12 = 54."},{"q":"Ventes au coût d'achat : 18 000 000 FC par an ; stock moyen : 1 500 000 FC. Quelle est la durée moyenne de stockage ?","o":["12 jours","30 jours environ","60 jours","365 jours"],"a":0,"e":"Rotation = 12 ; 365 ÷ 12 ≈ 30 jours."},{"q":"Fiche : 80 bouteilles ; comptage : 74 ; coût de revient 2 000 FC. Quelle est la perte à justifier ?","o":["12 000 FC","6 000 FC","148 000 FC","160 000 FC"],"a":1,"e":"Écart de −6 ; 6 × 2 000 = 12 000 FC."},{"q":"Facture de 500 $ à 2 300 FC, payée quand le taux est 2 340 FC. Quelle différence ?","o":["20 000 FC","2 000 FC","40 000 FC","11 700 FC"],"a":2,"e":"500 × 40 = 20 000 FC. Attention : la bonne réponse est 20 000 FC."},{"q":"Pour comparer deux fournisseurs, que faut-il faire ?","o":["Comparer le coût livré, le délai, la qualité et les conditions de paiement","Choisir le plus proche sans calcul","Prendre toujours le plus connu","Regarder uniquement le prix affiché"],"a":3,"e":"Une bonne comparaison est complète et chiffrée."},{"q":"Parmi ces mesures, laquelle protège le mieux le magasin contre les vols internes ?","o":["Donner la clé à tous","Aucune sortie sans pièce et séparation des tâches","Éviter de compter pour ne pas fâcher","Ranger sans étiquettes"],"a":0,"e":"Les contrôles et la séparation des tâches réduisent les risques."}]}]</script>

function rangeFor(p, ref = new Date()) {

function buckets(p) {

function resizeImage(file, max = 240) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
// Pièce jointe (photo compressée ou PDF/document ≤ 600 Ko) stockée dans le document Firestore
async function readAttach(file) {
  if (!file) return null;
  if (file.type.startsWith('image/')) return { data: await resizeImage(file, 900), name: file.name, type: 'image/jpeg' };
  if (file.size > 600 * 1024) throw new Error('Fichier trop lourd (600 Ko maximum). Utilisez une photo ou un PDF léger.');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  return { data, name: file.name, type: file.type };
}

let actx;
const SEQ = { ok: [[880, .1], [1175, .16]], err: [[440, .2], [330, .2], [440, .2], [330, .32]], msg: [[784, .1], [988, .1], [1318, .24]], alarm: [[950, .26], [700, .26], [950, .26], [700, .26], [950, .26], [700, .3]] };
function sound(kind = 'ok') {
  if (S.settings.sound === false) return;
  try {
    actx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const vol = Math.min(1, Math.max(0.05, +S.settings.vol || 1)); let t = actx.currentTime;
    (SEQ[kind] || SEQ.ok).forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain(); o.type = kind === 'err' || kind === 'alarm' ? 'square' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * 0.7, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.03); t += d;
    });
    if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(kind === 'err' || kind === 'alarm' ? [250, 120, 250] : 60);
  } catch { /* son indisponible */ }
}

function modal(title, html, opts = {}) {

  document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('open'));
  w.close = () => { w.classList.remove('open'); setTimeout(() => { w.remove(); hooks.afterModal(); }, 200); };
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) w.close(); });

}
const formData = f => Object.fromEntries(new FormData(f));
function form(title, html, onSubmit, opts = {}) {
  const w = modal(title, `<form class="frm">${html}<div class="row end"><button type="button" class="btn ghost" data-close>${opts.cancel || 'Annuler'}</button><button class="btn">${opts.ok || 'Enregistrer'}</button></div></form>`, opts);

/* ---------- opérations atomiques (batch) ---------- */
function batch() {
  const b = F.writeBatch(F.db);
  const api = {
    set: (c, id, d) => { auditChg(api, c, id, d); b.set(F.doc(F.db, c, id), d); return api; },
    merge: (c, id, d) => { auditChg(api, c, id, d); b.set(F.doc(F.db, c, id), d, { merge: true }); return api; },
    upd: (c, id, d) => { auditChg(api, c, id, d); b.update(F.doc(F.db, c, id), d); return api; },
    del: (c, id) => { b.delete(F.doc(F.db, c, id)); return api; },
    commit: () => {
      const p = b.commit(); sound('ok');
      S.pend = (S.pend || 0) + 1; window.__net?.(); p.then(() => {}, () => {}).then(() => { S.pend = Math.max(0, S.pend - 1); window.__net?.(); });
      p.catch(e => { console.error(e); logErr('Écriture refusée : ' + (e.code || e.message)); toast(e.code === 'permission-denied' ? "Action non autorisée pour votre profil" : 'Erreur de synchronisation : ' + e.message, 'err'); });
      return p;
    }
  };
  return api;
}

// ---------- Audit : qui a modifié quoi (ancienne et nouvelle valeur) ----------
const AUD_LBL = { name: 'Nom', sell: 'Prix de vente', buy: "Prix d'achat", min: 'Stock minimum', phone: 'Téléphone', limit: 'Plafond de crédit', cat: 'Catégorie', unit: 'Unité', barcode: 'Code-barres', supplierId: 'Fournisseur', rate: 'Taux', address: 'Adresse', note: 'Note', shop: 'Nom du commerce', idle: 'Inactivité (min)', mainCur: 'Devise principale', maxDisc: 'Remise maximale (%)', footer: 'Pied de reçu' };
const AUD_COL = { clients: 'Client', suppliers: 'Fournisseur' }; // les produits ont déjà leur propre journal détaillé
const AUD_MONEY = ['sell', 'buy', 'limit'], AUD_SKIP = ['qty', 'debt', 'spent', 'bought', 'ts', 'id', 'updated', 'lastBak', 'lastBakBy', 'cgu', 'lastLogin', 'units', 'photo', 'img'];
function auditChg(api, c, id, d) {
  try {
    let old, label;
    if (c === 'meta' && id === 'settings') { old = S.settings; label = 'Paramètres'; }
    else if (AUD_COL[c]) { old = (S[c] || []).find(x => x.id === id); if (!old) return; label = AUD_COL[c] + ' « ' + (d.name ?? old.name ?? id) + ' »'; }
    else return;
    if (!d || !old) return;
    const chg = [];
    for (const k in d) {
      const n = d[k], o = old[k];
      if (AUD_SKIP.includes(k) || /key|token|secret|pass/i.test(k) || n === undefined || (typeof n === 'object' && n !== null) || typeof n === 'function') continue;
      if (String(o ?? '') === String(n ?? '')) continue;
      const fmt = v => v === undefined || v === '' || v === null ? '(vide)' : AUD_MONEY.includes(k) && typeof v === 'number' ? usd(v) : String(v).slice(0, 80);
      chg.push({ f: AUD_LBL[k] || k, o: fmt(o), n: fmt(n) });
    }
    if (!chg.length) return;
    const jid = jr(api, 'Modification', label + ' — ' + chg.map(x => `${x.f} : ${x.o} → ${x.n}`).join(' ; ').slice(0, 480), null, '', '', id);
    api.merge('journal', jid, { chg });
  } catch (e) { console.warn('audit', e); }
}

function reportErr(msg, stack) {
  try {

    if (!msg || /ResizeObserver|Script error|Non-Error promise|Load failed|NetworkError|AbortError/i.test(msg) || ERR_SEEN.has(msg) || ERR_SEEN.size >= 12 || !S.user || !S.me) return;

    b.set(F.doc(F.db, 'errors', id), { id, ts: Date.now(), day: dayKey(), user: who(), email: S.user.email, route: S.route || '', msg, stack: String(stack || '').slice(0, 600), ua: navigator.userAgent.slice(0, 160), v: 'v7' });
    b.commit().catch(() => {});
  } catch { /* */ }
}

// ======================= LOTS 2-4 : aides communes =======================
const mainU = v => S.settings.mainCur === 'USD' ? v : v * S.settings.rate;
const TIER_LBL = { detail: 'Détaillant', gros: 'Grossiste', fidele: 'Client fidèle', vip: 'Client VIP' };
const TP = () => ({ gros: 5, fidele: 2, vip: 5, ...(S.settings.tp || {}) });
const TM = () => S.settings.tm || { fidele: S.settings.mainCur === 'USD' ? 200 : 500000, vip: S.settings.mainCur === 'USD' ? 800 : 2000000 };
function tierOf(c) { if (!c) return 'detail'; if (c.tier && c.tier !== 'auto') return c.tier; const sp = mainU(c.spent || 0), m = TM(); return sp >= num(m.vip) ? 'vip' : sp >= num(m.fidele) ? 'fidele' : 'detail'; }
const tierPct = c => c ? (num(TP()[tierOf(c)]) || 0) : 0;
const promoActive = () => (S.settings.promos || []).filter(p => p.from <= dayKey() && dayKey() <= p.to);
function autoDisc(L, client) {
  const pr = promoActive(), names = []; let promo = 0;
  L.forEach(x => { const m = pr.filter(p => !p.pid || p.pid === x.p.id); if (m.length) { const best = m.reduce((a, b) => b.pct > a.pct ? b : a); promo += x.sub * best.pct / 100; names.push(`${best.name} −${best.pct}%`); } });
  const sub = sum(L, x => x.sub), tp = tierPct(client), tierAmt = (sub - promo) * tp / 100;
  const lab = [...new Set(names)].join(', ') + (tp ? (names.length ? ' ; ' : '') + `${TIER_LBL[tierOf(client)]} −${tp}%` : '');
  return { amt: r2(promo + tierAmt), label: lab };
}
// vérification des reçus (QR)
const vhash = str => { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(6, '0').slice(-6); };

  const D7 = Date.now() - 7 * 864e5, ss = zok().filter(s => s.ts >= D7), prof = s => s.profit ?? (s.total - s.cost), rev = sum(ss, s => s.total), gross = sum(ss, prof), ex = sum(S.expenses.filter(e => e.ts >= D7), zExpU);
  const agg = {}; ss.forEach(s => s.items.forEach(i => { const a = agg[i.name] ??= 0; agg[i.name] = a + i.price * i.qty; })); const top = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const low = S.products.filter(p => stockState(p) !== 'ok' && stockState(p) !== undefined && ['rupture', 'faible'].includes(stockState(p))).length;
  return `📊 *Rapport hebdomadaire — ${S.settings.shop}*\nDu ${fmtDate(D7).slice(0, 10)} au ${fmtDate(Date.now()).slice(0, 10)}\n\n💰 Ventes : ${usd(rev)} (${ss.filter(s => !s.isReturn).length} vente(s))\n📈 Bénéfice brut : ${usd(gross)}\n💸 Dépenses : ${usd(ex)}\n✅ Bénéfice net : ${usd(gross - ex)}\n\n🏆 Top produits : ${top.map(([n, v]) => n + ' (' + usd(v) + ')').join(', ') || '—'}\n⚠️ Produits en rupture / stock faible : ${low}\n👥 Dettes clients : ${usd(sum(S.clients, c => Math.max(0, c.debt || 0)))}\n🏭 Dettes fournisseurs : ${usd(sum(S.suppliers, c => Math.max(0, c.debt || 0)))}\n\nEnvoyé depuis KAJIMINYI STOCK PRO`;
};
A.weekly = () => {

  const w = modal('📨 Rapport hebdomadaire', `<textarea readonly rows="14" style="width:100%;font-size:.85rem">${esc(t)}</textarea><div class="col" style="gap:8px;margin-top:8px"><button class="btn green" id="wwa">💬 WhatsApp${st.ownerPhone ? ' au propriétaire' : ''}</button><button class="btn ghost" id="wml">✉️ E-mail${st.ownerEmail ? ' au propriétaire' : ''}</button><button class="btn ghost" id="wsh">↗ Partager…</button></div>${st.ownerPhone || st.ownerEmail ? '' : '<p class="muted sm">Astuce : enregistrez le téléphone/e-mail du propriétaire dans Paramètres → Commercial.</p>'}`);

    code = String(code || '').trim().toUpperCase(); const i = code.lastIndexOf('-'), no = code.slice(0, i), s = S.sales.find(x => x.no.toUpperCase() === no);
    if (!s) return `<div class="totbox"><b class="neg">❌ Reçu introuvable</b><br>Aucune vente ne porte ce numéro. Le reçu est probablement faux.</div>`;

const tgOn = () => { const s = S.settings; return !!(s.tgToken && s.tgChat && s.tgOff !== true); };
const tgEv = k => (S.settings.tgEv ? S.settings.tgEv[k] !== false : true);
async function tgPost(text, token = S.settings.tgToken, chat = S.settings.tgChat) {
  const r = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: String(chat).trim(), text: String(text).slice(0, 3900) }) });
  const j = await r.json().catch(() => ({})); if (!r.ok || !j.ok) throw new Error(j.description || ('Telegram ' + r.status)); return j;
}
const tgQ = () => { try { return JSON.parse(localStorage.getItem('ksp_tgq') || '[]'); } catch { return []; } };
const tgQset = q => { try { localStorage.setItem('ksp_tgq', JSON.stringify(q.slice(-30))); } catch { /* */ } };
async function tgFlush() { if (!tgOn() || !navigator.onLine) return; let q = tgQ(); if (!q.length) return; const left = []; for (const m of q) { if (Date.now() - m.t > 864e5) continue; try { await tgPost(m.x); } catch { left.push(m); } } tgQset(left); }
function tgNotify(kind, text) {
  try { if (!tgOn() || !tgEv(kind)) return; const full = `🏪 ${S.settings.shop || 'KAJIMINYI'}\n${text}\n👤 ${who()} · ${fmtDate(Date.now())}`;
    tgPost(full).catch(() => { const q = tgQ(); q.push({ t: Date.now(), x: full }); tgQset(q); }); } catch { /* jamais bloquant */ }
}
window.addEventListener('online', () => setTimeout(tgFlush, 1500)); setTimeout(tgFlush, 12000);
function tgSale(s, need) {
  if (!tgOn()) return;
  const big = num(S.settings.tgBig) || 100; if (s.total >= big && tgEv('sale')) tgNotify('sale', `💰 Grosse vente ${s.no} : ${fmAt(s.total, s.rate)}${s.clientName ? '\nClient : ' + s.clientName : ''}`);
  for (const pid in need) { const p = S.products.find(x => x.id === pid); if (!p) continue; const left = r2((p.qty || 0) - need[pid]);
    if (left <= 0) tgNotify('stock', `🚨 RUPTURE : ${p.name} (stock 0)`); else if (p.min > 0 && left <= p.min && (p.qty || 0) > p.min) tgNotify('stock', `⚠️ Stock faible : ${p.name} — reste ${left} ${p.unit} (minimum ${p.min})`); }
}
