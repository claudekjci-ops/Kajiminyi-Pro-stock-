// Suppression définitive de collections entières (administrateur). Lit le serveur, puis supprime par paquets de 400.
async function purgeCols(cols, onProgress) {
  let n = 0;
  for (const c of cols) {
    const snap = await F.getDocs(F.collection(F.db, c)), docs = snap.docs;
    for (let i = 0; i < docs.length; i += 400) {
      const b = F.writeBatch(F.db); docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
      await b.commit(); n += Math.min(400, docs.length - i); onProgress?.(c, n);
    }
  }
  return n;
}
const who = () => S.me?.name || S.user?.email || '';
function jr(b, type, desc, amt = null, cur = '', cat = '', ref = '') {
  const id = uid(), ts = Date.now();
  b.set('journal', id, { id, ts, day: dayKey(ts), uid: S.user.uid, user: who(), email: S.user.email, type, desc, amt, cur, cat, ref });
  return id;
}
// cur = compte de caisse (CDF, USD, MMC, MM, BANK) ; amt dans la devise native du compte
function cashop(b, kind, cur, amt, desc, ref = '', ts = Date.now(), extra = {}) {
  const id = uid(), a = nat(cur) === 'CDF' ? Math.round(amt) : r00(amt);
  b.set('cashops', id, { id, ts, day: dayKey(ts), kind, cur, amt: a, rate: S.settings.rate, rateDate: S.settings.rateDate || '', desc, ref, user: who(), sid: curSession()?.id || '', ...extra });
}

function subscribe(onChange) {
  let t; const fire = () => { clearTimeout(t); t = setTimeout(onChange, 60); }; const un = [];

// code scanné ou saisi : produit trouvé (formats normalisés) → panier ; code d'emballage proche → confirmation ; inconnu → association / création rapide
function addByCode(code) {
  const p = findByCode(code);
  if (p) { A.addcart({ id: p.id }); return; }
  const alt = codeMatches(code).find(m => m.lvl === 2);
  const unknown = () => hooks.unknownCode(code, q => { sq = ''; A.addcart({ id: q.id }); });
  if (alt) { confirmBox(`Ce code ressemble à un emballage ou lot de <b>${esc(alt.p.name)}</b>. Ajouter ce produit à la vente ?`, 'Ajouter').then(ok => { if (ok) A.addcart({ id: alt.p.id }); else unknown(); }); return; }
  unknown();
}

// sépare « Jean, 0990000000 » en nom + téléphone
function parsePassant(s) {
  const m = String(s || '').match(/\+?\d[\d\s.\-]{6,}\d/); if (!m) return { name: String(s || '').trim(), phone: '' };
  const digits = m[0].replace(/\D/g, ''), name = String(s).replace(m[0], ' ').replace(/[,;|/:–—-]+/g, ' ').replace(/\s+/g, ' ').trim();
  return { name: /[A-Za-zÀ-ÿ]{2}/.test(name) ? name : '', phone: digits.length >= 8 && digits.length <= 15 ? m[0].replace(/[\s.\-]+/g, ' ').trim() : '' };
}
function checkout(w) {
  const L = cartLines(); if (!L.length) throw new Error('Panier vide');
  L.forEach(x => { if (!sellable(x.p)) throw new Error(`« ${x.p.name} » ne peut pas être vendu (${x.p.suspended ? 'vente suspendue' : 'produit expiré'})`); });
  const need = {}; L.forEach(x => { need[x.p.id] = (need[x.p.id] || 0) + x.qty * x.u.factor; });
  const bonusL = (ck.bonus || []).map(bn => { const p = S.products.find(x => x.id === bn.pid); if (!p) return null; const u = allUnits(p).find(x => x.name === bn.unit) || allUnits(p)[0]; return { p, u, qty: num(bn.qty) }; }).filter(x => x && x.qty > 0);
  bonusL.forEach(x => { need[x.p.id] = (need[x.p.id] || 0) + x.qty * x.u.factor; });
  for (const id in need) { const p = S.products.find(q => q.id === id); if (need[id] > p.qty + 1e-9) throw new Error(`Stock insuffisant : ${p.name} (disponible ${fmtQty(p)})`); }
  const t = totals(L), lim = isMgr() ? 100 : S.settings.maxDisc;
  if (num(ck.disc) > lim) throw new Error(`Remise maximale autorisée : ${lim}%`);
  const pay = payAmounts(t.total);
  if (Math.abs(paidUSD(pay) - t.total) > 0.01) throw new Error('Le total des paiements doit être égal au montant à payer');
  if (pay.usd > 0 && !pmAllowed('usd')) throw new Error("Les paiements en espèces USD ne sont pas autorisés");
  let cl = S.clients.find(c => c.id === ck.client); const passant = ck.client === '__passant', pnm = (ck.pname || '').trim().slice(0, 60), pp = passant ? parsePassant(pnm) : null;
  if (pay.credit > 0) {
    if (passant) throw new Error("Un passant ne peut pas acheter à crédit : enregistrez-le d'abord dans vos clients");
    if (!cl) throw new Error('Choisissez un client pour une vente à crédit');
    if (!(cl.limit > 0) || (cl.debt || 0) + pay.credit > cl.limit + 1e-9) throw new Error(`Plafond de crédit dépassé (plafond ${usd(cl.limit || 0)}, dette ${usd(cl.debt || 0)})`);
  }
  if ((pay.usd > 0 || pay.cdf > 0) && !curSession()) throw new Error("Ouvrez la caisse (menu Caisse) avant d'encaisser des espèces");
  const id = uid(), ts = Date.now(), d = new Date(ts);
  let newCl = null;   // passant avec nom + téléphone : fiche client créée (ou fiche existante retrouvée par le téléphone)
  if (pp?.name && pp?.phone) {
    const key = pp.phone.replace(/\D/g, '').slice(-9), ex = S.clients.find(c => String(c.phone || '').replace(/\D/g, '').slice(-9) === key);
    if (ex) cl = ex;
    else { const dc = num(S.settings.defCredit); cl = newCl = { id: uid(), name: pp.name, phone: pp.phone, limit: r2(S.settings.mainCur === 'USD' ? dc : dc / S.settings.rate), debt: 0, spent: t.total, last: ts, ts, createdBy: who(), source: 'passant' }; }
  }
  const no = 'V' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + id.slice(0, 4).toUpperCase();
  const items = L.map(x => ({ pid: x.p.id, name: x.p.name, cat: x.p.cat, unit: x.u.name, factor: x.u.factor, qty: x.qty, price: r2(x.price), cost: r2(x.cost), sup: x.p.supplierId || '' }));
  const cost = r2(sum(L, x => x.cost * x.qty));
  const bonusArr = bonusL.map(x => ({ pid: x.p.id, name: x.p.name, unit: x.u.name, factor: x.u.factor, qty: x.qty, cost: r2(x.p.buy * x.u.factor) })), bonusCost = r2(sum(bonusArr, x => x.cost * x.qty));
  const sale = {
    id, no, ts, day: dayKey(ts), uid: S.user.uid, userName: who(), items, subtotal: r2(t.sub), discount: t.discAmt, discPct: t.disc, total: t.total, ...(t.autoAmt ? { autoDisc: t.autoAmt, autoLabel: t.autoLabel } : {}),
    pay, rate: S.settings.rate, rateDate: S.settings.rateDate || '', mainCur: S.settings.mainCur, due: pay.credit > 0 ? (ck.due || addDays(dayKey(), S.settings.creditDays || 30)) : '',
    clientId: cl?.id || '', clientName: cl?.name || (passant ? 'Passant' + (pnm ? ' — ' + pnm : '') : ''), status: 'ok', cost: r2(cost + bonusCost), profit: r2(t.total - cost - bonusCost), ...(bonusArr.length ? { bonus: bonusArr, bonusCost } : {}), ...(passant && cl ? { clientPhone: cl.phone || '' } : {})
  };
  const b = batch();
  b.set('sales', id, sale);
  for (const pid in need) b.upd('products', pid, { qty: inc(-need[pid]) });
  fefo(b, need);

    ${sel('Fournisseur', 'supplierId', [['', '— Aucun —'], ...S.suppliers.map(s => [s.id, s.name])], p.supplierId || '')}

      ${d.id ? `<p class="muted sm">Stock actuel : <b>${fmtQty(p)}</b>${fmtDec(p) ? ' (≈ ' + fmtDec(p) + ')' : ''}. Pour le corriger, remplissez les deux cases ci-dessous (laissez vide pour ne rien changer).</p>` : '<p class="muted sm">Stock de départ :</p>'}
      <div class="two">${fld('Nombre de grands emballages', 'bigQty', '', 'number', 'min="0" step="any" placeholder="ex. 10"')}${fld('+ pièces en plus (hors emballage)', 'pcsQty', '', 'number', 'min="0" step="any" placeholder="ex. 0"')}</div>

    async (v, w, f) => {

      const bcode = cleanCode(v.barcode), dup = bcode && codeMatches(bcode).find(m => m.lvl === 1 && m.p.id !== d.id);

      if (v.mfg && v.exp && v.exp < v.mfg) throw new Error("La date d'expiration précède la date de fabrication");
      const bn = v.bigName.trim(), bf = num(v.bigF);

      if (!bn && v.bigQty !== '') throw new Error("Renseignez d'abord le grand emballage (nom et nombre de pièces)");
      const units = [];
      if (bn && bf > 1) { const pa = num(v.bigS), ba = num(v.bigB); units.push({ name: bn, factor: bf, priceAmt: pa, price: r2(toUSD(pa, v.sellCur)), buyAmt: ba, buy: r2(toUSD(ba, v.buyCur)) }); }
      [...f.querySelectorAll('.urow')].forEach(r => {
        const pa = num(r.querySelector('.u-s').value), ba = num(r.querySelector('.u-b').value);
        units.push({ name: r.querySelector('.u-n').value.trim(), factor: num(r.querySelector('.u-f').value), priceAmt: pa, price: r2(toUSD(pa, v.sellCur)), buyAmt: ba, buy: r2(toUSD(ba, v.buyCur)) });
      });
      const seen = new Set(), U = units.filter(u => u.name && u.factor > 0 && u.name !== v.unit && !seen.has(u.name.toLowerCase()) && seen.add(u.name.toLowerCase()));
      const qtyBase = v.bigQty === '' && v.pcsQty === '' ? null : r2(num(v.bigQty) * (bf > 1 ? bf : 0) + num(v.pcsQty));
      const photo = $('#pphoto').value || p.photo || '';
      const data = {
        name, code, barcode: bcode, cat: v.cat, brand: v.brand.trim(), quality: v.quality.trim(), supplierId: v.supplierId, desc: v.desc, photo,
        buyAmt: num(v.buyAmt), buyCur: v.buyCur, buy: r2(toUSD(num(v.buyAmt), v.buyCur)), sellAmt: num(v.sellAmt), sellCur: v.sellCur, sell: r2(toUSD(num(v.sellAmt), v.sellCur)),
        min: num(v.min), unit: v.unit, units: U, mfg: v.mfg || '', exp: v.exp || '', suspended: !!v.suspended, updated: Date.now(), updatedBy: who()
      };
      const b = batch();
      if (d.id) {
        const diff = []; [['name', 'nom'], ['buyAmt', 'prix achat'], ['sellAmt', 'prix vente'], ['min', 'stock min'], ['cat', 'catégorie'], ['unit', 'unité'], ['exp', 'expiration'], ['suspended', 'vente suspendue'], ['barcode', 'code-barres']].forEach(([k, l]) => { if (String(p[k] ?? '') !== String(data[k] ?? '')) diff.push(`${l}: ${p[k] ?? '—'} → ${data[k] ?? '—'}`); });
        let qtyNote = '';
        if (qtyBase != null && Math.abs(qtyBase - p.qty) > 1e-9) { data.qty = qtyBase; qtyNote = ` ; quantité: ${fmtQty(p)} → ${fmtQty({ unit: v.unit, units: U }, qtyBase)}`; }
        b.merge('products', d.id, data); jr(b, 'Modification produit', `${name} ${diff.join(' ; ') || '(détails)'}${qtyNote}`, null, '', catName(data.cat), d.id);
      } else {
        const id = uid(), qty = qtyBase || 0;
        b.set('products', id, { id, ...data, qty, ts: Date.now(), createdBy: who() });
        jr(b, 'Produit créé', `${name} (${code})${qty ? ' — stock initial ' + fmtQty({ unit: v.unit, units: U }, qty) : ''}`, qty || null, '', catName(data.cat), id);
      }
      b.commit(); toast('Produit enregistré');
      if (d.id && data.qty != null) askJustif('product', d.id, `Correction de la quantité de « ${name} » : ${fmtQty(p)} → ${fmtQty({ unit: v.unit, units: U }, data.qty)}`);
    }, {
      onOpen: (w, f) => {
        f.dataset.pid = d.id || '';
        $('#pfile', w).addEventListener('change', async e => {
          const file = e.target.files[0]; if (!file) return;
          const url = await resizeImage(file); $('#pphoto').value = url; const im = $('#pprev'); im.src = url; im.style.display = '';
        });
        const prev = () => {
          const unit = f.unit.value, bn = f.bigName.value.trim(), bf = num(f.bigF.value), el = $('#pvw', f), hasQ = f.bigQty.value !== '' || f.pcsQty.value !== '';
          if (!bn || !(bf > 1)) { el.innerHTML = `Vous comptez uniquement en <b>${esc(unit)}</b>.${f.pcsQty.value !== '' ? ` Stock : <b>${num(f.pcsQty.value)} ${esc(unit)}</b>.` : ''}<br><small>Pour compter aussi en cartons/sacs…, renseignez « Grand emballage » et le nombre de pièces.</small>`; return; }
          const P = { unit, units: [{ name: bn, factor: bf }] }, base = num(f.bigQty.value) * bf + num(f.pcsQty.value), ex = hasQ ? base : 10 * bf;
          el.innerHTML = `1 ${esc(bn)} = <b>${bf} ${esc(unit)}</b>.<br>${hasQ ? 'Stock saisi' : 'Exemple : 10 ' + esc(bn)} = <b>${fmtQty(P, ex)}</b> = ${+ex.toFixed(4)} ${esc(unit)}.` +
            (ex >= 1 ? `<br>Après la vente d'1 ${esc(unit)} : <b>${fmtQty(P, ex - 1)}</b>${fmtDec(P, ex - 1) ? ' (≈ ' + fmtDec(P, ex - 1) + ')' : ''}.` : '');
        };
        prev(); f.addEventListener('input', prev); f.addEventListener('change', prev);
      }
    });
};
A.pdel = async d => {
  const p = S.products.find(x => x.id === d.id); if (!p) return;
  if (!await confirmBox(`Supprimer « ${esc(p.name)} » ? (l'historique reste conservé)`, 'Supprimer')) return;
  const b = batch(); b.del('products', p.id); jr(b, 'Produit supprimé', `${p.name} (stock ${p.qty} ${p.unit}) supprimé par ${who()}`, p.qty, '', catName(p.cat), p.id); b.commit();
  askJustif('product', p.id, `Suppression du produit « ${p.name} » (stock ${fmtQty(p)})`);
};

/* ================= CATÉGORIES ================= */
views.categories = el => {
  const ok = S.sales.filter(s => s.status !== 'cancelled'), rev = {}, prof = {};
  ok.forEach(s => s.items.forEach(i => { rev[i.cat] = (rev[i.cat] || 0) + i.price * i.qty; prof[i.cat] = (prof[i.cat] || 0) + (i.price - i.cost) * i.qty; }));
  el.innerHTML = page('Catégories', `<button class="btn" data-act="cform">${ic('plus')} Nouvelle</button>`,
    `<div class="grid g2">${S.categories.map(c => {
      const ps = S.products.filter(p => p.cat === c.id), rup = ps.filter(p => stockState(p) === 'rupture').length, fai = ps.filter(p => stockState(p) === 'faible').length, exr = ps.filter(p => expState(p)).length;
      const st = !ps.length ? ['gray', 'Vide'] : rup ? ['bad', 'Rupture partielle'] : fai ? ['warn', 'Stock faible'] : ['', 'Stock OK'];
      return `<div class="card"><div class="cat-card"><div class="cat-ic">${c.image ? `<img src="${c.image}" alt="">` : esc(c.icon || '📦')}</div>
        <div style="flex:1"><b>${esc(c.name)}</b> <span class="badge ${st[0]}">${st[1]}</span><div class="muted sm">${esc(c.desc || '')}</div></div>
        <div class="ac"><button class="x" data-act="cform" data-id="${c.id}">${ic('edit')}</button>${isMgr() ? `<button class="x" style="color:var(--r)" data-act="cdel" data-id="${c.id}">${ic('trash')}</button>` : ''}</div></div>
        <div class="mi"><span>Produits</span><b>${ps.length}</b></div><div class="mi"><span>Quantité totale</span><b>${r2(sum(ps, p => p.qty)).toLocaleString('fr-FR')} u.</b></div>
        <div class="mi"><span>Valeur du stock</span><b>${usd(sum(ps, p => p.qty * p.buy))}</b></div><div class="mi"><span>Chiffre d'affaires</span><b>${usd(rev[c.id] || 0)}</b></div>
        <div class="mi"><span>Bénéfices</span><b class="${(prof[c.id] || 0) < 0 ? 'neg' : 'pos'}">${usd(prof[c.id] || 0)}</b></div>
        <div class="mi"><span>Alertes</span><span>${rup ? `<span class="badge bad">${rup} rupture(s)</span> ` : ''}${fai ? `<span class="badge warn">${fai} faible(s)</span> ` : ''}${exr ? `<span class="badge bad">${exr} expiration(s)</span>` : ''}${!rup && !fai && !exr ? '—' : ''}</span></div>
        ${ps.length ? `<div class="sm muted" style="margin-top:6px">${ps.slice(0, 8).map(p => esc(p.name)).join(' · ')}${ps.length > 8 ? '…' : ''}</div>` : ''}</div>`;
    }).join('') || '<p class="muted">Aucune catégorie.</p>'}</div>`);
};
A.cform = d => {
  const c = d.id ? S.categories.find(x => x.id === d.id) : {};
  form(d.id ? 'Modifier la catégorie' : 'Nouvelle catégorie', `${fld('Nom', 'name', c.name || '', 'text', 'required')}${fld('Icône (emoji)', 'icon', c.icon || '📦')}
    <label>Image (facultatif)<input type="file" id="cfile" accept="image/*"></label><input type="hidden" id="cimg">${fld('Description', 'desc', c.desc || '')}`,
    async v => {
      const id = d.id || uid(), data = { name: v.name.trim(), icon: v.icon, desc: v.desc, image: $('#cimg').value || c.image || '' };
      const b = batch(); b.merge('categories', id, { id, ...data, ts: c.ts || Date.now() });
      jr(b, 'Catégorie', (d.id ? 'Modifiée : ' : 'Créée : ') + data.name, null, '', data.name, id); b.commit();
    }, { onOpen: w => $('#cfile', w).addEventListener('change', async e => { if (e.target.files[0]) $('#cimg').value = await resizeImage(e.target.files[0], 160); }) });

A.cdel = async d => {
  const c = S.categories.find(x => x.id === d.id); if (!c) return;
  if (S.products.some(p => p.cat === c.id)) return toast('Impossible : cette catégorie contient des produits', 'err');
  if (!await confirmBox(`Supprimer la catégorie « ${esc(c.name)} » ?`, 'Supprimer')) return;
  const b = batch(); b.del('categories', c.id); jr(b, 'Catégorie', 'Supprimée : ' + c.name + ' par ' + who(), null, '', c.name, c.id); b.commit();
};

/* ================= INVENTAIRE ================= */
let inv = null;
const REASONS = ['—', 'Casse', 'Endommagé', 'Rongé (rats)', 'Expiré', 'Vol / perte', 'Erreur de comptage'];
views.inventory = el => {
  if (!inv) {
    el.innerHTML = page('Inventaire', '', `<div class="card"><h3>Nouvel inventaire</h3><div class="frm"><label>Périmètre<select id="invscope"><option value="all">Tout le magasin</option>${S.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
      <button class="btn" data-act="invstart">Démarrer le comptage</button></div></div>
      <div class="card"><h3>Historique des inventaires</h3>${[...S.inventories].sort((a, b) => b.ts - a.ts).map(i => `<div class="mi"><span>${fmtDate(i.ts)} — ${esc(i.scopeName)} <small class="muted">(${i.lines.length} produits, par ${esc(i.userName)})</small></span><span><b class="${i.valueAdj < 0 ? 'neg' : 'pos'}">${usd(i.valueAdj)}</b> <button class="btn sm ghost" data-act="invview" data-id="${i.id}">Rapport</button></span></div>`).join('') || '<p class="muted">Aucun inventaire.</p>'}</div>`);
    return;
  }
  const ps = S.products.filter(p => inv.scope === 'all' || p.cat === inv.scope);
  el.innerHTML = page('Comptage — ' + esc(inv.scopeName), `<button class="btn ghost" data-act="invcancel">Abandonner</button><button class="btn" data-act="invvalidate">Valider</button>`, `
    <div class="hint">Saisissez le stock physique (en unité de base), les produits endommagés et le motif d'un éventuel écart. Les lignes vides ne sont pas ajustées.</div>
    <div class="llist">${ps.map(p => `<div class="lrow inv" data-pid="${p.id}" data-theo="${p.qty}"><div class="jm"><b>${esc(p.name)}</b><small>Théorique : ${+p.qty.toFixed(3)} ${esc(p.unit)} (${fmtQty(p)})${expState(p) === 'expired' ? ' · <span class="neg">expiré</span>' : ''}</small>
      <div class="invf"><label>Physique<input class="inv-in i-p" type="number" step="any" min="0" inputmode="decimal"></label><label>Endommagés<input class="inv-in i-d" type="number" step="any" min="0" inputmode="decimal" value="0"></label>
      <label>Motif<select class="inv-in i-r">${REASONS.map(r => `<option>${r}</option>`).join('')}</select></label><b class="gap">—</b></div></div></div>`).join('')}</div>`);
};
document.addEventListener('input', e => {
  if (!e.target.classList.contains('inv-in')) return;
  const tr = e.target.closest('.inv'), th = num(tr.dataset.theo), ph = tr.querySelector('.i-p').value, dm = num(tr.querySelector('.i-d').value), g = tr.querySelector('.gap');
  if (ph === '') { g.textContent = '—'; g.className = 'gap'; return; }
  const gap = r2(num(ph) + dm - th); g.textContent = 'Écart ' + (gap > 0 ? '+' : '') + gap; g.className = 'gap ' + (gap < 0 ? 'neg' : gap > 0 ? 'pos' : '');
});
A.invstart = () => { const scope = $('#invscope').value; inv = { scope, scopeName: scope === 'all' ? 'Tout le magasin' : catName(scope) }; views.inventory($('#view')); };
A.invcancel = async () => { if (await confirmBox('Abandonner ce comptage ?', 'Abandonner')) { inv = null; views.inventory($('#view')); } };
A.invvalidate = async () => {
  const lines = $$('.inv').filter(tr => tr.querySelector('.i-p').value !== '').map(tr => {
    const p = S.products.find(x => x.id === tr.dataset.pid), phys = num(tr.querySelector('.i-p').value), dmg = num(tr.querySelector('.i-d').value), theo = p.qty, reason = tr.querySelector('.i-r').value;
    return { pid: p.id, name: p.name, unit: p.unit, theo, phys, dmg, gap: r2(phys + dmg - theo), adjust: r2(phys - theo), cost: p.buy, reason: reason === '—' ? '' : reason };
  });
  if (!lines.length) return toast('Aucune ligne comptée', 'err');
  const valueAdj = r2(sum(lines, l => l.adjust * l.cost));
  if (!await confirmBox(`Valider l'inventaire (${lines.length} produits, impact ${usd(valueAdj)}) ? Les stocks seront ajustés aux quantités physiques.`, 'Valider')) return;
  const b = batch(), id = uid(), ts = Date.now();
  b.set('inventories', id, { id, ts, day: dayKey(ts), scope: inv.scope, scopeName: inv.scopeName, lines, valueAdj, uid: S.user.uid, userName: who() });
  lines.forEach(l => {
    if (l.adjust !== 0) {
      b.upd('products', l.pid, { qty: inc(l.adjust) });
      jr(b, l.adjust < 0 ? 'Sortie stock' : 'Entrée stock', `Ajustement inventaire — ${l.name} : ${l.theo} → ${l.phys} ${l.unit}${l.reason ? ' (' + l.reason + ')' : ''}${l.dmg ? ' (' + l.dmg + ' endommagé(s))' : ''}`, l.adjust, '', '', id);
    }
  });
  jr(b, 'Inventaire', `Inventaire validé — ${inv.scopeName} — ${lines.length} produits, impact ${usd(valueAdj)}`, valueAdj, 'USD', '', id);
  b.commit(); const neg = lines.filter(l => l.adjust < 0).length; inv = null; toast('Inventaire validé'); views.inventory($('#view'));
  if (neg) askJustif('inventory', id, `Inventaire avec ${neg} écart(s) négatif(s) — impact ${usd(valueAdj)}`);
};
const invReport = i => ({
  title: 'Inventaire ' + dayKey(i.ts) + ' ' + i.scopeName,

}

function usageData() {
  const now = Date.now(), t30 = now - 30 * 864e5, ok = S.sales.filter(s => s.status !== 'cancelled');
  return S.users.filter(u => u.active !== false).map(u => {
    const mine = (x, k = 'user') => x.email ? x.email === u.id : (x[k] === u.name);
    const J = S.journal.filter(j => j.ts >= t30 && (j.email ? j.email === u.id : j.user === u.name));
    const sales = S.sales.filter(s => s.ts >= t30 && (s.uid === undefined ? false : s.userName === u.name)), nSales = sales.filter(s => s.status !== 'cancelled'), canc = S.sales.filter(s => s.status === 'cancelled' && s.cancelTs >= t30 && s.cancelBy === u.name);
    const pendOld = S.justifs.filter(j => j.user === u.name && j.status === 'pending' && j.ts < now - 2 * 864e5).length, rej = S.justifs.filter(j => j.user === u.name && j.status === 'rejected').length;
    const gaps = S.sessions.filter(s => s.status === 'closed' && s.closeTs >= t30 && s.closeUser === u.name && (Math.abs(s.diff?.CDF || 0) > 0 || Math.abs(s.diff?.USD || 0) > 0)).length;
    const del = J.filter(j => /supprim/i.test(j.type + ' ' + j.desc)).length, forced = J.filter(j => /FORC/.test(j.desc)).length;
    const invNeg = S.inventories.filter(i => i.ts >= t30 && i.userName === u.name).reduce((n, i) => n + i.lines.filter(l => l.adjust < 0).length, 0);
    const exps = S.expenses.filter(e => e.ts >= t30 && (e.userName === u.name)).length;
    const cr = nSales.length + canc.length ? canc.length / (nSales.length + canc.length) : 0;
    const pen = { 'Annulations': Math.min(20, cr * 100 * 2), 'Justifications': Math.min(20, pendOld * 5 + rej * 8), 'Écarts de caisse': Math.min(20, gaps * 5), 'Suppressions': Math.min(15, del * 5), 'Dépenses forcées': Math.min(10, forced * 5), 'Écarts d\'inventaire': Math.min(10, invNeg * 2) };
    const actions = J.filter(j => j.type !== 'Connexion').length, logins = J.filter(j => j.type === 'Connexion').length, total = sum(Object.values(pen), v => v);
    const reasons = []; if (canc.length) reasons.push(`${canc.length} annulation(s) sur ${nSales.length + canc.length} vente(s) (${Math.round(cr * 100)} %)`); if (pendOld) reasons.push(`${pendOld} justification(s) sans réponse depuis plus de 2 jours`); if (rej) reasons.push(`${rej} justification(s) rejetée(s)`);
    if (gaps) reasons.push(`${gaps} clôture(s) de caisse avec écart`); if (del) reasons.push(`${del} suppression(s)`); if (forced) reasons.push(`${forced} dépense(s) forcée(s)`); if (invNeg) reasons.push(`${invNeg} écart(s) négatif(s) d'inventaire`);
    return { u, actions, logins, nSales: nSales.length, revenue: sum(nSales, s => s.total), canc: canc.length, exps, pen, score: actions + logins + nSales.length + canc.length + exps === 0 ? null : Math.max(0, Math.round(100 - total)), reasons };
  });
}

let calMonth = new Date(); calMonth.setDate(1); let calSel = dayKey();
const EV_COL = { exp: 'red', credit: 'orange', debt: 'orange', custom: 'blue' };
const EV_TYPES = ['Rappel de paiement', 'Inventaire', 'Approvisionnement', 'Rendez-vous de livraison', 'Autre'];
function calEvents() {
  const ev = [];
  S.products.filter(p => p.exp && p.qty > 0).forEach(p => ev.push({ date: p.exp, title: 'Expiration : ' + p.name, type: 'exp' }));
  S.clients.filter(c => c.debt > 0.004).forEach(c => unsettledClient(c).filter(u => u.due).forEach(u => ev.push({ date: u.due, title: 'Remboursement attendu : ' + c.name + ' (' + usd(u.left) + ')', type: 'credit' })));
  S.suppliers.filter(x => x.debt > 0.004).forEach(x => unsettledSupplier(x).filter(u => u.due).forEach(u => ev.push({ date: u.due, title: 'Paiement fournisseur : ' + x.name + ' (' + usd(u.left) + ')', type: 'debt' })));
  S.events.forEach(e => ev.push({ ...e, custom: true, type: 'custom' }));
  return ev;
}
views.calendar = el => {
  const ev = calEvents(), y = calMonth.getFullYear(), m = calMonth.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), today = dayKey();
  const cells = []; for (let i = 0; i < first; i++) cells.push('<span></span>');
  for (let d = 1; d <= n; d++) { const k = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'), es = ev.filter(e => e.date === k && !e.done);
    cells.push(`<button class="cd ${k === calSel ? 'sel' : ''} ${k === today ? 'today' : ''}" data-act="cday" data-d="${k}">${d}${es.length ? `<i class="dots">${[...new Set(es.map(e => e.type))].slice(0, 3).map(t => `<b class="${EV_COL[t]}"></b>`).join('')}</i>` : ''}</button>`); }
  const day = ev.filter(e => e.date === calSel).sort((a, b) => (a.time || '').localeCompare(b.time || '')), up = ev.filter(e => !e.done && e.date >= today && e.date <= addDays(today, 30)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 15);

    <div class="card"><div class="row sp"><button class="btn ghost sm" data-act="calnav" data-n="-1">‹</button><b>${calMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</b><button class="btn ghost sm" data-act="calnav" data-n="1">›</button></div>
    <div class="cgrid"><small>L</small><small>M</small><small>M</small><small>J</small><small>V</small><small>S</small><small>D</small>${cells.join('')}</div></div>
    <div class="card"><h3>${new Date(calSel + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</h3>${day.map(evRow).join('') || '<p class="muted">Rien de prévu ce jour.</p>'}</div>
    <div class="card"><h3>30 prochains jours</h3>${up.map(e => `<div class="mi"><span>${e.date}${e.time ? ' ' + e.time : ''} — ${esc(e.title)}</span></div>`).join('') || '<p class="muted">Rien à venir.</p>'}</div>

  ] },
  { k: 'sales', t: 'Ventes', intro: 'Enregistrer une vente, encaisser, imprimer le reçu et gérer les cas particuliers.', parts: [
    ['Avant de vendre : ouvrir la caisse', 'Pour encaisser des espèces (CDF ou USD), la caisse doit être ouverte dans le module Caisse avec le fonds de départ. Mobile Money, banque et crédit n’exigent pas cette ouverture.', 'Le matin, la caissière ouvre la caisse avec 50 000 FC de fonds initial. Ensuite seulement elle encaisse en espèces.'],
    ['Ajouter les produits au panier', 'Touchez un produit, ou scannez son code-barres (bouton Scanner), ou tapez dans la barre de recherche puis appuyez sur Entrée : un code exact ajoute directement le produit, un seul résultat est aussi ajouté. Les produits suspendus, expirés ou en rupture ne peuvent pas être vendus.', 'Vous scannez le code d’un Coca-Cola : il est ajouté au panier. Vous tapez « coca 33 » : seuls les Coca de 33 cl restent affichés.'],
    ['Code-barres inconnu : ne bloquez pas la vente', 'Si un code n’existe pas dans le catalogue, une fenêtre propose deux choix rapides : retrouver le produit existant (le code lui sera associé pour toujours) ou créer une nouvelle fiche avec ce code, déjà rempli. Le nom est cherché en ligne quand c’est possible. Un code mal lu (somme de contrôle invalide) est signalé : rescannez-le.', 'Un article importé n’avait pas de code-barres. Vous scannez son étiquette, tapez « sucre » dans la fenêtre, touchez « Choisir » : le code est mémorisé et le sucre est ajouté. La prochaine fois, un simple scan suffit.'],
    ['Unités et conversions (carton, bouteille…)', 'Chaque ligne du panier peut être vendue dans l’unité de votre choix. Le stock reste compté en unité de base et se lit dans les emballages définis sur la fiche produit.', '1 carton = 12 bouteilles. Stock : 119 bouteilles, affiché « 9 Carton + 11 Bouteille ». Vous vendez 1 carton : il reste 107 bouteilles = 8 cartons + 11 bouteilles.'],
    ['Remise', 'La remise s’exprime en pourcentage. Un caissier est limité au maximum fixé dans les Paramètres (10 % par défaut) ; un gérant ou un administrateur peut aller jusqu’à 100 %.', 'Panier de 50 000 FC, remise de 10 % : 5 000 FC de remise, le client paie 45 000 FC. Une remise de 15 % par un caissier est refusée.'],
    ['Modes de paiement et paiement mixte', 'Choisissez Espèces CDF, Espèces USD, Mobile Money CDF ou USD, Banque USD, Crédit, ou Mixte pour répartir le montant. En mixte, le total des paiements doit être égal au montant à payer (« Reste à payer » = 0).', 'Total 45 000 FC : 20 000 FC en espèces + 25 000 FC en Mobile Money CDF = 45 000 FC, la vente peut être validée. Avec 20 000 + 20 000, il reste 5 000 FC à payer : la vente est refusée.'],
    ['Vente à crédit', 'Le client doit figurer dans la liste (un passant ne peut pas acheter à crédit), avoir un plafond de crédit, et sa dette après la vente ne doit pas dépasser ce plafond. Une échéance est proposée (30 jours par défaut, modifiable dans les Paramètres).', 'Plafond 100 000 FC, dette actuelle 70 000 FC. Une vente à crédit de 40 000 FC donnerait 110 000 FC : refusée. Vous pouvez faire un paiement mixte : 30 000 FC à crédit + 10 000 FC en espèces.'],
    ['Client de passage et fiche client automatique', 'Choisissez « Passant » pour un acheteur qui n’est pas dans votre liste. Si vous saisissez son nom ET son téléphone (ex. « Jean, 0990000000 »), une fiche client est créée automatiquement, la vente lui est rattachée et le reçu affiche son nom et son numéro. Si ce numéro existe déjà, la vente est rattachée à la fiche existante : aucun doublon.', 'Vous saisissez « Marie Kabila, 081 234 5678 » : la fiche « Marie Kabila » apparaît dans Clients avec cette vente. Si vous saisissez seulement « Marie », elle reste un passant simple.'],
    ['Reçu, partage et annulation', 'Après l’encaissement, le reçu s’affiche : imprimez-le ou partagez-le (WhatsApp, etc.). Retrouvez toutes les ventes dans l’onglet « Historique des ventes ». Seul un gérant ou un administrateur peut annuler une vente : le stock et la caisse sont alors rétablis et une justification est demandée.', 'La vente V261121-AB12 de 45 000 FC est annulée par erreur de prix : les produits reviennent en stock, 45 000 FC sont retirés de la caisse, et l’annulation apparaît dans l’Historique.']
  ] },
  { k: 'products', t: 'Produits', intro: 'La fiche de chaque article : identité, prix, emballages, stock et dates.', parts: [
    ['Créer un produit', 'Touchez « Nouveau » puis renseignez : nom, catégorie, prix d’achat et de vente d’UNE pièce (avec leur devise), unité de base, emballages éventuels, stock de départ, stock minimum, dates et fournisseur. L’identifiant produit se crée tout seul si vous le laissez vide.', 'Bouteille de Fanta : achat 2 500 FC, vente 3 500 FC. Marge = 3 500 − 2 500 = 1 000 FC, soit 28,6 % du prix de vente (1 000 / 3 500).'],
    ['Grands emballages et conversions', 'Indiquez le grand emballage (Carton, Sac, Casier…) et le nombre de pièces qu’il contient. Le prix du carton se calcule automatiquement (prix de la pièce × nombre) sauf si vous en fixez un autre.', 'Carton de 12 bouteilles. Bouteille à 3 500 FC : le carton vaut 42 000 FC par défaut ; si vous saisissez 40 000 FC comme prix du carton, c’est ce prix qui s’applique (rabais de 2 000 FC).'],
    ['Codes-barres : saisie, scan et formats reconnus', 'Saisissez ou scannez le code. L’application normalise les formats : espaces, tirets, retours du scanner, « .0 » ajouté par un import Excel et zéros du début sont ignorés, et un code UPC-A de 12 chiffres est reconnu comme le même produit que son équivalent EAN-13. Un code déjà utilisé par un autre produit est refusé.', 'Les codes 036000291452 (UPC-A) et 0036000291452 (EAN-13) désignent le même produit. Si vous saisissez le second alors que le premier existe, l’application répond « déjà utilisé par… ».'],
    ['Plusieurs codes pour un même produit', 'Quand un produit arrive avec une autre étiquette (nouveau fournisseur, nouvel emballage), associez le second code au lieu de créer un doublon : il suffit de scanner puis de choisir le produit existant. Les codes associés sont affichés sur la fiche.', 'Le même sucre existe avec l’étiquette du fournisseur A et celle du fournisseur B : les deux codes ouvrent la même fiche et le même stock.'],
    ['Rechercher et filtrer la liste', 'La liste se filtre par texte (nom, code, code-barres même partiel, marque, catégorie, fournisseur), par état (En stock, Stock faible, Rupture, Expire / expiré, Suspendus, Sans code-barres), par catégorie et par fournisseur, et se trie par nom, stock, prix ou date. Le bouton Scanner ouvre directement la fiche du produit scanné.', 'Pour compléter vos articles importés : touchez « Sans code-barres », puis scannez chaque article et associez le code. Pour préparer une commande : filtre « Stock faible » + fournisseur « Brasimba ».'],
    ['Stock minimum, expiration et suspension', 'Sous le stock minimum, le produit passe en « Faible » ; à zéro, en « Rupture ». Une date d’expiration proche (30 jours par défaut) déclenche une alerte ; un produit expiré ne peut plus être vendu. Vous pouvez aussi suspendre la vente d’un produit.', 'Minimum 24, stock 20 : état « Faible ». Expiration le 10/12 et nous sommes le 21/11 : l’affichage indique « Expire 19 j ».']
  ] },
  { k: 'categories', t: 'Catégories', intro: 'Regrouper les produits pour mieux les retrouver et les analyser.', parts: [
    ['Créer et utiliser les catégories', 'Créez vos catégories (VERRE, EKOLO, WHISKY…) avant les produits. Chaque carte affiche le stock, la valeur, le chiffre d’affaires, le bénéfice et les alertes de la catégorie. Les boutons de catégorie filtrent aussi l’écran de vente.', 'En vente, touchez « WHISKY » : seuls les whiskies s’affichent, plus simple en période de forte affluence.']
  ] },
  { k: 'purchases', t: 'Entrées de stock', intro: 'Enregistrer une livraison de marchandises, la payer et mettre le stock à jour.', parts: [
    ['Choisir le fournisseur : la liste se filtre', 'Dès qu’un fournisseur est choisi, seuls ses articles sont proposés dans les lignes. Si vous changez de fournisseur, les lignes d’un autre fournisseur sont retirées. Pour recevoir un article qui n’est pas encore le sien, utilisez « Rattacher un autre article à ce fournisseur » (confirmation demandée) : c’est le seul moyen, ce qui évite les erreurs de réception.', 'Vous choisissez « Brasimba » : on ne voit que ses bières. Le sucre n’apparaît pas ; vous touchez « Rattacher », choisissez « Sucre 1 kg » et confirmez : il est désormais rattaché à Brasimba.'],
    ['Saisir les lignes, prix et transport', 'Pour chaque ligne : produit, unité, quantité et prix. Choisissez la devise des prix saisis. Les frais de transport sont répartis sur les lignes au prorata de leur valeur pour calculer le vrai coût de revient, qui met à jour le prix d’achat du produit.', '10 cartons de 12 bouteilles à 36 000 FC le carton = 360 000 FC, plus 20 000 FC de transport = 380 000 FC. Coût réel d’une bouteille : 380 000 / 120 = 3 166,67 FC.'],
    ['Payer cash ou à crédit — contrôle de liquidité', 'Cash : la caisse est débitée du compte choisi, mais l’opération est BLOQUÉE si le solde est insuffisant (une alerte rouge apparaît dès la saisie). Crédit : une dette fournisseur est créée, à régler plus tard dans Clients & Fournisseurs.', 'Espèces CDF en caisse : 300 000 FC. Entrée cash de 380 000 FC : bloquée, il manque 80 000 FC. Solutions : alimenter la caisse, payer par Mobile Money ou Banque, ou payer à crédit.'],
    ['Justificatif et vérification', 'Ajoutez une photo du bordereau de livraison. Touchez l’œil sur une entrée pour revoir les lignes, le taux enregistré, le mode de paiement et le total.', 'Photo du bon de livraison n° 0457 jointe : en cas de litige, le justificatif est dans l’entrée.']
  ] },
  { k: 'inventory', t: 'Inventaire', intro: 'Comparer le stock réel au stock de l’application et corriger les écarts.', parts: [
    ['Faire un inventaire', 'Choisissez tout le magasin ou une catégorie, saisissez le stock physique compté, les produits endommagés et le motif (casse, rongé, expiré…). À la validation, les stocks sont ajustés et un rapport est conservé ; l’opération est notée dans l’Historique.', 'Fanta : stock dans l’application 48, compté 45, motif « casse » : écart de −3 bouteilles. Valeur perdue = 3 × 2 500 FC (prix d’achat) = 7 500 FC.']
  ] },
  { k: 'cash', t: 'Caisse', intro: 'Suivre l’argent en espèces, Mobile Money et banque, en CDF et en USD.', parts: [
    ['Ouvrir la caisse', 'En début de journée, ouvrez la caisse avec le fonds initial. Sans caisse ouverte, les espèces ne s’encaissent pas.', 'Fonds initial : 50 000 FC en espèces CDF.'],
    ['Cinq comptes séparés', 'Espèces CDF, Espèces USD, Mobile Money CDF, Mobile Money USD et Banque USD ont chacun leur solde. Une dépense ou un paiement ne peut sortir que d’un compte qui a assez d’argent.', 'Espèces CDF : 120 000 FC ; Mobile Money CDF : 80 000 FC. Un paiement de 100 000 FC en Mobile Money est refusé, mais possible en espèces.'],
    ['Encaissements, décaissements, dépôts, retraits', 'Utilisez ces opérations pour les mouvements hors ventes. Tout décaissement ou retrait déclenche une demande de justification.', 'Vous retirez 30 000 FC en espèces pour acheter du carburant : l’application vous demande « pourquoi ? » ; vous répondez et joignez la photo du reçu.'],
    ['Clôturer la caisse', 'Comptez l’argent réel et saisissez-le : l’application calcule l’écart avec le solde théorique, l’enregistre et demande une justification s’il existe. Le rapport journalier PDF résume toute la journée.', 'Théorique 350 000 FC, compté 348 000 FC : écart de −2 000 FC, à justifier (ex. erreur de monnaie).']
  ] },
  { k: 'expenses', t: 'Dépenses', intro: 'Enregistrer les charges du commerce sous contrôle.', parts: [
    ['Saisir une dépense', 'Indiquez le motif, la catégorie (transport, loyer, électricité, salaires…), le montant, la devise et un justificatif facultatif. La dépense sort de la caisse.', 'Transport de marchandises : 15 000 FC, catégorie « Transport », photo du reçu jointe.'],
    ['Blocage : dépense supérieure au bénéfice', 'Une dépense qui ferait dépasser le bénéfice brut du mois est bloquée. L’administrateur peut la forcer avec une justification écrite.', 'Bénéfice brut du mois : 60 230 FC. Une dépense de 100 000 FC est bloquée ; une de 40 000 FC passe.']
  ] },
  { k: 'partners', t: 'Clients & Fournisseurs', intro: 'Les fiches, le crédit, les dettes, les règlements et leurs reçus.', parts: [
    ['Fiches clients et plafond de crédit', 'Chaque client a un téléphone, un plafond de crédit, un historique d’achats et un solde (dette). Le plafond par défaut vient des Paramètres. Un rappel WhatsApp peut être envoyé depuis la fiche.', 'Client « Papa Jean » : plafond 100 000 FC, achats cumulés 640 000 FC, dette 40 000 FC.'],
    ['Encaisser le remboursement d’un client', 'Ouvrez la fiche, touchez « Encaisser un remboursement », choisissez le compte et le montant. Le solde baisse, la caisse augmente et un reçu est généré automatiquement.', 'Dette de 40 000 FC, le client donne 15 000 FC en espèces CDF : le reçu indique solde avant 40 000 FC, solde après 25 000 FC.'],
    ['Payer un fournisseur', 'Ouvrez la fiche du fournisseur, touchez « Payer le fournisseur », choisissez le compte, le montant, puis saisissez le nom de la personne qui reçoit l’argent et faites-la signer au doigt. Le paiement ne peut ni dépasser la dette ni dépasser le solde du compte.', 'Dette de 500 000 FC. Vous payez 200 000 FC par Mobile Money CDF à « M. Kabongo », qui signe : il reste 300 000 FC à payer.'],
    ['Reçus de règlement et traçabilité', 'Chaque règlement (client ou fournisseur) produit un reçu horodaté avec une référence unique (RC-… pour un client, RF-… pour un fournisseur), le montant, le mode de paiement, le solde avant/après et l’opérateur. Il se partage, s’imprime ou s’exporte en PDF, et se retrouve dans la fiche du tiers et dans l’Historique.', 'Référence RC-20261121-A1B2C3 : en cas de contestation, tapez-la dans l’Historique pour retrouver l’opération et rouvrir le reçu.'],
    ['Taux propre à un fournisseur', 'Un fournisseur peut avoir son propre taux de change : sa dette est alors convertie à ce taux. Les autres montants utilisent le taux général.', 'Dette de 100 $. Taux général 2 300 FC → 230 000 FC ; taux de ce fournisseur 2 400 FC → 240 000 FC.'],
    ['Notes, ristourne, commissions et comparaison', 'Notez chaque fournisseur sur 100 (qualité, délai, prix, fiabilité, disponibilité, crédit). Renseignez ristourne et commission de fin de mois. « Comparer » classe les fournisseurs par prix d’achat pour un produit donné. « Top 20 » classe vos meilleurs clients.', 'Commission de 3 % sur 1 000 000 FC de ventes de ses produits = 30 000 FC, visible quand le mois est clôturé.']
  ] },
  { k: 'journal', t: 'Historique', intro: 'Le journal de toutes les opérations, en lecture seule.', parts: [
    ['Tout est affiché en francs congolais (CDF)', 'Pour éviter toute ambiguïté, tous les montants de l’Historique sont affichés en CDF. Une opération saisie en dollars est convertie automatiquement, au taux enregistré avec l’opération quand il est connu, sinon au taux actuel. L’export Excel suit la même règle.', 'Une opération de 10 $ au taux de 2 300 FC apparaît « 23 000 FC ». Une description « Vente $10,50 » s’affiche « Vente 24 150 FC ».'],
    ['Filtrer et retrouver une opération', 'Filtrez par type, date, utilisateur, catégorie ou texte (y compris une référence de reçu). Les lignes de règlement affichent un lien vers leur reçu.', 'Filtre « Remboursement » + utilisateur « Marie » + dates du mois : tous les remboursements encaissés par Marie.'],
    ['Justifier les opérations sensibles', 'Annulations, retraits, décaissements, dépenses, inventaires et modifications de produits peuvent recevoir une justification via le lien « Ajouter une justification ».', 'Annulation de vente : « erreur de prix corrigée avec le client » ajouté sous la ligne.']
  ] },
  { k: 'justifs', t: 'Justifications', intro: 'Expliquer les opérations sensibles et les faire valider.', parts: [
    ['Demander, répondre, valider', 'Une justification est demandée automatiquement pour les opérations sensibles. L’employé répond avec un texte et une photo ; l’administrateur marque « justifié », « accepté » ou « rejeté ». Vous pouvez répondre plus tard : l’opération reste « en attente ».', 'Écart de caisse de −2 000 FC : la caissière répond « monnaie rendue en trop » ; l’administrateur l’accepte.']
  ] },
  { k: 'reports', t: 'Rapports', intro: 'Analyser une période et exporter les résultats.', parts: [
    ['Choisir le rapport et la période', 'Sélectionnez un type (synthèse, ventes, achats, dépenses, bénéfices, stocks, dettes, caisse, employés…) puis la période avec les boutons ou les dates.', 'Rapport « Ventes » du 01/11 au 30/11 : liste des ventes avec remise, total et mode de paiement.'],
    ['Exporter en PDF, Excel, CSV ou PowerPoint', 'Les boutons exportent le rapport affiché. Le bouton PowerPoint crée une présentation complète de la période : page de titre, sommaire, synthèse, puis un tableau par module (Stocks, Entrées, Ventes, Clients, Fournisseurs, Dettes, Règlements & reçus, Dépenses, Caisse, Historique), limité aux modules accessibles à votre profil.', 'Mois de novembre : touchez « Mois » puis « PowerPoint ». Le fichier KAJIMINYI_Synthese_… s’ouvre dans PowerPoint ou Google Slides pour la réunion avec les associés.']
  ] },
  { k: 'health', t: 'Business Health', intro: 'Le score de santé de votre commerce.', parts: [
    ['Score sur 100 et seuil de rentabilité', 'Le score combine rentabilité, croissance, dépenses, stock, dettes, trésorerie et pertes. Il reste « indicatif » tant que les données sont insuffisantes. Le seuil de rentabilité est le chiffre d’affaires minimum pour couvrir les dépenses.', 'Dépenses de 300 000 FC par mois et marge brute de 20 % : seuil = 300 000 / 0,20 = 1 500 000 FC de ventes par mois.']
  ] },
  { k: 'usage', t: 'Santé & usage', intro: 'Qualité d’utilisation de l’application par chaque employé.', parts: [
    ['Indicateurs par employé', 'Le module suit annulations, justifications en attente, écarts de caisse et suppressions pour repérer les pratiques à corriger, avec des graphiques.', 'Un caissier avec 6 annulations en une semaine pour 40 ventes mérite une discussion.']
  ] },
  { k: 'calc', t: 'Smart Calculator', intro: 'Des calculs commerciaux prêts à l’emploi.', parts: [
    ['Marge, majoration, TVA, remise, change', 'Choisissez le calcul, saisissez les valeurs, puis « Enregistrer » pour le retrouver dans l’historique des calculs. Taux de marge = (vente − achat) / vente. Majoration = (vente − achat) / achat.', 'Achat 3 000 FC, vente 4 000 FC : taux de marge 25 %, majoration 33,3 %. TVA 16 % sur 10 000 FC HT : 1 600 FC de TVA, 11 600 FC TTC.']
  ] },
  { k: 'calendar', t: 'Calendrier', intro: 'Échéances et rappels au même endroit.', parts: [
    ['Échéances automatiques et rappels', 'Expirations de produits, échéances de crédits clients et paiements fournisseurs s’ajoutent seuls. Ajoutez vos rappels et exportez-les vers le calendrier du téléphone.', 'Crédit du client « Papa Jean » à échéance le 30/11 : il apparaît ce jour-là, avec le montant restant dû.']
  ] },
  { k: 'notifs', t: 'Notifications', intro: 'Toutes les alertes en cours.', parts: [
    ['Alertes, notifications du téléphone et sonnerie', 'Les alertes graves (rupture, crédit en retard, expiration) sonnent. Autorisez les notifications du téléphone pour les recevoir même application fermée, et testez la sonnerie.', 'Une alerte « Sucre : rupture » arrive pendant que vous êtes en livraison : vous commandez avant de manquer des ventes.']
  ] },
  { k: 'chat', t: 'Chat & sondages', intro: 'Communiquer avec l’équipe dans l’application.', parts: [
    ['Canaux, annonces et sondages', 'Discutez par canal (général, caisse, stock…), lisez les annonces et votez aux sondages lancés par la direction.', 'Sondage : « Fermer à 19 h ou 20 h ? » Chaque employé vote une fois ; le résultat s’affiche en pourcentage.']
  ] },
  { k: 'users', t: 'Utilisateurs', intro: 'Donner et retirer des accès (administrateur).', parts: [
    ['Ajouter un employé et régler ses droits', 'Saisissez l’adresse Gmail de l’employé, son nom et son profil, puis ajustez ses permissions module par module. Vous pouvez suspendre un compte sans le supprimer ; son historique est conservé.', 'Nouvelle caissière : ajoutez marie@gmail.com avec le profil « Caissier ». Si elle quitte l’entreprise, décochez « Compte actif ».']
  ] },
  { k: 'settings', t: 'Paramètres', intro: 'Régler l’application selon votre commerce.', parts: [
    ['Identité, devises et taux', 'Nom, adresse et téléphone du commerce (imprimés sur les reçus), devise principale, taux de change, règle éventuelle d’interdiction des espèces USD.', 'Le taux passe de 2 300 à 2 350 FC : modifiez-le ici ; les anciens reçus gardent 2 300 FC.'],
    ['Modes de paiement, remises, crédit, expiration', 'Activez les modes de paiement utilisés, fixez la remise maximale du caissier (10 % par défaut), le plafond de crédit par défaut, le délai de crédit (30 jours) et le nombre de jours avant alerte d’expiration (30 jours).', 'Vous passez la remise maximale à 5 % : un caissier ne peut plus accorder 10 %.'],
    ['Affichage, sécurité et sauvegarde', 'Thème clair ou sombre, couleurs, taille du texte, déconnexion automatique par inactivité, modules affichés, exportation de sauvegarde et assistant IA.', 'Déconnexion après 30 minutes d’inactivité : si un employé laisse son téléphone, la session se ferme seule.']
  ] },
  { k: 'help', t: 'Centre d’aide', intro: 'Où trouver de l’aide.', parts: [
    ['Manuel, FAQ, assistant et signalement', 'Ce manuel explique chaque module. La FAQ répond aux questions fréquentes. L’assistant répond à partir de vos données réelles. « Signaler un problème » envoie un message à l’administrateur avec une capture d’écran possible.', 'Pour savoir pourquoi une dépense est bloquée : cherchez « dépense » dans ce manuel, ou demandez à l’assistant « Pourquoi ma dépense est-elle bloquée ? ».']
  ] }
];
{ const g = k => MANUAL.find(m => m.k === k);
  g('sales')?.parts.push(['Bonus en produit (offert) — différent de la remise', 'Dans le panier, la zone « 🎁 Bonus en produit » permet d’offrir des produits en plus de la vente, sans toucher au montant à payer. Choisissez le produit, l’unité (pièce ou grand emballage : carton…) et la quantité. Le stock sort en conséquence (au coût d’achat, donc le bénéfice diminue), le bonus est enregistré à part de la remise et apparaît sur le reçu et dans l’Historique. L’annulation de la vente remet aussi le bonus en stock.', 'Un client achète 10 paquets d’eau. Vous lui offrez 1 carton d’eau de 12 paquets : ajoutez un bonus « Eau — Carton — 1 ». Total à payer inchangé ; le stock baisse de 10 paquets (vendus) + 12 paquets (bonus). Reçu : « 🎁 Bonus offert (gratuit) : 1 Carton Eau ».']);
  g('partners')?.parts.push(['Relancer une dette par WhatsApp', 'Depuis la fiche du client, ou depuis l’onglet « Crédits clients » (bouton 💬), l’application ouvre WhatsApp avec un message prêt, dans cet ordre : « Bonjour » + nom du client, « Comment vous allez ? », puis le montant dû, l’échéance et la demande de règlement ou d’échange. Vous relisez, puis vous envoyez. Les numéros commençant par 0 sont convertis au format international de la RDC (+243).', 'Client Papa Jean, dette 230 000 FC, échéance dépassée : « Bonjour Papa Jean, Comment vous allez ? Vous avez un solde impayé de 230 000 FC (échu depuis le 12/11). Pouvez-vous passer le régler, ou nous appeler pour qu’on en discute ? »']);
  MANUAL.push({ k: 'academy', t: 'Formation & brevets', intro: 'Apprendre la gestion de commerce adaptée à la RDC et obtenir des brevets.', parts: [

const netState = () => { const n = $('#net'); if (!n) return; const on = navigator.onLine, p = S.pend || 0; n.textContent = (on ? '● En ligne' : '● Hors ligne') + (p ? ' · ⏳ ' + p + ' en attente' : ''); n.classList.toggle('off', !on); n.title = p ? p + ' opération(s) pas encore synchronisée(s) avec le serveur' : ''; };
window.__net = netState;
window.addEventListener('online', () => { netState(); toast('Connexion rétablie — synchronisation en cours'); });
window.addEventListener('offline', () => { netState(); toast('Hors connexion — vos opérations seront synchronisées automatiquement', 'err'); });

// Gestion de session : déconnexion après inactivité
let lastAct = Date.now(), idleI = null;
function resetIdle() {
  lastAct = Date.now(); if (idleI) return;
  // vérification toutes les 20 s (un setTimeout dépasse sa limite de 24 jours et déconnectait aussitôt pour 43 200 min)
  idleI = setInterval(() => {
    if (!S.me) return;
    const lim = Math.max(1, Math.min(Number(S.settings.idle) || 30, 525600)) * 60000;
    if (Date.now() - lastAct > lim) { lastAct = Date.now(); toast('Session expirée (inactivité)', 'err'); F.signOut(F.auth); }
  }, 20000);
}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));

// Pas de menu « Copier le lien / Télécharger / Partager » sur un appui long (liens, boutons, images, menus)
document.addEventListener('contextmenu', e => { if (e.target.closest?.('a,button,img,nav,aside,.nav,.tabbar,.chip,.lrow,.card,[data-act]') && !e.target.closest('input,textarea,[contenteditable]')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.closest?.('a,img')) e.preventDefault(); });

}

</script>
