e = solde précédent + entrées − sorties<\/b>.<\/p>\n<table>\n<thead><tr><th>N°<\/th><th>Libellé<\/th><th>Entrée (FC)<\/th><th>Sortie (FC)<\/th><th>Solde (FC)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>0<\/td><td>Report de la veille<\/td><td><\/td><td><\/td><td>85 000<\/td><\/tr>\n<tr><td>1<\/td><td>Vente comptant (savon)<\/td><td>60 000<\/td><td><\/td><td>145 000<\/td><\/tr>\n<tr><td>2<\/td><td>Achat de sachets d'emballage<\/td><td><\/td><td>40 000<\/td><td>105 000<\/td><\/tr>\n<tr><td>3<\/td><td>Vente comptant (sucre)<\/td><td>125 000<\/td><td><\/td><td>230 000<\/td><\/tr>\n<tr><td>4<\/td><td>Transport du livreur<\/td><td><\/td><td>15 000<\/td><td>215 000<\/td><\/tr>\n<tr><td>5<\/td><td>Paiement au fournisseur Mado<\/td><td><\/td><td>100 000<\/td><td>115 000<\/td><\/tr>\n<tr><td>6<\/td><td>Client Jonas rembourse sa dette<\/td><td>50 000<\/td><td><\/td><td>165 000<\/td><\/tr>\n<tr><td>Total<\/td><td><\/td><td>235 000<\/td><td>155 000<\/td><td>165 000<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Contrôle : 85 000 + 235 000 − 155 000 = 165 000 FC. Le soir, vous <b>comptez l'argent réel<\/b> dans le tiroir et vous le comparez au solde du livre. Si les deux sont égaux, la caisse est juste. Sinon, il y a une erreur, un oubli ou un vol à chercher le jour même.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Dans une pharmacie de quartier à Goma, la caissière remet chaque soir au patron le livre de caisse signé et l'argent compté. Un jour, le solde du livre est de 312 000 FC mais le tiroir contient 297 000 FC. Le patron relit les opérations : une vente de 15 000 FC avait été encaissée mais pas notée. Le livre est corrigé par une écriture datée (jamais avec une rature qui cache le chiffre d'origine) et la caisse est juste.<\/div>\n<h4>2. Le journal des ventes<\/h4>\n<p>Il liste, dans l'ordre des dates, <b>toutes les ventes<\/b> avec le numéro de facture, le client, le montant et le mode de paiement (comptant ou à crédit). Il permet de connaître vos ventes du mois et de suivre ce que les clients vous doivent.<\/p>\n<table>\n<thead><tr><th>Date<\/th><th>Facture<\/th><th>Client<\/th><th>Montant (FC)<\/th><th>Paiement<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>03/03<\/td><td>F-101<\/td><td>Client de passage<\/td><td>150 000<\/td><td>Comptant<\/td><\/tr>\n<tr><td>05/03<\/td><td>F-102<\/td><td>Restaurant Chez Tantine<\/td><td>220 000<\/td><td>Crédit (30 jours)<\/td><\/tr>\n<tr><td>09/03<\/td><td>F-103<\/td><td>École Les Étoiles<\/td><td>95 000<\/td><td>Crédit (15 jours)<\/td><\/tr>\n<tr><td colspan=\"3\">Total ventes<\/td><td>465 000<\/td><td>dont à crédit : 315 000<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>3. Le journal des achats<\/h4>\n<p>Même principe pour ce que vous <b>achetez<\/b> : marchandises, emballages, fournitures. Il indique le fournisseur, le numéro de sa facture, le montant et ce qui reste à payer. Il vous évite d'oublier une dette et sert à vérifier que le fournisseur ne vous facture pas deux fois.<\/p>\n<h4>Les pièces justificatives<\/h4>\n<ul>\n<li><b>Vente<\/b> : copie de la facture ou ticket de caisse numéroté.<\/li>\n<li><b>Achat<\/b> : facture ou bon de livraison du fournisseur.<\/li>\n<li><b>Petite dépense sans facture<\/b> (taxi, manutention) : un <b>bon de caisse<\/b> daté, signé et justifié.<\/li>\n<li><b>Banque<\/b> : relevé, bordereau de versement, avis de virement.<\/li>\n<\/ul>\n<h4>Bonnes habitudes<\/h4>\n<ol>\n<li>Une seule personne responsable de la caisse, un seul livre.<\/li>\n<li>Pas d'argent de la maison dans le tiroir de la boutique.<\/li>\n<li>Noter chaque prélèvement personnel avec un libellé « prélèvement ».<\/li>\n<li>Numéroter les factures dans l'ordre, sans trous.<\/li>\n<li>Classer les pièces par mois dans une chemise.<\/li>\n<\/ol>\n<div class=\"key\"><b>À retenir.<\/b> Livre de caisse : solde = ancien solde + entrées − sorties, comparé chaque soir à l'argent compté. Journal des ventes : toutes les factures de vente, avec ce qui est à crédit. Journal des achats : toutes les factures d'achat, avec ce qu'il reste à payer. Une pièce justificative derrière chaque ligne.<\/div>\n","quiz":[{"q":"Le livre de caisse affiche 120 000 FC au début. Entrées : 80 000 et 45 000 FC. Sorties : 60 000 et 25 000 FC. Quel est le solde ?","o":["160 000 FC","125 000 FC","245 000 FC","85 000 FC"],"a":1,"e":"120 000 + 125 000 − 85 000 = 160 000 FC."},{"q":"Quelle opération se note dans le journal des achats ?","o":["Un prélèvement pour la famille","Le salaire d'un employé","La facture d'un fournisseur de marchandises livrée à crédit","Une vente comptant au marché"],"a":3,"e":"Le journal des achats liste les factures reçues des fournisseurs."},{"q":"Trois ventes : 150 000 FC comptant, 220 000 FC à crédit et 95 000 FC à crédit. Combien reste à encaisser auprès des clients ?","o":["465 000 FC","315 000 FC","150 000 FC","95 000 FC"],"a":2,"e":"220 000 + 95 000 = 315 000 FC à encaisser ; les 150 000 FC sont déjà encaissés."},{"q":"Vous payez un taxi de 5 000 FC sans recevoir de facture. Que faites-vous ?","o":["Un bon de caisse daté et signé qui explique la dépense","Rien : c'est trop petit","Vous le notez comme une vente","Vous attendez la fin de l'année"],"a":0,"e":"Une petite dépense sans facture se justifie par un bon de caisse signé."}]},{"t":"Chapitre 3 — La partie double : débit et crédit avec des écritures de commerce","html":"\n<h4>Une idée simple : chaque opération a deux faces<\/h4>\n<p>Quand vous achetez des marchandises en payant avec la caisse, deux choses se passent : vous recevez des marchandises <b>et<\/b> votre caisse diminue. La <b>partie double<\/b> note les <b>deux faces<\/b> de chaque opération. On dit qu'on enregistre : <b>d'où vient la valeur<\/b> (le crédit) et <b>où elle va<\/b> (le débit). Le total des débits est toujours égal au total des crédits : si ce n'est pas le cas, il y a une erreur.<\/p>\n<h4>Débit et crédit : ce ne sont pas « bien » et « mal »<\/h4>\n<p><b>Débit<\/b> veut dire « colonne de gauche » et <b>crédit<\/b> « colonne de droite ». Rien d'autre. Ce qui compte, c'est l'effet sur chaque compte :<\/p>\n<table>\n<thead><tr><th>Type de compte<\/th><th>Augmente quand on…<\/th><th>Diminue quand on…<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Comptes d'actif (caisse, banque, stock, clients, matériel)<\/td><td>débite<\/td><td>crédite<\/td><\/tr>\n<tr><td>Comptes de charges (achats, loyer, transport, salaires)<\/td><td>débite<\/td><td>crédite<\/td><\/tr>\n<tr><td>Comptes de passif (capital, fournisseurs, emprunts)<\/td><td>crédite<\/td><td>débite<\/td><\/tr>\n<tr><td>Comptes de produits (ventes)<\/td><td>crédite<\/td><td>débite<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Quelques comptes du plan SYSCOHADA<\/h4>\n<p>Les numéros ci-dessous sont donnés à titre indicatif : ils suivent le plan de comptes en classes (1 ressources durables, 2 actif immobilisé, 3 stocks, 4 tiers, 5 trésorerie, 6 charges, 7 produits).<\/p>\n<ul>\n<li><b>101<\/b> Capital ; <b>521<\/b> Banque ; <b>571<\/b> Caisse<\/li>\n<li><b>311<\/b> Marchandises (stock) ; <b>401<\/b> Fournisseurs ; <b>411<\/b> Clients<\/li>\n<li><b>601<\/b> Achats de marchandises ; <b>622<\/b> Locations (loyer) ; <b>701<\/b> Ventes de marchandises<\/li>\n<\/ul>\n<h4>Une série d'écritures pour un commerce de pagnes à Mbuji-Mayi<\/h4>\n<p>Awa ouvre son commerce. Voici les opérations, dans l'ordre, chacune avec son débit et son crédit :<\/p>\n<table>\n<thead><tr><th>N°<\/th><th>Opération<\/th><th>Débit<\/th><th>Crédit<\/th><th>Montant (FC)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>Apport de capital déposé en banque<\/td><td>521 Banque<\/td><td>101 Capital<\/td><td>5 000 000<\/td><\/tr>\n<tr><td>2<\/td><td>Retrait de la banque vers la caisse<\/td><td>571 Caisse<\/td><td>521 Banque<\/td><td>1 500 000<\/td><\/tr>\n<tr><td>3<\/td><td>Achat de pagnes payé en caisse<\/td><td>601 Achats<\/td><td>571 Caisse<\/td><td>1 200 000<\/td><\/tr>\n<tr><td>4<\/td><td>Achat de pagnes à crédit chez un grossiste<\/td><td>601 Achats<\/td><td>401 Fournisseurs<\/td><td>800 000<\/td><\/tr>\n<tr><td>5<\/td><td>Vente comptant encaissée en caisse<\/td><td>571 Caisse<\/td><td>701 Ventes<\/td><td>1 500 000<\/td><\/tr>\n<tr><td>6<\/td><td>Vente à crédit à une cliente<\/td><td>411 Clients<\/td><td>701 Ventes<\/td><td>600 000<\/td><\/tr>\n<tr><td>7<\/td><td>Paiement partiel du fournisseur par la banque<\/td><td>401 Fournisseurs<\/td><td>521 Banque<\/td><td>500 000<\/td><\/tr>\n<tr><td>8<\/td><td>La cliente paie une partie en caisse<\/td><td>571 Caisse<\/td><td>411 Clients<\/td><td>300 000<\/td><\/tr>\n<tr><td>9<\/td><td>Loyer payé en caisse<\/td><td>622 Loyer<\/td><td>571 Caisse<\/td><td>200 000<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Que valent les comptes après ces écritures ?<\/h4>\n<ul>\n<li>Caisse : 1 500 000 − 1 200 000 + 1 500 000 + 300 000 − 200 000 = <b>1 900 000 FC<\/b><\/li>\n<li>Banque : 5 000 000 − 1 500 000 − 500 000 = <b>3 000 000 FC<\/b><\/li>\n<li>Clients : 600 000 − 300 000 = <b>300 000 FC<\/b> (à encaisser)<\/li>\n<li>Fournisseurs : 800 000 − 500 000 = <b>300 000 FC<\/b> (à payer)<\/li>\n<li>Capital : <b>5 000 000 FC<\/b> ; Achats : <b>2 000 000 FC<\/b> ; Ventes : <b>2 100 000 FC<\/b> ; Loyer : <b>200 000 FC<\/b><\/li>\n<\/ul>\n<p>Vérification : total des soldes débiteurs = 1 900 000 + 3 000 000 + 300 000 + 2 000 000 + 200 000 = <b>7 400 000 FC<\/b> ; total des soldes créditeurs = 5 000 000 + 300 000 + 2 100 000 = <b>7 400 000 FC<\/b>. Les deux totaux sont égaux : c'est la « balance » équilibrée.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Mbuji-Mayi, Awa constate que sa balance ne tombe pas juste : débits 7 400 000 FC, crédits 7 100 000 FC. Écart de 300 000 FC, exactement le montant de l'écriture 8. Elle avait noté le débit de la caisse mais oublié de diminuer le compte Clients. Une erreur d'un seul côté se retrouve grâce à l'équilibre débit/crédit.<\/div>\n<h4>Les outils de la partie double<\/h4>\n<ul>\n<li>Le <b>journal<\/b> : toutes les écritures dans l'ordre des dates.<\/li>\n<li>Le <b>grand livre<\/b> : les mêmes écritures, regroupées par compte.<\/li>\n<li>La <b>balance<\/b> : la liste des soldes de tous les comptes, qui doit être équilibrée.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Toute opération est notée deux fois : un compte débité, un compte crédité, pour le même montant. Actif et charges augmentent au débit ; passif et produits augmentent au crédit. Total des débits = total des crédits, toujours.<\/div>\n","quiz":[{"q":"Vous achetez des marchandises payées en caisse. Quelle est l'écriture ?","o":["Débit Caisse, crédit Achats","Débit Clients, crédit Achats","Débit Achats, crédit Caisse","Débit Ventes, crédit Caisse"],"a":3,"e":"Les achats sont une charge qui augmente au débit ; la caisse diminue donc on la crédite."},{"q":"Vous faites une vente de 600 000 FC à crédit. Quelle est l'écriture ?","o":["Débit Clients, crédit Ventes","Débit Ventes, crédit Clients","Débit Caisse, crédit Ventes","Débit Fournisseurs, crédit Ventes"],"a":0,"e":"Le client vous doit de l'argent (actif, débit) et la vente est un produit (crédit)."},{"q":"Un client règle en caisse 300 000 FC qu'il devait. Quels comptes sont touchés ?","o":["Débit Caisse, crédit Clients","Débit Ventes, crédit Caisse","Débit Clients, crédit Caisse","Débit Banque, crédit Ventes"],"a":1,"e":"La caisse augmente (débit) et la créance sur le client diminue (crédit)."},{"q":"Le compte Clients reçoit 900 000 FC de ventes à crédit au débit et 400 000 FC d'encaissements au crédit. Quel est son solde ?","o":["400 000 FC débiteur","500 000 FC débiteur","1 300 000 FC créditeur","500 000 FC créditeur"],"a":2,"e":"900 000 − 400 000 = 500 000 FC : le solde est débiteur, c'est ce que les clients doivent encore."}]},{"t":"Chapitre 4 — Le bilan et le compte de résultat simplifiés","html":"\n<h4>Deux photos de votre commerce<\/h4>\n<p>À la fin de l'année, la comptabilité produit deux documents principaux. Le <b>bilan<\/b> est une <b>photo à une date<\/b> (le 31 décembre, par exemple) : ce que le commerce possède et ce qu'il doit. Le <b>compte de résultat<\/b> est un <b>film de l'année<\/b> : tout ce qui a été gagné et dépensé pendant la période, et la différence, le <b>résultat<\/b>.<\/p>\n<h4>Le bilan : actif et passif<\/h4>\n<ul>\n<li>L'<b>actif<\/b> : ce que l'entreprise possède ou doit recevoir. Matériel, stock de marchandises, créances sur les clients, argent en banque et en caisse.<\/li>\n<li>Le <b>passif<\/b> : d'où vient l'argent qui a financé l'actif. Le capital apporté par le propriétaire, le résultat de l'année, les emprunts, les dettes envers les fournisseurs.<\/li>\n<\/ul>\n<p>Règle fondamentale : <b>total de l'actif = total du passif<\/b>. Ce que vous possédez a forcément été financé par vous ou par des tiers.<\/p>\n<table>\n<thead><tr><th>ACTIF (ce que j'ai)<\/th><th>FC<\/th><th>PASSIF (d'où ça vient)<\/th><th>FC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Matériel (valeur nette)<\/td><td>1 000 000<\/td><td>Capital<\/td><td>3 000 000<\/td><\/tr>\n<tr><td>Stock de marchandises<\/td><td>2 400 000<\/td><td>Résultat de l'année<\/td><td>700 000<\/td><\/tr>\n<tr><td>Clients (ils me doivent)<\/td><td>600 000<\/td><td>Emprunt à la microfinance<\/td><td>500 000<\/td><\/tr>\n<tr><td>Banque<\/td><td>900 000<\/td><td>Fournisseurs (je leur dois)<\/td><td>1 000 000<\/td><\/tr>\n<tr><td>Caisse<\/td><td>300 000<\/td><td><\/td><td><\/td><\/tr>\n<tr><td><b>Total actif<\/b><\/td><td><b>5 200 000<\/b><\/td><td><b>Total passif<\/b><\/td><td><b>5 200 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Vérification : 1 000 000 + 2 400 000 + 600 000 + 900 000 + 300 000 = 5 200 000 ; 3 000 000 + 700 000 + 500 000 + 1 000 000 = 5 200 000. Les deux côtés sont égaux. Les <b>capitaux propres<\/b> sont le capital plus le résultat : 3 700 000 FC. Ce que le propriétaire possède réellement, après avoir remboursé toutes les dettes (500 000 + 1 000 000 = 1 500 000 FC), est 5 200 000 − 1 500 000 = <b>3 700 000 FC<\/b>.<\/p>\n<h4>Le compte de résultat : produits moins charges<\/h4>\n<table>\n<thead><tr><th>Ligne<\/th><th>FC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Ventes de marchandises (produits)<\/td><td>9 600 000<\/td><\/tr>\n<tr><td>Coût d'achat des marchandises vendues<\/td><td>− 6 400 000<\/td><\/tr>\n<tr><td><b>Marge brute<\/b><\/td><td><b>3 200 000<\/b><\/td><\/tr>\n<tr><td>Loyer<\/td><td>− 1 000 000<\/td><\/tr>\n<tr><td>Salaire de l'aide en boutique (12 × 70 000)<\/td><td>− 840 000<\/td><\/tr>\n<tr><td>Transport<\/td><td>− 300 000<\/td><\/tr>\n<tr><td>Amortissement du matériel<\/td><td>− 200 000<\/td><\/tr>\n<tr><td>Dépenses diverses<\/td><td>− 160 000<\/td><\/tr>\n<tr><td><b>Résultat de l'année (bénéfice)<\/b><\/td><td><b>700 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Calcul : 9 600 000 − 6 400 000 = 3 200 000 ; charges = 1 000 000 + 840 000 + 300 000 + 200 000 + 160 000 = 2 500 000 ; 3 200 000 − 2 500 000 = <b>700 000 FC<\/b> (environ 304 $ au taux d'exemple de 1 $ = 2 300 FC ; le taux varie). Ce résultat se retrouve au passif du bilan : les deux documents sont liés.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mama Nadine, boutique d'épicerie à Kinshasa, présente ces deux tableaux à une microfinance pour demander un prêt de 1 500 000 FC. Le chargé de crédit regarde d'abord la marge brute (3 200 000 FC), puis le résultat (700 000 FC), puis le bilan : elle a déjà un emprunt de 500 000 FC et 1 000 000 FC de dettes fournisseurs. Il note que le résultat est positif et que l'activité est suivie. Sans ces chiffres, la discussion aurait reposé sur la seule parole.<\/div>\n<h4>Bénéfice ou perte ?<\/h4>\n<p>Si les produits dépassent les charges, c'est un <b>bénéfice<\/b> (résultat positif) ; sinon une <b>perte<\/b>. Une perte n'est pas une catastrophe si on la comprend : marge trop faible ? charges trop élevées ? ventes en baisse ?<\/p>\n<h4>Le résultat n'est pas l'argent en caisse<\/h4>\n<p>Attention : un bénéfice de 700 000 FC ne veut pas dire 700 000 FC en caisse. Le bénéfice a pu être investi dans du stock ou prêté aux clients. Le bilan montre où l'argent est « passé » : ici en grande partie dans le stock (2 400 000 FC) et les créances (600 000 FC).<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Bilan = photo : actif (ce que j'ai) = passif (d'où ça vient). Compte de résultat = film : produits − charges = résultat. Le résultat de l'année apparaît au passif du bilan. Marge brute = ventes − coût d'achat des marchandises vendues.<\/div>\n","quiz":[{"q":"Actif total 5 200 000 FC ; capital et résultat 3 700 000 FC ; emprunt 500 000 FC. Quelle est la dette envers les fournisseurs ?","o":["1 500 000 FC","3 700 000 FC","1 000 000 FC","500 000 FC"],"a":3,"e":"5 200 000 − 3 700 000 − 500 000 = 1 000 000 FC."},{"q":"Ventes : 4 000 000 FC ; coût d'achat des marchandises vendues : 2 600 000 FC ; autres charges : 900 000 FC. Quel est le résultat ?","o":["500 000 FC","1 400 000 FC","900 000 FC","−500 000 FC"],"a":1,"e":"4 000 000 − 2 600 000 − 900 000 = 500 000 FC de bénéfice."},{"q":"Dans le bilan, où range-t-on ce que les clients vous doivent ?","o":["À l'actif, comme créances","Au passif, comme capital","Au passif, comme emprunt","Dans les charges"],"a":0,"e":"Une créance sur un client est un droit : elle est à l'actif."},{"q":"Ventes : 9 600 000 FC ; coût d'achat des marchandises vendues : 6 400 000 FC. Quelle est la marge brute ?","o":["16 000 000 FC","3 200 000 FC","6 400 000 FC","700 000 FC"],"a":2,"e":"9 600 000 − 6 400 000 = 3 200 000 FC."}]},{"t":"Chapitre 5 — Stocks, créances clients, dettes fournisseurs et amortissement","html":"\n<h4>Quatre éléments qui donnent de la vérité à vos comptes<\/h4>\n<p>Un commerçant ne vend pas seulement contre de l'argent immédiat : il garde des marchandises en stock, fait crédit à des clients, achète à crédit et utilise du matériel pendant des années. La comptabilité doit en tenir compte, sinon le résultat est faux.<\/p>\n<h4>1. Le stock<\/h4>\n<p>Le <b>stock<\/b> est l'ensemble des marchandises achetées et pas encore vendues. Il est évalué à son <b>coût d'achat<\/b> (prix payé, plus transport et frais d'achat), jamais au prix de vente. Quand les achats se font à des prix différents, on utilise souvent le <b>coût moyen unitaire pondéré (CMUP)<\/b> : on divise la valeur totale par le nombre total d'unités.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépôt de farine à Lubumbashi achète 100 sacs à 20 000 FC, puis 50 sacs à 23 000 FC. Valeur totale : 100 × 20 000 + 50 × 23 000 = 2 000 000 + 1 150 000 = 3 150 000 FC pour 150 sacs. CMUP = 3 150 000 / 150 = <b>21 000 FC par sac<\/b>. En fin d'année, il reste 40 sacs : valeur du stock = 40 × 21 000 = <b>840 000 FC<\/b>. Les 110 sacs vendus ont donc coûté 110 × 21 000 = 2 310 000 FC.<\/div>\n<p>Avec la méthode SYSCOHADA, les achats de l'année sont enregistrés en charges (compte 601). À l'inventaire, on <b>compte le stock réel<\/b> et on corrige : <b>coût des marchandises vendues = stock de début + achats − stock de fin<\/b>. Exemple : stock de début 600 000 + achats 2 800 000 − stock de fin 840 000 = <b>2 560 000 FC<\/b> de marchandises vendues au coût d'achat.<\/p>\n<h4>2. Les créances clients<\/h4>\n<p>Une <b>créance<\/b> est une somme que quelqu'un vous doit. Vendre à crédit augmente les ventes, mais l'argent n'est pas encore là. Pour la gérer :<\/p>\n<ul>\n<li>tenir un <b>état des clients<\/b> : nom, facture, date, montant, échéance ;<\/li>\n<li>relancer dès le jour de l'échéance, par téléphone ou visite ;<\/li>\n<li>fixer un plafond de crédit par client ;<\/li>\n<li>repérer le client qui ne paie plus : une créance ancienne est une créance <b>douteuse<\/b>.<\/li>\n<\/ul>\n<p>Par <b>prudence<\/b>, si vous pensez qu'un client ne paiera probablement pas (par exemple 150 000 FC impayés depuis six mois), vous constatez ce risque dans les comptes (une <b>dépréciation<\/b>) et votre bénéfice baisse, même si vous continuez à relancer. Si la perte devient certaine, la créance est passée en perte.<\/p>\n<h4>3. Les dettes fournisseurs<\/h4>\n<p>Une <b>dette<\/b> est ce que vous devez. Les fournisseurs vous font parfois crédit à 15 ou 30 jours. C'est utile (un crédit gratuit), à condition de payer à temps pour garder leur confiance. Tenez un <b>état des fournisseurs<\/b> : facture, échéance, montant payé, reste à payer.<\/p>\n<h4>4. L'amortissement<\/h4>\n<p>Le matériel (étagères, congélateur, moto, ordinateur) sert pendant plusieurs années. Si vous mettiez tout le prix en charge l'année d'achat, cette année paraîtrait très mauvaise et les suivantes trop bonnes. On <b>répartit donc le coût sur la durée d'utilisation<\/b> : c'est l'<b>amortissement<\/b>. La méthode la plus simple est l'amortissement <b>linéaire<\/b> (le même montant chaque année) :<\/p>\n<p><b>Amortissement annuel = coût d'achat / durée d'utilisation en années<\/b><\/p>\n<table>\n<thead><tr><th>Bien<\/th><th>Coût (FC)<\/th><th>Durée<\/th><th>Amortissement annuel (FC)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Étagères et comptoir<\/td><td>1 200 000<\/td><td>6 ans<\/td><td>200 000<\/td><\/tr>\n<tr><td>Moto de livraison (1 500 $)<\/td><td>3 450 000<\/td><td>5 ans<\/td><td>690 000<\/td><\/tr>\n<tr><td>Ordinateur<\/td><td>1 800 000<\/td><td>3 ans<\/td><td>600 000<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La <b>valeur nette comptable<\/b> est le coût moins les amortissements cumulés. Pour la moto : après 2 ans, 3 450 000 − 2 × 690 000 = <b>2 070 000 FC<\/b>. Si la moto est achetée en cours d'année, on compte seulement les mois d'usage : achat au 1er avril = 9 mois, soit 690 000 × 9 / 12 = <b>517 500 FC<\/b> la première année. L'amortissement est une charge qui n'entraîne aucune sortie d'argent cette année-là : l'argent est sorti à l'achat.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Les durées d'amortissement données ici sont des exemples. Les durées et taux acceptés sur le plan fiscal en RDC peuvent différer : à vérifier auprès de l'administration compétente (taux et procédures peuvent changer).<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Stock évalué au coût d'achat (CMUP si les prix changent). Coût des marchandises vendues = stock de début + achats − stock de fin. Créances clients : suivre, relancer, constater le risque. Dettes fournisseurs : suivre et payer à l'échéance. Amortissement linéaire = coût / durée.<\/div>\n","quiz":[{"q":"Vous achetez 100 sacs à 20 000 FC puis 50 sacs à 23 000 FC. Quel est le coût moyen unitaire pondéré ?","o":["21 000 FC","21 500 FC","22 000 FC","20 500 FC"],"a":1,"e":"(2 000 000 + 1 150 000) / 150 = 21 000 FC."},{"q":"Une moto coûte 3 450 000 FC et s'amortit linéairement sur 5 ans. Quel est l'amortissement annuel ?","o":["1 150 000 FC","690 000 FC","345 000 FC","17 250 000 FC"],"a":2,"e":"3 450 000 / 5 = 690 000 FC."},{"q":"Même moto : quelle est sa valeur nette comptable après 2 ans ?","o":["2 070 000 FC","1 380 000 FC","2 760 000 FC","690 000 FC"],"a":0,"e":"3 450 000 − 2 × 690 000 = 2 070 000 FC."},{"q":"Un client doit 150 000 FC depuis six mois et ne répond plus. Quelle attitude respecte la prudence ?","o":["Effacer la vente des comptes sans trace","Compter ces 150 000 FC comme un bénéfice","Constater le risque de non-paiement dans les comptes et continuer à relancer","Ne rien changer : la vente a déjà été comptée"],"a":3,"e":"On note la dépréciation dès que la perte est probable, sans abandonner la relance."}]},{"t":"Chapitre 6 — Rapprochement caisse/banque et inventaire de fin d'année","html":"\n<h4>Contrôler pour pouvoir faire confiance aux chiffres<\/h4>\n<p>Tenir des comptes ne suffit pas : il faut vérifier régulièrement qu'ils correspondent à la réalité. Trois contrôles sont à connaître : le contrôle de la caisse, le rapprochement bancaire et l'inventaire du stock. Ils découvrent les erreurs, les oublis et les vols.<\/p>\n<h4>1. Le contrôle de la caisse<\/h4>\n<p>Chaque soir (ou au moins chaque semaine), on <b>compte l'argent réel<\/b> et on compare au <b>solde du livre de caisse<\/b>. Exemple : le livre indique 1 500 000 FC, le comptage donne 1 485 000 FC. Il manque <b>15 000 FC<\/b>.<\/p>\n<ol>\n<li>Recomptez et vérifiez l'addition du livre.<\/li>\n<li>Cherchez une opération oubliée (vente non notée, dépense sans bon).<\/li>\n<li>Si l'écart reste inexpliqué, notez-le, signé et daté, dans un compte d'écart : ne le cachez jamais en changeant un chiffre.<\/li>\n<li>Si les écarts se répètent, changez l'organisation (responsable unique, contrôle par une deuxième personne).<\/li>\n<\/ol>\n<h4>2. Le rapprochement bancaire<\/h4>\n<p>Votre banque vous envoie un <b>relevé<\/b>. Votre comptabilité a son propre compte « Banque ». Les deux soldes sont souvent différents, sans que personne n'ait fait d'erreur : certaines opérations ne sont pas connues des deux côtés en même temps. Le <b>rapprochement bancaire<\/b> explique cet écart ligne par ligne.<\/p>\n<p>Causes classiques :<\/p>\n<ul>\n<li>un <b>chèque émis<\/b> que votre fournisseur n'a pas encore encaissé : vous l'avez déjà comptabilisé, la banque pas encore ;<\/li>\n<li>un <b>versement<\/b> déposé tard dans la journée, pas encore crédité ;<\/li>\n<li>des <b>frais bancaires<\/b> ou intérêts prélevés par la banque dont vous n'avez pas encore tenu compte ;<\/li>\n<li>un <b>virement reçu<\/b> d'un client que vous découvrez sur le relevé ;<\/li>\n<li>une <b>erreur<\/b> de montant d'un côté ou de l'autre.<\/li>\n<\/ul>\n<table>\n<thead><tr><th>Rapprochement au 31 janvier<\/th><th>FC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Solde du relevé bancaire<\/td><td>2 260 000<\/td><\/tr>\n<tr><td>− Chèque émis non encore débité par la banque<\/td><td>− 300 000<\/td><\/tr>\n<tr><td><b>Solde bancaire corrigé<\/b><\/td><td><b>1 960 000<\/b><\/td><\/tr>\n<tr><td>Solde du compte Banque dans vos livres<\/td><td>2 000 000<\/td><\/tr>\n<tr><td>− Frais bancaires prélevés, non encore enregistrés<\/td><td>− 40 000<\/td><\/tr>\n<tr><td><b>Solde comptable corrigé<\/b><\/td><td><b>1 960 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Les deux soldes corrigés sont égaux : 1 960 000 FC. Il reste à <b>enregistrer<\/b> les frais de 40 000 FC dans vos comptes (une charge, avec la banque crédité). Le chèque, lui, ne demande aucune écriture : il sera débité par la banque plus tard.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un grossiste de boissons de Kananga constate que son relevé affiche 260 000 FC de plus que ses livres. Il fait le rapprochement : il avait émis un chèque de 300 000 FC non encore encaissé par son fournisseur, et la banque avait prélevé 40 000 FC de frais que lui ignorait. 300 000 − 40 000 = 260 000 FC : l'écart est entièrement expliqué, et il enregistre ses frais.<\/div>\n<h4>3. L'inventaire de fin d'année<\/h4>\n<p>L'<b>inventaire<\/b> est le recensement de tout ce que possède et doit le commerce à la clôture. La loi comptable oblige à le faire au moins une fois par an. Marche à suivre :<\/p>\n<ol>\n<li><b>Préparer<\/b> : fixer la date, arrêter les ventes pendant le comptage ou noter les mouvements, former des équipes de deux personnes.<\/li>\n<li><b>Compter le stock<\/b> article par article, noter la quantité réelle et l'état (abîmé, périmé, invendable).<\/li>\n<li><b>Comparer<\/b> avec le stock théorique (stock de début + entrées − sorties). Exemple : 120 cartons de savon attendus, 114 comptés : manque de 6 cartons × 8 500 FC = <b>51 000 FC<\/b> de perte à comprendre et à comptabiliser.<\/li>\n<li><b>Valoriser<\/b> au coût d'achat (ou à la valeur probable de vente si elle est plus basse, pour les produits abîmés ou périmés).<\/li>\n<li><b>Relever<\/b> les créances clients, dettes fournisseurs, argent en banque et en caisse, matériel.<\/li>\n<li><b>Enregistrer<\/b> les corrections : stock final, amortissements, dépréciations des créances douteuses.<\/li>\n<\/ol>\n<h4>Les écritures de fin d'année<\/h4>\n<p>Une fois l'inventaire fait, on ajuste les comptes : on constate le stock final, l'amortissement de l'année et les risques sur les créances. Ensuite on établit la balance, puis le bilan et le compte de résultat du chapitre 4.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Caisse : comparer le livre au comptage réel. Banque : rapprocher le relevé et les livres (chèques non débités, frais, virements) jusqu'à ce que les soldes corrigés soient égaux. Stock : inventaire annuel, comparaison théorique/réel, écarts expliqués et comptabilisés.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Le calendrier de clôture, les documents à déposer et leur durée de conservation dépendent de votre régime et de la loi en vigueur. À vérifier auprès de l'administration compétente (taux et procédures peuvent changer).<\/div>\n","quiz":[{"q":"Relevé bancaire : 2 260 000 FC. Chèque émis non encore débité : 300 000 FC. Quel est le solde bancaire corrigé ?","o":["2 000 000 FC","2 300 000 FC","1 960 000 FC","2 560 000 FC"],"a":3,"e":"2 260 000 − 300 000 = 1 960 000 FC."},{"q":"Le relevé montre 40 000 FC de frais bancaires que vous n'aviez pas notés. Que faites-vous ?","o":["Vous les enregistrez en charge dans vos comptes","Vous les ignorez : c'est la faute de la banque","Vous les ajoutez à vos ventes","Vous les enregistrez comme un apport de capital"],"a":0,"e":"Les frais sont une charge réelle : votre compte Banque doit diminuer de 40 000 FC."},{"q":"Le livre de caisse indique 1 500 000 FC, le comptage donne 1 485 000 FC. Quelle est la bonne réaction ?","o":["Ne rien faire tant que l'écart est petit","Rechercher la cause, noter l'écart et revoir l'organisation s'il se répète","Modifier le livre pour qu'il indique 1 485 000 FC sans rien noter","Ajouter 15 000 FC dans la caisse"],"a":2,"e":"L'écart de 15 000 FC doit être expliqué et tracé, jamais caché."},{"q":"Inventaire : 120 cartons attendus, 114 comptés, coût d'achat 8 500 FC le carton. Quelle est la valeur du manque ?","o":["51 000 FC","8 500 FC","102 000 FC","6 000 FC"],"a":1,"e":"6 cartons × 8 500 FC = 51 000 FC."}]},{"t":"Chapitre 7 — Lire ses états financiers et décider","html":"\n<h4>Des chiffres pour agir<\/h4>\n<p>Les états financiers ne servent pas à remplir un dossier : ils servent à <b>décider<\/b>. Avec quelques calculs simples, appelés <b>ratios<\/b>, vous transformez le bilan et le compte de résultat en réponses : puis-je augmenter mes prix ? pourquoi n'ai-je jamais d'argent ? puis-je emprunter ? Reprenons les chiffres de Mama Nadine (chapitre 4) : ventes 9 600 000 FC, coût d'achat des marchandises vendues 6 400 000 FC, résultat 700 000 FC, stock 2 400 000 FC, clients 600 000 FC, fournisseurs 1 000 000 FC, banque 900 000 FC, caisse 300 000 FC.<\/p>\n<h4>1. La rentabilité : gagne-t-on assez ?<\/h4>\n<ul>\n<li><b>Taux de marge brute<\/b> = marge brute / ventes = 3 200 000 / 9 600 000 = <b>33,3 %<\/b>. Sur 100 FC vendus, 33 FC restent après avoir payé la marchandise.<\/li>\n<li><b>Taux de résultat net<\/b> = résultat / ventes = 700 000 / 9 600 000 = <b>7,3 %<\/b>. Sur 100 FC vendus, 7 FC de bénéfice final.<\/li>\n<\/ul>\n<p>Pour fixer un prix à partir d'un coût : un article acheté 8 000 FC et vendu 10 000 FC donne une marge de 2 000 FC. Le <b>taux de marge<\/b> (sur le coût) est 2 000 / 8 000 = <b>25 %<\/b> ; le <b>taux de marque<\/b> (sur le prix de vente) est 2 000 / 10 000 = <b>20 %<\/b>. Ne confondez pas les deux.<\/p>\n<h4>2. Le stock : combien de temps dort-il ?<\/h4>\n<p>Rotation du stock = coût des marchandises vendues / stock = 6 400 000 / 2 400 000 ≈ <b>2,67 fois par an<\/b>. En jours : 360 / 2,67 ≈ <b>135 jours<\/b> en moyenne avant la vente. Un stock qui dort immobilise de l'argent, risque de se périmer ou d'être volé. Pour des produits frais ou des médicaments à date de péremption, 135 jours serait trop long.<\/p>\n<h4>3. Les clients : combien de temps pour être payé ?<\/h4>\n<p>Délai clients = clients / ventes × 360 = 600 000 / 9 600 000 × 360 = <b>22,5 jours<\/b>. Comparez au délai que vous accordez (15 ou 30 jours) : si vous êtes au-delà, les relances ne sont pas assez fermes.<\/p>\n<h4>4. Les fournisseurs : combien de temps pour payer ?<\/h4>\n<p>Délai fournisseurs (approché) = fournisseurs / achats × 360. En prenant 6 400 000 FC d'achats : 1 000 000 / 6 400 000 × 360 ≈ <b>56 jours<\/b>. Ici l'entreprise paie plus tard qu'elle n'est payée : elle est financée en partie par ses fournisseurs, ce qui aide la trésorerie, mais attention à ne pas dépasser les délais accordés.<\/p>\n<h4>5. La santé financière à court terme<\/h4>\n<p>Comparez ce que vous avez à court terme (stock 2 400 000 + clients 600 000 + banque 900 000 + caisse 300 000 = <b>4 200 000 FC<\/b>) avec ce que vous devez à court terme (fournisseurs 1 000 000 FC). Ratio = 4 200 000 / 1 000 000 = <b>4,2<\/b> : à première vue confortable. Mais si l'on retire le stock, difficile à vendre vite, il reste 1 800 000 FC contre 1 000 000 FC : <b>1,8<\/b>, encore correct. La <b>trésorerie<\/b> (banque + caisse) est de 1 200 000 FC, assez pour payer les fournisseurs.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un revendeur de téléphones de Goma a un résultat positif de 900 000 FC mais ne trouve jamais d'argent pour réapprovisionner. En lisant ses chiffres, il découvre que son stock tourne seulement 1,5 fois par an (240 jours) et que ses clients paient en 60 jours. Son bénéfice est enfermé dans des téléphones invendus et des crédits. Il décide : vendre à prix réduit les modèles qui dorment, exiger un acompte à la commande et fixer 15 jours maximum de crédit. Trois mois plus tard, sa trésorerie remonte sans qu'il ait emprunté.<\/div>\n<h4>Une méthode de lecture en 6 questions<\/h4>\n<ol>\n<li>Les ventes augmentent-elles par rapport à l'année dernière ?<\/li>\n<li>La marge brute tient-elle ou baisse-t-elle (prix d'achat en hausse, remises trop fortes) ?<\/li>\n<li>Quelles charges pèsent le plus (loyer, salaires, transport) ?<\/li>\n<li>Le stock est-il trop gros ou trop long à vendre ?<\/li>\n<li>Les clients paient-ils dans les délais ?<\/li>\n<li>Les prélèvements personnels sont-ils inférieurs au résultat ?<\/li>\n<\/ol>\n<div class=\"warn\"><b>Attention.<\/b> Les ratios donnent des repères, pas des vérités : un commerce de boissons et un commerce de pièces détachées n'ont pas les mêmes rotations. Comparez-vous d'abord à vous-même d'une année à l'autre. Les montants en dollars varient avec le taux de change.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Taux de marge brute = marge / ventes. Rotation du stock = coût des marchandises vendues / stock. Délai clients = clients / ventes × 360. Comparez ces chiffres d'année en année pour décider : prix, stock, crédit clients, emprunt, prélèvements. Gagner n'est pas avoir de l'argent : suivez aussi la trésorerie.<\/div>\n","quiz":[{"q":"Ventes : 9 600 000 FC ; marge brute : 3 200 000 FC. Quel est le taux de marge brute ?","o":["33,3 %","7,3 %","66,7 %","50 %"],"a":1,"e":"3 200 000 / 9 600 000 = 33,3 %."},{"q":"Clients : 600 000 FC ; ventes annuelles : 9 600 000 FC. Quel est le délai clients (base 360 jours) ?","o":["6 jours","225 jours","22,5 jours","60 jours"],"a":3,"e":"600 000 / 9 600 000 × 360 = 22,5 jours."},{"q":"Coût des marchandises vendues : 6 400 000 FC ; stock : 2 400 000 FC. Combien de jours le stock reste-t-il en moyenne (base 360) ?","o":["Environ 135 jours","Environ 45 jours","Environ 270 jours","Environ 15 jours"],"a":0,"e":"Rotation 6 400 000 / 2 400 000 ≈ 2,67 ; 360 / 2,67 ≈ 135 jours."},{"q":"Un article acheté 8 000 FC est vendu 10 000 FC. Quel est le taux de marque (marge / prix de vente) ?","o":["80 %","20 %","25 %","2 000 %"],"a":2,"e":"2 000 / 10 000 = 20 %. Le taux de marge sur le coût serait de 25 %."}]}],"exam":[{"q":"Quel ensemble de règles encadre la comptabilité des entreprises en RDC, en commun avec d'autres pays ?","o":["Le SYSCOHADA de l'OHADA","Un règlement propre à chaque marché","Les usages de chaque banque","Aucune règle commune"],"a":0,"e":"La RDC est membre de l'OHADA et applique le droit comptable commun (SYSCOHADA)."},{"q":"Ventes : 3 000 000 FC ; achats des marchandises vendues : 2 000 000 FC ; autres charges : 500 000 FC. Quel est le résultat ?","o":["5 500 000 FC","500 000 FC","1 000 000 FC","2 500 000 FC"],"a":2,"e":"3 000 000 − 2 000 000 − 500 000 = 500 000 FC."},{"q":"Livre de caisse : report 50 000 FC, entrées 300 000 FC, sorties 180 000 FC. Quel est le solde ?","o":["130 000 FC","250 000 FC","170 000 FC","530 000 FC"],"a":3,"e":"50 000 + 300 000 − 180 000 = 170 000 FC."},{"q":"Vous vendez 450 000 FC à crédit. Quelle est l'écriture ?","o":["Débit Clients, crédit Ventes","Débit Ventes, crédit Clients","Débit Caisse, crédit Clients","Débit Achats, crédit Ventes"],"a":1,"e":"Le client vous doit (actif, débit) ; la vente est un produit (crédit)."},{"q":"Que dit la règle de la partie double ?","o":["Chaque opération est notée en débit et en crédit pour le même montant","On note chaque opération deux fois dans la caisse","Le total des ventes doit égaler celui des achats","Les débits sont les mauvaises opérations, les crédits les bonnes"],"a":0,"e":"Débit et crédit sont deux colonnes ; les totaux sont toujours égaux."},{"q":"Vous achetez 700 000 FC de marchandises à crédit et payez 400 000 FC par la banque. Combien devez-vous encore au fournisseur ?","o":["700 000 FC","300 000 FC","400 000 FC","1 100 000 FC"],"a":2,"e":"700 000 − 400 000 = 300 000 FC."},{"q":"Dans le bilan, la dette envers un fournisseur se place :","o":["Au passif","À l'actif","Dans les produits","Dans les ventes"],"a":1,"e":"Une dette est une ressource fournie par un tiers : elle est au passif."},{"q":"Un congélateur coûte 2 400 000 FC et dure 4 ans (amortissement linéaire). Quel est l'amortissement annuel ?","o":["1 200 000 FC","240 000 FC","600 000 FC","2 400 000 FC"],"a":3,"e":"2 400 000 / 4 = 600 000 FC."},{"q":"Vous achetez 80 unités à 1 500 FC puis 20 unités à 2 000 FC. Quel est le CMUP ?","o":["1 600 FC","1 750 FC","1 500 FC","2 000 FC"],"a":0,"e":"(120 000 + 40 000) / 100 = 1 600 FC."},{"q":"Relevé de banque : 1 000 000 FC ; chèque émis non encore débité : 200 000 FC. Quel est le solde bancaire corrigé ?","o":["1 000 000 FC","800 000 FC","1 200 000 FC","200 000 FC"],"a":2,"e":"1 000 000 − 200 000 = 800 000 FC."},{"q":"Clients : 1 200 000 FC ; ventes annuelles : 7 200 000 FC. Quel est le délai clients (base 360 jours) ?","o":["60 jours","30 jours","6 jours","120 jours"],"a":1,"e":"1 200 000 / 7 200 000 × 360 = 60 jours."},{"q":"Votre résultat est de 700 000 FC mais la caisse est vide. Quelle explication est la plus probable ?","o":["La comptabilité est inutile","Le bénéfice est un montant fixe qu'il faut garder en caisse","Le bénéfice est immobilisé dans le stock, les crédits clients ou les prélèvements","Le bénéfice a disparu des comptes"],"a":3,"e":"Un résultat n'est pas de l'argent liquide : il peut être investi en stock, prêté aux clients ou prélevé."}]},{"id":"finance","title":"Finance du commerçant : trésorerie, crédit et rentabilité","icon":"💰","level":"Intermédiaire","hours":3,"summary":"Ce cours vous apprend à piloter l'argent de votre commerce : séparer vos finances personnelles, suivre la trésorerie, fixer des prix rentables et gérer le change entre francs congolais et dollars. Vous verrez aussi le crédit client, les tontines, la microfinance, le crédit bancaire, les ratios simples et la préparation d'un investissement.","goals":["Séparer l'argent de l'entreprise de l'argent personnel et distinguer bénéfice et trésorerie","Calculer marge, coefficient, seuil de rentabilité et prix de vente","Protéger ses prix et ses créances face à la variation du taux CDF/USD","Gérer le crédit client, le recouvrement et les dettes fournisseurs","Comparer épargne, tontine, microfinance et crédit bancaire, et calculer intérêts et mensualités","Lire les ratios simples et bâtir un plan de financement avant d'investir"],"chapters":[{"t":"Chapitre 1 — L'argent de l'entreprise, l'argent de la famille et la trésorerie","html":"\n<h4>Deux poches, deux comptes<\/h4>\n<p>Beaucoup de commerçants prennent dans la caisse pour payer les frais de scolarité, une réparation de la maison ou une fête de famille. Chaque prélèvement semble petit. Mais à la fin du mois, personne ne sait plus si la boutique gagne de l'argent ou non. Le premier principe de la finance du commerçant est donc simple : <b>l'argent de l'entreprise n'est pas votre argent personnel<\/b>. L'entreprise doit être traitée comme une personne à part, qui paie son loyer, son stock, ses employés, puis vous verse un salaire.<\/p>\n<h4>Comment séparer concrètement<\/h4>\n<ul>\n<li>Fixez-vous un <b>salaire mensuel<\/b> (ou une somme par semaine) que vous prenez à date fixe, et notez-le dans un cahier ou dans l'application.<\/li>\n<li>Ouvrez, si possible, un compte (banque, microfinance ou mobile money) réservé à l'activité.<\/li>\n<li>Si vous devez vraiment prélever en dehors du salaire, écrivez-le comme <b>prélèvement exceptionnel<\/b> avec la date et le montant.<\/li>\n<li>Ne payez pas une dépense de la maison avec l'argent du stock, et inversement.<\/li>\n<li>Si l'entreprise vous doit de l'argent (vous avez avancé de l'argent personnel), notez-le aussi.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mama Rose tient une boutique de produits alimentaires à Kinshasa. Chaque jour, elle prend entre 5 000 et 20 000 FC dans la caisse « pour dépanner ». Sur un mois, elle a pris 420 000 FC sans le noter. Elle voit un bénéfice de 300 000 FC dans son cahier et pense qu'elle gagne bien. En réalité, ses prélèvements dépassent son bénéfice de 120 000 FC : elle mange son stock. Après trois mois, ses étagères sont à moitié vides et elle ne comprend pas pourquoi. Depuis qu'elle se verse 250 000 FC par mois, le vendredi, elle voit enfin l'état réel de la boutique.<\/div>\n<h4>Bénéfice et trésorerie : deux choses différentes<\/h4>\n<p>Le <b>bénéfice<\/b> est ce que vous gagnez en vendant plus cher que vous n'avez payé, après avoir enlevé les charges. La <b>trésorerie<\/b> est l'argent que vous avez réellement à disposition : caisse, compte en banque, mobile money. On peut avoir un bon bénéfice et pas d'argent : vos clients vous doivent de l'argent, ou vous avez tout investi dans du nouveau stock. Une entreprise ne s'arrête pas par manque de bénéfice, mais par <b>manque d'argent disponible au moment de payer<\/b>.<\/p>\n<h4>Fonds de roulement, besoin en fonds de roulement, trésorerie<\/h4>\n<p>Trois notions vous aident à comprendre d'où vient votre argent disponible :<\/p>\n<ul>\n<li>Le <b>fonds de roulement (FR)<\/b> = ressources stables (apport personnel, bénéfices gardés, prêts de long terme) moins ce qui est immobilisé durablement (étagères, congélateur, véhicule). C'est la marge de sécurité de l'entreprise.<\/li>\n<li>Le <b>besoin en fonds de roulement (BFR)<\/b> = stock + créances clients (ce que les clients vous doivent) moins dettes fournisseurs (ce que vous devez). C'est l'argent que l'activité bloque.<\/li>\n<li>La <b>trésorerie<\/b> = FR − BFR. Elle doit être positive.<\/li>\n<\/ul>\n<table>\n<thead><tr><th>Élément<\/th><th>Montant (FC)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Capital et bénéfices gardés<\/td><td>6 000 000<\/td><\/tr>\n<tr><td>Prêt de long terme<\/td><td>2 000 000<\/td><\/tr>\n<tr><td>Total des ressources stables<\/td><td>8 000 000<\/td><\/tr>\n<tr><td>Étagères, congélateur (immobilisations)<\/td><td>3 500 000<\/td><\/tr>\n<tr><td><b>FR = 8 000 000 − 3 500 000<\/b><\/td><td><b>4 500 000<\/b><\/td><\/tr>\n<tr><td>Stock 3 000 000 + clients 1 200 000 − fournisseurs 1 700 000<\/td><td>BFR = 2 500 000<\/td><\/tr>\n<tr><td><b>Trésorerie = 4 500 000 − 2 500 000<\/b><\/td><td><b>2 000 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Vérification : la caisse et le compte de Mama Rose contiennent bien 2 000 000 FC. Si elle décidait d'acheter un second congélateur de 2 500 000 FC avec cet argent, son FR tomberait à 2 000 000 et sa trésorerie deviendrait négative (2 000 000 − 2 500 000 = −500 000) : elle ne pourrait plus payer un fournisseur à temps.<\/p>\n<h4>Le plan de trésorerie mensuel<\/h4>\n<p>Chaque début de mois, écrivez ce que vous pensez encaisser (ventes au comptant, clients qui paient) et ce que vous devrez payer (fournisseurs, loyer, salaires, transport, électricité). Ajoutez l'argent disponible au départ. Si le solde prévu devient négatif une semaine précise, vous avez le temps d'agir : relancer des clients, négocier un délai, reporter un achat.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Séparez l'argent de la famille et celui de la boutique grâce à un salaire fixe. Le bénéfice n'est pas la trésorerie : surveillez l'argent réellement disponible. Trésorerie = fonds de roulement − besoin en fonds de roulement, et elle doit rester positive.<\/div>\n","quiz":[{"q":"Mama Rose prend 15 000 FC dans la caisse chaque jour pour la maison sans rien noter. Quel est le principal danger ?","o":["Elle ne peut plus savoir si la boutique est réellement rentable et vide peu à peu son stock","Aucun, car c'est son argent de toute façon","Elle paie trop d'impôts","Ses clients achètent moins"],"a":0,"e":"Sans notes, les prélèvements se confondent avec les dépenses de l'entreprise. Un salaire fixe noté permet de voir le vrai résultat."},{"q":"Une entreprise a 8 000 000 FC de ressources stables et 3 500 000 FC d'immobilisations. Quel est son fonds de roulement ?","o":["11 500 000 FC","4 500 000 FC","3 500 000 FC","8 000 000 FC"],"a":2,"e":"FR = ressources stables − immobilisations = 8 000 000 − 3 500 000 = 4 500 000 FC."},{"q":"Stock : 3 000 000 FC ; clients : 1 200 000 FC ; fournisseurs : 1 700 000 FC. Quel est le BFR ?","o":["2 500 000 FC","5 900 000 FC","4 200 000 FC","1 500 000 FC"],"a":1,"e":"BFR = stock + créances clients − dettes fournisseurs = 3 000 000 + 1 200 000 − 1 700 000 = 2 500 000 FC."},{"q":"Un FR de 5 000 000 FC et un BFR de 3 200 000 FC : que vaut la trésorerie et que signifie-t-elle ?","o":["1 800 000 FC, positive : l'entreprise a de l'argent disponible","8 200 000 FC, c'est le bénéfice","1 800 000 FC, négative : l'entreprise est en difficulté","3 200 000 FC, c'est le stock"],"a":0,"e":"Trésorerie = 5 000 000 − 3 200 000 = 1 800 000 FC. Un résultat positif signifie qu'il reste de l'argent disponible."}]},{"t":"Chapitre 2 — Marge, coefficient, seuil de rentabilité et prix de vente","html":"\n<h4>Le prix d'achat n'est pas le coût d'achat<\/h4>\n<p>Avant de fixer un prix, il faut connaître ce que la marchandise vous coûte <b>vraiment<\/b> une fois dans votre boutique. C'est le <b>coût d'achat<\/b> : prix chez le fournisseur + transport + déchargement + taxes ou frais de passage + tout ce qui est payé pour amener l'article chez vous. Beaucoup de commerçants oublient le transport et se trompent sur leur marge.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un commerçant de Lubumbashi achète un carton de savon à 60 000 FC. Il paie 4 000 FC de transport et 2 000 FC de manutention. Son coût d'achat est 60 000 + 4 000 + 2 000 = <b>66 000 FC<\/b>, pas 60 000 FC. S'il vendait à 65 000 FC en croyant gagner 5 000 FC, il perdrait en réalité 1 000 FC par carton.<\/div>\n<h4>Marge, taux de marge, taux de marque, coefficient<\/h4>\n<ul>\n<li><b>Marge brute<\/b> = prix de vente − coût d'achat (en FC).<\/li>\n<li><b>Taux de marge<\/b> = marge ÷ coût d'achat. C'est le pourcentage que l'on ajoute au coût d'achat.<\/li>\n<li><b>Taux de marque<\/b> = marge ÷ prix de vente. C'est la part du prix de vente qui reste après avoir payé la marchandise.<\/li>\n<li><b>Coefficient multiplicateur<\/b> = prix de vente ÷ coût d'achat. On multiplie le coût d'achat par ce nombre pour trouver le prix de vente.<\/li>\n<\/ul>\n<table>\n<thead><tr><th>Sac de farine 25 kg<\/th><th>Calcul<\/th><th>Résultat<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Coût d'achat<\/td><td>donné<\/td><td>38 000 FC<\/td><\/tr>\n<tr><td>Prix de vente<\/td><td>donné<\/td><td>46 000 FC<\/td><\/tr>\n<tr><td>Marge<\/td><td>46 000 − 38 000<\/td><td>8 000 FC<\/td><\/tr>\n<tr><td>Taux de marge<\/td><td>8 000 ÷ 38 000<\/td><td>21,1 %<\/td><\/tr>\n<tr><td>Taux de marque<\/td><td>8 000 ÷ 46 000<\/td><td>17,4 %<\/td><\/tr>\n<tr><td>Coefficient<\/td><td>46 000 ÷ 38 000<\/td><td>1,21<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Remarquez que le taux de marque est toujours plus petit que le taux de marge. Quand un fournisseur dit « je prends 20 % », demandez : 20 % de quoi ? Du coût d'achat ou du prix de vente ? Ce n'est pas la même chose : une marge de 25 % sur le coût d'achat correspond à seulement 20 % du prix de vente.<\/p>\n<h4>Fixer un prix de vente<\/h4>\n<ol>\n<li>Calculez le coût d'achat complet.<\/li>\n<li>Choisissez un coefficient selon le produit : plus petit pour les produits très comparés (sucre, farine), plus grand pour les produits peu comparables ou à faible rotation.<\/li>\n<li>Comparez avec les prix du marché de votre quartier.<\/li>\n<li>Arrondissez à un prix pratique (des montants faciles à rendre en monnaie).<\/li>\n<\/ol>\n<p>Pour le carton de savon : 66 000 × 1,3 = 85 800 FC, arrondi à 86 000 FC.<\/p>\n<h4>Les charges fixes et le seuil de rentabilité<\/h4>\n<p>Une marge ne sert à rien si elle ne couvre pas les charges. Les <b>charges fixes<\/b> sont celles que l'on paie même si l'on ne vend rien : loyer, salaires, électricité, téléphone. Le <b>seuil de rentabilité<\/b> est le chiffre d'affaires minimum pour ne ni gagner ni perdre.<\/p>\n<p>Formule : <b>seuil de rentabilité = charges fixes ÷ taux de marque<\/b>.<\/p>\n<p>Exemple : loyer 400 000 + salaire de l'employé 350 000 + électricité et téléphone 150 000 = 900 000 FC par mois. Le taux de marque moyen de la boutique est de 20 %. Seuil = 900 000 ÷ 0,20 = <b>4 500 000 FC<\/b> de ventes par mois, soit 150 000 FC par jour sur 30 jours. Chaque jour où l'on vend moins, on s'éloigne du bénéfice. À 6 000 000 FC de ventes, la marge est de 1 200 000 FC ; après 900 000 FC de charges, il reste 300 000 FC de bénéfice.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne baissez pas vos prix pour attirer des clients sans recalculer : passer d'un taux de marque de 20 % à 10 % double le seuil de rentabilité (900 000 ÷ 0,10 = 9 000 000 FC). Vous devez alors vendre deux fois plus pour gagner autant.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Partez du coût d'achat complet. Prix de vente = coût d'achat × coefficient. Taux de marge = marge ÷ coût d'achat ; taux de marque = marge ÷ prix de vente. Seuil de rentabilité = charges fixes ÷ taux de marque. Connaître son seuil, c'est savoir combien vendre chaque jour.<\/div>\n","quiz":[{"q":"Coût d'achat 12 000 FC, coefficient 1,25. Quel est le prix de vente ?","o":["15 000 FC","13 500 FC","14 400 FC","12 250 FC"],"a":0,"e":"12 000 × 1,25 = 15 000 FC."},{"q":"Un article coûte 12 000 FC et se vend 15 000 FC. Quel est le taux de marque ?","o":["20 %","25 %","30 %","3 000 %"],"a":1,"e":"Marge = 3 000 FC. Taux de marque = 3 000 ÷ 15 000 = 20 %. (Le taux de marge serait 25 %.)"},{"q":"Charges fixes de 600 000 FC par mois, taux de marque de 25 %. Quel est le seuil de rentabilité mensuel ?","o":["800 000 FC","1 500 000 FC","2 400 000 FC","150 000 FC"],"a":3,"e":"600 000 ÷ 0,25 = 2 400 000 FC de ventes par mois."},{"q":"Prix chez le fournisseur : 40 000 FC ; transport 3 000 FC ; déchargement 2 000 FC. Avec un coefficient de 1,2, quel prix de vente ?","o":["50 400 FC","54 000 FC","48 000 FC","45 000 FC"],"a":2,"e":"Coût d'achat = 45 000 FC ; 45 000 × 1,2 = 54 000 FC. Calculer sur 40 000 donnerait 48 000 FC et ferait perdre de la marge."}]},{"t":"Chapitre 3 — Gérer le change entre francs congolais et dollars","html":"\n<h4>Pourquoi le taux de change vous concerne<\/h4>\n<p>En RDC, beaucoup de commerçants achètent en dollars (importation, grossistes) et vendent en francs congolais (FC), ou l'inverse. Le <b>taux de change<\/b> est le prix d'un dollar en francs. Dans ce cours nous utilisons l'exemple <b>1 $ = 2 300 FC<\/b>, mais ce taux <b>varie<\/b> : il peut changer d'une semaine à l'autre et être différent d'un lieu à l'autre. Si vous ne suivez pas le taux, votre marge peut disparaître sans que vous vendiez moins.<\/p>\n<h4>Conversions de base<\/h4>\n<ul>\n<li>De dollars en francs : montant en $ × taux. Exemple : 150 $ × 2 300 = 345 000 FC.<\/li>\n<li>De francs en dollars : montant en FC ÷ taux. Exemple : 1 150 000 FC ÷ 2 300 = 500 $.<\/li>\n<\/ul>\n<p>Chez le changeur, il y a deux prix : celui où il <b>achète<\/b> vos dollars (plus bas) et celui où il <b>vend<\/b> des dollars (plus haut). La différence est son gain. Si vous vendez 1 000 $ à 2 280 FC, vous recevez 2 280 000 FC ; si le lendemain vous les rachetez à 2 320 FC, il faut 2 320 000 FC : l'aller-retour coûte 40 000 FC. Évitez de changer plusieurs fois sans raison.<\/p>\n<h4>Le piège du prix fixé avec l'ancien taux<\/h4>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Patrick vend des téléphones à Goma. Il achète un modèle à 100 $ à Dubaï et le revend 280 000 FC. Au taux de 2 300 FC, le coût est 230 000 FC : marge de 50 000 FC. Mais lorsque Patrick veut racheter le même modèle, le taux est monté à 2 500 FC : le téléphone lui coûte maintenant 250 000 FC. Sa marge réelle est de 30 000 FC. Il a vendu au même prix, mais il peut racheter moins de produits avec son argent.<\/div>\n<table>\n<thead><tr><th>Taux (FC pour 1 $)<\/th><th>Coût de 100 $<\/th><th>Marge si vente 280 000 FC<\/th><th>Prix pour garder +20 % sur le coût<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>2 300<\/td><td>230 000 FC<\/td><td>50 000 FC<\/td><td>276 000 FC<\/td><\/tr>\n<tr><td>2 400<\/td><td>240 000 FC<\/td><td>40 000 FC<\/td><td>288 000 FC<\/td><\/tr>\n<tr><td>2 500<\/td><td>250 000 FC<\/td><td>30 000 FC<\/td><td>300 000 FC<\/td><\/tr>\n<tr><td>2 600<\/td><td>260 000 FC<\/td><td>20 000 FC<\/td><td>312 000 FC<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La règle : fixez vos prix selon le <b>coût de remplacement<\/b>, c'est-à-dire ce que coûtera le produit quand vous le rachèterez, et non selon ce que vous l'avez payé hier.<\/p>\n<h4>Les créances en francs perdent de la valeur quand le franc baisse<\/h4>\n<p>Si vous vendez à crédit en francs, vous êtes payé plus tard avec une monnaie qui peut valoir moins. Une créance de 4 600 000 FC vaut 2 000 $ au taux de 2 300 FC. Si le client paie dans 30 jours alors que le taux est 2 500 FC, la même somme ne vaut plus que 1 840 $ (4 600 000 ÷ 2 500) : vous avez perdu 160 $. Quand le franc remonte, c'est l'inverse, mais on ne peut pas compter dessus.<\/p>\n<h4>Les bons réflexes<\/h4>\n<ol>\n<li>Notez chaque jour le taux utilisé (celui du marché de votre ville) dans votre cahier.<\/li>\n<li>Calculez vos coûts en dollars si vous achetez en dollars, puis convertissez au taux du jour.<\/li>\n<li>Réévaluez vos prix régulièrement, par exemple chaque semaine, ou quand le taux bouge nettement.<\/li>\n<li>Gardez une partie de votre trésorerie dans la monnaie dans laquelle vous payez vos fournisseurs.<\/li>\n<li>Pour les ventes à crédit importantes, convenez de la monnaie de paiement dès le départ, par écrit.<\/li>\n<li>Ne gardez pas de grosses sommes dans une monnaie qui perd de la valeur sans besoin.<\/li>\n<\/ol>\n<div class=\"warn\"><b>Attention.<\/b> Les règles sur l'usage des devises, les prix affichés en dollars et les opérations de change sont fixées par les autorités (Banque centrale du Congo et textes en vigueur) et peuvent changer. À vérifier auprès de l'administration compétente avant toute opération importante. Les taux de ce cours sont des exemples.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Le taux de change varie : suivez-le. FC → $ : diviser par le taux ; $ → FC : multiplier. Fixez vos prix sur le coût de remplacement, protégez vos créances et gardez de l'argent dans la monnaie de vos achats. Éviter les allers-retours inutiles chez le changeur.<\/div>\n","quiz":[{"q":"Au taux de 2 300 FC pour 1 $, combien font 150 $ en francs ?","o":["345 000 FC","15 333 FC","2 450 FC","34 500 FC"],"a":1,"e":"150 × 2 300 = 345 000 FC."},{"q":"Combien de dollars valent 1 150 000 FC au taux de 2 300 FC ?","o":["2 645 $","500 $","250 $","50 $"],"a":2,"e":"1 150 000 ÷ 2 300 = 500 $."},{"q":"Un téléphone coûte 100 $ et se vend 280 000 FC. Le taux passe de 2 300 à 2 500 FC. Quelle est la marge quand on le rachète ?","o":["30 000 FC","50 000 FC","20 000 FC","280 000 FC"],"a":1,"e":"Coût de remplacement = 100 × 2 500 = 250 000 FC ; marge = 280 000 − 250 000 = 30 000 FC."},{"q":"Une créance de 4 600 000 FC est payée quand le taux est de 2 500 FC (elle valait 2 000 $ à 2 300 FC). Combien vaut-elle en dollars ?","o":["1 840 $","2 000 $","2 160 $","1 150 $"],"a":0,"e":"4 600 000 ÷ 2 500 = 1 840 $ : une perte de 160 $ due à la baisse du franc."}]},{"t":"Chapitre 4 — Crédit client, recouvrement et dettes fournisseurs","html":"\n<h4>Vendre à crédit : un service qui a un coût<\/h4>\n<p>Vendre à crédit attire des clients, surtout les gros (restaurants, bars, écoles, entreprises). Mais chaque vente à crédit est un <b>prêt sans intérêt<\/b> que vous faites au client avec votre argent. Pendant que vous attendez, vous ne pouvez pas racheter de stock. Et si le client ne paie pas, la perte est lourde, parce que vous avez perdu le prix d'achat et pas seulement la marge.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un grossiste de boissons de Kananga vend à crédit un lot de 500 000 FC à un bar. Sa marge sur cette vente est de 20 %, soit 100 000 FC. Si le bar ne paie jamais, le grossiste perd 500 000 FC. Pour récupérer cette perte, il doit réaliser 5 ventes semblables qui rapportent chacune 100 000 FC de marge (500 000 ÷ 100 000 = 5), seulement pour revenir à zéro. Un seul impayé efface donc le travail de plusieurs ventes.<\/div>\n<h4>Une politique de crédit en cinq règles<\/h4>\n<ol>\n<li><b>Choisir les clients.<\/b> Connaître son adresse, son activité, son historique de paiement, demander des références.<\/li>\n<li><b>Fixer une limite.<\/b> Un plafond de crédit par client, adapté à sa taille et à ses habitudes.<\/li>\n<li><b>Fixer un délai.<\/b> 7, 15 ou 30 jours, par écrit sur le bon de livraison ou la facture.<\/li>\n<li><b>Garder une preuve.<\/b> Bon de commande ou de livraison signé, facture, parfois un acompte (une partie payée d'avance).<\/li>\n<li><b>Suivre les paiements.<\/b> Un cahier ou un tableau des créances, mis à jour chaque semaine.<\/li>\n<\/ol>\n<p>Exemple de limite : un client a une limite de 1 000 000 FC. Il doit déjà 850 000 FC et demande 400 000 FC de plus. Le total serait de 1 250 000 FC, au-dessus de la limite. Vous pouvez accepter 150 000 FC à crédit et demander le reste au comptant, ou demander d'abord un règlement de l'ancienne dette.<\/p>\n<h4>Le tableau des créances par ancienneté<\/h4>\n<table>\n<thead><tr><th>Client<\/th><th>0-30 jours<\/th><th>31-60 jours<\/th><th>61-90 jours<\/th><th>Plus de 90 jours<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Bar A<\/td><td>300 000 FC<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>Restaurant B<\/td><td>0<\/td><td>250 000 FC<\/td><td>150 000 FC<\/td><td>0<\/td><\/tr>\n<tr><td>Boutique C<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>400 000 FC<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Plus une dette est ancienne, moins on a de chances d'être payé. La boutique C est un signal d'alarme : agissez tout de suite.<\/p>\n<h4>Relancer sans fâcher le client<\/h4>\n<ul>\n<li>3 jours avant l'échéance : un message ou un appel poli de rappel.<\/li>\n<li>Le lendemain du retard : appel ou visite, demandez une date précise de paiement.<\/li>\n<li>Après 7 jours : second contact, proposez un paiement en deux fois s'il est de bonne foi.<\/li>\n<li>Après 15 à 30 jours : lettre de mise en demeure (écrit qui demande formellement de payer), arrêt des nouvelles livraisons.<\/li>\n<li>En dernier recours : voie légale. L'OHADA prévoit des procédures de recouvrement, mais elles prennent du temps et des frais.<\/li>\n<\/ul>\n<p>Pour encourager le paiement rapide, vous pouvez offrir un <b>escompte<\/b> (une petite réduction pour paiement comptant). Exemple : 2 % sur 1 800 000 FC = 36 000 FC. Cela peut être moins cher que d'attendre trente jours et de risquer l'impayé.<\/p>\n<h4>Vos propres dettes envers les fournisseurs<\/h4>\n<p>Le crédit fournisseur est une ressource précieuse : il vous permet de vendre avant de payer. Pour le garder :<\/p>\n<ul>\n<li>Payez à la date promise, même par petits versements.<\/li>\n<li>Si vous ne pouvez pas, prévenez avant l'échéance et proposez un calendrier ; ne disparaissez pas.<\/li>\n<li>Négociez des délais plus longs quand vous achetez de gros volumes.<\/li>\n<li>Ne payez pas trop tôt si le fournisseur n'offre pas d'escompte : gardez votre argent utile aussi longtemps que possible.<\/li>\n<\/ul>\n<p>L'idéal est de récupérer l'argent de vos clients <b>plus vite<\/b> que vous ne payez vos fournisseurs. Si vous payez vos fournisseurs à 30 jours mais attendez vos clients 60 jours, vous financez vous-même 30 jours d'activité.<\/p>\n<div class=\"warn\"><b>Attention.<\/b> Ne menacez pas et n'utilisez jamais la violence ni la pression illégale pour récupérer une dette. Les règles de recouvrement et les délais légaux peuvent changer ; à vérifier auprès de l'administration compétente ou d'un juriste avant une action en justice.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Le crédit client est un prêt sans intérêt : choisissez, plafonnez, documentez et suivez. Relancez tôt et avec méthode. Soignez vos fournisseurs en payant à temps, et essayez d'encaisser plus vite que vous ne payez.<\/div>\n","quiz":[{"q":"Un impayé de 500 000 FC sur une vente où la marge était de 20 % (100 000 FC). Combien de ventes semblables faut-il pour compenser la perte ?","o":["2 ventes","10 ventes","5 ventes","1 vente"],"a":3,"e":"500 000 ÷ 100 000 = 5 ventes semblables, uniquement pour revenir à zéro."},{"q":"Vous offrez 3 % d'escompte pour paiement comptant sur une facture de 2 000 000 FC. Quelle est la réduction ?","o":["30 000 FC","60 000 FC","6 000 FC","600 000 FC"],"a":2,"e":"2 000 000 × 0,03 = 60 000 FC."},{"q":"Un client dépasse de 3 jours la date de paiement. Quelle est la meilleure première réaction ?","o":["Le contacter poliment et obtenir une date précise de paiement","Porter plainte immédiatement","L'oublier jusqu'à la fin du mois","Augmenter ses prix la prochaine fois sans rien dire"],"a":1,"e":"Une relance rapide et courtoise est la plus efficace et conserve la relation. Les procédures légales sont un dernier recours."},{"q":"Limite de crédit du client : 1 000 000 FC. Il doit déjà 850 000 FC et veut 400 000 FC de plus. Que faites-vous ?","o":["Refuser de lui vendre à jamais","Accepter 150 000 FC à crédit et le reste au comptant, ou demander un règlement de l'ancienne dette","Accepter les 400 000 FC sans condition","Doubler sa limite sans rien vérifier"],"a":2,"e":"La limite protège votre trésorerie : 1 000 000 − 850 000 = 150 000 FC de crédit possible."}]},{"t":"Chapitre 5 — Épargne, tontines, microfinance et crédit bancaire","html":"\n<h4>Où trouver de l'argent, où le placer<\/h4>\n<p>Un commerçant a besoin d'argent pour acheter du stock, remplacer un équipement ou traverser une période creuse. Il a plusieurs options : épargner lui-même, utiliser une tontine, emprunter à une microfinance ou à une banque. Chacune a ses avantages et son coût. Pour comparer, il faut savoir calculer ce que l'argent emprunté coûte réellement.<\/p>\n<h4>Les intérêts : simple et composé<\/h4>\n<p>L'<b>intérêt<\/b> est le prix de l'argent prêté. Le <b>taux d'intérêt<\/b> est ce prix en pourcentage, pour une période (mois, an).<\/p>\n<ul>\n<li><b>Intérêt simple<\/b> : calculé toujours sur le capital de départ. Intérêt = capital × taux × nombre de périodes.<\/li>\n<li><b>Intérêt composé<\/b> : les intérêts s'ajoutent au capital et produisent à leur tour des intérêts. Capital final = capital × (1 + taux) puissance le nombre de périodes.<\/li>\n<\/ul>\n<p>Exemple simple : un prêt de 1 000 000 FC à 3 % par mois pendant 6 mois, remboursé à la fin, coûte 1 000 000 × 0,03 × 6 = 180 000 FC. On rembourse 1 180 000 FC. Cela équivaut à 36 % par an, un coût important qui doit être payé par la marge de votre activité.<\/p>\n<p>Exemple composé : une épargne de 1 000 000 FC placée à 1 % par mois, intérêts laissés sur le compte, devient 1 126 825 FC au bout de 12 mois (1 000 000 × 1,01 douze fois), soit un peu plus que les 120 000 FC de l'intérêt simple.<\/p>\n<h4>Le remboursement par mensualités<\/h4>\n<p>Beaucoup de crédits se remboursent en mensualités égales. Chaque versement contient une part de capital et une part d'intérêts, calculés sur ce qu'il reste à rembourser. Exemple : prêt de 1 200 000 FC à 3 % par mois sur 6 mois. La mensualité est d'environ 221 517 FC. Le total remboursé est d'environ 1 329 102 FC : les intérêts totaux sont d'environ 129 102 FC.<\/p>\n<table>\n<thead><tr><th>Mois<\/th><th>Intérêt du mois<\/th><th>Capital remboursé<\/th><th>Reste dû<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>36 000<\/td><td>185 517<\/td><td>1 014 483<\/td><\/tr>\n<tr><td>2<\/td><td>30 434<\/td><td>191 083<\/td><td>823 400<\/td><\/tr>\n<tr><td>3<\/td><td>24 702<\/td><td>196 815<\/td><td>626 586<\/td><\/tr>\n<tr><td>4<\/td><td>18 798<\/td><td>202 719<\/td><td>423 866<\/td><\/tr>\n<tr><td>5<\/td><td>12 716<\/td><td>208 801<\/td><td>215 065<\/td><\/tr>\n<tr><td>6<\/td><td>6 452<\/td><td>215 065<\/td><td>0<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Les montants sont en FC, arrondis. Le coût est plus faible que dans l'exemple à 1 000 000 FC remboursé en une fois, parce que vous rendez le capital peu à peu et que les intérêts baissent.<\/p>\n<h4>La tontine<\/h4>\n<p>La <b>tontine<\/b> est un groupe d'épargne : chaque membre verse une somme à chaque réunion et, à tour de rôle, un membre reçoit le total. Avec 10 membres qui versent 50 000 FC par mois, le bénéficiaire du mois reçoit 500 000 FC. Pas d'intérêt, pas de dossier, et la pression du groupe aide à épargner. Mais :<\/p>\n<ul>\n<li>Celui qui reçoit en dernier a prêté de l'argent aux autres sans rien gagner.<\/li>\n<li>Si un membre quitte le groupe après avoir reçu, les autres perdent.<\/li>\n<li>Les règles (ordre, retard, absence) doivent être claires, de préférence écrites.<\/li>\n<\/ul>\n<h4>Microfinance et banque<\/h4>\n<p>Les <b>institutions de microfinance<\/b> accordent de petits crédits, souvent à court terme et avec peu de papiers, parfois en groupe. Les <b>banques<\/b> demandent plus de documents (identification, comptabilité, historique du compte) et des <b>garanties<\/b> (caution d'une personne, nantissement d'un bien, hypothèque sur un terrain ou un immeuble). En échange, elles peuvent prêter plus grand et, parfois, moins cher. Les taux varient selon les établissements, la monnaie du prêt et la période : comparez toujours plusieurs offres.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mireille, couturière à Mbuji-Mayi, veut 800 000 FC pour acheter du tissu. L'offre A est de 2,5 % par mois pendant 6 mois (intérêt simple) : 800 000 × 0,025 × 6 = 120 000 FC. L'offre B demande 15 % du capital pour 6 mois plus 10 000 FC de frais de dossier : 120 000 + 10 000 = 130 000 FC. L'offre A coûte moins cher de 10 000 FC. Elle compare aussi le <b>coût total<\/b>, pas seulement le taux affiché : frais de dossier, assurance, garantie.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les taux d'exemple de ce cours ne sont pas ceux d'une institution précise. Lisez le contrat, demandez le coût total et le tableau de remboursement. Les taux et règles de crédit peuvent changer ; à vérifier auprès de l'établissement et des autorités compétentes.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Intérêt simple = capital × taux × durée. Comparez les crédits par leur coût total en FC. Un emprunt doit être payé par la marge générée. La tontine est gratuite mais repose sur la confiance et la discipline ; la banque et la microfinance demandent des garanties et des preuves.<\/div>\n","quiz":[{"q":"Prêt de 2 000 000 FC à 2 % par mois pendant 5 mois (intérêt simple, remboursé à la fin). Quel est l'intérêt total ?","o":["200 000 FC","20 000 FC","100 000 FC","400 000 FC"],"a":0,"e":"2 000 000 × 0,02 × 5 = 200 000 FC."},{"q":"1 500 000 FC empruntés à 24 % par an pendant 2 ans (intérêt simple, remboursé à la fin). Quel montant total rembourse-t-on ?","o":["2 220 000 FC","1 860 000 FC","720 000 FC","1 536 000 FC"],"a":1,"e":"Intérêt = 1 500 000 × 0,24 × 2 = 720 000 FC ; total = 2 220 000 FC."},{"q":"Une tontine de 12 membres, chacun verse 40 000 FC par mois. Combien reçoit le bénéficiaire du mois ?","o":["120 000 FC","480 000 FC","40 000 FC","960 000 FC"],"a":2,"e":"12 × 40 000 = 480 000 FC."},{"q":"Pour 800 000 FC sur 6 mois, l'offre A coûte 120 000 FC et l'offre B 130 000 FC (frais compris). Que faut-il conclure ?","o":["Le coût est identique","On ne peut jamais comparer deux crédits","A est la moins chère de 10 000 FC","B est moins chère car elle a un taux plus rond"],"a":3,"e":"On compare le coût total en francs : 120 000 contre 130 000 FC."}]},{"t":"Chapitre 6 — Les ratios simples pour piloter son commerce","html":"\n<h4>À quoi servent les ratios ?<\/h4>\n<p>Un <b>ratio<\/b> est une division qui transforme des chiffres en un indicateur facile à comparer : d'un mois à l'autre, d'un produit à l'autre, ou avec un commerce voisin. Il ne remplace pas le jugement, mais il montre vite où se trouve le problème : stock qui dort, clients qui paient trop tard, bénéfice trop faible.<\/p>\n<h4>La rotation du stock<\/h4>\n<p>La <b>rotation du stock<\/b> indique combien de fois, dans l'année, vous renouvelez votre stock. Formule : coût d'achat des marchandises vendues sur la période ÷ stock moyen. Ensuite, <b>durée de stockage = 360 jours ÷ rotation<\/b> (on utilise 360 jours pour simplifier).<\/p>\n<p>Exemple : sur l'année, la boutique a vendu des marchandises dont le coût d'achat est de 48 000 000 FC. Le stock moyen est de 6 000 000 FC. Rotation = 48 000 000 ÷ 6 000 000 = <b>8 fois par an<\/b>. Durée = 360 ÷ 8 = <b>45 jours<\/b> : un produit reste en moyenne 45 jours en rayon. Une rotation plus élevée est en général meilleure : l'argent revient plus souvent. Mais une rotation trop forte peut signifier des ruptures de stock et des clients perdus.<\/p>\n<h4>Le délai de paiement des clients et des fournisseurs<\/h4>\n<ul>\n<li><b>Délai client<\/b> = créances clients ÷ chiffre d'affaires de l'année × 360. Exemple : créances 6 000 000 FC, chiffre d'affaires 72 000 000 FC : 6 ÷ 72 × 360 = <b>30 jours<\/b>.<\/li>\n<li><b>Délai fournisseur<\/b> = dettes fournisseurs ÷ achats de l'année × 360. Exemple : dettes 4 000 000 FC, achats 48 000 000 FC : 4 ÷ 48 × 360 = <b>30 jours<\/b>.<\/li>\n<\/ul>\n<p>Si le délai client est plus long que le délai fournisseur, vous financez vos clients avec votre trésorerie. Un cycle simple : <b>durée du stock + délai client − délai fournisseur<\/b> = nombre de jours d'activité que vous devez financer. Ici, 45 + 30 − 30 = <b>45 jours<\/b>.<\/p>\n<h4>La rentabilité<\/h4>\n<ul>\n<li><b>Marge nette<\/b> = bénéfice net ÷ chiffre d'affaires. Elle dit combien il reste de bénéfice pour 100 FC vendus.<\/li>\n<li><b>Rendement du capital<\/b> = bénéfice net ÷ capitaux investis. Elle dit ce que rapporte l'argent mis dans l'entreprise.<\/li>\n<\/ul>\n<p>Exemple : chiffre d'affaires 72 000 000 FC, bénéfice net 5 400 000 FC, capitaux investis 18 000 000 FC. Marge nette = 5,4 ÷ 72 = <b>7,5 %<\/b>. Rendement = 5,4 ÷ 18 = <b>30 %<\/b> par an. Cela veut dire que pour 100 FC investis, l'entreprise a produit 30 FC de bénéfice en un an. À comparer avec l'intérêt d'une épargne ou le coût d'un crédit : si le rendement de l'entreprise est inférieur au taux du crédit, emprunter pour grandir est dangereux.<\/p>\n<table>\n<thead><tr><th>Ratio<\/th><th>Boutique X<\/th><th>Boutique Y<\/th><th>Qui fait mieux ?<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Chiffre d'affaires annuel<\/td><td>72 000 000 FC<\/td><td>72 000 000 FC<\/td><td>Égalité<\/td><\/tr>\n<tr><td>Rotation du stock<\/td><td>8 fois<\/td><td>4 fois<\/td><td>X<\/td><\/tr>\n<tr><td>Durée du stock<\/td><td>45 jours<\/td><td>90 jours<\/td><td>X<\/td><\/tr>\n<tr><td>Délai client<\/td><td>30 jours<\/td><td>60 jours<\/td><td>X<\/td><\/tr>\n<tr><td>Marge nette<\/td><td>7,5 %<\/td><td>9 %<\/td><td>Y<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La boutique Y gagne plus sur chaque vente, mais son argent dort deux fois plus longtemps dans le stock et chez les clients. À la fin, sa trésorerie est souvent plus tendue.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Un dépôt de pièces détachées à Lubumbashi stocke 3 000 000 FC de pièces peu demandées. Le gérant calcule la rotation par famille de produits : les filtres tournent 12 fois par an (30 jours de stock), les amortisseurs 3 fois (120 jours). Il décide d'acheter plus de filtres, moins d'amortisseurs, et de solder les pièces qui dorment depuis plus de 6 mois. Il libère ainsi de l'argent pour le produit qui se vend le mieux.<\/div>\n<h4>Comment utiliser les ratios<\/h4>\n<ol>\n<li>Calculez-les une fois par mois ou par trimestre avec la même méthode.<\/li>\n<li>Gardez un tableau pour suivre leur évolution.<\/li>\n<li>Posez-vous une question précise : pourquoi le délai client augmente-t-il ? Quels produits freinent la rotation ?<\/li>\n<li>Fixez-vous un objectif réaliste (par exemple ramener le délai client de 45 à 30 jours).<\/li>\n<\/ol>\n<div class=\"key\"><b>À retenir.<\/b> Rotation = coût des marchandises vendues ÷ stock moyen ; durée du stock = 360 ÷ rotation. Délai client = créances ÷ ventes × 360. Marge nette = bénéfice ÷ chiffre d'affaires. Un ratio n'a de sens que comparé à lui-même dans le temps ou à un commerce semblable.<\/div>\n","quiz":[{"q":"Coût d'achat des marchandises vendues : 36 000 000 FC ; stock moyen : 4 500 000 FC. Quelle est la rotation annuelle ?","o":["9 fois","8 fois","6 fois","0,125 fois"],"a":2,"e":"36 000 000 ÷ 4 500 000 = 8 fois."},{"q":"Une rotation de 12 fois par an correspond à quelle durée de stockage (avec 360 jours) ?","o":["60 jours","45 jours","30 jours","12 jours"],"a":3,"e":"360 ÷ 12 = 30 jours."},{"q":"Créances clients 2 500 000 FC, chiffre d'affaires annuel 30 000 000 FC. Quel est le délai de paiement des clients ?","o":["30 jours","12 jours","2,5 jours","90 jours"],"a":0,"e":"2,5 ÷ 30 × 360 = 30 jours."},{"q":"Bénéfice net 1 800 000 FC pour un chiffre d'affaires de 24 000 000 FC. Quelle est la marge nette ?","o":["7,5 %","0,75 %","75 %","13,3 %"],"a":1,"e":"1 800 000 ÷ 24 000 000 = 0,075 soit 7,5 %."}]},{"t":"Chapitre 7 — Plan de financement et décisions d'investissement","html":"\n<h4>Investir : dépenser aujourd'hui pour gagner demain<\/h4>\n<p>Un <b>investissement<\/b> est une dépense qui servira longtemps : un congélateur, une moto de livraison, l'aménagement d'un second point de vente. Contrairement à l'achat de stock, l'argent ne revient pas en quelques semaines. Il revient lentement, par les bénéfices supplémentaires. Avant d'investir, il faut répondre à trois questions : combien ça coûte vraiment, comment le financer, et en combien de temps ça se rembourse.<\/p>\n<h4>Le plan de financement : besoins et ressources<\/h4>\n<p>Le <b>plan de financement<\/b> met en face les <b>besoins<\/b> (ce qu'il faut payer) et les <b>ressources<\/b> (d'où vient l'argent). Ils doivent être égaux.<\/p>\n<p>Les besoins d'un projet comprennent : l'investissement lui-même, le stock de départ, les garanties et cautions demandées (par exemple au propriétaire du local), les frais de démarrage et une <b>réserve de trésorerie<\/b> pour les premiers mois où les ventes seront faibles. Les ressources peuvent être : l'apport personnel, un emprunt, un crédit fournisseur, une tontine, un proche.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Aline, grossiste à Kinshasa, veut ouvrir un second point de vente à Matadi. Son plan :\n<table>\n<thead><tr><th>Besoins<\/th><th>FC<\/th><th>Ressources<\/th><th>FC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Aménagement du local<\/td><td>2 500 000<\/td><td>Apport personnel<\/td><td>3 900 000<\/td><\/tr>\n<tr><td>Stock de départ<\/td><td>4 000 000<\/td><td>Emprunt<\/td><td>3 000 000<\/td><\/tr>\n<tr><td>Garantie locative (exemple)<\/td><td>900 000<\/td><td>Crédit fournisseur sur le stock<\/td><td>1 500 000<\/td><\/tr>\n<tr><td>Réserve de trésorerie<\/td><td>1 000 000<\/td><td><\/td><td><\/td><\/tr>\n<tr><td><b>Total<\/b><\/td><td><b>8 400 000<\/b><\/td><td><b>Total<\/b><\/td><td><b>8 400 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Si Aline avait oublié la réserve de trésorerie, son plan serait équilibré à 7 400 000 FC, mais dès le premier mois creux, elle aurait manqué d'argent pour payer le loyer et le personnel.<\/p>\n<h4>Faire correspondre durée de l'usage et durée du financement<\/h4>\n<p>Une règle d'or : <b>financer le long terme par du long terme<\/b>. L'aménagement du local, le véhicule, le congélateur doivent être payés par l'apport, l'épargne ou un emprunt de plusieurs mois ou années. Le crédit fournisseur à 30 jours convient pour le stock, pas pour un véhicule. Si vous utilisez l'argent du stock pour acheter un équipement, votre trésorerie se vide et vous ne pouvez plus racheter de marchandises.<\/p>\n<h4>Le remboursement de l'emprunt<\/h4>\n<p>Pour savoir si vous pouvez rembourser, calculez la mensualité. Exemple simplifié : emprunt de 3 000 000 FC sur 12 mois avec 720 000 FC d'intérêts au total (2 % par mois sur le capital initial). La mensualité est (3 000 000 + 720 000) ÷ 12 = <b>310 000 FC<\/b>. Le nouveau point de vente prévoit un bénéfice de 450 000 FC par mois : il couvre la mensualité, avec 140 000 FC de marge de sécurité. Mais si les ventes sont plus faibles, par exemple un bénéfice de 280 000 FC, il manque 30 000 FC par mois, qu'Aline devrait prendre sur son autre boutique. Testez donc toujours un <b>scénario prudent<\/b>.<\/p>\n<h4>Le délai de récupération<\/h4>\n<p>Le <b>délai de récupération<\/b> est le temps nécessaire pour que les gains supplémentaires remboursent l'investissement : investissement ÷ gain net mensuel. Exemple : un congélateur de 3 000 000 FC permet de vendre des produits frais et de gagner 150 000 FC net de plus par mois, une fois déduits l'électricité et l'entretien. Délai = 3 000 000 ÷ 150 000 = <b>20 mois<\/b>. Si le congélateur dure 5 ans (60 mois), l'investissement est rentable. S'il tombe en panne dans 18 mois, il ne l'est pas.<\/p>\n<h4>Questions à se poser avant d'investir<\/h4>\n<ul>\n<li>Le gain est-il certain ou espéré ? Qui sont les clients ?<\/li>\n<li>Quels coûts cachés : électricité, entretien, assurance, personnel supplémentaire ?<\/li>\n<li>Que se passe-t-il si les ventes sont 30 % plus faibles que prévu ?<\/li>\n<li>Si le taux de change varie, mon investissement, acheté en dollars, reste-t-il supportable ?<\/li>\n<li>Après le paiement, me reste-t-il assez de trésorerie pour acheter du stock ?<\/li>\n<\/ul>\n<div class=\"warn\"><b>Attention.<\/b> N'empruntez jamais en comptant sur un gain incertain pour rembourser. Si le projet échoue, vous devrez quand même rembourser. Ne mettez pas en garantie la maison familiale ou les biens vitaux sans avoir bien mesuré le risque. Les conditions de crédit et de garantie peuvent changer ; à vérifier auprès de l'établissement et d'un conseiller compétent.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Faites un plan de financement : besoins = ressources, avec une réserve de trésorerie. Financez le long terme par du long terme. Calculez la mensualité et testez un scénario prudent. Délai de récupération = investissement ÷ gain net mensuel.<\/div>\n","quiz":[{"q":"Investissement de 4 800 000 FC ; gain net supplémentaire de 400 000 FC par mois. Quel est le délai de récupération ?","o":["14 mois","12 mois","10 mois","20 mois"],"a":2,"e":"4 800 000 ÷ 400 000 = 12 mois."},{"q":"Besoins : 2 000 000 + 3 000 000 + 500 000 FC. Ressources : apport 2 000 000 FC et emprunt 3 000 000 FC. Que se passe-t-il ?","o":["Il manque 500 000 FC","Le plan est équilibré","Il y a un excédent de 500 000 FC","Il manque 5 500 000 FC"],"a":1,"e":"Besoins = 5 500 000 ; ressources = 5 000 000 ; manque 500 000 FC."},{"q":"Emprunt de 1 200 000 FC sur 10 mois, avec 240 000 FC d'intérêts au total. Quelle est la mensualité ?","o":["124 000 FC","144 000 FC","120 000 FC","264 000 FC"],"a":2,"e":"(1 200 000 + 240 000) ÷ 10 = 144 000 FC."},{"q":"Quelle ressource convient le mieux pour financer l'achat d'un véhicule de livraison utilisé plusieurs années ?","o":["L'argent prévu pour le stock de la semaine","Les cotisations à rembou
