<style>
:root{--dg:#003B32;--g:#00A86B;--bg:#F4F7F6;--o:#FFA726;--r:#E53935;--tx:#13302b;--mu:#6b8480;--bd:#e1e9e7;--sh:0 2px 12px rgba(0,59,50,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;overscroll-behavior-y:none}
h2,h3{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.ic{vertical-align:middle;flex:none}
.muted{color:var(--mu)}.pos{color:var(--g)}.neg{color:var(--r)}.sm{font-size:.85em}.right{text-align:right}
.splash,.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--dg),#005a48);color:#fff;padding:24px;text-align:center}
.splash img{width:88px;border-radius:20px}
.login .box{background:#fff;color:var(--tx);border-radius:24px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login img{width:84px;border-radius:20px}
.login h1{margin:12px 0 4px;color:var(--dg);font-size:1.4rem;letter-spacing:.5px}
.login p{color:var(--mu);margin:0 0 22px;font-size:.9rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:1px solid var(--bd);border-radius:14px;background:#fff;font-weight:600;box-shadow:var(--sh)}
.gbtn:active{transform:scale(.98)}
/* layout */
.shell{min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:250px;background:var(--dg);color:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.side.open+.scrim{display:block}
.side .lg{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:800;letter-spacing:.5px}
.side .lg img{width:38px;border-radius:10px}
.side .lg small{display:block;font-weight:400;font-size:.7rem;opacity:.7;letter-spacing:0}
.side nav{flex:1;overflow:auto;padding:4px 10px}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#cfe7df;text-decoration:none;margin-bottom:2px}
.side a.on{background:var(--g);color:#fff;font-weight:600}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:.8rem}
.mainwrap{min-height:100vh;padding-bottom:78px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--dg);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .brand-s{font-weight:800;flex:1;font-size:.95rem}.top .brand-s b{color:var(--g)}
.ib{background:none;border:0;color:#fff;padding:4px}
.net{font-size:.72rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.15)}
.net.off{background:var(--o);color:#3a2500}
main{padding:14px;max-width:1300px;margin:0 auto}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.68rem;color:var(--mu);text-decoration:none;background:none;border:0}
.bnav a.on{color:var(--g);font-weight:700}
@media(min-width:900px){
  .side{transform:none}.scrim{display:none!important}
  .mainwrap{margin-left:250px;padding-bottom:20px}.bnav{display:none}
  .top .ib{display:none}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:1.25rem;color:var(--dg)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
/* composants */
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:8px;color:var(--dg)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh);border-left:5px solid var(--g);animation:up .35s both}
.kpi small{color:var(--mu);display:block;font-size:.74rem}
.kpi b{font-size:1.12rem;display:block;margin-top:2px;word-break:break-word}
.kpi.o{border-color:var(--o)}.kpi.r{border-color:var(--r)}.kpi.d{border-color:var(--dg)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chart{position:relative;height:230px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--dg);border:1px solid var(--bd)}
.btn.dark{background:var(--dg)}.btn.red{background:var(--r)}.btn.orange{background:var(--o);color:#3a2500}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn[disabled]{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font-size:.84rem;color:var(--tx)}
.chip.on{background:var(--dg);color:#fff;border-color:var(--dg)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:#e3f6ee;color:#007a4d}
.badge.warn{background:#fff1dc;color:#9a5b00}.badge.bad{background:#fde6e5;color:#b3231f}.badge.gray{background:#eceff0;color:#556}
.search{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:#fff;margin-bottom:8px}
.tw{overflow-x:auto;border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:.86rem}
.tbl th{background:var(--dg);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap;font-weight:600;font-size:.78rem}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:nth-child(even) td{background:#fafcfb}
.tbl img.th{width:38px;height:38px;border-radius:8px;object-fit:cover;display:block}
.tbl .ac{white-space:nowrap}
.tbl .ac button{background:none;border:0;color:var(--dg);padding:4px}
.tbl .ac .del{color:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:12px}
.sp{justify-content:space-between}
/* formulaires */
.frm{display:flex;flex-direction:column;gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mu);font-weight:600}
.frm input,.frm select,.frm textarea,.in{padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:1rem;width:100%}
.frm input:focus,.frm select:focus,.search:focus{outline:2px solid var(--g);border-color:transparent}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--tx)}
.frm .chk input{width:auto}
.urow,.pl{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.pl{grid-template-columns:1.5fr 1fr .8fr .9fr auto auto}
.urow input,.pl input,.pl select{padding:8px;border:1px solid var(--bd);border-radius:10px;width:100%;min-width:0}
@media(max-width:600px){.pl{grid-template-columns:1fr 1fr 1fr}.pl .pl-p{grid-column:1/4}}
.x{background:none;border:0;color:var(--mu);font-size:1.1rem;padding:4px 8px}
/* modales */
.modal-wrap{position:fixed;inset:0;background:rgba(0,20,16,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal-wrap.open{opacity:1}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .25s}
.modal-wrap.open .sheet{transform:none}
.sheet.wide{max-width:760px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.sheet-h h3{color:var(--dg)}
.sheet-b{padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
@media(min-width:700px){.modal-wrap{align-items:center}.sheet{border-radius:22px}}
.toasts,#toasts{position:fixed;top:12px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;animation:up .25s;transition:opacity .35s}
.toast.err{background:var(--r)}.toast.out{opacity:0}
/* ventes */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.pcard:active{transform:scale(.97)}
.pcard img,.pcard .ph-ic{width:100%;height:80px;object-fit:cover;border-radius:10px}
.ph-ic{background:linear-gradient(135deg,#d8f3e8,#bfe9d6);color:var(--dg);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800}
.pcard b{font-size:.84rem;line-height:1.2}.pcard span{color:var(--g);font-weight:700;font-size:.86rem}.pcard small{font-size:.72rem}
.pcard.out{opacity:.55}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;background:var(--g);color:#fff;border:0;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px rgba(0,168,107,.4)}
@media(min-width:900px){.cartbar{left:auto;right:24px;bottom:24px;min-width:300px}}
.cl{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.cl .qty{display:flex;align-items:center;gap:4px}
.cl .qty input{width:62px;text-align:center;padding:6px;border:1px solid var(--bd);border-radius:8px}
.cl .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:1.1rem}
.cl select{padding:6px;border:1px solid var(--bd);border-radius:8px}
.totbox{background:var(--bg);border-radius:14px;padding:12px;margin:10px 0}
.totbox .big{font-size:1.4rem;font-weight:800;color:var(--dg)}
.receipt{font-family:"Courier New",monospace;font-size:.82rem;background:#fff;padding:6px;max-width:340px;margin:0 auto}
.receipt .rc-h{text-align:center;border-bottom:1px dashed #333;padding-bottom:6px;margin-bottom:6px}
.receipt table{width:100%}.receipt td{padding:2px 0;vertical-align:top}
.receipt .rc-t{border-top:1px dashed #333;margin-top:6px;padding-top:6px}
.receipt .rc-t div{display:flex;justify-content:space-between}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;width:100%;max-width:none}
  .modal-wrap,.sheet,.sheet-b{position:static!important;overflow:visible!important;transform:none!important;max-height:none!important}
}
.inv-in{width:84px;padding:6px;border:1px solid var(--bd);border-radius:8px}
.cat-card{display:flex;gap:12px;align-items:center}
.cat-ic{width:54px;height:54px;border-radius:14px;background:#d8f3e8;display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none;overflow:hidden}
.cat-ic img{width:100%;height:100%;object-fit:cover}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.hint{background:#fff8e8;border:1px solid #ffe2a8;border-radius:12px;padding:10px 12px;font-size:.84rem;margin-bottom:10px}
.mi{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}

/* ===== Style "maquette" : écran mobile ===== */
body{background:#f2f6f5}
.top{background:var(--dg);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .brand-s{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:700}
.top .brand-s img{width:30px;height:30px;border-radius:8px}
.top .brand-s b{color:#7ef0bd}
@media(max-width:899px){.ph h2{display:none}.ph:has(.acts:empty){display:none}.ph{margin-bottom:8px;justify-content:flex-end}}
.hero{background:linear-gradient(135deg,#00A86B,#008a57);color:#fff;border-radius:20px;padding:16px 18px;position:relative;box-shadow:0 8px 20px rgba(0,168,107,.28);margin-bottom:12px;overflow:hidden}
.hero small{opacity:.92;font-size:.9rem;display:block}
.hero b{display:block;font-size:2rem;margin:4px 0 2px;letter-spacing:.3px}
.hero span{opacity:.88;font-size:.85rem}
.hero i{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.4}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{color:#fff;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-height:96px;box-shadow:0 6px 14px rgba(0,0,0,.12);animation:up .35s both}
.tile .t-h{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600}
.tile b{font-size:1.7rem;line-height:1.1;margin-top:4px}.tile small{opacity:.9}
.t-blue{background:linear-gradient(135deg,#3b9bff,#1e6fe8)}.t-green{background:linear-gradient(135deg,#7ccf52,#43a047)}
.t-orange{background:linear-gradient(135deg,#ffbd4a,#fb8c00)}.t-purple{background:linear-gradient(135deg,#a066f7,#6f3bd9)}
.card{border-radius:20px;border:1px solid #e8efed}
.bnav{border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,59,50,.1);border-top:0}

<script type="application/json" id="acad-data">[{"id":"entrepreneuriat","title":"Les bases de l'entrepreneuriat en RDC","icon":"🚀","level":"Débutant","hours":3,"summary":"Ce cours vous apprend à passer d'une idée à une activité solide : état d'esprit, test de l'idée, étude de marché, calcul du seuil de rentabilité et préparation aux obstacles réels. Il se termine par un plan d'action de 90 jours.","goals":["Adopter les habitudes d'un entrepreneur : noter, séparer l'argent, se fixer des objectifs chiffrés","Trouver une idée et la tester à moindre coût","Réaliser une étude de marché simple (clients, taille du marché, concurrents)","Calculer ses besoins de départ et son seuil de rentabilité","Comprendre les différences entre informel et formel","Préparer son activité aux obstacles réels de la RDC et construire un plan de 90 jours"],"chapters":[{"t":"Chapitre 1 — L'état d'esprit de l'entrepreneur","html":"\n<h4>Qu'est-ce qu'un entrepreneur ?<\/h4>\n<p>Un entrepreneur est une personne qui repère un besoin, rassemble des ressources (argent, marchandises, temps, relations) et prend le risque de proposer un produit ou un service pour gagner sa vie. La vendeuse de pagnes au marché, le jeune qui répare les téléphones à Goma, le propriétaire d'un dépôt de boissons à Lubumbashi : tous sont des entrepreneurs. Vous n'avez pas besoin d'un diplôme ni d'un grand capital pour commencer, mais vous avez besoin d'une manière de penser.<\/p>\n<h4>Entrepreneur ou simple vendeur ?<\/h4>\n<p>Beaucoup de gens vendent ; moins nombreux sont ceux qui <b>pilotent<\/b> leur activité. La différence se voit dans les habitudes de tous les jours :<\/p>\n<ul>\n<li>Le vendeur attend les clients ; l'entrepreneur va chercher les clients et écoute leurs demandes.<\/li>\n<li>Le vendeur mélange l'argent de la boutique et l'argent de la maison ; l'entrepreneur sépare les deux.<\/li>\n<li>Le vendeur ne sait pas combien il gagne vraiment ; l'entrepreneur note ses ventes, ses achats et ses dépenses.<\/li>\n<li>Le vendeur subit les problèmes ; l'entrepreneur les prévoit et prépare des solutions.<\/li>\n<\/ul>\n<h4>Les cinq qualités qui comptent vraiment<\/h4>\n<ol>\n<li><b>La discipline :<\/b> ouvrir à l'heure, compter la caisse chaque soir, ne pas « emprunter » dans le stock pour la famille sans le noter.<\/li>\n<li><b>La patience :<\/b> une activité met souvent plusieurs mois avant de rapporter régulièrement.<\/li>\n<li><b>La capacité d'apprendre :<\/b> chaque erreur (marchandise invendue, crédit non remboursé) est une leçon si on prend le temps de la comprendre.<\/li>\n<li><b>Le sens du client :<\/b> un client bien accueilli revient et amène d'autres clients.<\/li>\n<li><b>Le goût du risque mesuré :<\/b> on ne mise jamais tout son argent sur une seule opération.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Mireille tient une petite boutique à Kananga. Elle vend du sucre, du savon et des cartes de recharge. Chaque soir, elle note dans un cahier : ventes du jour, dépenses, argent restant en caisse. Un jour, elle remarque que les cartes de recharge rapportent peu mais attirent beaucoup de passants. Elle décide de placer le savon et le sucre juste à côté. Résultat : les clients qui viennent pour une recharge achètent aussi un savon. Elle n'a rien inventé, elle a simplement observé et noté.<\/div>\n<h4>Les peurs courantes et comment les traiter<\/h4>\n<table>\n<thead><tr><th>Peur<\/th><th>Ce qu'on peut faire<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>« Je n'ai pas assez d'argent »<\/td><td>Commencer petit, avec un seul produit, et réinvestir les premiers bénéfices.<\/td><\/tr>\n<tr><td>« Je vais échouer »<\/td><td>Tester l'idée sur une petite quantité avant de s'engager davantage.<\/td><\/tr>\n<tr><td>« Je n'ai pas fait d'études »<\/td><td>Apprendre par la pratique, par les formations et en demandant conseil à des commerçants expérimentés.<\/td><\/tr>\n<tr><td>« Les autres vont se moquer »<\/td><td>Parler de son projet à des personnes de confiance qui vous encouragent et vous disent la vérité.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Séparer l'argent de l'activité et l'argent personnel<\/h4>\n<p>C'est la première règle d'or. Imaginons que votre boutique encaisse 100 000 FC (environ 43 $) un jour donné. Cette somme n'est pas à vous : elle contient le prix de revient de la marchandise vendue, les frais du jour et seulement ensuite votre bénéfice. Si vous dépensez tout, le stock ne pourra pas être renouvelé et, dans quelques semaines, les rayons seront vides. Fixez-vous un <b>salaire<\/b> (une somme que vous prélevez chaque semaine ou chaque mois) et laissez le reste dans l'activité.<\/p>\n<h4>Fixer des objectifs précis<\/h4>\n<p>« Je veux réussir » n'est pas un objectif. « Dans 6 mois, je veux vendre 30 sacs de farine par semaine et gagner 20 000 FC de bénéfice net par jour » est un objectif : il est précis, chiffré et limité dans le temps. Un bon objectif répond à quatre questions : quoi ? combien ? pour quand ? comment le mesurer ?<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Être entrepreneur, c'est observer, planifier, noter et apprendre. Séparez toujours l'argent de l'activité de votre argent personnel, fixez-vous des objectifs chiffrés, et commencez petit pour apprendre sans tout risquer.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Ne confondez pas chiffre d'affaires (tout ce que vous encaissez) et bénéfice (ce qui reste après avoir payé la marchandise et les frais). Beaucoup de commerces ferment parce que le patron croit être riche alors qu'il mange son propre stock.<\/div>\n","quiz":[{"q":"Quelle habitude distingue le mieux un entrepreneur d'un simple vendeur ?","o":["Il ouvre plus tard que les autres","Il note ses ventes, ses achats et ses dépenses","Il ne prend jamais aucun risque","Il garde l'argent de l'activité avec celui de la maison"],"a":1,"e":"Noter les chiffres permet de savoir réellement si l'on gagne de l'argent."},{"q":"Une boutique encaisse 100 000 FC en un jour. Quelle affirmation est vraie ?","o":["Les 100 000 FC sont tous du bénéfice","Les 100 000 FC peuvent être dépensés pour la famille","Il faut d'abord retirer le prix de la marchandise vendue et les frais","Il faut tout garder en caisse sans jamais calculer"],"a":2,"e":"L'encaissement contient le coût de la marchandise et les frais. Seul le reste est le bénéfice."},{"q":"Lequel est un objectif bien formulé ?","o":["Je veux réussir un jour","Je veux gagner beaucoup","Je veux avoir une grande boutique","Dans 6 mois, vendre 30 sacs de farine par semaine"],"a":3,"e":"Un bon objectif est précis, chiffré, limité dans le temps et mesurable."},{"q":"Pourquoi est-il conseillé de se verser un salaire fixe ?","o":["Pour séparer l'argent de l'activité et l'argent personnel","Pour payer moins d'impôts automatiquement","Pour éviter de tenir des cahiers","Parce que c'est obligatoire pour tous les commerçants"],"a":0,"e":"Le salaire fixe protège le stock et la trésorerie de l'activité."}]},{"t":"Chapitre 2 — Trouver une idée et la tester","html":"\n<h4>D'où viennent les bonnes idées ?<\/h4>\n<p>Une bonne idée d'activité n'est pas forcément nouvelle. Elle répond à un <b>problème réel<\/b> que des personnes rencontrent tous les jours et pour lequel elles sont prêtes à payer. Posez-vous ces questions autour de vous :<\/p>\n<ul>\n<li>De quoi les gens de mon quartier se plaignent-ils souvent ? (eau, courant, transport, produits introuvables, prix trop élevés)<\/li>\n<li>Qu'est-ce que je dois aller chercher loin et qui pourrait être vendu près de chez moi ?<\/li>\n<li>Quelle compétence ai-je déjà (couture, cuisine, mécanique, vente, informatique) ?<\/li>\n<li>Quels produits se vendent bien chez les autres, et que pourrais-je faire mieux (service, propreté, horaires, livraison) ?<\/li>\n<\/ul>\n<h4>Les trois filtres d'une bonne idée<\/h4>\n<ol>\n<li><b>Y a-t-il des clients ?<\/b> Des personnes en nombre suffisant ont-elles ce besoin ?<\/li>\n<li><b>Est-ce rentable ?<\/b> Le prix de vente est-il supérieur au coût total, avec une marge raisonnable ?<\/li>\n<li><b>Est-ce faisable pour moi ?<\/b> Ai-je l'argent, le local, les compétences et le temps nécessaires ?<\/li>\n<\/ol>\n<p>Si l'une des trois réponses est « non », il faut modifier l'idée ou en choisir une autre.<\/p>\n<h4>Tester avant d'investir<\/h4>\n<p>Tester, c'est dépenser très peu pour apprendre beaucoup. Voici des méthodes simples :<\/p>\n<ul>\n<li><b>Le petit lot :<\/b> acheter une petite quantité de marchandise et voir en une ou deux semaines comment elle se vend.<\/li>\n<li><b>La précommande :<\/b> proposer le produit aux clients avant de l'acheter et demander une avance.<\/li>\n<li><b>Le point de vente temporaire :<\/b> une table devant la maison, un jour de marché, avant de louer un local.<\/li>\n<li><b>Les questions directes :<\/b> demander à 20 clients possibles s'ils achèteraient, à quel prix et à quelle fréquence.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Patrick veut vendre de l'eau minérale en sachets congelés à Lubumbashi, où il fait très chaud. Il ne loue pas encore de local. Il achète 5 sacs de 30 sachets, soit 150 sachets, à 300 FC l'un : coût 45 000 FC. Il les vend 500 FC l'un devant une école et un arrêt de bus. Après 3 jours, il a vendu 120 sachets et 30 sont restés.<\/div>\n<p>Calculons le résultat du test de Patrick :<\/p>\n<table>\n<thead><tr><th>Élément<\/th><th>Calcul<\/th><th>Résultat<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Dépense de départ<\/td><td>150 × 300 FC<\/td><td>45 000 FC<\/td><\/tr>\n<tr><td>Ventes<\/td><td>120 × 500 FC<\/td><td>60 000 FC<\/td><\/tr>\n<tr><td>Marchandise restante (au prix coûtant)<\/td><td>30 × 300 FC<\/td><td>9 000 FC<\/td><\/tr>\n<tr><td>Coût des 120 sachets vendus<\/td><td>120 × 300 FC<\/td><td>36 000 FC<\/td><\/tr>\n<tr><td>Bénéfice brut de 3 jours<\/td><td>60 000 − 36 000<\/td><td>24 000 FC (environ 10 $)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>La marge par sachet est de 200 FC (500 − 300), soit 40 % du prix de vente. Patrick doit encore retirer ses frais (transport, glace, électricité) pour connaître le bénéfice net. Mais il a appris que les clients achètent et acceptent le prix. Il a aussi appris qu'un quart du stock ne s'est pas vendu : il commandera donc un peu moins la prochaine fois.<\/p>\n<h4>Définir sa proposition de valeur<\/h4>\n<p>Complétez cette phrase : « J'aide [quels clients] à [quel problème] grâce à [mon produit ou service], mieux ou moins cher que [les autres] parce que [mon avantage]. » Si vous n'arrivez pas à la compléter, votre idée est encore floue.<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Une bonne idée répond à un vrai besoin, rapporte plus qu'elle ne coûte et reste à votre portée. Testez en petit avant d'investir en grand, et regardez toujours les chiffres : ventes, coût, marge et stock invendu.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les encouragements de la famille et des amis ne prouvent pas que l'idée marche. Seuls des clients qui paient avec leur argent le prouvent.<\/div>\n","quiz":[{"q":"Quel est le meilleur critère pour reconnaître une bonne idée d'activité ?","o":["Elle est entièrement nouvelle","Elle plaît à votre famille","Elle répond à un besoin réel pour lequel des clients paient","Elle demande beaucoup de capital"],"a":2,"e":"Une idée vaut surtout par le besoin réel qu'elle satisfait et la volonté de payer des clients."},{"q":"Patrick achète 100 sachets à 300 FC et les vend tous à 500 FC. Quel est son bénéfice brut ?","o":["20 000 FC","30 000 FC","50 000 FC","15 000 FC"],"a":0,"e":"Ventes 50 000 FC moins coût 30 000 FC = 20 000 FC."},{"q":"Dans l'exemple, la marge par sachet (500 FC de vente, 300 FC d'achat) en pourcentage du prix de vente est de :","o":["20 %","30 %","50 %","40 %"],"a":3,"e":"200 / 500 = 0,40, soit 40 %."},{"q":"Quelle méthode permet de tester une idée en dépensant très peu ?","o":["Louer un grand local pour un an","Acheter un petit lot et le vendre pendant une ou deux semaines","Emprunter une grosse somme","Attendre que les concurrents disparaissent"],"a":1,"e":"Le petit lot permet d'apprendre sans risquer beaucoup d'argent."}]},{"t":"Chapitre 3 — Étude de marché simple : clients et concurrents","html":"\n<h4>Pourquoi faire une étude de marché ?<\/h4>\n<p>Une étude de marché consiste à rassembler des informations pour répondre à une question : « Mon activité va-t-elle trouver assez de clients dans cet endroit, à ce prix ? » Elle n'exige ni ordinateur ni expert. Elle demande surtout de la curiosité, un cahier et quelques jours de terrain.<\/p>\n<h4>Étape 1 : connaître ses clients<\/h4>\n<p>Décrivez votre client type : qui est-il ? où vit-il ? combien gagne-t-il ? quand et où achète-t-il ? qu'est-ce qui compte pour lui (prix, qualité, confiance, crédit) ? Une boutique près d'un marché à Kananga n'a pas les mêmes clients qu'une pharmacie près d'un hôpital à Goma. Fabriquez 3 à 5 petites fiches « client » :<\/p>\n<ul>\n<li>La ménagère qui achète au jour le jour, en petites quantités.<\/li>\n<li>Le revendeur qui achète en gros pour revendre.<\/li>\n<li>Le salarié qui achète à la fin du mois.<\/li>\n<\/ul>\n<h4>Étape 2 : évaluer la taille du marché<\/h4>\n<p>On peut estimer la demande avec un calcul simple. Exemple : dans votre quartier, il y a environ 400 ménages. Vous pensez que 25 % pourraient acheter votre produit régulièrement, et chacun en achète 4 fois par mois.<\/p>\n<table>\n<thead><tr><th>Élément<\/th><th>Valeur<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Ménages dans la zone<\/td><td>400<\/td><\/tr>\n<tr><td>Ménages acheteurs possibles (25 %)<\/td><td>100<\/td><\/tr>\n<tr><td>Achats par mois (100 × 4)<\/td><td>400 achats<\/td><\/tr>\n<tr><td>Panier moyen<\/td><td>3 000 FC<\/td><\/tr>\n<tr><td>Marché mensuel estimé<\/td><td>400 × 3 000 = 1 200 000 FC (environ 522 $)<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Ce chiffre est le marché <b>total<\/b> de la zone. Vous n'en captez qu'une part, car il y a des concurrents. Si vous espérez 30 % de ce marché, cela fait 360 000 FC de ventes par mois. Est-ce assez pour payer la marchandise, le loyer, les frais et votre salaire ? C'est la question à vérifier avant d'investir.<\/p>\n<h4>Étape 3 : étudier ses concurrents<\/h4>\n<p>Un concurrent est toute personne qui répond au même besoin que vous, même avec un produit différent. Faites le tour de la zone et notez pour chacun : produits, prix, horaires, propreté, accueil, crédit accordé, points forts et points faibles. Allez acheter chez eux comme un client.<\/p>\n<table>\n<thead><tr><th>Concurrent<\/th><th>Prix du sac de farine 25 kg<\/th><th>Crédit<\/th><th>Point fort<\/th><th>Point faible<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Boutique A<\/td><td>38 000 FC<\/td><td>Non<\/td><td>Proche du marché<\/td><td>Rupture fréquente<\/td><\/tr>\n<tr><td>Boutique B<\/td><td>36 500 FC<\/td><td>Oui, 1 semaine<\/td><td>Prix bas<\/td><td>Accueil froid<\/td><\/tr>\n<tr><td>Marché central<\/td><td>35 000 FC<\/td><td>Non<\/td><td>Grand choix<\/td><td>Éloigné, transport<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Jonas veut ouvrir un point de vente de farine à Mbuji-Mayi. Avec le tableau ci-dessus, il voit que personne ne livre à domicile. Il décide de proposer la livraison à vélo-taxi pour les commandes de 2 sacs et plus, au prix de 37 000 FC le sac. Il ne cherche pas à être le moins cher, il cherche à offrir un service que les autres n'offrent pas.<\/div>\n<h4>Étape 4 : choisir son positionnement<\/h4>\n<p>Vous pouvez vous distinguer par le <b>prix<\/b> (le moins cher), la <b>qualité<\/b> (des produits sûrs), le <b>service<\/b> (livraison, crédit, conseil) ou la <b>proximité<\/b> (ouvert tôt, tard, près des gens). Il est rare d'être meilleur sur tous les points : choisissez un ou deux atouts clairs.<\/p>\n<h4>Comment recueillir l'information sans dépenser<\/h4>\n<ul>\n<li>Parler à 20 clients possibles avec 3 ou 4 questions simples.<\/li>\n<li>Compter le nombre de passants à différentes heures devant l'emplacement choisi.<\/li>\n<li>Demander aux grossistes quels produits partent le plus vite.<\/li>\n<li>Observer les emplacements voisins : qui est fermé ? pourquoi ?<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Une étude de marché simple, c'est : mes clients (qui, combien, quand), la taille de la demande (un calcul réaliste), mes concurrents (prix, forces, faiblesses) et mon atout pour me distinguer. Notez tout par écrit.<\/div>\n","quiz":[{"q":"Dans une zone de 500 ménages, 20 % pourraient acheter votre produit. Combien de ménages acheteurs possibles ?","o":["50","100","200","20"],"a":1,"e":"500 × 20 % = 100 ménages."},{"q":"100 ménages achètent 4 fois par mois, panier moyen de 2 500 FC. Quel est le marché mensuel estimé ?","o":["1 000 000 FC","250 000 FC","100 000 FC","10 000 000 FC"],"a":0,"e":"100 × 4 = 400 achats ; 400 × 2 500 = 1 000 000 FC."},{"q":"Si le marché mensuel est de 1 000 000 FC et que vous visez 25 % de part, quelles ventes mensuelles visez-vous ?","o":["100 000 FC","500 000 FC","250 000 FC","25 000 FC"],"a":2,"e":"1 000 000 × 25 % = 250 000 FC."},{"q":"Pourquoi observer vos concurrents ?","o":["Pour copier exactement leurs produits","Pour les décourager d'ouvrir","Pour éviter de fixer un prix","Pour repérer leurs faiblesses et trouver votre atout"],"a":3,"e":"L'observation montre ce que les clients ne trouvent pas encore et permet de vous positionner."}]},{"t":"Chapitre 4 — Ressources, coûts, risques et seuil de rentabilité","html":"\n<h4>Les ressources dont vous avez besoin<\/h4>\n<p>Une activité ne repose pas seulement sur l'argent. Faites la liste de vos ressources, et de ce qui vous manque :<\/p>\n<ul>\n<li><b>Ressources financières :<\/b> épargne, tontine, aide de la famille, crédit.<\/li>\n<li><b>Ressources matérielles :<\/b> local, étagères, balance, congélateur, moto, groupe électrogène.<\/li>\n<li><b>Ressources humaines :<\/b> vous-même, un employé, un associé de confiance.<\/li>\n<li><b>Ressources de relations :<\/b> fournisseurs, clients fidèles, voisins, association de commerçants.<\/li>\n<li><b>Ressources de compétences :<\/b> savoir calculer, négocier, réparer, conserver les produits.<\/li>\n<\/ul>\n<h4>Besoins de démarrage : investissement et fonds de roulement<\/h4>\n<p>Deux catégories de dépenses sont à bien distinguer :<\/p>\n<ul>\n<li>L'<b>investissement<\/b> : ce que vous achetez une fois et qui sert longtemps (étagères, congélateur, enseigne).<\/li>\n<li>Le <b>fonds de roulement<\/b> : l'argent qui tourne chaque jour (achat de marchandise, loyer, transport, salaires). On conseille d'en prévoir au moins pour 2 ou 3 mois.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Chantal ouvre une petite boutique de boissons à Kinshasa. Elle fait ce budget de départ :\n<ul>\n<li>Étagères et réfrigérateur d'occasion : 1 150 000 FC (500 $)<\/li>\n<li>Stock de départ (casiers de boissons) : 2 300 000 FC (1 000 $)<\/li>\n<li>Loyer de 3 mois d'avance : 690 000 FC (300 $)<\/li>\n<li>Frais divers et réserve : 460 000 FC (200 $)<\/li>\n<\/ul>\nTotal : 4 600 000 FC, soit 2 000 $. Elle dispose de 3 000 000 FC d'épargne. Il lui manque 1 600 000 FC : elle devra réduire le stock initial, chercher une tontine ou un petit prêt, ou repousser l'ouverture.<\/div>\n<h4>Les coûts fixes et les coûts variables<\/h4>\n<p>Un <b>coût fixe<\/b> ne change pas avec le nombre de ventes : loyer, salaire de l'employé, abonnement. Un <b>coût variable<\/b> augmente avec les ventes : achat de marchandise, sacs d'emballage, commissions. Savoir séparer les deux permet de calculer le <b>seuil de rentabilité<\/b> : la quantité à vendre pour ne plus perdre d'argent.<\/p>\n<h4>Calcul du seuil de rentabilité<\/h4>\n<p>Reprenons Chantal. Elle vend le casier de boissons 25 000 FC et l'achète 20 000 FC. La marge sur un casier est de 5 000 FC. Ses coûts fixes mensuels : loyer 230 000 FC, électricité 100 000 FC, gardien 150 000 FC, transport 70 000 FC, soit 550 000 FC.<\/p>\n<table>\n<thead><tr><th>Étape<\/th><th>Calcul<\/th><th>Résultat<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Marge par casier<\/td><td>25 000 − 20 000<\/td><td>5 000 FC<\/td><\/tr>\n<tr><td>Coûts fixes mensuels<\/td><td>230 000 + 100 000 + 150 000 + 70 000<\/td><td>550 000 FC<\/td><\/tr>\n<tr><td>Seuil en nombre de casiers<\/td><td>550 000 / 5 000<\/td><td>110 casiers par mois<\/td><\/tr>\n<tr><td>Seuil en francs de ventes<\/td><td>110 × 25 000<\/td><td>2 750 000 FC<\/td><\/tr>\n<tr><td>Par jour (26 jours)<\/td><td>110 / 26<\/td><td>environ 4,2 casiers<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Elle doit donc vendre un peu plus de 4 casiers par jour juste pour couvrir ses frais. Au-delà, chaque casier lui laisse 5 000 FC de bénéfice. Si elle en vend 150 dans le mois : (150 − 110) × 5 000 = 200 000 FC de bénéfice. Si elle n'en vend que 90, elle perd (110 − 90) × 5 000 = 100 000 FC.<\/p>\n<h4>Identifier et réduire les risques<\/h4>\n<table>\n<thead><tr><th>Risque<\/th><th>Exemple<\/th><th>Réponse possible<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Marché<\/td><td>Les clients achètent moins<\/td><td>Petit stock, test, promotions<\/td><\/tr>\n<tr><td>Financier<\/td><td>Clients qui ne paient pas<\/td><td>Limiter le crédit, noter chaque dette<\/td><\/tr>\n<tr><td>Change<\/td><td>Le dollar monte, les prix d'achat aussi<\/td><td>Réviser souvent les prix, garder une partie en dollars<\/td><\/tr>\n<tr><td>Opérationnel<\/td><td>Panne d'électricité, vol, casse<\/td><td>Assurer ce qui peut l'être, surveiller le stock<\/td><\/tr>\n<tr><td>Personnel<\/td><td>Maladie, deuil, dépendance à vous seul<\/td><td>Réserve d'argent, personne de confiance<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"key\"><b>À retenir.<\/b> Calculez vos besoins de départ (investissement et fonds de roulement), séparez coûts fixes et variables, et connaissez votre seuil de rentabilité : coûts fixes divisés par la marge unitaire. Ne démarrez pas sans avoir listé vos risques et prévu une réserve.<\/div>\n","quiz":[{"q":"Lequel est un coût fixe ?","o":["Le loyer mensuel du local","L'achat de marchandise","Les sacs d'emballage","La commission par vente"],"a":0,"e":"Le loyer reste le même, que l'on vende peu ou beaucoup."},{"q":"Coûts fixes mensuels : 400 000 FC. Marge par article : 2 000 FC. Quel est le seuil de rentabilité en articles ?","o":["100","400","800","200"],"a":3,"e":"400 000 / 2 000 = 200 articles par mois."},{"q":"Même boutique : elle vend 260 articles dans le mois. Quel est son bénéfice (après coûts fixes) ?","o":["120 000 FC","60 000 FC","520 000 FC","0 FC"],"a":0,"e":"260 × 2 000 = 520 000 FC de marge ; moins 400 000 FC de coûts fixes = 120 000 FC."},{"q":"Que représente le fonds de roulement ?","o":["Les meubles achetés une seule fois","L'argent qui sert au fonctionnement courant (marchandise, loyer, frais)","Le bénéfice de l'année","L'impôt à payer"],"a":1,"e":"Le fonds de roulement finance les dépenses de tous les jours, en attendant les ventes."}]},{"t":"Chapitre 5 — Secteur informel et secteur formel","html":"\n<h4>Que veut dire « informel » ?<\/h4>\n<p>Le secteur <b>informel<\/b> regroupe les activités économiques qui ne sont pas (ou pas entièrement) enregistrées auprès de l'administration : pas de registre de commerce, pas de numéro d'impôt, souvent pas de comptabilité ni de contrat de travail écrit. En RDC, comme dans de nombreux pays d'Afrique, une très grande partie des petites activités est informelle. Beaucoup de commerçants du marché, de vendeurs ambulants ou d'artisans en font partie. L'informel n'est pas une honte : il permet à des millions de familles de vivre. Mais il a ses limites.<\/p>\n<h4>Les avantages de l'informel<\/h4>\n<ul>\n<li>Démarrage rapide et peu coûteux.<\/li>\n<li>Peu de papiers à gérer.<\/li>\n<li>Grande souplesse (changer de produit, d'endroit).<\/li>\n<\/ul>\n<h4>Les limites de l'informel<\/h4>\n<ul>\n<li><b>Pas d'accès au crédit bancaire :<\/b> sans papiers ni comptabilité, une banque ou une institution de microfinance hésite à prêter.<\/li>\n<li><b>Pas de marchés importants :<\/b> les grandes entreprises, ONG, administrations et mines exigent des fournisseurs en règle (factures, numéro d'impôt).<\/li>\n<li><b>Pas de protection :<\/b> en cas de conflit avec un client, un fournisseur ou un associé, il est difficile de se défendre sans preuve écrite.<\/li>\n<li><b>Risque de sanctions :<\/b> amendes, saisie de marchandises, fermeture temporaire.<\/li>\n<li><b>Croissance bloquée :<\/b> difficile d'embaucher, de louer un grand local ou d'importer en règle.<\/li>\n<\/ul>\n<h4>Que veut dire « formel » ?<\/h4>\n<p>Une activité formelle est enregistrée : elle a une existence légale (inscription au registre du commerce, numéro d'identification, déclarations aux administrations compétentes, paiement des taxes et impôts dus). Le détail de ces démarches est étudié dans le cours « Création et formalisation d'une entreprise en RDC ».<\/p>\n<h4>Une transition par étapes<\/h4>\n<p>On n'est pas obligé de passer de l'informel au formel en un jour. Voici un chemin réaliste :<\/p>\n<ol>\n<li><b>Étape 1 :<\/b> tenir un cahier de ventes, d'achats et de dépenses (même en informel).<\/li>\n<li><b>Étape 2 :<\/b> séparer l'argent personnel de l'argent de l'activité ; ouvrir un compte (bancaire ou mobile money) dédié à l'activité.<\/li>\n<li><b>Étape 3 :<\/b> se renseigner auprès du guichet unique de création d'entreprise ou d'une association de commerçants sur la forme adaptée à votre taille.<\/li>\n<li><b>Étape 4 :<\/b> s'enregistrer et obtenir les numéros d'identification demandés.<\/li>\n<li><b>Étape 5 :<\/b> déclarer et payer les impôts et taxes qui vous concernent ; conserver factures et reçus.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Sylvie vend des pagnes à Kinshasa depuis 5 ans, de manière informelle. Un hôtel lui propose de fournir 200 uniformes en tissu, pour une commande de 4 600 000 FC (2 000 $). Mais l'hôtel exige une facture et un numéro d'identification fiscale. Sans formalisation, Sylvie perd le marché. Elle se rend au guichet unique, s'enregistre, et obtient les documents. L'année suivante, elle fournit trois entreprises. Son chiffre d'affaires triple.<\/div>\n<h4>Coût de l'informel : un exemple chiffré<\/h4>\n<p>Imaginons un commerçant informel qui veut emprunter 4 600 000 FC (2 000 $) pour acheter du stock. Sans comptabilité ni papiers, il ne trouve que des prêteurs privés qui demandent 20 % d'intérêt par mois, soit 920 000 FC d'intérêt chaque mois. En un an, l'intérêt dépasse le montant emprunté. Une institution formelle, même avec un taux plus élevé que dans d'autres pays, reste en général bien moins chère qu'un prêteur informel. Les taux réels changent selon les institutions : demandez toujours le coût total du crédit, par écrit.<\/p>\n<table>\n<thead><tr><th>Critère<\/th><th>Informel<\/th><th>Formel<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Démarrage<\/td><td>Immédiat<\/td><td>Demande des démarches<\/td><\/tr>\n<tr><td>Accès au crédit<\/td><td>Très limité<\/td><td>Plus facile<\/td><\/tr>\n<tr><td>Gros clients<\/td><td>Souvent fermés<\/td><td>Accessibles<\/td><\/tr>\n<tr><td>Protection juridique<\/td><td>Faible<\/td><td>Meilleure<\/td><\/tr>\n<tr><td>Impôts et taxes<\/td><td>Pas déclarés, risque de sanctions<\/td><td>Déclarés, règles connues<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\"><b>Attention.<\/b> Les obligations, taxes et statuts simplifiés pour petits commerçants dépendent de la loi et changent avec le temps. Renseignez-vous avant de décider, auprès du guichet unique et de l'administration compétente (taux et procédures peuvent changer). Ce cours ne remplace pas un conseil personnalisé.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> L'informel permet de démarrer, mais freine la croissance (crédit, gros clients, protection). On peut se formaliser par étapes. Commencez par la tenue de cahiers et la séparation des comptes, puis informez-vous sur les démarches officielles.<\/div>\n","quiz":[{"q":"Quel est un inconvénient majeur de l'informel ?","o":["Il coûte trop cher à démarrer","Il interdit de vendre des produits","Il oblige à avoir un comptable","Il limite l'accès au crédit et aux gros clients"],"a":3,"e":"Les banques et les grandes organisations demandent des documents en règle."},{"q":"Un prêt de 1 000 000 FC à 20 % d'intérêt par mois : combien d'intérêt la première année (sans rembourser le capital) ?","o":["2 400 000 FC","200 000 FC","1 200 000 FC","240 000 FC"],"a":0,"e":"200 000 FC par mois × 12 mois = 2 400 000 FC, plus que le prêt."},{"q":"Quelle étape est conseillée en premier dans la transition vers le formel ?","o":["Embaucher dix employés","Tenir un cahier de ventes, achats et dépenses","Fermer la boutique","Changer de produit"],"a":1,"e":"La tenue de cahiers prépare le dossier et vous donne des chiffres fiables."},{"q":"Sylvie perd un marché avec un hôtel parce qu'elle n'a ni facture ni numéro d'identification. Quel principe cela illustre-t-il ?","o":["Les hôtels n'achètent jamais de pagnes","Les clients importants exigent des fournisseurs en règle","Le secteur informel est interdit","Il faut toujours vendre moins cher"],"a":1,"e":"Les entreprises et organisations demandent des fournisseurs enregistrés qui peuvent facturer."}]},{"t":"Chapitre 6 — Les obstacles réels en RDC et comment s'y préparer","html":"\n<h4>Regarder la réalité en face<\/h4>\n<p>Entreprendre en RDC offre de grandes opportunités : un pays vaste, une population jeune, des besoins immenses. Mais il y a aussi des obstacles bien connus. Un entrepreneur sérieux ne les ignore pas : il les <b>prévoit dans ses prix, son budget et son organisation<\/b>. Voici les principaux et des réponses pratiques.<\/p>\n<h4>1. L'électricité<\/h4>\n<p>Les coupures sont fréquentes dans de nombreuses villes. Un congélateur ou une machine à coudre qui s'arrête fait perdre de l'argent. Réponses : estimer le coût du carburant ou d'un panneau solaire, choisir des produits qui ne dépendent pas du froid, ou fixer son prix en y incluant ce coût.<\/p>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> À Goma, Fatuma vend de la glace en sachets. Son groupe électrogène consomme 6 litres de carburant par jour à 3 450 FC le litre (1,50 $), soit 20 700 FC par jour. Elle vend 200 sachets par jour. Le coût du carburant est de 20 700 / 200 = environ 104 FC par sachet. Elle l'ajoute à son prix de revient au lieu de l'ignorer : sinon sa marge réelle serait fausse.<\/div>\n<h4>2. Le transport et la logistique<\/h4>\n<p>Routes difficiles, distances, taxes sur la route, délais : les marchandises coûtent plus cher à Kananga qu'à Kinshasa. Réponses : grouper les achats pour réduire le coût par unité, bâtir une relation avec un transporteur fiable, prévoir une marge de sécurité pour les retards et ajouter le transport au prix de revient.<\/p>\n<h4>3. Le taux de change<\/h4>\n<p>Beaucoup de produits sont achetés en dollars mais vendus en francs congolais. Si le dollar passe de 2 300 FC à 2 500 FC (le taux varie), un achat de 1 000 $ passe de 2 300 000 FC à 2 500 000 FC. Si vous n'avez pas changé vos prix, vous perdez 200 000 FC. Réponses : réviser souvent ses prix, garder une partie de sa trésorerie en dollars, se renseigner sur les taux chaque semaine et ne pas vendre à perte à crédit en FC une marchandise achetée en dollars.<\/p>\n<h4>4. L'insécurité et le vol<\/h4>\n<p>Le vol de marchandise, les cambriolages et dans certaines régions les troubles sécuritaires pèsent sur l'activité. Réponses : choisir un local sûr, prévoir un gardien, ne pas garder beaucoup d'espèces (utiliser la banque ou le mobile money), assurer ce qui est assurable, et tenir un inventaire pour détecter rapidement un manque.<\/p>\n<h4>5. La corruption et les pressions<\/h4>\n<p>Des demandes d'argent indues peuvent apparaître lors de démarches ou de contrôles. Réponses : connaître vos droits et les textes qui s'appliquent, exiger des reçus officiels, passer par des guichets et canaux officiels, garder des preuves écrites et vous faire accompagner par une association de commerçants. Refuser de participer à la corruption protège votre entreprise sur le long terme.<\/p>\n<h4>6. L'accès au crédit<\/h4>\n<p>Les banques prêtent peu aux petites entreprises, et les taux sont souvent élevés. Réponses : épargner régulièrement, utiliser la tontine ou les coopératives, bâtir un historique (compte actif, comptabilité propre), commencer par de petits prêts bien remboursés, comparer le coût total du crédit.<\/p>\n<h4>Le tableau de préparation<\/h4>\n<table>\n<thead><tr><th>Obstacle<\/th><th>Effet sur l'activité<\/th><th>Ligne à ajouter dans le budget<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Électricité<\/td><td>Coûts de carburant<\/td><td>Carburant par jour × 26 jours<\/td><\/tr>\n<tr><td>Transport<\/td><td>Prix d'achat plus élevé<\/td><td>Frais de transport par unité<\/td><\/tr>\n<tr><td>Change<\/td><td>Marge qui fond<\/td><td>Réserve de change (par exemple 5 % du stock)<\/td><\/tr>\n<tr><td>Insécurité<\/td><td>Vol, perte<\/td><td>Gardien, serrure, assurance si possible<\/td><\/tr>\n<tr><td>Crédit<\/td><td>Manque de trésorerie<\/td><td>Épargne de sécurité, tontine<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"warn\"><b>Attention.<\/b> Ne comptez pas sur la chance. Une activité qui ne survit qu'avec un électricité parfaite, un dollar stable et aucun vol ne tient pas. Faites vos calculs avec des hypothèses prudentes.<\/div>\n<div class=\"key\"><b>À retenir.<\/b> Les obstacles (électricité, transport, change, insécurité, corruption, crédit) sont réels mais gérables. La règle : les prévoir, les chiffrer, les inclure dans le prix de revient, et créer une réserve de sécurité.<\/div>\n","quiz":[{"q":"Fatuma dépense 20 700 FC de carburant par jour pour 200 sachets de glace. Le coût de carburant par sachet est d'environ :","o":["20 FC","104 FC","400 FC","1 000 FC"],"a":1,"e":"20 700 / 200 = 103,5 FC, soit environ 104 FC."},{"q":"Vous achetez pour 1 000 $. Le dollar passe de 2 300 FC à 2 450 FC. De combien le coût augmente-t-il en FC ?","o":["15 000 FC","100 000 FC","250 000 FC","150 000 FC"],"a":3,"e":"1 000 × (2 450 − 2 300) = 150 000 FC."},{"q":"Quelle réponse est la plus prudente face à la hausse du dollar ?","o":["Ne jamais changer ses prix","Réviser régulièrement ses prix de vente","Vendre à crédit en FC sans limite","Cacher la hausse aux clients et ne rien noter"],"a":1,"e":"Il faut ajuster les prix pour protéger la marge quand le coût d'achat augmente."},{"q":"Pour réduire le risque de vol, quelle mesure est la plus utile ?","o":["Garder toutes les recettes en espèces à la boutique","Ne jamais compter le stock","Éviter de garder beaucoup d'espèces et tenir un inventaire","Laisser le local ouvert la nuit"],"a":2,"e":"Moins d'espèces et un inventaire régulier réduisent les pertes et permettent de les détecter."}]},{"t":"Chapitre 7 — Votre plan d'action sur 90 jours","html":"\n<h4>Pourquoi 90 jours ?<\/h4>\n<p>Un grand projet fait peur. Un plan de 90 jours, divisé en trois périodes de 30 jours, rend les choses concrètes. À la fin, vous aurez soit lancé votre activité, soit appris assez pour décider autrement. Dans les deux cas, vous aurez avancé.<\/p>\n<h4>Jours 1 à 30 : préparer et vérifier<\/h4>\n<ul>\n<li>Écrire votre idée en une phrase (la proposition de valeur du chapitre 2).<\/li>\n<li>Interroger au moins 20 clients possibles.<\/li>\n<li>Visiter 5 concurrents et remplir le tableau de comparaison.<\/li>\n<li>Estimer le marché de la zone (chapitre 3).<\/li>\n<li>Faire la liste de vos besoins de départ et de vos ressources (chapitre 4).<\/li>\n<li>Calculer votre seuil de rentabilité.<\/li>\n<li>Vous renseigner sur les démarches de création auprès du guichet unique.<\/li>\n<\/ul>\n<h4>Jours 31 à 60 : tester et organiser<\/h4>\n<ul>\n<li>Lancer un test en petit (petit lot, point de vente temporaire).<\/li>\n<li>Ouvrir un compte pour l'activité (banque ou mobile money) et séparer l'argent.<\/li>\n<li>Commencer le cahier de caisse : ventes, achats, dépenses chaque soir.<\/li>\n<li>Négocier avec 2 ou 3 fournisseurs et comparer prix, délais, crédit.<\/li>\n<li>Choisir l'emplacement et vérifier la sécurité.<\/li>\n<li>Préparer le budget complet et l'argent manquant.<\/li>\n<\/ul>\n<h4>Jours 61 à 90 : lancer et corriger<\/h4>\n<ul>\n<li>Ouvrir officiellement ou développer le test.<\/li>\n<li>Suivre chaque semaine : ventes, marge, stock restant, dettes clients.<\/li>\n<li>Comparer les résultats avec votre seuil de rentabilité.<\/li>\n<li>Corriger : produits qui ne se vendent pas, prix, horaires, accueil.<\/li>\n<li>Lancer la démarche de formalisation si vos résultats le permettent.<\/li>\n<\/ul>\n<h4>Un exemple de budget de lancement<\/h4>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Éric, à Lubumbashi, veut vendre des pièces détachées de moto. Voici son plan chiffré (1 $ = 2 300 FC, le taux varie) :\n<ul>\n<li>Étagères et caisse : 575 000 FC (250 $)<\/li>\n<li>Premier stock de pièces : 2 300 000 FC (1 000 $)<\/li>\n<li>Loyer de 2 mois : 460 000 FC (200 $)<\/li>\n<li>Démarches de création, frais divers : 345 000 FC (150 $)<\/li>\n<li>Réserve de sécurité : 690 000 FC (300 $)<\/li>\n<\/ul>\nTotal : 4 370 000 FC, soit 1 900 $. Éric a 2 500 000 FC. Il lui manque 1 870 000 FC. Plan : commencer avec un stock de 1 000 000 FC de pièces qui se vendent le plus vite, ouvrir, et acheter le reste avec les premiers bénéfices, plus un petit prêt de la tontine.<\/div>\n<h4>Le tableau de bord hebdomadaire<\/h4>\n<table>\n<thead><tr><th>Semaine<\/th><th>Ventes (FC)<\/th><th>Coût marchandises vendues (FC)<\/th><th>Marge (FC)<\/th><th>Stock invendu (FC)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>180 000<\/td><td>130 000<\/td><td>50 000<\/td><td>1 100 000<\/td><\/tr>\n<tr><td>2<\/td><td>220 000<\/td><td>158 000<\/td><td>62 000<\/td><td>1 050 000<\/td><\/tr>\n<tr><td>3<\/td><td>260 000<\/td><td>185 000<\/td><td>75 000<\/td><td>1 000 000<\/td><\/tr>\n<tr><td>4<\/td><td>300 000<\/td><td>213 000<\/td><td>87 000<\/td><td>980 000<\/td><\/tr>\n<\/tbody>\n<\/table>\n<p>Total du mois pour Éric : ventes 960 000 FC, marge 274 000 FC. S'il a 200 000 FC de frais fixes pour le mois, son bénéfice est de 74 000 FC : il progresse chaque semaine et se rapproche de son seuil de rentabilité.<\/p>\n<h4>Les indicateurs à suivre<\/h4>\n<ul>\n<li>Chiffre d'affaires de la semaine.<\/li>\n<li>Marge (ventes moins coût des marchandises vendues).<\/li>\n<li>Stock restant et produits qui ne bougent pas.<\/li>\n<li>Dettes des clients (argent qu'on vous doit).<\/li>\n<li>Argent en caisse et sur le compte.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> Un plan de 90 jours se découpe en trois temps : préparer (1-30), tester et organiser (31-60), lancer et corriger (61-90). Chiffrez le budget, séparez l'argent, suivez des indicateurs chaque semaine et ajustez. L'application KAJIMINYI peut vous aider à suivre ces chiffres.<\/div>\n","quiz":[{"q":"Quelle activité appartient aux jours 1 à 30 ?","o":["Corriger les prix après trois mois de vente","Interroger des clients possibles et visiter des concurrents","Faire le bilan final de l'année","Embaucher cinq employés"],"a":1,"e":"La première période sert à vérifier l'idée avant d'investir."},{"q":"Budget : 575 000 + 2 300 000 + 460 000 + 345 000 + 690 000 FC. Quel est le total ?","o":["4 370 000 FC","3 970 000 FC","4 700 000 FC","5 000 000 FC"],"a":0,"e":"575 000 + 2 300 000 = 2 875 000 ; + 460 000 = 3 335 000 ; + 345 000 = 3 680 000 ; + 690 000 = 4 370 000."},{"q":"Ventes du mois : 960 000 FC ; marge : 274 000 FC ; frais fixes : 200 000 FC. Quel est le bénéfice ?","o":["960 000 FC","274 000 FC","74 000 FC","200 000 FC"],"a":2,"e":"274 000 − 200 000 = 74 000 FC."},{"q":"Pourquoi suivre le stock invendu chaque semaine ?","o":["Pour payer plus d'impôts","Parce que le stock ne coûte rien","Pour éviter de compter la caisse","Pour repérer les produits qui bloquent de l'argent"],"a":3,"e":"Un stock qui ne bouge pas immobilise votre argent et peut se perdre."}]}],"exam":[{"q":"Lequel de ces comportements montre un état d'esprit d'entrepreneur ?","o":["Mélanger la caisse et l'argent de la maison","Noter chaque soir les ventes et les dépenses","Attendre que les clients arrivent seuls","Ne jamais changer de produit"],"a":1,"e":"Noter les chiffres est la base du pilotage d'une activité."},{"q":"Une boutique encaisse 80 000 FC. Le coût des marchandises vendues est de 60 000 FC et les frais du jour de 8 000 FC. Quel est le bénéfice du jour ?","o":["12 000 FC","20 000 FC","80 000 FC","8 000 FC"],"a":0,"e":"80 000 − 60 000 − 8 000 = 12 000 FC."},{"q":"Quelle est la meilleure façon de tester une idée ?","o":["Emprunter beaucoup et ouvrir un grand magasin","Se baser sur l'avis de ses amis","Vendre un petit lot et observer les résultats","Copier exactement le voisin"],"a":2,"e":"Un petit test coûte peu et donne de vraies informations."},{"q":"Vous achetez un produit à 1 500 FC et le vendez 2 000 FC. Quelle est la marge en pourcentage du prix de vente ?","o":["33 %","50 %","20 %","25 %"],"a":3,"e":"500 / 2 000 = 25 %."},{"q":"Dans une zone de 600 ménages, 30 % peuvent acheter votre produit, 3 fois par mois, à 2 000 FC l'achat. Quel est le marché mensuel estimé ?","o":["1 080 000 FC","360 000 FC","540 000 FC","3 600 000 FC"],"a":0,"e":"600 × 30 % = 180 ménages ; 180 × 3 = 540 achats ; 540 × 2 000 = 1 080 000 FC."},{"q":"Quel élément est un investissement de départ ?","o":["Le loyer du mois","Un réfrigérateur acheté pour la boutique","Le salaire du gardien","L'achat de sucre à revendre"],"a":1,"e":"Un réfrigérateur est un bien durable acheté une fois."},{"q":"Coûts fixes : 300 000 FC par mois. Marge par article : 1 500 FC. Seuil de rentabilité ?","o":["100 articles","150 articles","200 articles","300 articles"],"a":2,"e":"300 000 / 1 500 = 200 articles."},{"q":"Parmi ces risques, lequel est un risque de change ?","o":["Un cambriolage","Une coupure d'électricité","Un concurrent qui ouvre à côté","Un dollar qui monte alors que vos prix en FC restent les mêmes"],"a":3,"e":"Le risque de change vient de la variation du taux entre FC et dollar."},{"q":"Quel avantage principal apporte la formalisation ?","o":["Elle ouvre l'accès à des clients importants et au crédit","Elle supprime toute dépense","Elle interdit les contrôles","Elle rend inutile la comptabilité"],"a":0,"e":"Les entreprises en règle accèdent plus facilement aux gros marchés et au financement."},{"q":"Que faire face à une demande d'argent indue lors d'une démarche ?","o":["Payer sans reçu pour aller vite","Exiger un reçu officiel, passer par les canaux officiels et garder des preuves","Fermer l'activité","Cacher ses ventes"],"a":1,"e":"Les canaux officiels et les preuves vous protègent."},{"q":"Éric a un budget de lancement de 4 370 000 FC et dispose de 2 500 000 FC. Quel montant lui manque ?","o":["1 000 000 FC","2 500 000 FC","1 870 000 FC","870 000 FC"],"a":2,"e":"4 370 000 − 2 500 000 = 1 870 000 FC."},{"q":"Dans un plan de 90 jours, que fait-on entre les jours 61 et 90 ?","o":["On réfléchit à l'idée pour la première fois","On ne fait que lire","On évite de regarder les chiffres","On lance, on suit les indicateurs chaque semaine et on corrige"],"a":3,"e":"La dernière période sert à lancer l'activité et à ajuster d'après les résultats."}]},{"id":"formalisation","title":"Création et formalisation d'une entreprise en RDC","icon":"📝","level":"Intermédiaire","hours":3,"summary":"Ce cours explique comment passer de l'activité informelle à une entreprise légale : droit OHADA, statuts d'entreprenant, d'entreprise individuelle, de SARL, SA et SNC. Vous apprendrez à choisir votre forme, rédiger vos statuts, obtenir vos identifiants (RCCM, Id.Nat, NIF) et respecter vos obligations après la création.","goals":["Comprendre ce qu'est le droit OHADA et pourquoi se formaliser","Distinguer l'entreprenant, l'entreprise individuelle, la SARL, la SA et la SNC","Comparer la responsabilité des associés selon la forme choisie","Choisir sa forme juridique en fonction de sa situation","Connaître le rôle des statuts, du capital et des apports","Suivre les démarches (guichet unique, RCCM, Id.Nat, NIF, banque) et respecter ses obligations"],"chapters":[{"t":"Chapitre 1 — Pourquoi se formaliser et que dit le droit OHADA ?","html":"\n<h4>Un cadre commun à 17 pays<\/h4>\n<p>L'<b>OHADA<\/b> (Organisation pour l'harmonisation en Afrique du droit des affaires) est une organisation de pays africains qui ont décidé d'utiliser les mêmes règles pour les affaires. La République démocratique du Congo en est membre depuis 2012. Concrètement, cela veut dire que la manière de créer une société, de tenir une comptabilité, de garantir un prêt ou de recouvrer une dette suit des règles écrites dans des textes communs appelés <b>Actes uniformes<\/b>. Ils s'appliquent directement en RDC. Un commerçant de Kinshasa et un commerçant d'Abidjan ou de Douala jouent donc, en grande partie, avec les mêmes règles.<\/p>\n<p>Les Actes uniformes qui vous concernent le plus :<\/p>\n<ul>\n<li>le <b>droit commercial général<\/b> : qui est commerçant, le registre du commerce, le statut de l'entreprenant, les contrats de vente ;<\/li>\n<li>le <b>droit des sociétés commerciales<\/b> : SARL, SA, SNC et autres formes de société ;<\/li>\n<li>le <b>droit comptable<\/b> (SYSCOHADA) : comment tenir ses comptes, étudié dans le cours de comptabilité ;<\/li>\n<li>les <b>sûretés<\/b> et le <b>recouvrement des créances<\/b> : garanties d'un prêt, moyens de se faire payer.<\/li>\n<\/ul>\n<h4>Qui est « commerçant » ?<\/h4>\n<p>Selon le droit commercial général, est commerçant celui qui accomplit des actes de commerce (acheter pour revendre, par exemple) et en fait sa profession habituelle. La vendeuse de pagnes qui revend chaque semaine, le grossiste de farine et le propriétaire de pharmacie sont des commerçants. Le commerçant a des <b>obligations<\/b> : se faire enregistrer, tenir une comptabilité, conserver ses pièces. Il a aussi des <b>droits<\/b> : bénéficier d'un cadre légal pour ses contrats et ses créances.<\/p>\n<h4>Pourquoi se formaliser ?<\/h4>\n<p>Rester informel est possible tant que l'on reste petit et que l'on ne vend qu'au comptant sur le marché. Mais dès que l'on veut grandir, les portes se ferment sans papiers.<\/p>\n<table>\n<thead><tr><th>Ce que vous voulez<\/th><th>Ce qu'on vous demande<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Fournir une entreprise, un hôtel, une ONG, une administration<\/td><td>Facture en règle, numéro d'impôt, souvent registre du commerce<\/td><\/tr>\n<tr><td>Ouvrir un compte professionnel<\/td><td>Documents d'identification de l'entreprise<\/td><\/tr>\n<tr><td>Demander un crédit à une banque ou une microfinance<\/td><td>Existence légale, comptabilité, historique<\/td><\/tr>\n<tr><td>Importer ou travailler avec un partenaire étranger<\/td><td>Identification officielle de l'entreprise<\/td><\/tr>\n<tr><td>Protéger votre patrimoine personnel<\/td><td>Choisir une forme juridique adaptée<\/td><\/tr>\n<tr><td>Employer des salariés<\/td><td>Affiliation sociale, contrats, déclarations<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Jean-Pierre vend des pièces détachées de camions à Lubumbashi depuis huit ans. Une société de transport lui propose une commande de 9 200 000 FC (4 000 $ au taux d'exemple de 1 $ = 2 300 FC ; le taux varie). La société exige une facture portant le numéro d'impôt et l'identification de l'entreprise de Jean-Pierre. Il n'a rien. Le marché part chez un concurrent en règle. En six mois de démarches, Jean-Pierre se formalise ; l'année suivante, il décroche deux contrats de ce type. La formalisation ne lui a pas apporté la clientèle, mais elle lui a ouvert la porte de clients qui lui étaient fermés.<\/div>\n<h4>Ce que la formalisation ne fait pas<\/h4>\n<ul>\n<li>Elle n'apporte pas de clients à elle seule : il faut toujours bien vendre.<\/li>\n<li>Elle ne supprime pas tous les risques : elle les organise (responsabilité, preuves, contrats).<\/li>\n<li>Elle a un coût (frais, impôts, temps) : il faut le prévoir dans le plan d'affaires.<\/li>\n<\/ul>\n<div class=\"key\"><b>À retenir.<\/b> La RDC applique le droit OHADA : mêmes règles que les autres pays membres pour les sociétés, le commerce et la comptabilité. Se formaliser coûte du temps et de l'argent, mais donne accès aux gros clients, aux banques et à une protection juridique. Le bon moment pour y penser, c'est avant de manquer une opportunité.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Les procédures, frais et délais cités dans ce cours peuvent évoluer. Ils sont donnés pour vous orienter ; vérifiez toujours auprès du guichet unique de création d'entreprise et de l'administration compétente avant d'agir. Ce cours ne remplace pas le conseil d'un juriste ou d'un notaire.<\/div>\n","quiz":[{"q":"Que signifie le fait que la RDC applique le droit OHADA ?","o":["Les règles sur les sociétés, le commerce et la comptabilité sont communes avec les autres pays membres","Chaque province fait ses propres règles de société","Les entreprises n'ont plus d'impôts à payer","Seuls les étrangers sont concernés"],"a":0,"e":"Les Actes uniformes de l'OHADA s'appliquent directement dans les pays membres, dont la RDC."},{"q":"Parmi ces personnes, laquelle est un commerçant au sens du droit ?","o":["Une personne qui achète pour revendre de façon habituelle","Une personne qui vend un seul objet de sa maison une fois","Une personne qui reçoit un salaire d'un employeur","Une personne qui garde les enfants d'une voisine"],"a":0,"e":"Le commerçant accomplit des actes de commerce et en fait sa profession habituelle."},{"q":"Un hôtel veut vous commander pour 4 600 000 FC (2 000 $) mais exige une facture avec numéro d'impôt. Sans papiers, que se passe-t-il le plus probablement ?","o":["L'hôtel peut accepter sans facture, c'est toujours permis","Vous perdez probablement le marché au profit d'un concurrent en règle","Vous pouvez facturer librement","L'hôtel paie en avance sans condition"],"a":2,"e":"Les entreprises et administrations exigent généralement des fournisseurs en règle."},{"q":"Laquelle de ces affirmations sur la formalisation est exacte ?","o":["Elle dispense de tenir une comptabilité","Elle garantit un grand nombre de clients","Elle donne accès à de nouveaux marchés et organise la protection juridique, mais a un coût","Elle supprime tous les risques de l'activité"],"a":3,"e":"La formalisation ouvre des portes et organise les risques, sans les supprimer et sans remplacer le travail commercial."}]},{"t":"Chapitre 2 — L'entreprenant et l'entreprise individuelle","html":"\n<h4>Les deux façons de commencer seul<\/h4>\n<p>Quand une seule personne lance son activité sans créer de société, le droit OHADA lui offre deux voies : le statut d'<b>entreprenant<\/b> (très léger) ou l'<b>entreprise individuelle<\/b> (le commerçant en nom propre, avec immatriculation complète). Dans les deux cas, il n'y a pas de société : c'est la personne elle-même qui exerce.<\/p>\n<h4>Le statut d'entreprenant<\/h4>\n<p>L'entreprenant est un entrepreneur individuel qui déclare son activité par une <b>simple déclaration<\/b>, sans passer par l'immatriculation complète. Il a été créé pour aider les petites activités de survie ou de petite taille à sortir de l'ombre avec des formalités allégées. Ses principales caractéristiques :<\/p>\n<ul>\n<li>il s'adresse aux petites activités : le chiffre d'affaires doit rester sous un plafond fixé par les textes ;<\/li>\n<li>il se déclare auprès du registre du commerce (le RCCM) et reçoit un numéro ou une attestation de déclaration ;<\/li>\n<li>ses obligations comptables sont réduites : en général, un registre simple des recettes et dépenses plutôt qu'une comptabilité complète ;<\/li>\n<li>il n'a pas de protection particulière de son patrimoine : il répond de ses dettes sur ses biens, comme le petit commerçant classique ;<\/li>\n<li>s'il dépasse le plafond, il doit passer au statut de commerçant immatriculé (entreprise individuelle ou société).<\/li>\n<\/ul>\n<div class=\"warn\"><b>Attention.<\/b> Les conditions précises du statut d'entreprenant en RDC (plafond de chiffre d'affaires, avantages fiscaux et sociaux, procédure et guichet compétent) dépendent de textes complémentaires qui ont évolué et dont l'application varie. À vérifier auprès du guichet unique de création d'entreprise ou du greffe du registre du commerce avant de vous engager (taux et procédures peuvent changer).<\/div>\n<h4>L'entreprise individuelle (commerçant personne physique)<\/h4>\n<p>Le commerçant en nom propre s'immatricule au RCCM, reçoit un numéro de registre du commerce, puis obtient ses autres identifiants (numéro d'identification nationale, numéro d'impôt). Il tient une comptabilité et conserve ses pièces. C'est la forme la plus simple pour un commerçant qui travaille seul, avec quelques employés au plus.<\/p>\n<p><b>Avantages :<\/b> procédure plus rapide et moins chère qu'une société ; pas de statuts à rédiger ; pas besoin de capital minimum ; décisions prises par une seule personne.<\/p>\n<p><b>Limites :<\/b> la <b>responsabilité est illimitée<\/b>. Le patrimoine de l'entreprise et le patrimoine personnel ne sont pas séparés aux yeux des créanciers : si l'activité s'endette, ils peuvent saisir la maison, la voiture ou l'épargne personnelle. L'entreprise ne peut pas non plus s'ouvrir facilement à des associés, et la crédibilité auprès de grands clients est parfois moindre.<\/p>\n<h4>Entreprenant ou entreprise individuelle : comment choisir ?<\/h4>\n<table>\n<thead><tr><th>Question à vous poser<\/th><th>Plutôt entreprenant<\/th><th>Plutôt entreprise individuelle<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Chiffre d'affaires<\/td><td>Très faible, sous le plafond légal<\/td><td>Plus élevé ou en croissance<\/td><\/tr>\n<tr><td>Clients<\/td><td>Particuliers, marché<\/td><td>Entreprises, administrations, ONG<\/td><\/tr>\n<tr><td>Crédit bancaire<\/td><td>Peu probable<\/td><td>Possible avec comptabilité<\/td><\/tr>\n<tr><td>Employés<\/td><td>Aucun ou très peu<\/td><td>Plusieurs<\/td><\/tr>\n<tr><td>Objectif<\/td><td>Commencer légalement, simplement<\/td><td>Construire une vraie entreprise<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Patricia vend des beignets et du jus devant l'école, à Mbuji-Mayi. Elle fait 350 000 FC de ventes par mois, soit 4 200 000 FC par an (environ 1 826 $). Elle n'emploie personne. Pour elle, le statut d'entreprenant est adapté, à condition que son chiffre d'affaires reste sous le plafond légal. Deux ans plus tard, elle ouvre une petite cantine qui sert une administration voisine : ses ventes montent, elle emploie deux personnes et on lui demande des factures. Elle passe alors à l'entreprise individuelle. Elle a choisi la forme qui correspond à sa taille du moment, puis l'a changée en grandissant.<\/div>\n<h4>Dialogue-type avec le greffe<\/h4>\n<p><i>Patricia :<\/i> « Bonjour, je vends des beignets et du jus. Je travaille seule. Que me conseillez-vous ? »<br/>\n<i>L'agent :<\/i> « Quel est votre chiffre d'affaires mensuel ? »<br/>\n<i>Patricia :<\/i> « Autour de 350 000 FC. »<br/>\n<i>L'agent :<\/i> « Voyons si cela entre dans le statut d'entreprenant. Voici les pièces à fournir et les frais éventuels. Si vous grandissez, nous vous expliquerons le passage à l'immatriculation complète. »<\/p>\n<div class=\"key\"><b>À retenir.<\/b> Entreprenant et entreprise individuelle sont deux façons d'exercer seul, sans société. L'entreprenant déclare une petite activité avec des formalités légères ; l'entreprise individuelle suppose une immatriculation complète. Dans les deux cas, vous répondez de vos dettes avec vos biens personnels.<\/div>\n","quiz":[{"q":"Quelle est la principale différence de protection entre une entreprise individuelle et une SARL ?","o":["Dans l'entreprise individuelle, la responsabilité est illimitée sur les biens personnels","L'entreprise individuelle protège entièrement la maison de l'entrepreneur","La SARL ne peut jamais avoir de dettes","Il n'y a aucune différence"],"a":0,"e":"Dans l'entreprise individuelle, il n'y a pas de séparation entre patrimoine professionnel et patrimoine personnel."},{"q":"Patricia fait 350 000 FC de ventes par mois. Quel est son chiffre d'affaires annuel ?","o":["4 200 000 FC","3 500 000 FC","35 000 000 FC","420 000 FC"],"a":1,"e":"350 000 × 12 = 4 200 000 FC."},{"q":"Le statut d'entreprenant convient plutôt à :","o":["Un hôtel qui veut un crédit bancaire","Une petite activité individuelle avec un chiffre d'affaires modeste","Une grande société de 50 salariés","Un groupe qui exporte"],"a":2,"e":"Il est conçu pour les petites activités individuelles sous un plafond de chiffre d'affaires."},{"q":"Que doit faire un entreprenant dont le chiffre d'affaires dépasse le plafond légal ?","o":["Cacher une partie de ses ventes","Fermer son activité","Passer à un statut complet (entreprise individuelle ou société)","Rien, le plafond est indicatif"],"a":3,"e":"Au-delà du plafond, on ne peut plus rester sous le statut allégé."}]},{"t":"Chapitre 3 — Les sociétés : SARL, SA et SNC","html":"\n<h4>Qu'est-ce qu'une société ?<\/h4>\n<p>Une <b>société<\/b> est une entreprise créée par une ou plusieurs personnes, les <b>associés<\/b>, qui mettent en commun des <b>apports<\/b> (argent, matériel, marchandises, savoir-faire) pour faire fonctionner une activité et partager les bénéfices. Contrairement à l'entreprise individuelle, la société est une <b>personne morale<\/b> : elle a son propre nom, son propre patrimoine et peut posséder des biens, signer des contrats et aller en justice. Ses associés ne sont pas la société.<\/p>\n<h4>La SARL : la forme la plus courante pour les petites et moyennes entreprises<\/h4>\n<p>La <b>société à responsabilité limitée<\/b> est la forme préférée des commerçants qui s'associent ou qui veulent protéger leurs biens personnels.<\/p>\n<ul>\n<li><b>Associés :<\/b> une ou plusieurs personnes (la SARL peut être créée par un seul associé, on parle alors de SARL unipersonnelle), jusqu'à un nombre maximal fixé par la loi (le droit OHADA a fixé 100 associés).<\/li>\n<li><b>Responsabilité :<\/b> chaque associé n'est responsable des dettes que <b>jusqu'à hauteur de son apport<\/b>. Ses biens personnels ne sont pas saisis, sauf faute grave de gestion ou garantie personnelle donnée (par exemple, caution signée pour la banque).<\/li>\n<li><b>Capital :<\/b> divisé en parts sociales ; fixé dans les statuts.<\/li>\n<li><b>Direction :<\/b> un ou plusieurs gérants, associés ou non.<\/li>\n<li><b>Cession des parts :<\/b> encadrée, car les associés se connaissent ; on ne peut pas toujours vendre ses parts à n'importe qui sans accord.<\/li>\n<\/ul>\n<h4>La SA : société anonyme<\/h4>\n<p>La <b>société anonyme<\/b> convient aux projets plus importants : industrie, banque, assurance, grandes entreprises. Le capital est divisé en <b>actions<\/b>. Elle est plus lourde à gérer (conseil d'administration ou administrateur général, assemblées, commissaires aux comptes dans certains cas) et son capital minimal est plus élevé que celui de la SARL. Les actionnaires ne sont responsables que jusqu'à hauteur de leur apport. Elle peut ouvrir son capital au public dans certains cas.<\/p>\n<h4>La SNC : société en nom collectif<\/h4>\n<p>Dans la <b>SNC<\/b>, tous les associés sont des commerçants et sont <b>responsables indéfiniment et solidairement<\/b> des dettes de la société. « Indéfiniment » veut dire sans limite à leur apport ; « solidairement » veut dire que le créancier peut demander toute la somme à n'importe lequel d'entre eux. Elle exige beaucoup de confiance entre associés ; elle est utile entre membres d'une même famille ou entre amis très proches qui acceptent de partager tous les risques. Elle compte au moins deux associés.<\/p>\n<h4>Autres formes à connaître<\/h4>\n<ul>\n<li>La <b>SAS<\/b> (société par actions simplifiée) : forme introduite par le droit OHADA révisé, très souple, où les statuts organisent librement le fonctionnement ; elle peut aussi être unipersonnelle.<\/li>\n<li>La <b>société en commandite simple<\/b> : une forme mixte avec des associés responsables sans limite et d'autres limités à leur apport.<\/li>\n<\/ul>\n<table>\n<thead><tr><th>Critère<\/th><th>SARL<\/th><th>SA<\/th><th>SNC<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Responsabilité des associés<\/td><td>Limitée aux apports<\/td><td>Limitée aux apports<\/td><td>Illimitée et solidaire<\/td><\/tr>\n<tr><td>Nombre d'associés<\/td><td>1 ou plus, avec un maximum<\/td><td>1 ou plus (selon les textes)<\/td><td>Au moins 2<\/td><\/tr>\n<tr><td>Capital<\/td><td>Fixé dans les statuts<\/td><td>Plus élevé, minimum légal<\/td><td>Fixé dans les statuts<\/td><\/tr>\n<tr><td>Lourdeur de gestion<\/td><td>Moyenne<\/td><td>Élevée<\/td><td>Faible<\/td><\/tr>\n<tr><td>Pour qui ?<\/td><td>Petit et moyen commerce<\/td><td>Projet important, nombreux investisseurs<\/td><td>Associés très proches<\/td><\/tr>\n<\/tbody>\n<\/table>\n<div class=\"ex\"><b>Exemple en RDC.<\/b> Trois amis ouvrent un dépôt de boissons à Goma : Aimé, Grâce et Moïse. Ils choisissent une SARL. Un jour, un grossiste de Bukavu leur réclame 15 000 000 FC pour des cartons de bière livrés. Le dépôt est cambriolé, le stock est perdu. Dans une SARL, chacun ne perd que son apport (par exemple 2 000 000 FC), et le grossiste ne peut pas saisir la maison d'Aimé. Si les trois avaient créé une SNC, le grossiste aurait pu exiger les 15 000 000 FC d'un seul des trois, qui aurait ensuite dû se retourner contre les autres.<\/div>\n<div class=\"warn\"><b>Attention.<\/b> Le montant minimal du capital d'une SARL ou d'une SA, le nombre maximal d'associés et certaines règles de fonctionnement dépendent à la fois de l'Acte uniforme et des textes nationaux, et ont été modifiés au fil du temps. Confirmez les chiffres actuels auprès du guichet unique de création d'entreprise ou d'un notaire (taux et procédures peuvent changer).<\/div>\n<div class=\"key\"><b>À retenir.<\/b> SARL : responsabilité limitée, forme courante pour le commerce. SA : projets plus lourds, capital plus élevé. SNC : responsabilité illimitée et solidaire, entre associés de confiance. La société est une personne morale distincte de ses associés.<\/div>\n","quiz":[{"q":"Dans une SNC, un créancier de la société peut :","o":["Réclamer la totalité de la dette à n'importe lequel des associés","Seulement saisir les biens personnels du gérant","Réclamer uniquement l'apport des associés","Rien réclamer aux associés"],"a":1,"e":"La responsabilité est indéfinie et solidaire : chaque associé peut être poursuivi pour toute la dette."},{"q":"Dans une SARL de 3 associés, l'un d'eux a apporté 2 000 000 FC. La société perd tout et doit 15 000 000 FC. Sans garantie personnelle, il peut perdre au maximum :","o":["5 000 000 FC","2 000 000 FC","15 000 000 FC","Tous ses biens"],"a":2,"e":"La responsabilité est limitée à l'apport, sauf faute de gestion ou garantie personnelle."},{"q":"Qu'est-ce qu'une personne morale ?","o":["Un employé de l'État","Un grand commerçant","Une société qui a son propre nom et patrimoine, distincte de ses associés","Une personne qui ne ment jamais"],"a":3,"e":"La société est un être juridique distinct de ses associés."},{"q":"Quelle forme convient à trois amis qui ouvrent un petit dépôt et veulent protéger leurs biens personnels ?","o":["La SARL","La SNC","L'entreprise individuelle","Aucune, c'est impossible"],"a":0,"e":"La SARL limite la responsabilité à l'apport et reste simple à gérer."}]},{"t":"Chapitre 4 — Choisir sa forme juridique","html":"\n<h4>Il n'y a pas de « meilleure » forme<\/h4>\n<p>La bonne forme juridique est celle qui correspond à <b>votre situation<\/b> : combien de personnes participent, quels risques vous prenez, quel argent vous investissez, quels clients vous voulez servir, et quelle charge administrative vous pouvez supporter. Poser les bonnes questions permet d'éviter une erreur coûteuse.<\/p>\n<h4>Les six questions à vous poser<\/h4>\n<ol>\n<li><b>Suis-je seul ou à plusieurs ?<\/b> Seul : entreprenant, entreprise individuelle ou société unipersonnelle. À plusieurs : société.<\/li>\n<li><b>Quel est le niveau de risque ?<\/b> Si vous vendez de gros volumes à crédit, importez ou avez des dettes importantes, protégez vos biens personnels (SARL, par exemple).<\/li>\n<li><b>Quels clients visé-je ?<\/b> Pour les entreprises et les administrations, une société ou une entreprise individuelle immatriculée est mieux perçue que la simple déclaration d'entreprenant.<\/li>\n<li><b>Aurai-je besoin d'un crédit ou d'investisseurs ?<\/b> Une société avec des comptes propres est plus facile à financer.<\/li>\n<li><b>Quel capital puis-je réunir ?<\/b> Le capital doit être réel et suffisant pour l'activité.<\/li>\n<li><b>Quelle charge administrative puis-je supporter ?<\/b> Une société demande statuts, assemblées, comptes annuels ; une entreprise individuelle est plus légère.<\/li>\n<\/ol>\n<h4>Tableau de décision<\/h4>\n<table>\n<thead><tr><th>Votre situation<\/th><th>Forme à étudier en premier<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Vente au détail, très petit chiffre d'affaires, seul<\/td><td>Entreprenant<\/td><\/tr>\n<tr><td>Boutique ou atelier qui grandit, seul, peu de risque<\/td><td>Entreprise individuelle<\/td><\/tr>\n<tr><td>Seul, mais gros stock, crédit fournisseur ou prêt bancaire<\/td><td>SARL unipersonnelle<\/td><\/tr>\n<tr><td>Deux à dix associés qui investissent ensemble<\/td><td>SARL<\/td><\/tr>\n<tr><td>Projet industriel ou important, beaucoup d'investisseurs<\/td><td>SA ou SAS<\/td><\/tr>\n<tr><td>Famille ou amis très proches qui acceptent tous les risques<\/td><td>SNC<\/td><\/tr>\n<\/tbody>\n<\/table>\n<h4>Cas chiffré : ce que la forme change au moment d'un malheur<\/h4>\n<p>Deux frères, Daniel et David, ont chacun un dépôt de pièces détachées à Kinshasa. Chacun a acheté 20 000 000 FC de marchandises à crédit auprès d'un fournisseur, et chacun subit un incendie qui détruit son stock. Il leur reste 6 000 000 FC d'actifs. Daniel est en entreprise individuelle ; David a créé une SARL avec un capital de 5 000 000 FC et n'a signé aucune garantie personnelle.<\/p>\n<ul>\n<li>Dette : 20 000 000 FC. Actif restant : 6 000 000 FC. Il manque <b>14 000 00
