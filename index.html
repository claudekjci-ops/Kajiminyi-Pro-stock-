<style>
:root{--dg:#003B32;--g:#00A86B;--bg:#F4F7F6;--o:#FFA726;--r:#E53935;--tx:#13302b;--mu:#6b8480;--bd:#e1e9e7;--cd:#fff;--cd2:#fafcfb;--sh:0 2px 12px rgba(0,59,50,.08);--gold:#F5C518}
[data-theme="dark"]{--bg:#0c1513;--tx:#e8f1ee;--mu:#8fa8a2;--bd:#1e2f2b;--cd:#14201d;--cd2:#182622;--sh:0 2px 12px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;overscroll-behavior-y:none;transition:background .25s,color .25s}
h2,h3{margin:0}button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.ic{vertical-align:middle;flex:none}.muted{color:var(--mu)}.pos{color:var(--g)}.neg{color:var(--r)}.sm{font-size:.85em}.right{text-align:right}
.card,.kpi,.pcard,.btn.ghost,.search,.frm input,.frm select,.frm textarea,.in,.sbox,.chip,.gbtn,.bnav,.sheet{background:var(--cd)}
.tbl td,.cl,.jrow,.mi{border-color:var(--bd)}
[data-theme="dark"] .ph-ic{background:linear-gradient(135deg,#123c30,#0d2c23);color:#7ef0bd}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#007a4d,#005a39)!important}
[data-theme="dark"] .tile small{opacity:.85}
.splash,.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--dg),#005a48);color:#fff;padding:24px;text-align:center}
.login .box{background:var(--cd);color:var(--tx);border-radius:24px;padding:32px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login h1{margin:12px 0 4px;color:var(--dg);font-size:1.4rem;letter-spacing:.5px}
[data-theme="dark"] .login h1{color:#7ef0bd}
.login p{color:var(--mu);margin:0 0 22px;font-size:.9rem}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;border:1px solid var(--bd);border-radius:14px;font-weight:600;box-shadow:var(--sh)}
.gbtn:active{transform:scale(.98)}
.logo-svg{width:88px;height:88px}
.shell{min-height:100vh}
.side{position:fixed;top:0;bottom:0;left:0;width:250px;background:var(--dg);color:#fff;z-index:50;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.side.open+.scrim{display:block}
.side .lg{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:800;letter-spacing:.5px}
.side .lg small{display:block;font-weight:400;font-size:.7rem;opacity:.7;letter-spacing:0}
.side nav{flex:1;overflow:auto;padding:4px 10px}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#cfe7df;text-decoration:none;margin-bottom:2px}
.side a.on{background:var(--g);color:#fff;font-weight:600}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:.8rem}
.mainwrap{min-height:100vh;padding-bottom:78px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;background:var(--dg);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .brand-s{font-weight:800;flex:1;font-size:.95rem;display:flex;align-items:center;gap:8px}
.top .brand-s b{color:var(--gold)}
.ib{background:none;border:0;color:#fff;padding:4px}
.net{font-size:.72rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.15)}
.net.off{background:var(--o);color:#3a2500}
main{padding:14px;max-width:1300px;margin:0 auto}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.68rem;color:var(--mu);text-decoration:none;background:none;border:0}
.bnav a.on{color:var(--g);font-weight:700}
@media(min-width:900px){.side{transform:none}.scrim{display:none!important}.mainwrap{margin-left:250px;padding-bottom:20px}.bnav{display:none}.top .ib.mbtn{display:none}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:1.25rem;color:var(--dg)}
[data-theme="dark"] .ph h2{color:#7ef0bd}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{border-radius:18px;padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-size:.95rem;margin-bottom:8px;color:var(--dg)}
[data-theme="dark"] .card h3{color:#7ef0bd}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{border-radius:16px;padding:12px;box-shadow:var(--sh);border-left:5px solid var(--g);animation:up .35s both}
.kpi small{color:var(--mu);display:block;font-size:.74rem}.kpi b{font-size:1.12rem;display:block;margin-top:2px;word-break:break-word}
.kpi.o{border-color:var(--o)}.kpi.r{border-color:var(--r)}.kpi.d{border-color:var(--dg)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chart{position:relative;height:230px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{color:var(--dg);border:1px solid var(--bd)}[data-theme="dark"] .btn.ghost{color:#7ef0bd}
.btn.dark{background:var(--dg)}.btn.red{background:var(--r)}.btn.orange{background:var(--o);color:#3a2500}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:9px}.btn[disabled]{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font-size:.84rem}
.chip.on{background:var(--dg);color:#fff;border-color:var(--dg)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600;background:#e3f6ee;color:#007a4d}
[data-theme="dark"] .badge{background:#0e3a2b;color:#5fe3ae}
.badge.warn{background:#fff1dc;color:#9a5b00}[data-theme="dark"] .badge.warn{background:#3d2c07;color:#ffc966}
.badge.bad{background:#fde6e5;color:#b3231f}[data-theme="dark"] .badge.bad{background:#471311;color:#ff8a85}
.badge.gold{background:#fff6d6;color:#8a6d00}[data-theme="dark"] .badge.gold{background:#3a2f06;color:#ffe27a}
.badge.gray{background:#eceff0;color:#556}[data-theme="dark"] .badge.gray{background:#24322e;color:#9db8b1}
.badge.blue{background:#e3f0fd;color:#1258a6}[data-theme="dark"] .badge.blue{background:#0c2a47;color:#7cc0ff}
.search{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:8px}
.tw{overflow-x:auto;border-radius:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{background:var(--dg);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap;font-weight:600;font-size:.78rem}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:nth-child(even) td{background:var(--cd2)}
.tbl img.th{width:38px;height:38px;border-radius:8px;object-fit:cover;display:block}
.tbl .ac{white-space:nowrap}.tbl .ac button{background:none;border:0;color:var(--g);padding:4px}.tbl .ac .del{color:var(--r)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:12px}.sp{justify-content:space-between}
.frm{display:flex;flex-direction:column;gap:10px}
.frm label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--mu);font-weight:600}
.frm input,.frm select,.frm textarea,.in{padding:10px 12px;border:1px solid var(--bd);border-radius:12px;font-size:1rem;width:100%}
.frm input:focus,.frm select:focus,.search:focus{outline:2px solid var(--g);border-color:transparent}
.frm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--tx)}.frm .chk input{width:auto}
.urow,.pl{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.pl{grid-template-columns:1.5fr 1fr .8fr .9fr auto auto}
.urow input,.pl input,.pl select{padding:8px;border:1px solid var(--bd);border-radius:10px;width:100%;min-width:0;background:var(--cd)}
@media(max-width:600px){.pl{grid-template-columns:1fr 1fr 1fr}.pl .pl-p{grid-column:1/4}}
.x{background:none;border:0;color:var(--mu);font-size:1.1rem;padding:4px 8px}
.modal-wrap{position:fixed;inset:0;background:rgba(0,20,16,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.modal-wrap.open{opacity:1}
.sheet{background:var(--cd);color:var(--tx);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .25s}
.modal-wrap.open .sheet{transform:none}.sheet.wide{max-width:760px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.sheet-h h3{color:var(--dg)}[data-theme="dark"] .sheet-h h3{color:#7ef0bd}
.sheet-b{padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
@media(min-width:700px){.modal-wrap{align-items:center}.sheet{border-radius:22px}}
#toasts{position:fixed;top:12px;left:0;right:0;z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;animation:up .25s;transition:opacity .35s}
.toast.err{background:var(--r)}.toast.out{opacity:0}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:14px;padding:0 12px;margin-bottom:10px;color:var(--mu)}
.sbox input{flex:1;border:0;outline:0;padding:12px 0;background:none;font-size:1rem;color:var(--tx)}
.plist{display:flex;flex-direction:column;gap:8px;padding-bottom:96px}

function resizeImage(file, max = 240) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.7)); }; im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- toasts / sonnerie / modales ---------- */
function beep(kind = 'ok') {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const play = (f, t0, d) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.001, ctx.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t0 + d); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + d); };
    if (kind === 'err') { play(330, 0, .18); play(233, .16, .3); }
    else if (kind === 'cash') { play(880, 0, .1); play(1174, .09, .18); }
    else { play(659, 0, .1); play(880, .08, .16); }
  } catch (e) {}
}
function toast(msg, type = 'ok') {
  beep(type === 'err' ? 'err' : 'ok');
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.classList.add('out'), 3200); setTimeout(() => t.remove(), 3600);
}
function modal(title, html, opts = {}) {
  const w = document.createElement('div'); w.className = 'modal-wrap';
  w.innerHTML = `<div class="sheet ${opts.wide ? 'wide' : ''}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Fermer">✕</button></div><div class="sheet-b">${html}</div></div>`;
  document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('open'));
  w.close = () => { w.classList.remove('open'); setTimeout(() => { w.remove(); hooks.afterModal(); }, 200); };
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-close]')) w.close(); });
  return w;
}
const formData = f => Object.fromEntries(new FormData(f));
function form(title, html, onSubmit, opts = {}) {
  const w = modal(title, `<form class="frm">${html}<div class="row end"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">${opts.ok || 'Enregistrer'}</button></div></form>`, opts);
  const f = w.querySelector('form');
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (f.dataset.busy) return; f.dataset.busy = 1;
    try { const r = await onSubmit(formData(f), w, f); if (r !== false) w.close(); }
    catch (err) { toast(err.message || String(err), 'err'); }
    finally { delete f.dataset.busy; }
  });
  opts.onOpen?.(w, f); return w;
}

/* ---------- opérations atomiques + traçabilité ---------- */
function batch() {
  const b = F.writeBatch(F.db);
  const api = {
    set: (c, id, d) => { b.set(F.doc(F.db, c, id), { storeId: STORE, ...d }); return api; },
    merge: (c, id, d) => { b.set(F.doc(F.db, c, id), { storeId: STORE, ...d }, { merge: true }); return api; },
    upd: (c, id, d) => { b.update(F.doc(F.db, c, id), d); return api; },
    del: (c, id) => { b.delete(F.doc(F.db, c, id)); return api; },
    commit: () => { const p = b.commit(); p.catch(e => { console.error(e); toast('Erreur de synchronisation : ' + e.message, 'err'); }); return p; }
  };
  return api;
}
const who = () => S.me?.name || S.user?.email || '';
function jr(b, type, desc, amt = null, cur = '', cat = '', ref = '') {
  const id = uid(), ts = Date.now();

function cashop(b, kind, cur, amt, desc, ref = '', ts = Date.now()) {

}

function subscribe(onChange) {
  let t; const fire = () => { clearTimeout(t); t = setTimeout(onChange, 60); }; const un = [];
  for (const c of COLS) {
    const q = c === 'journal' ? F.query(F.collection(F.db, c), F.orderBy('ts', 'desc'), F.limit(600)) : F.collection(F.db, c);
    un.push(F.onSnapshot(q, snap => { S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); fire(); }, err => console.error(c, err)));
  }
  un.push(F.onSnapshot(F.doc(F.db, 'meta', 'settings'), s => { if (s.exists()) S.settings = { ...S.settings, ...s.data(), payRules: { ...S.settings.payRules, ...(s.data().payRules || {}) }, supWeights: { ...S.settings.supWeights, ...(s.data().supWeights || {}) }, modules: { ...(s.data().modules || {}) } }; fire(); }));
  return () => un.forEach(u => u());
}

let cart = [], sq = '', scat = '', stab = 'new';

const MODES = () => {
  const r = S.settings.payRules, on = payRulesActive();
  const all = [
    ['cdf_cdf', 'Espèces CDF'], ['usd_usd', 'Espèces USD'], ['bank_usd', 'Virement / banque USD'],
    ['mm_cdf', 'Mobile Money CDF'], ['mm_usd', 'Mobile Money USD'], ['credit', 'Crédit'], ['mixte', 'Paiement mixte']];
  if (!on) return all;
  return all.filter(([k]) => k === 'credit' || k === 'mixte' ||
    (k === 'cdf_cdf' && r.cdf !== false) || (k === 'usd_usd' && r.usdCash) || (k === 'bank_usd' && r.usdBank) ||
    (k === 'mm_cdf' && r.cdf !== false && r.usdMM) || (k === 'mm_usd' && r.usdMM));
};
const cartLines = () => cart.map(c => {
  const p = S.products.find(x => x.id === c.pid); if (!p) return null;
  const us = allUnits(p), u = us.find(x => x.name === c.unit) || us[0], price = unitPrice(p, u);
  return { c, p, u, qty: c.qty, price, cost: p.buy * u.factor, sub: price * c.qty };
}).filter(Boolean);
const totals = L => { const sub = sum(L, x => x.sub), disc = Math.min(100, Math.max(0, num(ck.disc))); return { sub, disc, discAmt: r2(sub * disc / 100), total: r2(sub * (1 - disc / 100)) }; };
const payAmounts = total => {
  const r = S.settings.rate;
  switch (ck.mode) {
    case 'usd_usd': return { usd: total, cdf: 0, mm: 0, mmc: 'USD', credit: 0 };
    case 'bank_usd': return { usd: total, cdf: 0, mm: 0, mmc: 'USD', credit: 0 };
    case 'mm_usd': return { usd: 0, cdf: 0, mm: total, mmc: 'USD', credit: 0 };
    case 'mm_cdf': return { usd: 0, cdf: 0, mm: Math.round(total * r), mmc: 'CDF', credit: 0 };
    case 'credit': return { usd: 0, cdf: 0, mm: 0, mmc: 'USD', credit: total };
    default: return { usd: num(ck.usd), cdf: num(ck.cdf), mm: num(ck.mm), mmc: ck.mmc || 'CDF', credit: num(ck.credit) };
  }
};

      ${rows.map(s => `<tr data-s="${esc((s.no + ' ' + (s.clientName || '') + ' ' + s.userName).toLowerCase())}"><td>${s.no}${justifBadge('sale', s.id)}</td><td>${fmtDate(s.ts)}</td><td>${esc(s.clientName || '—')}</td><td>${esc(s.userName)}</td><td><b>${cdf(s.total * RATE(s))}</b><br><small class="muted">${usd(s.total)}</small></td>

    <div class="plist" id="pgrid">${S.products.map(p => { const ex = expiryState(p), st = stockState(p); return `<div class="pcard prow ${st === 'rupture' || st === 'suspendu' || ex === 'expired' ? 'out' : ''}" data-act="addcart" data-id="${p.id}" data-c="${p.cat}" data-s="${esc([p.name, p.code, p.barcode, p.brand].join(' ').toLowerCase())}">
      ${p.photo ? `<img src="${p.photo}" alt="">` : `<div class="ph-ic">${esc((p.name || '?')[0])}</div>`}<div class="pi"><b>${esc(p.name)}</b><small>${usd(p.sell)} / ${esc(p.unit)} · <span class="${st === 'ok' ? 'muted' : 'neg'}">${fmtQty(p)}</span>${ex ? ` · <span class="${ex === 'expired' ? 'neg' : ''}">${ex === 'expired' ? 'EXPIRÉ' : 'expire ' + p.exp}</span>` : ''}${p.suspended ? ' · <span class="muted">VENTE SUSPENDUE</span>' : ''}</small></div><span class="plus">${ic('plus', 20)}</span></div>`; }).join('') || '<p class="muted">Aucun produit. Ajoutez-en dans « Produits ».</p>'}</div>
    <div class="sfoot"><span>Total : <b>${cdf(totals(cartLines()).total * S.settings.rate)}</b><br><small class="muted">${usd(totals(cartLines()).total)}</small></span><button class="btn big" data-act="opencart" ${cart.length ? '' : 'disabled'}>${ic('cart')} Valider${cart.length ? ' (' + cart.length + ')' : ''}</button></div>`);

}

  if (e.target.id === 'sq' && e.key === 'Enter') {
    const q = e.target.value.trim().toLowerCase();

A.stab = d => { stab = d.t; views.sales($('#view')); };
A.scat = d => { scat = d.c; $$('[data-act="scat"]').forEach(b => b.classList.toggle('on', b.dataset.c === scat)); applyGrid(); };
A.addcart = d => {
  const p = S.products.find(x => x.id === d.id); if (!p) return;
  const ex = expiryState(p);
  if (p.suspended) return toast('Vente suspendue pour ce produit', 'err');
  if (ex === 'expired') return toast('Produit expiré — vente impossible', 'err');
  if (p.qty <= 0) return toast('Produit en rupture de stock', 'err');
  const l = cart.find(c => c.pid === p.id && c.unit === p.unit);
  if (l) l.qty += 1; else cart.push({ pid: p.id, unit: p.unit, qty: 1 });
  toast(p.name + ' ajouté'); views.sales($('#view'));
};
A.opencart = () => openCart();

function openCart() {
  const w = modal('Panier', '<div id="cartbody"></div>', { wide: true });
  const body = w.querySelector('#cartbody');
  const rate = S.settings.rate;
  const paint = () => {
    const L = cartLines(), t = totals(L), pa = payAmounts(t.total);
    if (!L.length) { body.innerHTML = '<p class="muted">Panier vide.</p>'; return; }
    body.innerHTML = `${L.map((x, i) => `<div class="cl"><div><b>${esc(x.p.name)}</b><br><small class="muted">${usd(x.price)} / ${esc(x.u.name)} — stock ${fmtQty(x.p)}</small></div><b>${cdf(x.sub * rate)}</b>
      <select data-cf="unit" data-i="${i}">${allUnits(x.p).map(u => `<option ${u.name === x.u.name ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
      <div class="qty"><button data-ca="dec" data-i="${i}">−</button><input type="number" step="any" min="0" inputmode="decimal" value="${x.qty}" data-cf="qty" data-i="${i}"><button data-ca="inc" data-i="${i}">+</button><button data-ca="rm" data-i="${i}" style="color:var(--r)">✕</button></div></div>`).join('')}
      <div class="frm" style="margin-top:10px"><div class="two">
        <label>Remise (%) — max ${isMgr() ? 100 : S.settings.maxDisc}%<input type="number" step="any" min="0" data-cf="disc" value="${esc(ck.disc)}"></label>
        <label>Client${ck.mode === 'credit' || num(ck.credit) > 0 ? ' (obligatoire)' : ''}<select data-cf="client"><option value="">— Comptoir —</option>${S.clients.map(c => `<option value="${c.id}" ${ck.client === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label></div></div>
      <div class="totbox"><div class="row sp"><span>Sous-total</span><b>${cdf(t.sub * rate)}</b></div><div class="row sp"><span>Remise</span><b>−${cdf(t.discAmt * rate)}</b></div>
        <div class="row sp"><span>À PAYER</span><span class="big">${cdf(t.total * rate)}</span></div><div class="row sp muted"><span>≈ en dollars</span><span>${usd(t.total)}</span></div></div>
      <div class="chips">${MODES().map(([k, l]) => `<button class="chip ${ck.mode === k ? 'on' : ''}" data-ca="mode" data-m="${k}">${l}</button>`).join('')}</div>
      ${!MODES().some(m => m[0] === ck.mode) ? `<p class="neg sm">⚠ Ce mode de paiement n'est plus autorisé par la réglementation configurée.</p>` : ''}
      ${ck.mode === 'mixte' ? `<div class="frm"><div class="two"><label>Espèces USD ($)<input type="number" step="any" data-pf="usd" value="${esc(ck.usd)}"></label><label>Espèces CDF (FC)<input type="number" step="any" data-pf="cdf" value="${esc(ck.cdf)}"></label>
        <label>Mobile Money<input type="number" step="any" data-pf="mm" value="${esc(ck.mm)}"></label><label>Devise MM<select data-pf="mmc">${['CDF', 'USD'].map(c => `<option ${ck.mmc === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
        <label>Crédit ($)<input type="number" step="any" data-pf="credit" value="${esc(ck.credit)}"></label></div>
        <div class="row sp"><span>Reste à payer</span><b id="reste"></b></div></div>`
      : `<p class="muted">À encaisser : ${ck.mode === 'cdf_cdf' ? cdf(t.total * rate) : ck.mode === 'mm_cdf' ? cdf(t.total * rate) : usd(t.total)}${ck.mode === 'credit' ? ' (ajouté à la dette du client)' : ''}</p>`}
      <div class="row end"><button class="btn ghost" data-ca="clear">Vider</button><button class="btn" data-ca="pay">Encaisser & enregistrer</button></div>`;
    reste();
  };
  const reste = () => {
    const r = body.querySelector('#reste'); if (!r) return;
    const t = totals(cartLines()), pa = payAmounts(t.total), mmU = pa.mmc === 'CDF' ? pa.mm / rate : pa.mm;
    const left = t.total - (pa.usd + pa.cdf / rate + mmU + pa.credit);
    r.textContent = cdf(left * rate) + ' / ' + usd(left); r.className = Math.abs(left) <= 0.05 ? 'pos' : 'neg';
  };
  paint();
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-ca]'); if (!b) return; const i = +b.dataset.i, a = b.dataset.ca;
    if (a === 'dec') cart[i].qty = Math.max(1, cart[i].qty - 1);
    else if (a === 'inc') cart[i].qty += 1;
    else if (a === 'rm') cart.splice(i, 1);
    else if (a === 'mode') ck.mode = b.dataset.m;
    else if (a === 'clear') { cart = []; w.close(); return; }
    else if (a === 'pay') { try { checkout(w); } catch (err) { toast(err.message, 'err'); } return; }
    if (!cart.length) { w.close(); return; }
    paint();
  });
  body.addEventListener('change', e => {
    const f = e.target.dataset.cf; if (!f) return; const i = +e.target.dataset.i;
    if (f === 'unit') cart[i].unit = e.target.value;
    else if (f === 'qty') cart[i].qty = Math.max(0, num(e.target.value)) || 1;
    else ck[f] = e.target.value;
    paint();
  });
  body.addEventListener('input', e => { const f = e.target.dataset.pf; if (f) { ck[f] = e.target.value; reste(); } });
}

function checkout(w) {
  const L = cartLines(); if (!L.length) throw new Error('Panier vide');
  const need = {}; L.forEach(x => { need[x.p.id] = (need[x.p.id] || 0) + x.qty * x.u.factor; });
  for (const id in need) { const p = S.products.find(q => q.id === id); if (need[id] > p.qty + 1e-9) throw new Error(`Stock insuffisant : ${p.name} (disponible ${fmtQty(p)})`); }
  const t = totals(L), lim = isMgr() ? 100 : S.settings.maxDisc;
  if (t.disc > lim) throw new Error(`Remise maximale autorisée : ${lim}%`);
  if (!MODES().some(m => m[0] === ck.mode)) throw new Error('Mode de paiement non autorisé (règles de paiement en vigueur)');
  const pay = payAmounts(t.total), rate = S.settings.rate, mmU = pay.mmc === 'CDF' ? pay.mm / rate : pay.mm;
  const paid = pay.usd + pay.cdf / rate + mmU + pay.credit;
  if (Math.abs(paid - t.total) > 0.05) throw new Error('Le total des paiements doit être égal au montant à payer');
  const cl = S.clients.find(c => c.id === ck.client);
  if (pay.credit > 0) {
    if (!cl) throw new Error('Choisissez un client pour une vente à crédit');
    if (!(cl.limit > 0) || (cl.debt || 0) + pay.credit > cl.limit + 1e-9) throw new Error(`Plafond de crédit dépassé (plafond ${usd(cl.limit || 0)}, dette ${usd(cl.debt || 0)})`);
  }
  if ((pay.usd > 0 || pay.cdf > 0) && !curSession()) throw new Error("Ouvrez la caisse (menu Caisse) avant d'encaisser des espèces");

  const id = uid(), ts = Date.now(), d = new Date(ts);
  const no = 'V' + String(d.getFullYear()).slice(2) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + id.slice(0, 4).toUpperCase();
  const items = L.map(x => ({ pid: x.p.id, name: x.p.name, cat: x.p.cat, unit: x.u.name, factor: x.u.factor, qty: x.qty, price: r2(x.price), cost: r2(x.cost) }));
  const cost = r2(sum(L, x => x.cost * x.qty));
  const sale = {
    id, no, ts, day: dayKey(ts), uid: S.user.uid, userName: who(), items, subtotal: r2(t.sub), discount: t.discAmt, discPct: t.disc, total: t.total,
    pay: { usd: pay.usd, cdf: pay.cdf, mm: r2(mmU), mmCdf: pay.mmc === 'CDF' ? pay.mm : 0, mmc: pay.mmc, credit: pay.credit }, clientId: cl?.id || '', clientName: cl?.name || '',
    status: 'ok', cost, profit: r2(t.total - cost), rate
  };
  const b = batch();
  b.set('sales', id, sale);
  for (const pid in need) b.upd('products', pid, { qty: inc(-need[pid]) });
  if (pay.usd > 0) cashop(b, 'sale', 'USD', pay.usd, 'Vente ' + no, id);
  if (pay.cdf > 0) cashop(b, 'sale', 'CDF', pay.cdf, 'Vente ' + no, id);
  if (mmU > 0) cashop(b, 'sale', pay.mmc === 'CDF' ? 'CDF' : 'MM', pay.mmc === 'CDF' ? pay.mm : mmU, 'Vente ' + no, id);
  if (cl) b.upd('clients', cl.id, { debt: inc(pay.credit), spent: inc(t.total), last: ts });
  jr(b, 'Vente', `Vente ${no} — ${items.length} article(s)${cl ? ' — ' + cl.name : ''}`, t.total, 'USD', '', id);
  b.commit();
  cart = []; ck = { disc: 0, client: '', mode: 'cdf_cdf', usd: '', cdf: '', mm: '', mmc: 'CDF', credit: '' };
  beep('cash');
  w.close(); toast('Vente enregistrée : ' + cdf(t.total * rate)); views.sales($('#view')); showReceipt(sale);
}

function receiptText(s) {

A.receipt = d => { const s = S.sales.find(x => x.id === d.id); if (s) showReceipt(s); };
A.rshare = async d => {
  const s = S.sales.find(x => x.id === d.id); if (!s) return; const text = receiptText(s);
  try { if (navigator.share) await navigator.share({ title: 'Reçu ' + s.no, text }); else window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); } catch {}
};
A.cancelsale = async d => {
  const s = S.sales.find(x => x.id === d.id); if (!s || s.status === 'cancelled') return;
  if (!await confirmBox(`Annuler la vente ${s.no} (${usd(s.total)}) ? Le stock et la caisse seront rétablis.`, 'Annuler la vente')) return;
  const b = batch(), need = {};
  s.items.forEach(i => { need[i.pid] = (need[i.pid] || 0) + i.qty * i.factor; });
  b.upd('sales', s.id, { status: 'cancelled', cancelTs: Date.now(), cancelBy: who() });
  for (const pid in need) if (S.products.some(p => p.id === pid)) b.upd('products', pid, { qty: inc(need[pid]) });
  const p = s.pay || {};
  if (p.usd > 0) cashop(b, 'cancel', 'USD', -p.usd, 'Annulation ' + s.no, s.id);
  if (p.cdf > 0) cashop(b, 'cancel', 'CDF', -p.cdf, 'Annulation ' + s.no, s.id);
  if (p.mm > 0) cashop(b, 'cancel', 'MM', -p.mm, 'Annulation ' + s.no, s.id);
  if (s.clientId && S.clients.some(c => c.id === s.clientId)) b.upd('clients', s.clientId, { debt: inc(-(p.credit || 0)), spent: inc(-s.total) });
  jr(b, 'Annulation', `Annulation de la vente ${s.no} par ${who()}`, s.total, 'USD', '', s.id);
  b.commit(); toast('Vente annulée');
};

    <div class="two">${fld("Prix d'achat", 'buy', p.buy ?? '', 'number', 'required min="0"')}${sel("Devise d'achat", 'curBuy', ['USD', 'CDF'], p.curBuy || 'USD')}</div>

    <div class="two">${sel('Unité de base', 'unit', ['Pièce', 'Verre', 'Ekolo', 'Bleuband', 'Bouteille', 'Carton', 'Casier', 'Paquet', 'Kilogramme', 'Litre', 'Ram', 'Farde', 'Boîte', 'Tige', 'Chaîne', 'Sachet'], p.unit)}${fld('Stock minimum (unité de base)', 'min', p.min ?? 5, 'number', 'min="0"')}</div>
    <div class="two">${fld('Date de fabrication (facultative)', 'mfd', p.mfd || '', 'date')}${fld("Date d'expiration", 'exp', p.exp || '', 'date')}</div>

    ${d.id ? `<p class="muted sm">Quantité actuelle : <b>${fmtQty(p)}</b> — modifiable via un inventaire ou une entrée de stock.</p>` : fld('Quantité initiale (unité de base)', 'qty', 0, 'number', 'min="0"')}
    <div class="hint"><b>Conversions d'unités</b> : ex. unité de base « Bouteille », puis « Carton » contient 12. Vendre 1 bouteille donne 10 − (1 ÷ 12) = 9,9167 cartons. Le stock est tenu en unité de base, sans erreur d'arrondi.</div>

    async (v, w, f) => {
      const name = v.name.trim(); if (!name) throw new Error('Nom requis');
      const code = (v.code || '').trim() || 'P' + String(S.products.length + 1).padStart(4, '0');
      if (S.products.some(x => x.id !== d.id && x.code && x.code.toLowerCase() === code.toLowerCase())) throw new Error('Ce code produit existe déjà');
      const units = [...f.querySelectorAll('.urow')].map(r => ({ name: r.querySelector('.u-n').value.trim(), factor: num(r.querySelector('.u-f').value), price: num(r.querySelector('.u-p').value) })).filter(u => u.name && u.factor > 0 && u.name !== v.unit);
      const photo = $('#pphoto').value || p.photo || '';
      // Normalisation en USD (référence interne) selon la devise saisie
      const rate = S.settings.rate;
      const buy = v.curBuy === 'CDF' ? r2(num(v.buy) / rate) : num(v.buy);
      const sell = v.curSell === 'CDF' ? r2(num(v.sell) / rate) : num(v.sell);
      const data = { name, code, barcode: v.barcode.trim(), cat: v.cat, brand: v.brand.trim(), photo, desc: v.desc.trim(), qualities: v.qualities.trim(), mfd: v.mfd || '', exp: v.exp || '', supplier: v.supplier || '', curBuy: v.curBuy, curSell: v.curSell, buy, sell, min: num(v.min), unit: v.unit, units, suspended: !!v.suspended, updated: Date.now(), updatedBy: who() };
      const b = batch();
      if (d.id) {
        const diff = []; [['name', 'nom'], ['buy', 'prix achat'], ['sell', 'prix vente'], ['min', 'stock min'], ['cat', 'catégorie'], ['unit', 'unité'], ['exp', 'expiration'], ['suspended', 'suspension']].forEach(([k, l]) => { if (String(p[k]) !== String(data[k])) diff.push(`${l}: ${p[k]} → ${data[k]}`); });
        b.merge('products', d.id, data); jr(b, 'Modification produit', `${name} par ${who()} ${diff.join(' ; ') || '(détails)'}`, null, '', catName(data.cat), d.id);
      } else {
        const id = uid(), qty = num(v.qty);
        b.set('products', id, { id, ...data, qty, ts: Date.now(), createdBy: who() });
        jr(b, 'Produit créé', `${name} (${code})${qty ? ' — stock initial ' + qty + ' ' + v.unit : ''}`, qty || null, '', catName(data.cat), id);
      }
      b.commit(); toast('Produit enregistré');
    }, {
      onOpen: (w, f) => {

    });
};

let inv = null;
views.inventory = el => {
  if (!inv) {
    el.innerHTML = page('Inventaire', '', `<div class="card"><h3>Nouvel inventaire</h3><div class="frm"><label>Périmètre<select id="invscope"><option value="all">Tout le magasin</option>${S.categories.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>

      <div class="card"><h3>Historique des inventaires</h3>${[...S.inventories].sort((a, b) => b.ts - a.ts).map(i => `<div class="mi"><span>${fmtDate(i.ts)} — ${esc(i.scopeName)} <small class="muted">(${i.lines.length} produits, par ${esc(i.userName)})</small>${justifBadge('inventory', i.id)}</span><span><b class="${i.valueAdj < 0 ? 'neg' : 'pos'}">${usd(i.valueAdj)}</b> <button class="btn sm ghost" data-act="invview" data-id="${i.id}">Rapport</button></span></div>`).join('') || '<p class="muted">Aucun inventaire.</p>'}</div>`);
    return;
  }
  const ps = S.products.filter(p => inv.scope === 'all' || p.cat === inv.scope);
  el.innerHTML = page('Comptage en cours — ' + esc(inv.scopeName), `<button class="btn ghost" data-act="invcancel">Abandonner</button><button class="btn" data-act="invvalidate">Valider</button>`, `
    <div class="hint">Saisissez le stock physique (en unité de base) et les produits endommagés/perdus (casse, vol, rongés…). Les lignes vides ne sont pas ajustées.</div>
    <div class="tw"><table class="tbl"><thead><tr><th>Produit</th><th>Théorique</th><th>Physique</th><th>Endommagés/perdus</th><th>Écart</th></tr></thead><tbody>
    ${ps.map(p => `<tr data-pid="${p.id}" data-theo="${p.qty}"><td><b>${esc(p.name)}</b><br><small class="muted">${esc(catName(p.cat))}</small></td><td>${+p.qty.toFixed(3)} ${esc(p.unit)}</td>
      <td><input class="inv-in i-p" type="number" step="any" min="0" inputmode="decimal"></td><td><input class="inv-in i-d" type="number" step="any" min="0" inputmode="decimal" value="0"></td><td class="gap">—</td></tr>`).join('')}
    </tbody></table></div>`);
};
document.addEventListener('input', e => {
  if (!e.target.classList.contains('inv-in')) return;
  const tr = e.target.closest('tr'), th = num(tr.dataset.theo), ph = tr.querySelector('.i-p').value, dm = num(tr.querySelector('.i-d').value), g = tr.querySelector('.gap');
  if (ph === '') { g.textContent = '—'; g.className = 'gap'; return; }
  const gap = r2(num(ph) + dm - th); g.textContent = (gap > 0 ? '+' : '') + gap; g.className = 'gap ' + (gap < 0 ? 'neg' : gap > 0 ? 'pos' : '');
});
A.invstart = () => { const scope = $('#invscope').value; inv = { scope, scopeName: scope === 'all' ? 'Tout le magasin' : catName(scope) }; views.inventory($('#view')); };
A.invcancel = async () => { if (await confirmBox('Abandonner ce comptage ?', 'Abandonner')) { inv = null; views.inventory($('#view')); } };
A.invvalidate = async () => {
  const lines = $$('tbody tr[data-pid]').filter(tr => tr.querySelector('.i-p').value !== '').map(tr => {
    const p = S.products.find(x => x.id === tr.dataset.pid), phys = num(tr.querySelector('.i-p').value), dmg = num(tr.querySelector('.i-d').value), theo = p.qty;
    return { pid: p.id, name: p.name, unit: p.unit, theo, phys, dmg, gap: r2(phys + dmg - theo), adjust: r2(phys - theo), cost: p.buy };
  });
  if (!lines.length) return toast('Aucune ligne comptée', 'err');
  const valueAdj = r2(sum(lines, l => l.adjust * l.cost));
  if (!await confirmBox(`Valider l'inventaire (${lines.length} produits, impact ${usd(valueAdj)}) ? Les stocks seront ajustés aux quantités physiques.`, 'Valider')) return;
  const b = batch(), id = uid(), ts = Date.now();
  b.set('inventories', id, { id, ts, day: dayKey(ts), scope: inv.scope, scopeName: inv.scopeName, lines, valueAdj, uid: S.user.uid, userName: who(), rate: S.settings.rate });
  lines.forEach(l => {
    if (l.adjust !== 0) {
      b.upd('products', l.pid, { qty: inc(l.adjust) });
      jr(b, l.adjust < 0 ? 'Sortie stock' : 'Entrée stock', `Ajustement inventaire — ${l.name} : ${l.theo} → ${l.phys} ${l.unit}${l.dmg ? ' (' + l.dmg + ' endommagé(s)/perdu(s))' : ''}`, l.adjust, '', '', id);
    }
  });
  jr(b, 'Inventaire', `Inventaire validé par ${who()} — ${inv.scopeName} — ${lines.length} produits, impact ${usd(valueAdj)}`, valueAdj, 'USD', '', id);
  b.commit(); inv = null; toast('Inventaire validé'); views.inventory($('#view'));
};
const invReport = i => ({
  title: 'Inventaire ' + dayKey(i.ts) + ' ' + i.scopeName,
  head: ['Produit', 'Théorique', 'Physique', 'Endommagés', 'Écart', 'Ajust.', 'Valeur $'],
  rows: i.lines.map(l => [l.name, l.theo, l.phys, l.dmg, l.gap, l.adjust, r2(l.adjust * l.cost)]),
  summary: [['Date', fmtDate(i.ts)], ['Responsable', i.userName], ['Écarts positifs', i.lines.filter(l => l.gap > 0).length], ['Produits manquants', i.lines.filter(l => l.gap < 0).length], ['Produits endommagés', i.lines.filter(l => l.dmg > 0).length], ['Impact valeur', usd(i.valueAdj)]]
});
A.invview = d => {
  const i = S.inventories.find(x => x.id === d.id); if (!i) return; const r = invReport(i);
  const w = modal('Rapport d\'inventaire', `${r.summary.map(([k, v]) => `<div class="mi"><span>${k}</span><b>${esc(v)}</b></div>`).join('')}<div class="tw" style="margin-top:10px"><table class="tbl"><thead><tr>${r.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${r.rows.map(x => `<tr>${x.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="row end"><button class="btn ghost" id="ipdf">PDF</button><button class="btn" id="ixls">Excel</button></div>`, { wide: true });
  $('#ipdf', w).onclick = () => exportPDF(r.title, r.head, r.rows, r.summary);
  $('#ixls', w).onclick = () => exportXLSX(r.title, r.head, r.rows, r.summary);
};

const plRow = () => `<div class="pl"><select class="pl-p"><option value="">Produit…</option>${S.products.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><select class="pl-u"></select>

function readLines(f) {
  return [...f.querySelectorAll('.pl')].map(r => {

A.newpurchase = () => {
  if (!S.products.length) return toast("Créez d'abord des produits", 'err');
  const curs = allowedCurrencies();
  form('Nouvelle entrée de stock', `
    ${sel('Fournisseur', 'supplier', [['', '— Aucun —'], ...S.suppliers.map(s => [s.id, s.name])])}
    <div id="plines">${plRow()}</div><button type="button" class="btn ghost sm" data-act="addpl">${ic('plus', 16)} Ajouter un produit</button>
    <div class="two">${fld('Frais de transport ($)', 'transport', 0, 'number', 'min="0"')}${fld('Date', 'date', dayKey(), 'date')}</div>
    <div class="two">${sel('Paiement', 'payType', [['cash', 'Cash (déduit la caisse)'], ['credit', 'Crédit (dette fournisseur)']])}<label id="curl">Devise du paiement<select name="cur">${curs.map(c => `<option>${c}</option>`).join('')}</select></label></div>
    ${fld('Observation', 'note', '')}<div class="totbox"><div class="row sp"><span>TOTAL</span><b id="ptot" class="big">$0.00</b></div><div class="muted sm" id="ptot2"></div></div>`,
    async (v, w, f) => {
      const L = readLines(f).filter(l => l.qty > 0); if (!L.length) throw new Error('Ajoutez au moins un produit avec une quantité');
      const supplier = S.suppliers.find(s => s.id === v.supplier);
      if (v.payType === 'credit' && !supplier) throw new Error('Choisissez un fournisseur pour un achat à crédit');
      const transport = r2(num(v.transport)), itemsTotal = r2(sum(L, l => l.qty * l.cost)), total = r2(itemsTotal + transport);
      const id = uid(), ts = dateTs(v.date), rate = S.settings.rate;
      const items = L.map(l => ({ pid: l.p.id, name: l.p.name, unit: l.u.name, factor: l.u.factor, qty: l.qty, cost: r2(l.cost) }));
      const b = batch();
      b.set('purchases', id, { id, ts, day: dayKey(ts), supplierId: supplier?.id || '', supplierName: supplier?.name || '', items, itemsTotal, transport, total, payType: v.payType, cur: v.payType === 'cash' ? v.cur : '', note: v.note, uid: S.user.uid, userName: who(), rate });
      L.forEach(l => {
        const base = l.qty * l.u.factor, share = itemsTotal > 0 ? (l.qty * l.cost) / itemsTotal : 0, landed = base > 0 ? (l.qty * l.cost + transport * share) / base : l.p.buy;
        b.upd('products', l.p.id, { qty: inc(base), buy: r2(landed * 10000) / 10000, updated: ts });
      });
      if (v.payType === 'cash') cashop(b, 'purchase', v.cur, -(v.cur === 'CDF' ? total * rate : total), 'Achat stock ' + (supplier?.name || ''), id, ts);
      else b.upd('suppliers', supplier.id, { debt: inc(total), bought: inc(total), last: ts });
      if (supplier && v.payType === 'cash') b.upd('suppliers', supplier.id, { bought: inc(total), last: ts });
      jr(b, 'Entrée stock', `Approvisionnement ${supplier?.name || ''} par ${who()} — ${items.length} produit(s) — ${v.payType === 'credit' ? 'crédit' : 'cash ' + v.cur}`, total, 'USD', '', id);
      b.commit(); toast('Entrée enregistrée, stock mis à jour');
    }, {
      wide: true, ok: 'Enregistrer l\'entrée',
      onOpen: (w, f) => {

          const L = readLines(f); L.forEach(l => { l.row.querySelector('.pl-s').textContent = usd(l.qty * l.cost); });
          const total = sum(L, l => l.qty * l.cost) + num(f.transport.value);
          $('#ptot', w).textContent = usd(total); $('#ptot2', w).textContent = f.cur.value === 'CDF' && f.payType.value === 'cash' ? '≈ ' + cdf(total * S.settings.rate) : '';
          $('#curl', w).style.display = f.payType.value === 'cash' ? '' : 'none';
        };
        f.addEventListener('change', e => {
          if (e.target.classList.contains('pl-p')) {
            const r = e.target.closest('.pl'), p = S.products.find(x => x.id === e.target.value), us = p ? allUnits(p) : [];
            r.querySelector('.pl-u').innerHTML = us.map(u => `<option>${esc(u.name)}</option>`).join(''); if (p) r.querySelector('.pl-c').value = r2(p.buy);
          } else if (e.target.classList.contains('pl-u')) {
            const r = e.target.closest('.pl'), p = S.products.find(x => x.id === r.querySelector('.pl-p').value), u = p && allUnits(p).find(x => x.name === e.target.value); if (u) r.querySelector('.pl-c').value = r2(p.buy * u.factor);
          }

    });
};

/* ================= DÉPENSES (avec blocage bénéfice) ================= */
const EXP_CATS = ['Transport', 'Loyer', 'Électricité', 'Eau', 'Salaires', 'Communication', 'Réparations', 'Achat de fournitures', 'Pertes & casse', 'Autres dépenses'];

function monthProfit() {
  const [m0, m1] = rangeFor('month');

  const exp = sum(S.expenses.filter(x => x.ts >= m0 && x.ts <= m1), x => toUSD(x.amt, x.cur, x.rate));
  return { gross, exp };
}

/* ================= CLIENTS & FOURNISSEURS ================= */
let ptab = 'clients';
const SUP_CRIT = [['q', 'Qualité des marchandises'], ['d', 'Respect des délais'], ['p', 'Prix pratiqués'], ['r', 'Fiabilité'], ['a', 'Disponibilité des produits'], ['c', 'Conditions de crédit']];
const supNote = s => {
  const w = S.settings.supWeights || {}, r = s.rating || {};
  let got = 0, max = 0;
  SUP_CRIT.forEach(([k, l]) => { const wt = w[k] ?? 0; if (wt > 0) { max += wt; got += (r[k] || 0) / 5 * wt; } });
  return max ? Math.round(got / max * 100) : null;
};
const supGrade = n => n == null ? ['gray', '—'] : n >= 80 ? ['', 'Excellent'] : n >= 60 ? ['blue', 'Bon'] : n >= 40 ? ['warn', 'Moyen'] : ['bad', 'Faible'];
function targetteBenefit(sid) {
  const s = S.suppliers.find(x => x.id === sid); if (!s?.targette?.pct) return 0;
  const [m0, m1] = rangeFor('month');
  let b = 0;
  S.sales.filter(x => x.status !== 'cancelled' && x.ts >= m0 && x.ts <= m1).forEach(x => x.items.forEach(i => {
    const p = S.products.find(q => q.id === i.pid);
    if (p?.supplier === sid) b += i.price * i.qty;
  }));
  return r2(b * s.targette.pct / 100);
}

/* ================= KAJIMINYI ASSISTANT ================= */
const AI_HIST = [];
function aiAnswer(q) {
  const s = q.toLowerCase(), now = Date.now(), rate = S.settings.rate;
  const ok = S.sales.filter(x => x.status !== 'cancelled');
  const [w0, w1] = rangeFor('week'), [m0, m1] = rangeFor('month'), [d0] = rangeFor('day');
  const say = t => t;
  if (/expir|périm/.test(s)) {
    const ex = S.products.filter(p => expiryState(p) === 'expired'), so = S.products.filter(p => expiryState(p) === 'soon');
    return `Produits expirés : ${ex.length ? ex.map(p => p.name).join(', ') : 'aucun'}. Bientôt expirés : ${so.length ? so.map(p => `${p.name} (${p.exp})`).join(', ') : 'aucun'}.`;
  }
  if (/rupture|stock.*(faible|bas)|commander|réappro/.test(s)) {
    const r = S.products.filter(p => stockState(p) === 'rupture'), f = S.products.filter(p => stockState(p) === 'faible');
    if (/commander|réappro/.test(s)) return `À commander en priorité : ${r.slice(0, 5).map(p => p.name).join(', ') || 'aucun en rupture'}. Stock faible : ${f.slice(0, 5).map(p => `${p.name} (${fmtQty(p)})`).join(', ') || 'aucun'}.`;
    return `En rupture : ${r.length} produit(s)${r.length ? ' : ' + r.slice(0, 5).map(p => p.name).join(', ') : ''}. Stock faible : ${f.length}.`;
  }
  if (/dépense/.test(s)) {
    const we = sum(S.expenses.filter(e => e.ts >= w0 && e.ts <= w1), e => toUSD(e.amt, e.cur, e.rate));
    const me = sum(S.expenses.filter(e => e.ts >= m0 && e.ts <= m1), e => toUSD(e.amt, e.cur, e.rate));
    return `Dépenses cette semaine : ${usd(we)} (${cdf(we * rate)}). Ce mois : ${usd(me)} (${cdf(me * rate)}).`;
  }
  if (/bénéf|profit|marge|rapporte|rentable/.test(s)) {
    const ms = ok.filter(x => x.ts >= m0 && x.ts <= m1);
    const rev = sum(ms, x => x.total), net = sum(ms, x => x.profit);
    const agg = {}; ms.forEach(x => x.items.forEach(i => { agg[i.name] = (agg[i.name] || 0) + (i.price - i.cost) * i.qty; }));
    const top = Object.entries(agg).sort((a, b) => b[1] - a[1])[0];
    return `Ce mois : bénéfice net ${usd(net)} (${cdf(net * rate)}) sur un CA de ${usd(rev)}. ${top ? `Le produit le plus rentable est « ${top[0]} » avec ${usd(top[1])}.` : ''}`;
  }
  if (/vente|chiffre|ca\b|aujourd/.test(s)) {
    const td = sum(ok.filter(x => x.ts >= d0), x => x.total), tm = sum(ok.filter(x => x.ts >= m0 && x.ts <= m1), x => x.total);
    return `Aujourd'hui : ${cdf(td * rate)} (${usd(td)}). Ce mois : ${cdf(tm * rate)} (${usd(tm)}), ${ok.filter(x => x.ts >= m0 && x.ts <= m1).length} ventes.`;
  }
  if (/dette|crédit/.test(s)) {
    return `Dettes clients : ${usd(sum(S.clients, c => c.debt || 0))}. Dettes fournisseurs : ${usd(sum(S.suppliers, x => x.debt || 0))}.`;
  }
  if (/écart|caisse/.test(s)) {
    const gaps = S.sessions.filter(x => x.status === 'closed' && (Math.abs(x.diff?.USD || 0) > 1 || Math.abs(x.diff?.CDF || 0) > rate));
    return gaps.length ? `Écarts de caisse détectés : ${gaps.length}. Dernier : ${fmtDate(gaps[0].closeTs)} — écart ${usd(gaps[0].diff?.USD || 0)} / ${cdf(gaps[0].diff?.CDF || 0)} par ${gaps[0].closeUser}. Ouvrez Caisse → Historique pour la justification.` : 'Aucun écart de caisse significatif enregistré. ✓';
  }
  if (/pourquoi.*(diminu|baiss|chuté)/.test(s)) {
    const p = S.products.find(x => s.includes(x.name.toLowerCase()));
    if (p) { const mv = S.journal.filter(j => j.desc.toLowerCase().includes(p.name.toLowerCase()) && /vente|sortie|inventaire/i.test(j.type)).slice(0, 3); return `Mouvements récents pour « ${p.name} » : ${mv.map(j => `${j.type} (${fmtDate(j.ts)}, ${j.user})`).join(' ; ') || 'aucun'}. Stock actuel : ${fmtQty(p)}.`; }
    return 'Précisez le nom du produit, par ex. « Pourquoi mon stock de whisky a-t-il diminué ? »';
  }
  if (/aide|comment|fonctionne/.test(s)) {
    const m = MODULES[cur] || '';
    return m ? `Vous êtes dans « ${m} ». ${FAQ.find(f => f[0].toLowerCase().includes(m.toLowerCase().split(' ')[0].toLowerCase()))?.[1] || 'Posez une question précise (stock, ventes, dépenses, dettes, caisse…) ou ouvrez l\'onglet Aide & CGU.'}` : 'Je peux expliquer chaque module, le stock, les bénéfices, les dépenses, les dettes et les écarts de caisse. Que voulez-vous savoir ?';
  }
  return 'Je réponds uniquement à partir de vos données réelles (jamais de chiffres inventés). Essayez : « Quel produit me rapporte le plus ? », « Combien ai-je dépensé cette semaine ? », « Quels produits commander ? », « Pourquoi ma caisse présente un écart ? »';
}
function aiReply(q) {
  return new Promise(res => setTimeout(() => res(aiAnswer(q)), 350 + Math.random() * 300));
}
A.openai = () => {
  const w = modal('KAJIMINYI ASSISTANT', `<div class="chat" id="aichat">${AI_HIST.map(h => `<div class="bub ${h.who === 'me' ? 'me' : 'ai'}">${esc(h.text)}${h.who === 'ai' ? '<small>KAJIMINYI ASSISTANT — réponse calculée sur vos données</small>' : ''}</div>`).join('') || `<div class="bub ai">Bonjour ${esc(S.me.name)} ! Je suis le Kajiminyi Assistant. Posez-moi une question sur votre stock, vos ventes, vos dépenses ou vos dettes. Vous êtes dans « ${MODULES[cur] || 'l\'application'} ».</div>`}</div>
    <div class="chat-in"><input id="aiin" placeholder="Votre question…" autocomplete="off"><button class="btn" id="aisend">${ic('spark', 18)}</button></div>
    <p class="muted sm" style="margin-top:6px">Je n'invente aucun chiffre : tout est calculé depuis vos données. Je ne modifie rien sans votre confirmation.</p>`);
  const chat = $('#aichat', w), inp = $('#aiin', w);
  const send = async () => {
    const q = inp.value.trim(); if (!q) return; inp.value = '';
    chat.insertAdjacentHTML('beforeend', `<div class="bub me">${esc(q)}</div>`);
    AI_HIST.push({ who: 'me', text: q });
    chat.scrollTop = chat.scrollHeight;
    const r = await aiReply(q);
    chat.insertAdjacentHTML('beforeend', `<div class="bub ai">${esc(r)}<small>KAJIMINYI ASSISTANT</small></div>`);
    AI_HIST.push({ who: 'ai', text: r });
    chat.scrollTop = chat.scrollHeight;
  };
  $('#aisend', w).onclick = send;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  inp.focus();
};

let deferred = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; const b = $('#inst'); if (b) b.hidden = false; });

/* ---------- écrans ---------- */
const loginScreen = (msg = '') => {
  $('#app').innerHTML = `<div class="login"><div class="box">${LOGO(84)}<h1>KAJIMINYI STOCK PRO</h1><p>Maîtrisez votre stock, contrôlez votre argent, développez votre entreprise.</p>
  <button class="gbtn" data-act="login"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continuer avec Google</button>
  <p class="neg" style="margin-top:14px">${esc(msg)}</p></div></div>`;
};
const denied = email => {
  $('#app').innerHTML = `<div class="login"><div class="box">${LOGO(64)}<h1>Accès non autorisé</h1><p>Le compte <b>${esc(email)}</b> n'est pas enregistré. Demandez à l'administrateur de l'ajouter dans « Utilisateurs », puis reconnectez-vous.</p><button class="gbtn" data-act="logout">Se déconnecter</button></div></div>`;
};
const loading = t => { $('#app').innerHTML = `<div class="splash">${LOGO(88)}<p>${t}</p></div>`; };

A.login = async () => {
  try { await F.signInWithPopup(F.auth, F.provider); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) F.signInWithRedirect(F.auth, F.provider);
    else if (e.code !== 'auth/popup-closed-by-user') loginScreen('Connexion impossible : ' + (e.code || e.message));
  }
};
A.logout = () => F.signOut(F.auth);
A.menu = () => $('#side')?.classList.toggle('open');
A.install = async () => { if (deferred) { deferred.prompt(); deferred = null; $('#inst').hidden = true; } };
F.getRedirectResult(F.auth).catch(e => loginScreen('Connexion impossible : ' + (e.code || e.message)));

/* ---------- authentification & rôles ---------- */
let cur = '', unsub = null, pending = false, idleT = null;
const SEED_CATS = [['Boissons alcoolisées', '🍺'], ['Boissons non alcoolisées', '🥤'], ['Alimentation', '🛒'], ['Hygiène & entretien', '🧴'], ['Divers', '📦']];
F.onAuthStateChanged(F.auth, async user => {
  unsub?.(); unsub = null; S.user = null; S.me = null; clearTimeout(idleT);
  if (!user) return loginScreen();
  loading('Connexion en cours…');
  const email = user.email.toLowerCase();
  const get = async (c, id) => { const r = F.doc(F.db, c, id); try { return await F.getDoc(r); } catch { return await F.getDocFromCache(r); } };
  try {
    let me = await get('users', email);
    if (!me.exists()) {
      const init = await get('meta', 'init');
      if (init.exists()) { S.user = user; return denied(email); }
      const b = batch();
      b.set('users', email, { name: user.displayName || email, role: 'admin', active: true, perms: ROLE_PERMS.admin, ts: Date.now() });
      b.set('meta', 'init', { ts: Date.now(), by: email });
      b.set('meta', 'settings', S.settings);
      SEED_CATS.forEach(([name, icon], i) => { const id = 'cat' + (i + 1); b.set('categories', id, { id, name, icon, desc: '', image: '', ts: Date.now() }); });
      await b.commit();
      me = await get('users', email);
    }
    const data = me.data();
    if (!data.active) { S.user = user; return denied(email); }
    S.user = user;
    S.me = { ...data, email, name: data.name || user.displayName || email, perms: [...(data.perms || ROLE_PERMS[data.role] || []), ...((ROLE_PERMS[data.role] || []).filter(m => !data.perms || !data.perms.includes(m)))] };
    // trace de connexion
    try {
      const lg = { email, ts: Date.now(), device: navigator.userAgent.slice(0, 80) };
      setDoc(doc(db, 'logins', uid()), lg).catch(() => {});
    } catch {}
    startApp();
    if (S.me.cgu !== CGU_VERSION) setTimeout(acceptCgu, 800);
  } catch (e) { console.error(e); loginScreen('Erreur : ' + (e.code || e.message) + ' — vérifiez la connexion et les règles Firestore.'); }
});

/* ---------- application ---------- */
function startApp() {
  setTheme(localStorage.getItem('k_theme') || S.settings.theme || 'light');
  document.body.style.fontSize = (localStorage.getItem('k_font') || S.settings.fontScale || 1) + 'rem';
  const mods = Object.keys(MODULES).filter(can);
  const quick = ['dashboard', 'sales', 'products', 'cash'].filter(can).slice(0, 4), QL = { dashboard: 'Accueil', sales: 'Vente', products: 'Stock', cash: 'Caisse' };
  $('#app').innerHTML = `<div class="shell"><aside class="side" id="side"><div class="lg">${LOGO(38)}<div>KAJIMINYI<br>STOCK PRO<small>Votre commerce sous contrôle</small></div></div>
    <nav>${mods.map(m => `<a href="#/${m}" data-nav="${m}">${ic(NAV_IC[m])}<span>${MODULES[m]}</span></a>`).join('')}</nav>
    <div class="foot"><b>${esc(S.me.name)}</b><br><span class="muted">${esc(S.me.role)}</span><br><a href="#" data-act="logout" style="padding:8px 0 0">${ic('logout', 16)} Déconnexion</a></div></aside><div class="scrim" data-act="menu"></div>
    <div class="mainwrap"><header class="top"><button class="ib mbtn" data-act="menu" aria-label="Menu">${ic('menu', 24)}</button><div class="brand-s" id="ttl"></div><button class="ib" id="themebtn" data-act="theme" title="Mode sombre/clair">${document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙'}</button><button class="ib" data-act="openai" title="Assistant">${ic('spark', 20)}</button><button class="btn sm" id="inst" data-act="install" hidden>Installer</button><span id="net" class="net"></span></header><main id="view"></main></div>
    <nav class="bnav">${quick.map(m => `<a href="#/${m}" data-nav="${m}">${ic(NAV_IC[m])}<span>${QL[m]}</span></a>`).join('')}<button data-act="menu">${ic('menu')}<span>Plus</span></button></nav></div>`;
  netState(); route();
  unsub = subscribe(refresh);
  resetIdle();
  // Service worker PWA (si sw.js est hébergé à côté)
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => console.log('SW OK')).catch(() => {});
}
function route() {
  const mods = Object.keys(MODULES).filter(can); let m = location.hash.replace('#/', '');
  if (!mods.includes(m)) m = mods[0]; cur = m;
  const tt = $('#ttl'); if (tt) tt.innerHTML = m === 'dashboard' ? `${LOGO(26)} KAJIMINYI <b>Stock Pro</b>` : esc(MODULES[m]);
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === m));
  $('#side')?.classList.remove('open'); draw(); window.scrollTo(0, 0);
}
function draw() {
  const el = $('#view'); if (!el || !views[cur]) return;
  try { views[cur](el); } catch (e) { console.error(e); el.innerHTML = '<div class="card">Erreur d\'affichage : ' + esc(e.message) + '</div>'; }
}
function refresh() {
  window.__ksync = Date.now();
  if (!$('#view')) return;
  const busy = document.querySelector('.modal-wrap') || document.activeElement?.matches?.('#view input, #view select, #view textarea');
  if (busy) { pending = true; return; }
  pending = false; draw();
}
hooks.afterModal = () => { if (pending) setTimeout(refresh, 150); };
document.addEventListener('focusout', () => { if (pending) setTimeout(refresh, 300); });
window.addEventListener('hashchange', () => { if (S.me) route(); });

/* ---------- global ---------- */
window.__kerrs = [];
window.addEventListener('error', e => { window.__kerrs.push(String(e.message).slice(0, 120)); });
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a, e); }
});
const netState = () => { const n = $('#net'); if (!n) return; const on = navigator.onLine; n.textContent = on ? '● En ligne' : '● Hors ligne'; n.classList.toggle('off', !on); };
window.addEventListener('online', () => { netState(); toast('Connexion rétablie — synchronisation en cours'); });
window.addEventListener('offline', () => { netState(); toast('Hors connexion — vos opérations seront synchronisées automatiquement', 'err'); });

function resetIdle() {
  clearTimeout(idleT); if (!S.me) return;
  idleT = setTimeout(() => { toast('Session expirée (inactivité)', 'err'); F.signOut(F.auth); }, (S.settings.idle || 30) * 60000);
}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));
</script>
</head>
<body>
<div id="app"><div class="splash">
<svg class="logo-svg" width="88" height="88" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="kgs" x1="0" y1="0" x2="64" y2="64"><stop offset="0" stop-color="#00A86B"/><stop offset="1" stop-color="#003B32"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#kgs)"/><path d="M22 14v36" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><path d="M42 14L23 33" stroke="#7ef0bd" stroke-width="5.5" stroke-linecap="round"/><path d="M29 27l15 23" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><path d="M44 40v8h-8" stroke="#F5C518" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 48l-9-9" stroke="#F5C518" stroke-width="4" stroke-linecap="round"/><rect x="37" y="47" width="3.4" height="7" rx="1" fill="#7ef0bd"/><rect x="42" y="44" width="3.4" height="10" rx="1" fill="#7ef0bd"/><rect x="47" y="41" width="3.4" height="13" rx="1" fill="#F5C518"/></svg>
<p>Chargement…</p></div></div>
<div id="toasts"></div>
</body>
